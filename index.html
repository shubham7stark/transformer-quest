/* ============================================================================
 * LEVEL 04 — Multi-Head Attention   (order 4)
 * ----------------------------------------------------------------------------
 * Follows the gold-standard pattern (see 01-tokens-embeddings.js):
 *   - one IIFE, ONE TQ.registerLevel call, NO other globals
 *   - render() = short explanation blocks + PRIMARY interactive visualization
 *   - every number genuinely computed via TQ math (no hardcoded attention)
 *   - all color via TQ.colorFor / TQ.heatmap / TQ.vectorView (one color language)
 *
 * Math shown, all real & deterministic:
 *   - the shared toy sentence -> TQ.toy.embeddings (6 x 16)
 *   - H = 4 heads, each with its OWN seeded Wq/Wk/Wv (base + head*10 + {1,2,3})
 *     via TQ.toyQKV(dk, ...). dk = dModel / H = 16 / 4 = 4.
 *   - per-head attention via TQ.attention -> .weights is the 6x6 heatmap shown
 *     in each tab; genuinely differs across heads because seeds differ.
 *   - Concat + Wo: per token concat the H length-4 outputs -> length 16, then
 *     ConcatAll (6 x 16) · Wo (16 x 16) -> Final (6 x 16). All via TQ.matmul.
 *   - "sharpest head" = argmin over heads of row entropy of att.weights[query].
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "multi-head",
    order: 4,
    title: "Multi-Head Attention",
    icon: "🧠",
    tagline: "Run attention several times in parallel subspaces, then concatenate.",
    preread: "Illustrated Transformer",
    objectives: [
      "See that each head has its own learned Q/K/V projections (its own subspace)",
      "Observe different heads attend to different relations (different patterns on the same sentence)",
      "Follow concat-of-heads → output projection back to d_model"
    ],

    render: function (root) {
      var toy = TQ.toy;
      var tokens = toy.tokens;
      var X = toy.embeddings;       // 6 x 16
      var dModel = toy.dModel;      // 16
      var H = 4;                    // heads
      var dk = dModel / H;          // 4
      var n = tokens.length;        // 6
      var BASE = 400;               // seed base; per-head = BASE + h*10 + {1,2,3}

      /* ---------------------------------------------- build every head (real) */
      // heads[h] = { qkv, att } where att = {scores, scaled, weights, output, dk}
      var heads = [];
      for (var h = 0; h < H; h++) {
        var qkv = TQ.toyQKV(dk, BASE + h * 10 + 1, BASE + h * 10 + 2, BASE + h * 10 + 3);
        var att = TQ.attention(qkv.Q, qkv.K, qkv.V); // weights: 6x6, output: 6x4
        heads.push({ qkv: qkv, att: att });
      }

      // ConcatAll (6 x 16): horizontally stack the four 6x4 head outputs.
      var concatAll = [];
      for (var t = 0; t < n; t++) {
        var rowC = [];
        for (var hh = 0; hh < H; hh++) {
          var ov = heads[hh].att.output[t];
          for (var k = 0; k < ov.length; k++) rowC.push(ov[k]);
        }
        concatAll.push(rowC); // length H*dk = 16
      }
      // Wo: (H*dk) x dModel = 16 x 16, learned output projection (deterministic).
      var Wo = TQ.randMatrix(H * dk, dModel, 999);
      var Final = TQ.matmul(concatAll, Wo); // 6 x 16

      // Shannon entropy of a probability row (lower = more peaked / confident).
      function entropy(p) {
        var e = 0;
        for (var i = 0; i < p.length; i++) {
          var w = p[i];
          if (w > 1e-12) e += -w * Math.log(w);
        }
        return e;
      }
      // Sharpest head for a given query token index = argmin head-row entropy.
      function sharpestHead(q) {
        var best = 0, bestE = Infinity;
        for (var hi = 0; hi < H; hi++) {
          var e = entropy(heads[hi].att.weights[q]);
          if (e < bestE) { bestE = e; best = hi; }
        }
        return best;
      }
      // argmax index of an array (first max wins) — used for each head's peak key.
      function argmaxIdx(arr) {
        var bi = 0;
        for (var ai = 1; ai < arr.length; ai++) if (arr[ai] > arr[bi]) bi = ai;
        return bi;
      }

      /* ----------------------------------------------------- intro narrative */
      root.appendChild(TQ.block(
        TQ.h(2, "One attention head is a single point of view"),
        TQ.p(
          "You just built scaled dot-product attention: project tokens into ",
          TQ.math("Q, K, V"), ", score every query against every key, softmax, blend the values. ",
          "But one set of projection matrices (", TQ.math("Wq, Wk, Wv"),
          ") forces every relationship through ", TQ.el("strong", { text: "one" }),
          " learned lens. If that lens is tuned to track \"which noun does this verb act on,\" it has no ",
          "spare capacity to also track \"which article binds this noun\" or \"what's three tokens back.\" ",
          "A single head must compromise across all the relations in a sentence at once."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "Run attention H times in parallel subspaces"),
        TQ.p(
          "Multi-head attention is the obvious fix: instead of one big ", TQ.math("d_model"),
          "-wide attention, run ", TQ.el("strong", { text: "H" }), " smaller ones in parallel, each with its ",
          TQ.el("strong", { text: "own" }), " ", TQ.math("Wq/Wk/Wv"), ". Each head projects the SAME input ",
          "embeddings into its own ", TQ.math("dk"), "-dimensional subspace (", TQ.math("dk = d_model / H"),
          ") and does the full scores → scale by ", TQ.math("1/√dk"),
          " → softmax → weighted-V pipeline independently."
        ),
        // on-screen arithmetic strip — make the shape bookkeeping explicit
        TQ.el("div", { class: "tq-mh-arith" },
          TQ.el("span", { class: "tq-mh-arith-item" }, TQ.math("dk = d_model / H = " + dModel + " / " + H + " = " + dk)),
          TQ.el("span", { class: "tq-mh-arith-item" }, TQ.math("concat width = H × dk = " + H + " × " + dk + " = " + (H * dk) + " = d_model"))
        ),
        TQ.p(
          "Here ", TQ.math("d_model = " + dModel), ", ", TQ.math("H = " + H), ", so ", TQ.math("dk = " + dk),
          " — four ", dk + "-dimensional attentions running side by side. This is almost exactly your CNN intuition: ",
          "a conv layer doesn't apply one filter, it applies a ", TQ.el("strong", { text: "bank" }),
          " of filters, each tuned to a different pattern (edges, texture, color blobs). A head is an attention ",
          "\"filter\"; the bank gives the layer multiple simultaneous ways to relate tokens."
        )
      ));

      /* ---------------------------------- PRIMARY interactive: heads as tabs */
      // Shared query selector drives BOTH the row highlight inside each head's
      // heatmap AND the Concat+Wo panel below. Clicking a heatmap row syncs it.
      var selQuery = 1; // default 'cat'
      var highlightSharp = false;

      // Per-head enable flags for the side-by-side comparison block (all ON).
      var enabledHeads = [];
      for (var eh = 0; eh < H; eh++) enabledHeads.push(true);

      // Forward decls so cross-updates work.
      var concatPanel = TQ.el("div", { class: "tq-panel tq-grow tq-mh-concat" });
      var querySel = TQ.segmented({
        options: tokens.map(function (tk, i) { return { label: tk, value: i }; }),
        value: selQuery,
        onChange: function (v) { selQuery = v; renderConcat(); refreshActiveHeatmap(); renderCompare(); }
      });
      var sharpToggle = TQ.toggle({
        label: "Highlight sharpest head",
        value: false,
        onChange: function (v) { highlightSharp = v; renderConcat(); }
      });

      // Track the currently-mounted heatmap so a query change can re-highlight
      // its selected row without flipping tabs.
      var activeHeadIdx = 0;
      var activeHeatHolder = null;

      function buildHeadHeatmap(headIdx) {
        return TQ.heatmap(heads[headIdx].att.weights, {
          rowLabels: tokens, colLabels: tokens, cellSize: 44,
          min: 0, max: 1, // attention weights are probabilities in [0,1]
          selectedRow: selQuery,
          format: function (v) { return TQ.fmt(v, 2); }
        });
      }

      function wireHeatRows(node) {
        // Make whole rows clickable to set the query (clicking any cell in a
        // row selects that query). Kernel already makes cells keyboard-able.
        var cells = node.querySelectorAll(".tq-hm-cell");
        var idx = 0;
        for (var r = 0; r < n; r++) {
          for (var c = 0; c < n; c++) {
            (function (rr, cell) {
              cell.classList.add("is-clickable");
              cell.setAttribute("role", "button");
              cell.setAttribute("tabindex", "0");
              cell.addEventListener("click", function () { setQuery(rr); });
              cell.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setQuery(rr); }
              });
            })(r, cells[idx]);
            idx++;
          }
        }
      }

      function setQuery(q) {
        selQuery = q;
        querySel.set(q);
        refreshActiveHeatmap();
        renderConcat();
        renderCompare();
      }

      function refreshActiveHeatmap() {
        if (!activeHeatHolder) return;
        var fresh = buildHeadHeatmap(activeHeadIdx);
        wireHeatRows(fresh);
        activeHeatHolder.replaceChild(fresh, activeHeatHolder.firstChild);
      }

      var tabItems = [];
      for (var ht = 0; ht < H; ht++) {
        (function (headIdx) {
          tabItems.push({
            label: "Head " + (headIdx + 1),
            render: function (container) {
              activeHeadIdx = headIdx;
              var heat = buildHeadHeatmap(headIdx);
              wireHeatRows(heat);
              activeHeatHolder = TQ.el("div", { class: "tq-grow" }, heat);

              // Per-head quick stats so the "different lens" point is concrete.
              var rowEntropies = [];
              for (var q = 0; q < n; q++) rowEntropies.push(entropy(heads[headIdx].att.weights[q]));
              var meanE = TQ.mean(rowEntropies);
              var maxPossible = Math.log(n); // uniform-row entropy ceiling

              var info = TQ.el("div", { class: "tq-panel tq-mh-headinfo" },
                TQ.el("div", { class: "tq-mh-headinfo-h" },
                  TQ.el("strong", { text: "Head " + (headIdx + 1) }),
                  TQ.badge("own seeds " + (BASE + headIdx * 10 + 1) + "/" +
                    (BASE + headIdx * 10 + 2) + "/" + (BASE + headIdx * 10 + 3), "info")
                ),
                TQ.el("div", { class: "tq-mh-stats" },
                  TQ.kv("dk", String(dk)),
                  TQ.kv("avg row entropy", TQ.fmt(meanE, 2)),
                  TQ.kv("uniform max", TQ.fmt(maxPossible, 2))
                ),
                TQ.note("Each cell = how much the query (row) reads from the key (col). " +
                  "Every row is a softmax, so it sums to ≈1.00 and lives in [0,1]. " +
                  "Click any row to trace that query through Concat + Wo below.")
              );

              container.appendChild(TQ.el("div", { class: "tq-flexrow tq-mh-tabrow" },
                activeHeatHolder, info));
            }
          });
        })(ht);
      }

      var headsBlock = TQ.block(
        TQ.h(2, "Four heads, same sentence — genuinely different patterns"),
        TQ.p(
          "Each tab below is a real attention-weights heatmap (rows = query token, cols = key token) ",
          "for one head, computed from that head's ", TQ.el("strong", { text: "own seeded" }), " ",
          TQ.math("Wq/Wk/Wv"), ". The heads differ because each gets a different random seed for its ",
          "projections (", TQ.math("base + head·10"), "), so each carves out a genuinely different subspace ",
          "— same input, four different lenses. Nothing is faked; flip between tabs and watch the pattern change."
        )
      );
      var legend = TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "0 (ignore)" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "1 (focus)" })
      );
      headsBlock.appendChild(legend);
      headsBlock.appendChild(TQ.tabs(tabItems));
      headsBlock.appendChild(TQ.callout(
        "Don't over-romanticize it: in a trained model heads CAN specialize (one ends up syntax-ish, " +
        "another positional, etc.), but they're not cleanly labeled modules, and pruning studies show many " +
        "heads are redundant. Say \"they can specialize,\" not \"head 7 IS the syntax head.\""
      ));
      root.appendChild(headsBlock);

      /* ============================================================= *
       *  PRIMARY interactive — SAME query, four lenses, + union coverage.
       *  The comparison the tabs make impossible: all four heads' attention
       *  ROWS for ONE query, stacked on the same six key columns, plus a
       *  computed UNION row (elementwise max across the ENABLED heads).
       *  Drives off the existing module-scope selQuery (no second selector).
       * ============================================================= */
      var comparePanel = TQ.el("div", { class: "tq-panel tq-grow tq-mh-cmp" });

      // one head-row strip: heads[h].att.weights[q] as a 1×6 heatmap, [0,1] scale
      function headRowStrip(h, q, dim) {
        var strip = TQ.heatmap([heads[h].att.weights[q]], {
          colLabels: tokens,
          rowLabels: ["head " + (h + 1)],
          cellSize: 44, min: 0, max: 1,
          selectedCol: argmaxIdx(heads[h].att.weights[q]),
          format: function (v) { return TQ.fmt(v, 2); }
        });
        return TQ.el("div", { class: "tq-mh-cmp-row" + (dim ? " is-off" : "") }, strip);
      }

      function renderCompare() {
        comparePanel.innerHTML = "";
        var q = selQuery;

        // header — which query we're comparing across heads
        comparePanel.appendChild(TQ.el("div", { class: "tq-mh-concat-head" },
          TQ.el("span", { class: "tq-stat-cap", text: "same query, four lenses" }),
          TQ.el("span", { class: "tq-mh-qtoken", text: "\"" + tokens[q] + "\" (#" + q + ")" })
        ));

        // shared column-header alignment is handled by each heatmap's colLabels.
        var grid = TQ.el("div", { class: "tq-mh-cmp-grid" });

        // four head rows (dim + excluded from union when toggled off)
        for (var hi = 0; hi < H; hi++) {
          grid.appendChild(headRowStrip(hi, q, !enabledHeads[hi]));
        }

        // UNION row = elementwise max across the ENABLED heads (genuinely live).
        var enabledIdx = [];
        for (var ei = 0; ei < H; ei++) if (enabledHeads[ei]) enabledIdx.push(ei);
        var union = [];
        for (var k = 0; k < n; k++) {
          if (enabledIdx.length === 0) { union.push(0); continue; }
          union.push(TQ.maxOf(enabledIdx.map(function (h) { return heads[h].att.weights[q][k]; })));
        }
        var unionStrip = TQ.heatmap([union], {
          colLabels: tokens,
          rowLabels: ["union (max)"],
          cellSize: 44, min: 0, max: 1,
          format: function (v) { return TQ.fmt(v, 2); }
        });
        grid.appendChild(TQ.el("div", { class: "tq-mh-cmp-row tq-mh-cmp-union" }, unionStrip));
        comparePanel.appendChild(grid);

        // readout: per-head argmax chips (enabled only) + distinct-keys-covered badge
        var distinct = {};
        var readout = TQ.el("div", { class: "tq-mh-cmp-readout" });
        readout.appendChild(TQ.el("span", { class: "tq-stat-cap", text: "peaks" }));
        for (var ci = 0; ci < H; ci++) {
          var am = argmaxIdx(heads[ci].att.weights[q]);
          var on = enabledHeads[ci];
          if (on) distinct[am] = true;
          readout.appendChild(TQ.badge(
            "head" + (ci + 1) + "→" + tokens[am] + (on ? "" : " (off)"),
            on ? "info" : "default"
          ));
        }
        var nDistinct = Object.keys(distinct).length;
        readout.appendChild(TQ.badge(
          nDistinct + " distinct key" + (nDistinct === 1 ? "" : "s") + " covered",
          nDistinct >= 3 ? "good" : "warn"
        ));
        comparePanel.appendChild(readout);

        // honest "they differ in WHERE, not in sharpness" annotation via entropy
        var ents = [];
        for (var pe = 0; pe < H; pe++) ents.push(entropy(heads[pe].att.weights[q]));
        comparePanel.appendChild(TQ.note(
          "Each strip is one head's softmax row for \"" + tokens[q] + "\" over the six keys (same [0,1] color " +
          "scale as the tabs). Each head's argmax key (its column label) is highlighted. The heads differ mostly " +
          "in WHERE they peak, not how " +
          "sharp they are — row entropies here are " +
          ents.map(function (e) { return TQ.fmt(e, 2); }).join(" / ") +
          " (uniform ceiling ln 6 = " + TQ.fmt(Math.log(n), 2) + "). The bottom UNION row is the elementwise " +
          "max across the ENABLED heads: drop to one head and it collapses to that head's narrow row; enable all " +
          "four and it lights up across keys no single head reached."
        ));
      }

      // four head on/off toggles (all default ON) — recompute union live.
      var cmpToggles = TQ.el("div", { class: "tq-mh-cmp-toggles" });
      for (var tg = 0; tg < H; tg++) {
        (function (hIdx) {
          var tgl = TQ.toggle({
            label: "Head " + (hIdx + 1),
            value: true,
            onChange: function (on) { enabledHeads[hIdx] = on; renderCompare(); }
          });
          cmpToggles.appendChild(tgl.el);
        })(tg);
      }

      var compareBlock = TQ.block(
        TQ.h(2, "Same query, four lenses — and what they cover together"),
        TQ.p(
          "The tabs above show one head at a time, so you have to hold one 6×6 grid in your head while you flip ",
          "to the next. Here is the comparison the tabs can't make: pick a query (the ",
          TQ.el("strong", { text: "same selector that drives Concat below" }),
          ") and see all four heads' attention ", TQ.el("strong", { text: "rows" }),
          " for it, stacked on the same six key columns."
        ),
        TQ.p(
          "The bottom ", TQ.el("strong", { text: "union" }), " row is computed live as the elementwise ",
          TQ.math("max"), " across the enabled heads. Toggle heads off and watch coverage shrink to a single ",
          "narrow row; turn them back on and the union blooms across keys no single head reaches alone — the ",
          "concrete meaning of \"multiple simultaneous ways to relate tokens.\""
        ),
        TQ.el("div", { class: "tq-controls-row" },
          TQ.el("div", {},
            TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Heads in the union"),
            cmpToggles)
        ),
        comparePanel,
        TQ.callout(
          "No single head covers cat→{The, mat, on} at once — the bank does. That breadth is exactly what " +
          "Concat + Wo merges into one vector next."
        )
      );
      renderCompare();
      root.appendChild(compareBlock);

      /* --------------------------- Concat + Wo panel (depends on selQuery) */
      function renderConcat() {
        concatPanel.innerHTML = "";
        var q = selQuery;
        var sharp = sharpestHead(q);

        concatPanel.appendChild(TQ.el("div", { class: "tq-mh-concat-head" },
          TQ.el("span", { class: "tq-stat-cap", text: "tracing query token" }),
          TQ.el("span", { class: "tq-mh-qtoken", text: "\"" + tokens[q] + "\" (#" + q + ")" })
        ));

        // 1) each head's dk-vector output for this token
        var headRows = TQ.el("div", { class: "tq-mh-headvecs" });
        for (var hi = 0; hi < H; hi++) {
          var isSharp = (hi === sharp);
          var dim = highlightSharp && !isSharp;
          var wrap = TQ.el("div", { class: "tq-mh-headvec" + (dim ? " is-dim" : "") },
            TQ.el("div", { class: "tq-mh-headvec-label" },
              TQ.el("span", { text: "head " + (hi + 1) + " · " + dk + "d" }),
              (highlightSharp && isSharp)
                ? TQ.badge("sharpest ✦", "good")
                : null
            ),
            TQ.vectorView(heads[hi].att.output[q], { cellSize: 26, showValues: true })
          );
          headRows.appendChild(wrap);
        }
        concatPanel.appendChild(TQ.el("div", { class: "tq-mh-step" },
          TQ.el("div", { class: "tq-mh-step-label", text: "1 · each head outputs a " + dk + "-dim vector" }),
          headRows
        ));

        // 2) concatenate -> length 16 = d_model
        concatPanel.appendChild(TQ.el("div", { class: "tq-mh-step" },
          TQ.el("div", { class: "tq-mh-step-label", text: "2 · concatenate → " + (H * dk) + "-dim (" + H + " × " + dk + " = " + (H * dk) + ")" }),
          TQ.vectorView(concatAll[q], { cellSize: 22, showValues: true })
        ));

        // 3) project by Wo -> final d_model vector
        concatPanel.appendChild(TQ.el("div", { class: "tq-mh-step" },
          TQ.el("div", { class: "tq-mh-step-label", text: "3 · × Wo (" + (H * dk) + "×" + dModel + ") → final " + dModel + "-dim vector" }),
          TQ.vectorView(Final[q], { cellSize: 22, showValues: true })
        ));

        concatPanel.appendChild(TQ.note(
          "Concat returns you to model width; " +
          "Wo is the learned mixer that lets the heads talk — without it you'd just have four " +
          "disconnected subspace results. " + (highlightSharp
            ? ("Sharpest head for \"" + tokens[q] + "\" is head " + (sharp + 1) +
               " (lowest row entropy = most confident).")
            : "Toggle \"sharpest head\" to spotlight the most confident head for this query.")
        ));
      }

      var concatBlock = TQ.block(
        TQ.h(2, "Concat, then project back: the part everyone skips"),
        TQ.p(
          "Each head outputs an ", TQ.math("n × dk"), " matrix (one ", TQ.math("dk"),
          "-vector per token). You can't just hand four separate ", TQ.math("dk"),
          "-vectors to the next layer — it expects width ", TQ.math("d_model"),
          ". So per token you ", TQ.el("strong", { text: "concatenate" }), " the H head-outputs back to length ",
          TQ.math("H·dk = " + (H * dk)), ", then multiply by ONE more learned matrix ",
          TQ.math("Wo"), " of shape ", TQ.math((H * dk) + "×" + dModel), ". ",
          TQ.math("MultiHead(X) = Concat(head_1..head_H)·Wo"), "."
        ),
        TQ.p(
          "Pick which token to trace; watch its four short ", TQ.math("dk=" + dk),
          " vectors snap together into one ", TQ.math((H * dk) + "-cell"),
          " vector, which then becomes a DIFFERENT ", TQ.math(dModel + "-cell"),
          " vector after ", TQ.math("Wo"), "."
        ),
        TQ.el("div", { class: "tq-controls-row" },
          TQ.el("div", {},
            TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Query token"),
            querySel.el),
          TQ.el("div", {},
            TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Options"),
            sharpToggle.el)
        ),
        concatPanel
      );
      renderConcat();
      root.appendChild(concatBlock);

      /* --------------------------------------------------- wrap-up takeaway */
      root.appendChild(TQ.block(
        TQ.h(2, "Why subspaces — and where this goes next"),
        TQ.p(
          "Splitting ", TQ.math("d_model"), " into H slices of size ", TQ.math("dk"),
          " isn't free capacity — total parameters are roughly the same as one full-width head. The win is ",
          TQ.el("strong", { text: "structural" }), ": H independent softmaxes can each commit fully to one ",
          "relation instead of one softmax averaging them all."
        ),
        TQ.callout(
          "Carry forward: MultiHead(X) = Concat(head_1..head_H)·Wo. The final " + dModel +
          "-dim vector you just built is exactly what flows into the residual + LayerNorm + FFN of a " +
          "transformer block — the next level."
        )
      ));

      /* small scoped styles (colors via CSS vars only — no hardcoded hex) */
      injectOnce("tq-lvl04-css",
        ".tq-mh-arith{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}" +
        ".tq-mh-arith-item{display:inline-flex}" +
        ".tq-mh-tabrow{align-items:flex-start;gap:20px}" +
        ".tq-mh-headinfo{min-width:240px;display:flex;flex-direction:column;gap:10px}" +
        ".tq-mh-headinfo-h{display:flex;align-items:center;justify-content:space-between;gap:8px}" +
        ".tq-mh-stats{display:flex;gap:8px;flex-wrap:wrap}" +
        ".tq-mh-concat{display:flex;flex-direction:column;gap:14px}" +
        ".tq-mh-concat-head{display:flex;align-items:center;gap:10px}" +
        ".tq-mh-qtoken{font-size:17px;font-weight:700}" +
        ".tq-mh-step{display:flex;flex-direction:column;gap:6px}" +
        ".tq-mh-step-label{font-size:12px;color:var(--ink-mute);font-family:var(--mono);letter-spacing:.02em}" +
        ".tq-mh-headvecs{display:flex;gap:16px;flex-wrap:wrap}" +
        ".tq-mh-headvec{display:flex;flex-direction:column;gap:4px;transition:opacity .2s}" +
        ".tq-mh-headvec.is-dim{opacity:.32}" +
        ".tq-mh-headvec-label{display:flex;align-items:center;gap:8px;font-size:12px;" +
          "color:var(--ink-mute);font-family:var(--mono)}" +
        ".tq-mh-cmp{display:flex;flex-direction:column;gap:14px}" +
        ".tq-mh-cmp-grid{display:flex;flex-direction:column;gap:6px}" +
        ".tq-mh-cmp-row{transition:opacity .2s}" +
        ".tq-mh-cmp-row.is-off{opacity:.3}" +
        ".tq-mh-cmp-union{margin-top:4px}" +
        ".tq-mh-cmp-union .tq-heatmap{outline:1px solid var(--accent);outline-offset:3px;border-radius:6px}" +
        ".tq-mh-cmp-toggles{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}" +
        ".tq-mh-cmp-readout{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}");
    },

    quiz: [
      {
        q: "In multi-head attention with d_model = 16 and H = 4 heads, what is the dimension dk that each head works in, and why that value?",
        choices: [
          "dk = 16, because every head sees the full model width",
          "dk = 64, because dk is always 64 in transformers",
          "dk = 4, because dk = d_model / H so the H head outputs concatenate back to d_model",
          "dk = 8, because heads always use half of d_model"
        ],
        answer: 2,
        explain: "dk = d_model / H = 16/4 = 4. Choosing dk this way means concatenating the H head outputs " +
                 "(H·dk = 4·4 = 16) lands exactly back at d_model, ready for the Wo projection."
      },
      {
        q: "In this level the four heads produce visibly different attention heatmaps on the SAME sentence. What actually causes the difference?",
        choices: [
          "Each head is given a different random seed for its Wq/Wk/Wv projections, so each operates in a different subspace",
          "The sentence is secretly changed for each head",
          "Later heads see the softmax output of earlier heads",
          "Only the colors differ; the underlying weights are identical"
        ],
        answer: 0,
        explain: "Each head has its OWN learned (here, seeded via base + head·10) Q/K/V projections, carving " +
                 "out a different subspace. Same input, different lens, genuinely different real attention " +
                 "weights — nothing faked."
      },
      {
        q: "After the H heads each produce their dk-dimensional outputs, how does multi-head attention return to a single d_model vector per token?",
        choices: [
          "It averages the H head outputs elementwise",
          "It sums the H attention-weight matrices, then applies V",
          "It concatenates the H head outputs (width H·dk = d_model) and multiplies by a learned output matrix Wo",
          "It takes only the output of the sharpest head and discards the rest"
        ],
        answer: 2,
        explain: "MultiHead(X) = Concat(head_1..head_H)·Wo. Concatenation restores width H·dk = d_model, and " +
                 "the learned Wo (here 16×16) mixes the per-subspace results into one vector — it's how the " +
                 "heads combine."
      },
      {
        q: "A colleague claims 'each attention head in a trained LLM is a clean, individually interpretable module — head 7 IS the syntax head.' What's the accurate refinement?",
        choices: [
          "Correct — every head maps to exactly one human-named linguistic function",
          "Heads CAN specialize and some show interpretable patterns, but they're not cleanly labeled modules and many are redundant",
          "Heads are identical to each other after training",
          "Interpretability is impossible because attention weights aren't real numbers"
        ],
        answer: 1,
        explain: "Heads can and do specialize (positional, syntactic-ish, etc.) and some are strikingly " +
                 "interpretable, but they aren't guaranteed clean single-function modules — pruning work shows " +
                 "substantial redundancy. Say 'they can specialize,' not 'each head = one function.'"
      }
    ]
  });

  // tiny helper local to this module (NOT a global): inject scoped CSS once.
  function injectOnce(id, css) {
    if (document.getElementById(id)) return;
    var s = document.createElement("style");
    s.id = id;
    s.textContent = css;
    document.head.appendChild(s);
  }
})();


/* ===== 05-positional-encoding.js ===== */
/* ============================================================================
 * LEVEL 05 — Positional Encoding   (order 5)
 * ----------------------------------------------------------------------------
 * Same pattern as the reference level 01:
 *   - one IIFE, ONE TQ.registerLevel call, NO other globals
 *   - render() = short explanation blocks + PRIMARY interactive visualizations,
 *     every number genuinely computed via TQ math (TQ.sinusoidalPE, TQ.attention)
 *   - all color via TQ.colorFor / TQ.heatmap / TQ.vectorView (one color language)
 *   - 4 quiz questions
 *
 * Math shown here, all real:
 *   PANEL A — TQ.sinusoidalPE(nPos,16) heatmap + a canvas plot of one column's
 *     sin/cos wave across positions; the per-dimension wavelength is computed
 *     directly (2π·10000^(2·floor(dim/2)/16)).
 *   PANEL B — embedding vs PE(pos) vs embedding+PE (TQ.addMat) for a chosen toy
 *     token + position, plus the live L2 distance ||PE_a - PE_b|| between two slots.
 *   PANEL C — attention computed from input = embeddings (PE off) or
 *     addMat(embeddings, PE) (PE on), via TQ.toyQKV + TQ.attention; a "swap
 *     cat⇄sat" rebuilds the input with rows 1,2 swapped BEFORE adding PE. The
 *     'The' weight row + output vector + per-component output delta show that
 *     attention is permutation-equivariant WITHOUT PE and order-aware WITH it.
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "positional-encoding",
    order: 5,
    title: "Positional Encoding",
    icon: "🧭",
    tagline: "Attention is order-blind by default — give it a sense of position.",
    preread: "Illustrated Transformer / Basics",
    objectives: [
      "Understand self-attention is permutation-invariant (no built-in order)",
      "Read a sinusoidal PE matrix: positions × dimensions, low dims high-frequency, high dims low-frequency",
      "See that adding PE to an embedding changes the vector, and swapping two words changes their encodings"
    ],

    render: function (root) {
      var toy = TQ.toy;
      var tokens = toy.tokens;
      var emb = toy.embeddings;
      var d = toy.dModel;          // 16
      var n = tokens.length;       // 6

      /* ============================================================= intro */
      root.appendChild(TQ.block(
        TQ.h(2, "Attention is a set operation, not a sequence operation"),
        TQ.p(
          "Here's the unsettling fact your CNN intuition won't prepare you for: self-attention has ",
          TQ.el("strong", { text: "no idea what order the tokens are in" }), ". A convolution is hard-wired ",
          "to position — a 3×3 kernel literally reads \"the pixel above-left, above, above-right.\" Locality and ",
          "order are baked into the weights. Attention threw all of that away. Each output token is ",
          TQ.math("softmax(Q·Kᵀ)·V"),
          " — a weighted average over every token, where the weights come only from ",
          TQ.el("strong", { text: "content" }), " (dot products of vectors), never from index."
        ),
        TQ.p(
          "Formally, attention is ", TQ.el("strong", { text: "permutation-equivariant" }),
          ": permute the input rows and you get the exact same outputs, just permuted the same way. An ",
          "unmoved token's output vector is bit-for-bit identical whether the rest of the sentence is in order ",
          "or shuffled. \"The cat sat on the mat\" and \"mat the on sat cat The\" produce the same bag of ",
          "representations. That's a problem, because word order is most of grammar."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "The fix: tag each position with a vector, and ADD it in"),
        TQ.p(
          "Before the first attention block, we give position its own embedding — a vector ", TQ.math("PE(pos)"),
          " that depends only on ", TQ.el("strong", { text: "where" }), " a token sits, not ",
          TQ.el("strong", { text: "what" }), " it is — and add it onto the token embedding: ",
          TQ.math("input = embedding + PE"), "."
        ),
        TQ.p(
          "Two things to internalize. First, it's ", TQ.el("strong", { text: "added, not concatenated" }),
          ". You don't grow ", TQ.math("d_model"), "; the position signal lives in the same 16 dimensions as ",
          "meaning, and the network learns to read it back out. Second, once you've added it, a token's input ",
          "vector now depends on its slot — the same word at position 1 vs position 2 becomes two different ",
          "vectors. Now when attention takes dot products, position leaks into the scores, and swapping two ",
          "words actually changes the result. Order is back on the menu."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "Why sinusoids: a multi-scale clock"),
        TQ.p(
          "The original Transformer builds PE from sines and cosines: ",
          TQ.math("PE(pos,2i) = sin(pos / 10000^(2i/d))"), ", ",
          TQ.math("PE(pos,2i+1) = cos(pos / 10000^(2i/d))"),
          ". Read the matrix as positions (rows) × dimensions (columns), where columns pair up ",
          "(0,1),(2,3),… each pair sharing one frequency. Low columns spin fast — column 0 is ",
          TQ.math("sin(pos/1)"), ", a full cycle every ~6 positions — and high columns spin glacially, ",
          "barely moving across a short sentence. It's a binary-counter-as-waves: fast bits flip every step, ",
          "slow bits encode coarse position."
        ),
        TQ.p(
          "Two payoffs. (1) It's deterministic and unbounded — position 5000 gets a clean code even if you ",
          "never trained past 512, so it ", TQ.el("strong", { text: "extrapolates" }), ". (2) The relative ",
          "offset between two positions is a fixed linear (rotation) function of their PEs, which lets attention ",
          "learn \"attend 3 tokens back\" as a single pattern — ",
          TQ.el("strong", { text: "see Panel D" }), ", where you slide the absolute position and watch the ",
          "similarity refuse to move."
        ),
        TQ.callout(
          "This is the fixed, hand-designed scheme. Modern models often skip it for RoPE, which rotates Q and K " +
          "by position-dependent angles instead of adding anything — and RoPE comes back to bite us in the MLA " +
          "level, where DeepSeek has to carve out a \"decoupled\" RoPE key because rotation doesn't play nicely " +
          "with their latent KV compression."
        )
      ));

      /* ===================================================== PANEL A: PE map */
      var panelA = TQ.block(
        TQ.h(2, "Panel A · The sinusoidal PE matrix"),
        TQ.p(
          "Below is ", TQ.math("PE(pos, 16)"), " straight from ", TQ.math("TQ.sinusoidalPE"),
          ": rows are positions, columns are dimensions, colored on our shared scale (fixed to ",
          TQ.math("[-1, 1]"), " since sin/cos live there). Drag ", TQ.el("strong", { text: "dimension" }),
          " to highlight one column; the canvas plots that column's wave across positions. Watch the ",
          "frequency drop as the dimension climbs."
        )
      );
      var legendA = TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "−1" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "+1" })
      );
      panelA.appendChild(legendA);

      var stateA = { nPos: 8, dim: 0 };

      var heatHolderA = TQ.el("div", { class: "tq-grow" });
      var wavePanel = TQ.canvasPanel(360, 200, function (ctx, w, h) {
        drawWave(ctx, w, h);
      });
      var waveInfo = TQ.el("div", { class: "tq-pe-waveinfo" });

      function peMatrix() { return TQ.sinusoidalPE(stateA.nPos, d); }

      function wavelengthFor(dim) {
        // pair (2i, 2i+1) share frequency 1/10000^(2i/d); period = 2π·10000^(2i/d)
        var twoI = 2 * Math.floor(dim / 2);
        return 2 * Math.PI * Math.pow(10000, twoI / d);
      }

      function buildHeatA() {
        var PE = peMatrix();
        return TQ.heatmap(PE, {
          rowLabels: TQ.range(stateA.nPos).map(function (p) { return "pos " + p; }),
          colLabels: TQ.range(d).map(function (i) { return String(i); }),
          cellSize: 30,
          min: -1, max: 1,
          selectedCol: stateA.dim,
          format: function (v) { return TQ.fmt(v, 2); },
          title: "PE(pos, dim) — selected dimension highlighted"
        });
      }

      function refreshHeatA() {
        heatHolderA.innerHTML = "";
        heatHolderA.appendChild(buildHeatA());
      }

      function drawWave(ctx, w, h) {
        var PE = peMatrix();
        var dim = stateA.dim;
        var isSin = (dim % 2 === 0);
        var pad = 28;
        var x0 = pad, x1 = w - 10;
        var y0 = 12, y1 = h - 22;
        var midY = (y0 + y1) / 2;
        // axes
        ctx.strokeStyle = TQ.cssVar("--ink", 0.16, "#e9edf8");
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x0, midY); ctx.lineTo(x1, midY); ctx.stroke(); // y=0
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();     // axis
        // labels for +1 / 0 / -1
        ctx.fillStyle = TQ.cssVar("--ink", 0.6, "#e8ecf6");
        ctx.font = "10px ui-monospace, monospace";
        ctx.fillText("+1", 4, y0 + 8);
        ctx.fillText("0", 10, midY + 3);
        ctx.fillText("-1", 6, y1);

        var nP = stateA.nPos;
        function px(p) { return nP > 1 ? x0 + (p / (nP - 1)) * (x1 - x0) : (x0 + x1) / 2; }
        function py(v) { return midY - v * (y1 - y0) / 2; }

        // line
        ctx.strokeStyle = TQ.colorFor(0.82);
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (var p = 0; p < nP; p++) {
          var v = PE[p][dim];
          if (p === 0) ctx.moveTo(px(p), py(v)); else ctx.lineTo(px(p), py(v));
        }
        ctx.stroke();
        // points colored by value on the shared scale
        for (var q = 0; q < nP; q++) {
          var val = PE[q][dim];
          ctx.fillStyle = TQ.colorFor((val + 1) / 2);
          ctx.beginPath();
          ctx.arc(px(q), py(val), 4, 0, Math.PI * 2);
          ctx.fill();
        }
        // caption
        ctx.fillStyle = TQ.cssVar("--ink", 0.7, "#e8ecf6");
        ctx.font = "11px ui-monospace, monospace";
        ctx.fillText("dim " + dim + " = " + (isSin ? "sin" : "cos") + "(pos / 10000^" +
          TQ.fmt(2 * Math.floor(dim / 2) / d, 3) + ")", x0, h - 6);
      }

      function refreshWaveInfo() {
        var dim = stateA.dim;
        var isSin = (dim % 2 === 0);
        var wl = wavelengthFor(dim);
        var pairLo = 2 * Math.floor(dim / 2), pairHi = pairLo + 1;
        waveInfo.innerHTML = "";
        waveInfo.appendChild(TQ.el("div", { class: "tq-pe-chips" },
          TQ.kv("dimension", String(dim)),
          TQ.kv("function", isSin ? "sin" : "cos"),
          TQ.kv("wavelength", wl >= 1000 ? Math.round(wl).toLocaleString() + " pos" : TQ.fmt(wl, 1) + " pos"),
          TQ.kv("pair", "(" + pairLo + ", " + pairHi + ")")
        ));
        waveInfo.appendChild(TQ.note(
          isSin
            ? "This column is the SINE of its frequency. Its partner (dim " + pairHi + ") is the COSINE at the " +
              "same frequency — 90° out of phase. A sin/cos pair is exactly what makes relative position a clean " +
              "rotation — the property Panel D measures: PE(p)·PE(p+k) depends only on the gap k, not on p."
            : "This column is the COSINE of its frequency. Its partner (dim " + pairLo + ") is the SINE at the " +
              "same frequency — 90° out of phase. A sin/cos pair is exactly what makes relative position a clean " +
              "rotation — the property Panel D measures: PE(p)·PE(p+k) depends only on the gap k, not on p."
        ));
      }

      var dimSlider = TQ.slider({
        min: 0, max: d - 1, step: 1, value: stateA.dim, label: "dimension (column)",
        format: function (v) { return "dim " + Math.round(v); },
        onInput: function (v) {
          stateA.dim = Math.round(v);
          refreshHeatA();
          wavePanel.redraw();
          refreshWaveInfo();
        }
      });
      var posSlider = TQ.slider({
        min: 4, max: 20, step: 1, value: stateA.nPos, label: "positions (rows)",
        format: function (v) { return Math.round(v) + " rows"; },
        onInput: function (v) {
          stateA.nPos = Math.round(v);
          refreshHeatA();
          wavePanel.redraw();
        }
      });

      panelA.appendChild(TQ.el("div", { class: "tq-controls-row" }, dimSlider.el, posSlider.el));
      panelA.appendChild(TQ.el("div", { class: "tq-flexrow tq-pe-arow" },
        heatHolderA,
        TQ.el("div", { class: "tq-panel tq-pe-wavecol" },
          TQ.el("div", { class: "tq-slider-label", text: "Selected dimension across positions" }),
          wavePanel.el,
          waveInfo
        )
      ));
      panelA.appendChild(TQ.callout(
        "Drag dimension from 0 upward and the wave stretches out. Dim 0 completes a full cycle in ~6 positions; " +
        "by dim 14 the wavelength is ~19,000 positions, so it's essentially flat across one sentence. Low dims = " +
        "fine position, high dims = coarse position — together they pin down an exact slot, like bits of a counter."
      ));
      refreshHeatA();
      refreshWaveInfo();
      root.appendChild(panelA);

      /* ============================================ PANEL B: add PE to a token */
      var panelB = TQ.block(
        TQ.h(2, "Panel B · Adding PE changes the vector"),
        TQ.p(
          "Pick a toy token and a position. We show its embedding, the position code ", TQ.math("PE(pos)"),
          ", and their elementwise sum ", TQ.math("embedding + PE"), " — three colored vectors. Several cells ",
          "visibly change color: the encoding now depends on the slot. The distance readout makes \"position ",
          "changes the vector\" a number, not a vibe."
        )
      );

      var peRows = TQ.sinusoidalPE(n, d); // 6 x 16 — one row per slot in the sentence
      var stateB = { tok: 1, posA: 1, posB: 2 };

      var tokSel = TQ.segmented({
        options: tokens.map(function (t, i) { return { label: t, value: i }; }),
        value: stateB.tok,
        onChange: function (v) { stateB.tok = v; updateB(); }
      });
      var posSliderB = TQ.slider({
        min: 0, max: n - 1, step: 1, value: stateB.posA, label: "position (slot)",
        format: function (v) { return "pos " + Math.round(v); },
        onInput: function (v) { stateB.posA = Math.round(v); updateB(); }
      });
      var posSliderB2 = TQ.slider({
        min: 0, max: n - 1, step: 1, value: stateB.posB, label: "compare-against position",
        format: function (v) { return "pos " + Math.round(v); },
        onInput: function (v) { stateB.posB = Math.round(v); updateB(); }
      });

      var outB = TQ.el("div", { class: "tq-panel" });

      function updateB() {
        var ti = stateB.tok, pa = stateB.posA, pb = stateB.posB;
        var e = emb[ti];
        var plus = TQ.addMat([e], [peRows[pa]])[0]; // embedding + PE(pa)
        // distance between the SAME token at two positions; embedding cancels:
        // ||(e+PE_a) - (e+PE_b)|| = ||PE_a - PE_b||
        var diff = [];
        for (var k = 0; k < d; k++) diff.push(peRows[pa][k] - peRows[pb][k]);
        var dist = TQ.norm(diff);

        outB.innerHTML = "";
        outB.appendChild(TQ.vectorView(e, { label: tokens[ti] + " — embedding", cellSize: 20 }));
        outB.appendChild(TQ.vectorView(peRows[pa], { label: "PE(pos " + pa + ")", cellSize: 20, max: 1 }));
        outB.appendChild(TQ.vectorView(plus, { label: tokens[ti] + " + PE(pos " + pa + ")  →  input", cellSize: 20 }));

        outB.appendChild(TQ.el("div", { class: "tq-pe-distrow" },
          TQ.el("div", { class: "tq-sim-cos" },
            TQ.el("span", { class: "tq-stat-cap", text:
              "L2 distance: \"" + tokens[ti] + "\" at pos " + pa + " vs pos " + pb }),
            TQ.el("span", { class: "tq-stat-big", text: TQ.fmt(dist, 3) })
          ),
          (pa === pb
            ? TQ.badge("same slot → distance 0", "default")
            : TQ.badge("position moved the vector", "info"))
        ));
        outB.appendChild(TQ.note(
          "The token embedding cancels in the difference, so this distance is exactly ‖PE(" + pa + ") − PE(" +
          pb + ")‖ — it depends only on the two slots, not on which word you picked. Adjacent toy slots sit ≈1.0 apart."
        ));
      }

      panelB.appendChild(TQ.el("div", { class: "tq-flexcol", style: { gap: "12px" } },
        TQ.el("div", {}, TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "token"), tokSel.el),
        TQ.el("div", { class: "tq-controls-row" }, posSliderB.el, posSliderB2.el),
        outB
      ));
      updateB();
      root.appendChild(panelB);

      /* ====================================== PANEL C: permutation demo */
      var panelC = TQ.block(
        TQ.h(2, "Panel C · Swap two words — does the output move?"),
        TQ.p(
          "Now the payoff. We derive ", TQ.math("Q, K, V"), " from the input (the documented ",
          TQ.math("TQ.toyQKV"), " convention, ", TQ.math("dk = 8"), ") and run real ", TQ.math("TQ.attention"),
          ". Input is either the raw embeddings (PE ", TQ.el("strong", { text: "off" }), ") or ",
          TQ.math("embeddings + PE"), " (PE ", TQ.el("strong", { text: "on" }),
          "). \"Swap cat⇄sat\" rebuilds the input with rows 1 and 2 traded ",
          TQ.el("strong", { text: "before" }), " PE is added, then reruns. We watch the attention-weight row ",
          "for \"The\" and its output vector — original vs swapped."
        )
      );

      var dk = 8;
      var stateC = { pe: false, swapped: false };

      var peToggle = TQ.toggle({
        label: "add positional encoding",
        value: stateC.pe,
        onChange: function (v) { stateC.pe = v; updateC(); }
      });
      var swapBtn = TQ.el("button", { class: "tq-btn tq-btn-accent", type: "button" });
      swapBtn.addEventListener("click", function () { stateC.swapped = !stateC.swapped; updateC(); });

      var outC = TQ.el("div", { class: "tq-panel" });

      function buildInput(swapped, withPE) {
        // start from embeddings; swap cat (row1) & sat (row2) if requested
        var rows = [];
        for (var i = 0; i < n; i++) rows.push(emb[i].slice());
        if (swapped) { var tmp = rows[1]; rows[1] = rows[2]; rows[2] = tmp; }
        if (withPE) rows = TQ.addMat(rows, peRows);
        return rows;
      }

      function runAttn(input) {
        // deterministic projections via the documented convention (seeds 101/202/303)
        var Wq = TQ.randMatrix(d, dk, 101);
        var Wk = TQ.randMatrix(d, dk, 202);
        var Wv = TQ.randMatrix(d, dk, 303);
        var Q = TQ.matmul(input, Wq);
        var K = TQ.matmul(input, Wk);
        var V = TQ.matmul(input, Wv);
        return TQ.attention(Q, K, V);
      }

      function updateC() {
        swapBtn.textContent = stateC.swapped ? "↺ Unswap (back to original order)" : "⇄ Swap cat ⇄ sat";

        var orig = runAttn(buildInput(false, stateC.pe));
        var swap = runAttn(buildInput(true, stateC.pe));

        // 'The' is row 0 — unmoved by the cat/sat swap
        var wOrig = orig.weights[0];
        var wSwap = swap.weights[0];
        var oOrig = orig.output[0];
        var oSwap = swap.output[0];

        // per-component output delta (orig vs swap)
        var delta = [];
        var maxAbsDelta = 0;
        for (var k = 0; k < oOrig.length; k++) {
          var dv = oSwap[k] - oOrig[k];
          delta.push(dv);
          if (Math.abs(dv) > maxAbsDelta) maxAbsDelta = Math.abs(dv);
        }
        var changed = maxAbsDelta > 1e-9;

        // labels: under swap the sentence order is The, sat, cat, on, the, mat
        var origLabels = tokens.slice();
        var swapLabels = tokens.slice();
        var t2 = swapLabels[1]; swapLabels[1] = swapLabels[2]; swapLabels[2] = t2;

        outC.innerHTML = "";
        outC.appendChild(TQ.el("div", { class: "tq-pe-statebar" },
          TQ.badge(stateC.pe ? "PE: ON" : "PE: OFF", stateC.pe ? "good" : "default"),
          TQ.badge(stateC.swapped ? "order: cat⇄sat swapped" : "order: original", stateC.swapped ? "warn" : "info"),
          TQ.el("span", { class: "tq-pe-statenote", text:
            stateC.pe
              ? "Inputs carry position → swapping changes the scores."
              : "Inputs are pure content → swapping only permutes columns." })
        ));

        outC.appendChild(TQ.el("div", { class: "tq-flexrow tq-pe-crow" },
          TQ.el("div", { class: "tq-pe-col" },
            TQ.el("div", { class: "tq-slider-label", text: "Attention weights for \"The\" — ORIGINAL" }),
            TQ.barRow(wOrig, { labels: origLabels, max: 1, format: function (v) { return TQ.fmt(v, 3); } })
          ),
          TQ.el("div", { class: "tq-pe-col" },
            TQ.el("div", { class: "tq-slider-label", text: "Attention weights for \"The\" — SWAPPED" }),
            TQ.barRow(wSwap, { labels: swapLabels, max: 1, format: function (v) { return TQ.fmt(v, 3); } })
          )
        ));

        outC.appendChild(TQ.el("div", { class: "tq-flexrow tq-pe-crow" },
          TQ.el("div", { class: "tq-pe-col" },
            TQ.vectorView(oOrig, { label: "output[\"The\"] — ORIGINAL", cellSize: 22, showValues: false })
          ),
          TQ.el("div", { class: "tq-pe-col" },
            TQ.vectorView(oSwap, { label: "output[\"The\"] — SWAPPED", cellSize: 22, showValues: false })
          )
        ));

        outC.appendChild(TQ.el("div", { class: "tq-pe-deltawrap" },
          TQ.el("div", { class: "tq-slider-label" },
            "Per-component change in output[\"The\"] (swapped − original)  ",
            changed
              ? TQ.badge("Δ nonzero — output MOVED", "warn")
              : TQ.badge("✓ all zero — output IDENTICAL", "good")
          ),
          TQ.vectorView(delta, { label: "Δ output", cellSize: 22, max: Math.max(maxAbsDelta, 1e-6), showValues: true })
        ));

        outC.appendChild(changed
          ? TQ.callout(
              "With PE ON: \"cat\" and \"sat\" now carry different position tags, so swapping them changes the " +
              "dot products. \"The\"'s weight row is genuinely different and its output vector moves (the Δ row lights " +
              "up). THIS contrast is the entire motivation for positional encoding.")
          : TQ.callout(
              "With PE OFF: the weight row for \"The\" just trades its cat/sat columns — same numbers — and the output " +
              "vector is byte-identical (Δ is all zero). This is permutation-equivariance you can stare at: an unmoved " +
              "token sees the same multiset of keys/values, so its output cannot change. Flip PE on and swap again."));
      }

      panelC.appendChild(TQ.el("div", { class: "tq-controls-row" }, peToggle.el, swapBtn));
      panelC.appendChild(outC);
      updateC();
      root.appendChild(panelC);

      /* ============ PANEL D: relative position — the dot product only sees the gap */
      var panelD = TQ.block(
        TQ.h(2, "Panel D · Relative position: the dot product only sees the gap"),
        TQ.p(
          "Panel C proved we ", TQ.el("strong", { text: "need" }), " order. This panel shows ",
          TQ.el("strong", { text: "why sinusoids in particular" }),
          ". Take two positions a fixed offset ", TQ.math("k"), " apart and dot their codes: ",
          TQ.math("sim(p, k) = PE(p) · PE(p+k)"),
          ". The astonishing part — slide the reference position ", TQ.math("p"),
          " with ", TQ.math("k"), " held fixed and the dot product barely moves, even though the two raw ",
          "vectors underneath churn wildly. The similarity depends almost entirely on the ",
          TQ.el("strong", { text: "gap" }), ", not on where you start. That is exactly what lets attention ",
          "learn \"attend ", TQ.math("k"), " tokens back\" as one reusable pattern."
        )
      );

      // A tall, real PE table so p and k slide over a genuine range. d stays 16.
      var nPosD = 40;
      var Kmax = 12;
      var peD = TQ.sinusoidalPE(nPosD, d); // 40 x 16 sinusoids — all real
      var stateD = { p: 4, k: 3, kAlt: 5, overlay: false };

      function simD(a, b) { return TQ.dot(peD[a], peD[b]); } // PE[a]·PE[b]

      // s(k) = PE[ref]·PE[ref+kk] for kk in 0..Kmax — the offset curve from one ref.
      function offsetCurve(ref) {
        var s = [];
        for (var kk = 0; kk <= Kmax; kk++) s.push(simD(ref, ref + kk));
        return s;
      }

      // Sample the pinned similarity at the CURRENT k across several reference
      // positions p' = 0,4,8,... (all valid, i.e. p'+k < nPosD). The spread of
      // these is the live "drift" — translation-invariance turned into a number.
      function driftSamples(k) {
        var vals = [];
        for (var pp = 0; pp + k < nPosD; pp += 4) vals.push(simD(pp, pp + k));
        return vals;
      }

      var ctrlP = TQ.slider({
        min: 0, max: nPosD - 1 - Kmax, step: 1, value: stateD.p, label: "reference position p",
        format: function (v) { return "p = " + Math.round(v); },
        onInput: function (v) { stateD.p = Math.round(v); updateD(); }
      });
      var ctrlK = TQ.slider({
        min: 0, max: Kmax, step: 1, value: stateD.k, label: "offset k",
        format: function (v) { return "k = " + Math.round(v); },
        onInput: function (v) { stateD.k = Math.round(v); updateD(); }
      });
      var ctrlKalt = TQ.segmented({
        options: [{ label: "k′ = 1", value: 1 }, { label: "k′ = 5", value: 5 }, { label: "k′ = 9", value: 9 }],
        value: stateD.kAlt,
        onChange: function (v) { stateD.kAlt = v; updateD(); }
      });
      var ctrlOverlay = TQ.toggle({
        label: "overlay the curve at a second reference position (p + 7)",
        value: stateD.overlay,
        onChange: function (v) { stateD.overlay = v; updateD(); }
      });

      // The similarity-vs-offset canvas. Draws s(k) for the current p (and,
      // when overlay is on, for p2 = p+7) with the chosen k marked.
      var curveCanvas = TQ.canvasPanel(380, 220, function (ctx, w, h) {
        drawCurveD(ctx, w, h);
      });
      var pinOut = TQ.el("div", { class: "tq-panel tq-pe-pin" });
      var vecOut = TQ.el("div", { class: "tq-pe-relcol" });
      var curveCap = TQ.el("div", { class: "tq-pe-relcap" });

      function curveExtent() {
        // y-range across every curve we might draw, so axes are stable while sliding.
        var all = offsetCurve(stateD.p);
        var p2 = stateD.p + 7;
        if (p2 + Kmax < nPosD) all = all.concat(offsetCurve(p2));
        return { lo: Math.min(0, TQ.minOf(all)), hi: TQ.maxOf(all) };
      }

      function drawCurveD(ctx, w, h) {
        var ext = curveExtent();
        var lo = ext.lo, hi = ext.hi, span = (hi - lo) || 1;
        var pad = 30;
        var x0 = pad, x1 = w - 12, y0 = 14, y1 = h - 26;
        function px(kk) { return x0 + (kk / Kmax) * (x1 - x0); }
        function py(v) { return y1 - ((v - lo) / span) * (y1 - y0); }

        // axes
        ctx.strokeStyle = TQ.cssVar("--ink", 0.16, "#e9edf8");
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();   // y axis
        ctx.beginPath(); ctx.moveTo(x0, py(0)); ctx.lineTo(x1, py(0)); ctx.stroke(); // y=0
        ctx.fillStyle = TQ.cssVar("--ink", 0.6, "#e8ecf6");
        ctx.font = "10px ui-monospace, monospace";
        ctx.fillText("sim", 4, y0 + 8);
        ctx.fillText("0", 12, py(0) + 3);
        ctx.fillText("k=0", x0 - 4, y1 + 14);
        ctx.fillText("k=" + Kmax, x1 - 30, y1 + 14);

        function plot(ref, t, withPoints) {
          var s = offsetCurve(ref);
          ctx.strokeStyle = TQ.colorFor(t);
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (var kk = 0; kk <= Kmax; kk++) {
            if (kk === 0) ctx.moveTo(px(kk), py(s[kk])); else ctx.lineTo(px(kk), py(s[kk]));
          }
          ctx.stroke();
          if (withPoints) {
            for (var q = 0; q <= Kmax; q++) {
              ctx.fillStyle = TQ.colorFor(t);
              ctx.globalAlpha = 0.7;
              ctx.beginPath(); ctx.arc(px(q), py(s[q]), 2.5, 0, Math.PI * 2); ctx.fill();
              ctx.globalAlpha = 1;
            }
          }
        }

        // overlay curve at p2 first (so it sits under the primary), then primary.
        var p2 = stateD.p + 7;
        if (stateD.overlay && p2 + Kmax < nPosD) plot(p2, 0.5, false);
        plot(stateD.p, 0.82, true);

        // mark the chosen k on the primary curve.
        var sk = simD(stateD.p, stateD.p + stateD.k);
        var mx = px(stateD.k), my = py(sk);
        ctx.strokeStyle = TQ.cssVar("--ink", 0.28, "#e8ecf6");
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(mx, py(0)); ctx.lineTo(mx, my); ctx.stroke();
        ctx.fillStyle = TQ.colorForSigned(sk, Math.max(Math.abs(hi), Math.abs(lo), 1));
        ctx.beginPath(); ctx.arc(mx, my, 5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = TQ.cssVar("--accent", 1, "#f2a93b");
        ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = TQ.cssVar("--ink", 0.85, "#e8ecf6");
        ctx.font = "11px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.fillText("k=" + stateD.k + " · " + TQ.fmt(sk, 3), mx, my - 9);
        ctx.textAlign = "left";
      }

      function updateD() {
        var p = stateD.p, k = stateD.k, kAlt = stateD.kAlt;
        var simK = simD(p, p + k);                 // PE(p)·PE(p+k)
        var simK2 = simD(p, p + kAlt);             // control offset PE(p)·PE(p+k′)
        var selfSim = simD(p, p);                  // the k=0 peak

        // drift across reference positions at the CURRENT k.
        var ds = driftSamples(k);
        var drift = TQ.maxOf(ds) - TQ.minOf(ds);

        curveCanvas.redraw();

        // (1) pinned readout + drift badge + control chip
        pinOut.innerHTML = "";
        pinOut.appendChild(TQ.el("div", { class: "tq-pe-relrow" },
          TQ.el("div", { class: "tq-sim-cos" },
            TQ.el("span", { class: "tq-stat-cap", text: "PE(p) · PE(p+k)   [p = " + p + ", k = " + k + "]" }),
            TQ.el("span", { class: "tq-stat-big", text: TQ.fmt(simK, 3) })
          ),
          (drift < 1e-6
            ? TQ.badge("invariant to absolute position", "good")
            : TQ.badge("drifts at this k", "info"))
        ));
        pinOut.appendChild(TQ.el("div", { class: "tq-pe-chips" },
          TQ.kv("drift across p", TQ.fmt(drift, 4)),
          TQ.kv("sampled p′", "0, 4, … (" + ds.length + " refs)"),
          TQ.kv("self-similarity (k=0)", TQ.fmt(selfSim, 3))
        ));
        pinOut.appendChild(TQ.el("div", { class: "tq-pe-relrow" },
          TQ.el("div", { class: "tq-sim-cos" },
            TQ.el("span", { class: "tq-stat-cap", text: "control: PE(p) · PE(p+k′)   [k′ = " + kAlt + "]" }),
            TQ.el("span", { class: "tq-stat-big", text: TQ.fmt(simK2, 3) })
          ),
          TQ.badge("different offset → different similarity", "info")
        ));

        // (3) the two raw vectors that churn while the dot product holds
        vecOut.innerHTML = "";
        vecOut.appendChild(TQ.vectorView(peD[p], { label: "PE(p = " + p + ")", cellSize: 18, max: 1 }));
        vecOut.appendChild(TQ.vectorView(peD[p + k], { label: "PE(p+k = " + (p + k) + ")", cellSize: 18, max: 1 }));

        // (2)/overlay caption: how close are the two curves?
        curveCap.innerHTML = "";
        var p2 = p + 7;
        if (stateD.overlay && p2 + Kmax < nPosD) {
          var c1 = offsetCurve(p), c2 = offsetCurve(p2);
          var gaps = [];
          for (var kk = 0; kk <= Kmax; kk++) gaps.push(Math.abs(c1[kk] - c2[kk]));
          var maxGap = TQ.maxOf(gaps);
          curveCap.appendChild(TQ.el("span", { text:
            "Two curves: s(k) at p = " + p + " and at p2 = " + p2 + ". Largest vertical gap across all k is " }));
          curveCap.appendChild(TQ.el("strong", { text: TQ.fmt(maxGap, 4) }));
          curveCap.appendChild(TQ.el("span", { text: " — the curve barely depends on where you start." }));
        } else {
          curveCap.appendChild(TQ.el("span", { text:
            "s(k) = PE(" + p + ")·PE(" + p + "+k) over k = 0…" + Kmax +
            ". Peaks at k = 0 (self-similarity " + TQ.fmt(selfSim, 2) + ") and decays as the gap grows — " +
            "that decay is a usable notion of relative distance. Toggle the overlay to prove it barely moves with p." }));
        }
      }

      panelD.appendChild(TQ.el("div", { class: "tq-controls-row" }, ctrlP.el, ctrlK.el));
      panelD.appendChild(TQ.el("div", { class: "tq-controls-row" },
        TQ.el("div", {},
          TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "control offset k′"),
          ctrlKalt.el
        ),
        TQ.el("div", {}, ctrlOverlay.el)
      ));
      panelD.appendChild(TQ.el("div", { class: "tq-flexrow tq-pe-drow" },
        TQ.el("div", { class: "tq-pe-relcol tq-grow" }, pinOut, vecOut),
        TQ.el("div", { class: "tq-panel tq-pe-curvecol" },
          TQ.el("div", { class: "tq-slider-label", text: "similarity vs offset   s(k) = PE(p)·PE(p+k)" }),
          curveCanvas.el,
          curveCap
        )
      ));
      panelD.appendChild(TQ.note(
        "This is exact, not approximate — and it holds at ANY d_model, including the 16 used here. Each sin·sin + " +
        "cos·cos pair collapses to cos(k / 10000^(2i/d)), in which the absolute position p has cancelled, so " +
        "PE(p)·PE(p+k) = Σ_i cos(k / 10000^(2i/d)) is provably a function of the gap k alone. The drift you see " +
        "(~1e-15) is pure floating-point rounding, not a truncation artifact. Slide p and watch the readout hold " +
        "to the displayed precision while the two vectors above recolor completely."
      ));
      panelD.appendChild(TQ.callout(
        "This is the deep reason sinusoids beat arbitrary learned tags: a single relative offset k always produces " +
        "the same similarity, anywhere in the sequence. Attention can learn one \"look k tokens back\" pattern and " +
        "reuse it at every position — and RoPE (the L9 payoff) takes this idea further, baking the rotation directly " +
        "into Q and K instead of adding a vector at all."
      ));
      updateD();
      root.appendChild(panelD);

      /* ----------------------------------------------------- wrap-up */
      root.appendChild(TQ.block(
        TQ.h(2, "Takeaway"),
        TQ.p(
          "Raw self-attention is a function over a ", TQ.el("strong", { text: "set" }),
          "; positional encoding is the one ingredient that turns it back into a function over a ",
          TQ.el("strong", { text: "sequence" }), ". Sinusoidal PE is the original fixed recipe: a multi-scale ",
          "clock added straight onto the embeddings. Learned PE and RoPE are the alternatives — and RoPE returns ",
          "in the MLA level (L9), where rotating Q/K clashes with low-rank KV compression and forces a ",
          "\"decoupled\" RoPE key."
        ),
        TQ.callout("Mental model to carry forward: input = meaning + position, sharing the same dimensions. " +
                   "Everything attention does downstream now has order to work with.")
      ));

      /* scoped styles (colors only via CSS vars / TQ.colorFor — no hardcoded hex) */
      injectOnce("tq-lvl05-css",
        ".tq-pe-arow{align-items:flex-start;gap:20px}" +
        ".tq-pe-wavecol{min-width:380px;display:flex;flex-direction:column;gap:10px}" +
        ".tq-pe-waveinfo{display:flex;flex-direction:column;gap:8px}" +
        ".tq-pe-chips{display:flex;gap:8px;flex-wrap:wrap}" +
        ".tq-pe-distrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 4px}" +
        ".tq-pe-statebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}" +
        ".tq-pe-statenote{color:var(--ink-mute);font-size:13px}" +
        ".tq-pe-crow{align-items:flex-start;gap:20px;margin-bottom:10px}" +
        ".tq-pe-col{flex:1 1 240px;min-width:220px;display:flex;flex-direction:column;gap:8px}" +
        ".tq-pe-deltawrap{display:flex;flex-direction:column;gap:8px;margin-top:8px}" +
        ".tq-pe-drow{align-items:flex-start;gap:20px}" +
        ".tq-pe-relcol{display:flex;flex-direction:column;gap:10px;min-width:300px}" +
        ".tq-pe-curvecol{min-width:392px;display:flex;flex-direction:column;gap:10px}" +
        ".tq-pe-pin{display:flex;flex-direction:column;gap:10px;padding:12px}" +
        ".tq-pe-relrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}" +
        ".tq-pe-relcap{font-size:13px;color:var(--ink-mute);line-height:1.5}");
    },

    quiz: [
      {
        q: "Without positional encoding, you swap two words in the input and recompute attention. What happens to the output vector of a third, unmoved token?",
        choices: [
          "It is unchanged (bit-for-bit identical)",
          "It changes, because attention is sensitive to order",
          "It becomes zero",
          "It changes only if the swapped words were adjacent"
        ],
        answer: 0,
        explain: "Self-attention is permutation-equivariant: it's a content-weighted average over a set. An " +

      },

        choices: [

      {

        choices: [
          "Low dims are noise; high dims carry the real signal",
          "Each dimension pair uses frequency 1/10000^(2i/d), so high dims have very long wavelengths and barely move over a few positions",
          "High dims are zeroed out during training",
          "It's a rendering artifact of the color scale"
        ],
        answer: 1,
        explain: "The wavelength grows geometrically with the dimension index. Dim 0 cycles every ~6 positions; " +
                 "dim 14 has a wavelength of ~19,000 positions, so it's essentially flat across one sentence. Fast " +

      },
      {

        choices: [
          "RoPE also adds a vector to the embedding, just with learned values",
          "RoPE rotates the query and key vectors by position-dependent angles instead of adding anything, and it returns in the MLA level where it must be decoupled from latent KV compression",
          "Learned positional embeddings are mathematically identical to sinusoidal ones",
          "Modern LLMs concatenate the position index as a raw scalar"
        ],
        answer: 1,
        explain: "RoPE injects position by rotating Q and K (not by adding a PE vector), which makes relative " +
                 "position fall out of the dot product. In DeepSeek's MLA, RoPE clashes with low-rank KV " +

  // tiny helper local to this module (NOT a global): inject scoped CSS once.
  function injectOnce(id, css) {

/* ===== 06-transformer-block.js ===== */
/* ============================================================================
 * LEVEL 06 — The Transformer Block   (order 6)
 * ----------------------------------------------------------------------------
 * Assemble a full post-LN block and animate ONE toy token's 16-dim vector
 * through every sub-layer, every number computed live by TQ math:
 *
 *   z   = LayerNorm(x + MHA(x))
 *   out = LayerNorm(z + FFN(z))      FFN(z) = max(0, zW1+b1)W2 + b2
 *
 * Pattern (copied from 01-tokens-embeddings.js):
 *   - one IIFE, ONE TQ.registerLevel call, NO other globals
 *   - short explanation blocks + a PRIMARY interactive (TQ.stepper) walkthrough
 *   - all color through TQ.colorFor / TQ.vectorView / TQ.barRow (one language)
 *   - 4 quiz questions
 *
 * All quantities are genuinely computed:
 *   qkv = TQ.toyQKV(16, 101, 202, 303); att = TQ.attention(qkv.Q,qkv.K,qkv.V)
 *   x = embeddings[p]; a = att.output[p] (blend of all 6 V rows via att.weights[p])
 *   r1 = x + a; z = LayerNorm(r1) -> mean=0, var=1 (computed, not asserted)
 *   FFN: W1=randMatrix(16,32,711), W2=randMatrix(32,16,713); h = relu(zW1+b1)
 *   r2 = z + ff; out = LayerNorm(r2) -> mean=0, var=1; out is 16-dim like x.
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "transformer-block",
    order: 6,
    title: "The Transformer Block",
    icon: "🧱",
    tagline: "Assemble it: Attention + Add&Norm + Feed-Forward + Add&Norm, stacked.",
    preread: "Illustrated Transformer (capstone)",
    objectives: [
      "Assemble a full block: Multi-Head Attention → residual+LayerNorm → FFN → residual+LayerNorm",
      "Map residual connections onto your CNN skip-connection (ResNet) intuition",
      "Understand why we LayerNorm (stable activation scale → trainable deep stacks)",
      "Tell encoder (bidirectional), decoder-only (causal), and encoder–decoder (adds cross-attention) blocks apart"
    ],

    render: function (root) {
      var toy = TQ.toy;
      var tokens = toy.tokens;
      var emb = toy.embeddings;
      var d = toy.dModel;        // 16
      var n = tokens.length;     // 6
      var dHidden = 32;          // 2x expansion here for legibility (real models use ~4x; same shape lesson)

      /* ---- fixed, deterministic block weights (seeds frozen) ------------- */
      var qkv = TQ.toyQKV(d, 101, 202, 303);
      var att = TQ.attention(qkv.Q, qkv.K, qkv.V); // scaled dot-product, /sqrt(16)=/4
      // We project the attention output (dk=16) straight back as the MHA result
      // (single conceptual head here; W_O = identity-shaped). att.output is n x 16.

      var W1 = TQ.randMatrix(d, dHidden, 711);
      var W2 = TQ.randMatrix(dHidden, d, 713);
      var b1row = TQ.randMatrix(1, dHidden, 715, 0.3)[0];
      var b2row = TQ.randMatrix(1, d, 717, 0.3)[0];

      function addVec(u, v) {
        var out = [];
        for (var i = 0; i < u.length; i++) out.push(u[i] + v[i]);
        return out;
      }
      function variance(vec) {
        var mu = TQ.mean(vec);
        var s = 0;
        for (var i = 0; i < vec.length; i++) s += (vec[i] - mu) * (vec[i] - mu);
        return s / vec.length;
      }

      // Run the WHOLE block for a single position p; return every intermediate.
      function runBlock(p) {
        var x = emb[p].slice();
        var a = att.output[p].slice();           // MHA output for this token
        var r1 = addVec(x, a);                    // residual #1 (x + MHA)
        var z = TQ.layerNorm(r1);                 // LayerNorm #1

        var hRaw = addVec(TQ.matmul([z], W1)[0], b1row); // zW1 + b1
        var h = TQ.reluVec(hRaw);                 // ReLU
        var ff = addVec(TQ.matmul([h], W2)[0], b2row);   // hW2 + b2
        var r2 = addVec(z, ff);                   // residual #2 (z + FFN)
        var out = TQ.layerNorm(r2);               // LayerNorm #2

        return {
          x: x, a: a, r1: r1, z: z,
          hRaw: hRaw, h: h, ff: ff, r2: r2, out: out
        };
      }

      /* ----------------------------------------------------- intro narrative */
      root.appendChild(TQ.block(
        TQ.h(2, "The block is a loop body — and you've already debugged its twin"),
        TQ.p(
          "A transformer is a stack of identical ", TQ.el("strong", { text: "blocks" }),
          " (GPT-2 had 12–48; modern LLMs run 30–120). One block does exactly two things, in order: ",
          "(1) ", TQ.el("strong", { text: "mix tokens together" }), " with attention, then ",
          "(2) ", TQ.el("strong", { text: "think about each token individually" }), " with a small MLP. ",
          "Wrapped around each is the move you already trust from ResNet: a ",
          TQ.el("strong", { text: "skip connection" }), "."
        ),
        TQ.p(
          "The post-LN block computes ",
          TQ.math("z = LayerNorm(x + MHA(x))"), ", then ",
          TQ.math("out = LayerNorm(z + FFN(z))"), ". Read those ",
          TQ.math("x +"), " and ", TQ.math("z +"),
          " literally — they are residual connections. The sub-layer doesn't have to reproduce its " +
          "input; it only learns a ", TQ.el("strong", { text: "delta" }), " to add. Identity is free, so " +
          "gradients have a clean highway down a 100-layer stack and the thing actually trains. Without " +
          "residuals, deep transformers degrade and die exactly like deep plain CNNs did."
        ),
        TQ.callout(
          "CNN bridge: residual = skip connection (ResNet, 2015). The block learns x + (a small correction), " +
          "not x replaced. That's why gradients reach the bottom of a very deep stack."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "LayerNorm: the same fix as BatchNorm, but per-token so it survives inference"),
        TQ.p(
          "You normalized activations in CNNs with ", TQ.el("strong", { text: "BatchNorm" }),
          " — subtract the mean, divide by the std, restore a learnable scale/shift — to keep activation " +
          "scale stable so deep stacks stay trainable. ", TQ.el("strong", { text: "LayerNorm" }),
          " is the same idea with one critical change of axis."
        ),
        TQ.p(
          "BatchNorm normalizes each feature ", TQ.el("strong", { text: "across the batch" }),
          " (it leans on other examples). LayerNorm normalizes each token's vector ",
          TQ.el("strong", { text: "across its own features" }),
          " — no cross-token, no cross-batch dependency. That matters because an LLM generates one token " +
          "at a time with a batch of one and variable sequence length; a stat that depends on neighbors " +
          "would be poison at inference."
        ),
        TQ.p(
          "So for a single ", TQ.math("d_model = " + d), " vector, LayerNorm forces those ", String(d),
          " numbers to have ", TQ.el("strong", { text: "mean 0 and variance 1" }),
          " (then applies learned gain γ and bias β, here 1 and 0). The residual sum ",
          TQ.math("x + sublayer(x)"), " can blow up the scale; LayerNorm immediately tames it back. ",
          "In the walkthrough below you'll watch the mean and variance go from messy to exactly 0 and 1 — ",
          TQ.el("strong", { text: "computed, not asserted" }), "."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "The FFN is a per-token MLP — and it's where most of the parameters live"),
        TQ.p(
          "After attention lets tokens look at each other, the feed-forward network processes each token " +
          "independently: ", TQ.math("FFN(z) = max(0, zW1 + b1)W2 + b2"),
          ". It's a two-layer MLP — Linear, ReLU, Linear — and you've built a thousand of these."
        ),
        TQ.p(
          "Two things make it transformer-flavored. First, it's ", TQ.el("strong", { text: "position-wise" }),
          ": the SAME W1, W2 are applied at every position, like a 1×1 convolution sliding over the sequence " +
          "(shared weights, applied independently per location). Attention is the only place tokens talk; the " +
          "FFN is purely local per-token computation. Second, it ",
          TQ.el("strong", { text: "expands then contracts" }),
          " — the hidden layer is typically ~4× d_model (GPT-2/GPT-3 are exactly 4×; Llama-2-7B is " +
          "4096→11008, ~2.7×, because its SwiGLU trims the hidden size to pay for an extra gate matrix), " +
          "so despite being 'just an MLP' it holds roughly two-thirds of a transformer's parameters. Attention ",
          TQ.el("strong", { text: "routes" }), " information; the FFN is where the model ",
          TQ.el("strong", { text: "stores and transforms" }), " what it knows."
        ),
        TQ.note(
          "Modern models often swap ReLU for GELU/SwiGLU and put LayerNorm BEFORE each sub-layer " +
          "('pre-LN') for steadier gradients. We use the original post-LN here so the ordering is concrete."
        )
      ));

      /* ====================================================================
       *  PRIMARY INTERACTIVE: stepper walkthrough of one token's vector
       * ================================================================== */
      var primary = TQ.block(
        TQ.h(2, "Watch one token flow through the whole block"),
        TQ.p(
          "Pick a token, then step through all 7 stages. Every cell color is its value on the shared scale; " +
          "flip ", TQ.el("strong", { text: "show raw numbers" }), " to read the components. ",
          "Only ", TQ.el("strong", { text: "one" }),
          " stage uses the other tokens (attention) — everything else is per-token."
        )
      );

      // legend (matches level 01)
      primary.appendChild(TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "low" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "high" })
      ));

      // ---- shared control state -----------------------------------------
      var pos = 1;          // default 'cat' (#1)
      var showRaw = false;
      var depth = 1;        // stack-depth caption control
      var data = runBlock(pos);

      var posSel = TQ.segmented({
        options: tokens.map(function (t, i) { return { label: t, value: i }; }),
        value: pos,
        onChange: function (v) { pos = v; data = runBlock(pos); rebuildStepper(); }
      });

      var rawToggle = TQ.toggle({
        label: "show raw numbers",
        value: showRaw,
        onChange: function (v) { showRaw = v; rebuildStepper(); }
      });

      var depthSel = TQ.segmented({
        options: [{ label: "1 block", value: 1 }, { label: "6 blocks", value: 6 }, { label: "48 blocks", value: 48 }],
        value: depth,
        onChange: function (v) { depth = v; updateDepthCaption(); }
      });

      var depthCaption = TQ.note("");
      function updateDepthCaption() {
        depthCaption.innerHTML = "";
        var msg;
        if (depth === 1) {
          msg = "1 block. You're watching this single block in full. Real models stack many of these.";
        } else {
          msg = depth + " blocks stacked. The output below (16-dim, same shape as the input) becomes the " +

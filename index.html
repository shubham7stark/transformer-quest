/* ============================================================================
 * LEVEL 05 — Positional Encoding   (order 5)
 * ----------------------------------------------------------------------------
 * Same pattern as the reference level 01:
 *   - one IIFE, ONE TQ.registerLevel call, NO other globals
 *   - render() = short explanation blocks + PRIMARY interactive visualizations,
 *     every number genuinely computed via TQ math (TQ.sinusoidalPE, TQ.attention)
 *   - all color via TQ.colorFor / TQ.heatmap / TQ.vectorView (one color language)
 *   - 4 quiz questions
 *
 * Math shown here, all real:
 *   PANEL A — TQ.sinusoidalPE(nPos,16) heatmap + a canvas plot of one column's
 *     sin/cos wave across positions; the per-dimension wavelength is computed
 *     directly (2π·10000^(2·floor(dim/2)/16)).
 *   PANEL B — embedding vs PE(pos) vs embedding+PE (TQ.addMat) for a chosen toy
 *     token + position, plus the live L2 distance ||PE_a - PE_b|| between two slots.
 *   PANEL C — attention computed from input = embeddings (PE off) or
 *     addMat(embeddings, PE) (PE on), via TQ.toyQKV + TQ.attention; a "swap
 *     cat⇄sat" rebuilds the input with rows 1,2 swapped BEFORE adding PE. The
 *     'The' weight row + output vector + per-component output delta show that
 *     attention is permutation-equivariant WITHOUT PE and order-aware WITH it.
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "positional-encoding",
    order: 5,
    title: "Positional Encoding",
    icon: "🧭",
    tagline: "Attention is order-blind by default — give it a sense of position.",
    preread: "Illustrated Transformer / Basics",
    objectives: [
      "Understand self-attention is permutation-equivariant (no built-in order): shuffle the inputs and the outputs just shuffle the same way",
      "Read a sinusoidal PE matrix: positions × dimensions, low dims high-frequency, high dims low-frequency",
      "See that adding PE to an embedding changes the vector, and swapping two words changes their encodings"
    ],

    render: function (root) {
      var toy = TQ.toy;
      var tokens = toy.tokens;
      var emb = toy.embeddings;
      var d = toy.dModel;          // 16
      var n = tokens.length;       // 6

      /* ============================================================= intro */
      root.appendChild(TQ.block(
        TQ.h(2, "Attention is a set operation, not a sequence operation"),
        TQ.p(
          TQ.el("em", { text: "(A set has no order — {cat, sat} is the same as {sat, cat}; a sequence does.) " }),
          "Here's the unsettling fact your CNN intuition won't prepare you for: self-attention has ",
          TQ.el("strong", { text: "no idea what order the tokens are in" }), ". A convolution is hard-wired ",
          "to position — a 3×3 kernel literally reads \"the pixel above-left, above, above-right.\" Locality and ",
          "order are baked into the weights. Attention threw all of that away. Each output token is ",
          TQ.math("softmax(Q·Kᵀ)·V"),
          " — a weighted average over every token, where the weights come only from ",
          TQ.el("strong", { text: "content" }), " (dot products of vectors), never from index."
        ),
        TQ.p(
          "Formally, attention is ", TQ.el("strong", { text: "permutation-equivariant" }),
          " (shuffle the inputs and the outputs just shuffle the same way, nothing else changes)",
          ": permute the input rows and you get the exact same outputs, just permuted the same way. An ",
          "unmoved token's output vector is bit-for-bit identical whether the rest of the sentence is in order ",
          "or shuffled. \"The cat sat on the mat\" and \"mat the on sat cat The\" produce the same bag of ",
          "representations. That's a problem, because word order is most of grammar."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "The fix: tag each position with a vector, and ADD it in"),
        TQ.p(
          "Before the first attention block, we give position its own embedding — a vector ", TQ.math("PE(pos)"),
          " that depends only on ", TQ.el("strong", { text: "where" }), " a token sits, not ",
          TQ.el("strong", { text: "what" }), " it is — and add it onto the token embedding: ",
          TQ.math("input = embedding + PE"), "."
        ),
        TQ.p(
          "Two things to internalize. First, it's ", TQ.el("strong", { text: "added, not concatenated" }),
          ". You don't grow ", TQ.math("d_model"), "; the position signal lives in the same 16 dimensions as ",
          "meaning, and the network learns to read it back out. Second, once you've added it, a token's input ",
          "vector now depends on its slot — the same word at position 1 vs position 2 becomes two different ",
          "vectors. Now when attention takes dot products, position leaks into the scores, and swapping two ",
          "words actually changes the result. Order is back on the menu."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "Why sinusoids: a multi-scale clock"),
        TQ.p(
          "The original Transformer builds PE from sines and cosines: ",
          TQ.math("PE(pos,2i) = sin(pos / 10000^(2i/d))"), ", ",
          TQ.math("PE(pos,2i+1) = cos(pos / 10000^(2i/d))"),
          ". Read the matrix as positions (rows) × dimensions (columns), where columns pair up ",
          "(0,1),(2,3),… each pair sharing one frequency. Low columns spin fast — column 0 is ",
          TQ.math("sin(pos/1)"), ", a full cycle every ~6 positions — and high columns spin glacially, ",
          "barely moving across a short sentence. It's a binary-counter-as-waves: fast (low) dimensions are the ",
          "ones digit that flips every step, slow (high) dimensions are the high digits that encode coarse position."
        ),
        TQ.p(
          "Two payoffs. (1) It's deterministic and unbounded — position 5000 gets a clean code even if you ",
          "never trained past 512, so it ", TQ.el("strong", { text: "extrapolates" }), ". (2) The gap between two ",
          "positions always produces the same similarity — so the model can learn \"look k tokens back\" once and ",
          "reuse it everywhere. (Mathematically, the relative offset is a fixed linear/rotation function of the PEs.) ",
          "This lets attention learn \"attend 3 tokens back\" as a single pattern — ",
          TQ.el("strong", { text: "see Panel D" }), ", where you slide the absolute position and watch the ",
          "similarity refuse to move."
        ),
        TQ.callout(
          "(Preview — fully covered in L9, nothing to memorize now.) This is the fixed, hand-designed scheme. " +
          "Modern models often skip it for RoPE, which rotates Q and K " +
          "by position-dependent angles instead of adding anything — and RoPE comes back to bite us in the MLA " +
          "level, where DeepSeek has to carve out a \"decoupled\" RoPE key because rotation doesn't play nicely " +
          "with their latent KV compression."
        )
      ));

      /* ------- orienting diagram: WHERE PE enters the pipeline (static SVG) ----- */
      // Panels A-D all zoom INTO PE; none show the embedding -> (+PE) -> attention
      // dataflow the Takeaway ("input = meaning + position") depends on. Colors via
      // CSS vars / currentColor only — inherits the dark theme.
      root.appendChild(TQ.figure(
        '<svg viewBox="0 0 560 140" width="560" height="140" role="img" ' +
          'aria-label="Positional encoding is added onto token embeddings before the first attention block" ' +
          'font-family="var(--mono)" font-size="13">' +
          '<defs><marker id="tq-l5-arrow" viewBox="0 0 10 10" refX="9" refY="5" ' +
            'markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
            '<path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>' +
          // stage 1: token embeddings
          '<text x="74" y="34" text-anchor="middle" fill="var(--ink-mute)" font-size="11">token embeddings</text>' +
          '<rect x="14" y="44" width="120" height="38" rx="7" fill="var(--panel-hi)" stroke="var(--line)"/>' +
          '<text x="74" y="68" text-anchor="middle" fill="var(--ink)">embed (n × d)</text>' +
          // the (+) node
          '<circle cx="280" cy="63" r="20" fill="var(--panel-hi)" stroke="var(--accent-2)"/>' +
          '<text x="280" y="69" text-anchor="middle" fill="var(--accent-2)" font-size="20">+</text>' +
          // stage 3: input to attention
          '<text x="486" y="34" text-anchor="middle" fill="var(--ink-mute)" font-size="11">input to attention</text>' +
          '<rect x="426" y="44" width="120" height="38" rx="7" fill="var(--panel-hi)" stroke="var(--line)"/>' +
          '<text x="486" y="68" text-anchor="middle" fill="var(--ink)">input (n × d)</text>' +
          // PE feeding the (+) from below
          '<rect x="200" y="104" width="160" height="30" rx="7" fill="var(--panel-hi)" stroke="var(--line)"/>' +
          '<text x="280" y="123" text-anchor="middle" fill="var(--accent)" font-size="12">PE(pos) — sinusoidal (n × d)</text>' +
          // arrows
          '<g stroke="currentColor" stroke-width="1.5" fill="none" color="var(--ink-faint)">' +
            '<line x1="138" y1="63" x2="256" y2="63" marker-end="url(#tq-l5-arrow)"/>' +
            '<line x1="304" y1="63" x2="422" y2="63" marker-end="url(#tq-l5-arrow)"/>' +
            '<line x1="280" y1="100" x2="280" y2="87" marker-end="url(#tq-l5-arrow)"/>' +
          '</g>' +
          '<text x="280" y="34" text-anchor="middle" fill="var(--ink-faint)" font-size="10">elementwise add, d_model unchanged</text>' +
        '</svg>',
        "Positional encoding enters once, before the first attention block: each position's sinusoidal vector is " +
        "added onto its token embedding. Same d_model in, same d_model out — it is added, not concatenated."
      ));

      /* ===================================================== PANEL A: PE map */
      var panelA = TQ.block(
        TQ.h(2, "Panel A · The sinusoidal PE matrix"),
        TQ.p(
          "Below is ", TQ.math("PE(pos, 16)"), " straight from ", TQ.math("TQ.sinusoidalPE"),
          ": rows are positions, columns are dimensions, colored on our shared scale (fixed to ",
          TQ.math("[-1, 1]"), " since sin/cos live there). Drag ", TQ.el("strong", { text: "dimension" }),
          " to highlight one column; the canvas plots that column's wave across positions. Watch the ",
          "frequency drop as the dimension climbs."
        )
      );
      var legendA = TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "−1" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "+1" })
      );
      panelA.appendChild(legendA);

      var stateA = { nPos: 8, dim: 0 };

      var heatHolderA = TQ.el("div", { class: "tq-grow" });
      var wavePanel = TQ.canvasPanel(360, 200, function (ctx, w, h) {
        drawWave(ctx, w, h);
      });
      var waveInfo = TQ.el("div", { class: "tq-pe-waveinfo" });

      function peMatrix() { return TQ.sinusoidalPE(stateA.nPos, d); }

      function wavelengthFor(dim) {
        // pair (2i, 2i+1) share frequency 1/10000^(2i/d); period = 2π·10000^(2i/d)
        var twoI = 2 * Math.floor(dim / 2);
        return 2 * Math.PI * Math.pow(10000, twoI / d);
      }

      function buildHeatA() {
        var PE = peMatrix();
        return TQ.heatmap(PE, {
          rowLabels: TQ.range(stateA.nPos).map(function (p) { return "pos " + p; }),
          colLabels: TQ.range(d).map(function (i) { return String(i); }),
          cellSize: 30,
          min: -1, max: 1,
          selectedCol: stateA.dim,
          format: function (v) { return TQ.fmt(v, 2); },
          title: "PE(pos, dim) — selected dimension highlighted"
        });
      }

      function refreshHeatA() {
        heatHolderA.innerHTML = "";
        heatHolderA.appendChild(buildHeatA());
      }

      function drawWave(ctx, w, h) {
        var PE = peMatrix();
        var dim = stateA.dim;
        var isSin = (dim % 2 === 0);
        var pad = 28;
        var x0 = pad, x1 = w - 10;
        var y0 = 12, y1 = h - 22;
        var midY = (y0 + y1) / 2;
        // axes
        ctx.strokeStyle = TQ.cssVar("--ink", 0.16, "#e9edf8");
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x0, midY); ctx.lineTo(x1, midY); ctx.stroke(); // y=0
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();     // axis
        // labels for +1 / 0 / -1
        ctx.fillStyle = TQ.cssVar("--ink", 0.6, "#e8ecf6");
        ctx.font = "10px ui-monospace, monospace";
        ctx.fillText("+1", 4, y0 + 8);
        ctx.fillText("0", 10, midY + 3);
        ctx.fillText("-1", 6, y1);

        var nP = stateA.nPos;
        function px(p) { return nP > 1 ? x0 + (p / (nP - 1)) * (x1 - x0) : (x0 + x1) / 2; }
        function py(v) { return midY - v * (y1 - y0) / 2; }

        // line
        ctx.strokeStyle = TQ.colorFor(0.82);
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (var p = 0; p < nP; p++) {
          var v = PE[p][dim];
          if (p === 0) ctx.moveTo(px(p), py(v)); else ctx.lineTo(px(p), py(v));
        }
        ctx.stroke();
        // points colored by value on the shared scale
        for (var q = 0; q < nP; q++) {
          var val = PE[q][dim];
          ctx.fillStyle = TQ.colorFor((val + 1) / 2);
          ctx.beginPath();
          ctx.arc(px(q), py(val), 4, 0, Math.PI * 2);
          ctx.fill();
        }
        // caption
        ctx.fillStyle = TQ.cssVar("--ink", 0.7, "#e8ecf6");
        ctx.font = "11px ui-monospace, monospace";
        ctx.fillText("dim " + dim + " = " + (isSin ? "sin" : "cos") + "(pos / 10000^" +
          TQ.fmt(2 * Math.floor(dim / 2) / d, 3) + ")", x0, h - 6);
      }

      function refreshWaveInfo() {
        var dim = stateA.dim;
        var isSin = (dim % 2 === 0);
        var wl = wavelengthFor(dim);
        var pairLo = 2 * Math.floor(dim / 2), pairHi = pairLo + 1;
        waveInfo.innerHTML = "";
        waveInfo.appendChild(TQ.el("div", { class: "tq-pe-chips" },
          TQ.kv("dimension", String(dim)),
          TQ.kv("function", isSin ? "sin" : "cos"),
          TQ.kv("wavelength", wl >= 1000 ? Math.round(wl).toLocaleString() + " pos" : TQ.fmt(wl, 1) + " pos"),
          TQ.kv("pair", "(" + pairLo + ", " + pairHi + ")")
        ));
        waveInfo.appendChild(TQ.note(
          isSin
            ? "This column is the SINE of its frequency. Its partner (dim " + pairHi + ") is the COSINE at the " +
              "same frequency — 90° out of phase. A sin/cos pair is exactly what makes relative position a clean " +
              "rotation — the property Panel D measures: PE(p)·PE(p+k) depends only on the gap k, not on p."
            : "This column is the COSINE of its frequency. Its partner (dim " + pairLo + ") is the SINE at the " +
              "same frequency — 90° out of phase. A sin/cos pair is exactly what makes relative position a clean " +
              "rotation — the property Panel D measures: PE(p)·PE(p+k) depends only on the gap k, not on p."
        ));
      }

      var dimSlider = TQ.slider({
        min: 0, max: d - 1, step: 1, value: stateA.dim, label: "dimension (column)",
        format: function (v) { return "dim " + Math.round(v); },
        onInput: function (v) {
          stateA.dim = Math.round(v);
          refreshHeatA();
          wavePanel.redraw();
          refreshWaveInfo();
        }
      });
      var posSlider = TQ.slider({
        min: 4, max: 20, step: 1, value: stateA.nPos, label: "positions (rows)",
        format: function (v) { return Math.round(v) + " rows"; },
        onInput: function (v) {
          stateA.nPos = Math.round(v);
          refreshHeatA();
          wavePanel.redraw();
        }
      });

      panelA.appendChild(TQ.el("div", { class: "tq-controls-row" }, dimSlider.el, posSlider.el));
      panelA.appendChild(TQ.el("div", { class: "tq-flexrow tq-pe-arow" },
        heatHolderA,
        TQ.el("div", { class: "tq-panel tq-pe-wavecol" },
          TQ.el("div", { class: "tq-slider-label", text: "Selected dimension across positions" }),
          wavePanel.el,
          waveInfo
        )
      ));
      panelA.appendChild(TQ.callout(
        "Drag dimension from 0 upward and the wave stretches out. Dim 0 completes a full cycle in ~6 positions; " +
        "by dim 14 the wavelength is ~19,000 positions, so it's essentially flat across one sentence. Low dims = " +
        "fine position, high dims = coarse position — together they pin down an exact slot, like bits of a counter."
      ));
      // Minimal, correct PyTorch that reproduces exactly the matrix drawn above —
      // the same formula TQ.sinusoidalPE(n, d) implements, then added to embeddings.
      panelA.appendChild(TQ.code(
        "import torch, math\n" +
        "\n" +
        "def sinusoidal_pe(n_pos, d_model):\n" +
        "    # PE[pos, 2i]   = sin(pos / 10000**(2i/d))\n" +
        "    # PE[pos, 2i+1] = cos(pos / 10000**(2i/d))\n" +
        "    pos = torch.arange(n_pos).unsqueeze(1)          # (n_pos, 1)\n" +
        "    i   = torch.arange(0, d_model, 2)               # even indices 0,2,4,...\n" +
        "    div = torch.pow(10000, i / d_model)             # one frequency per pair\n" +
        "    pe = torch.zeros(n_pos, d_model)\n" +
        "    pe[:, 0::2] = torch.sin(pos / div)              # even dims -> sin\n" +
        "    pe[:, 1::2] = torch.cos(pos / div)              # odd dims  -> cos\n" +
        "    return pe\n" +
        "\n" +
        "n_pos, d_model = 6, 16\n" +
        "pe = sinusoidal_pe(n_pos, d_model)   # (6, 16) - exactly the heatmap in Panel A\n" +
        "\n" +
        "# add it onto the token embeddings (NOT concatenate): same d_model\n" +
        "input_embeddings = token_embeddings + pe   # input = meaning + position\n",
        { lang: "python", label: "sinusoidal positional encoding",
          caption: "This is TQ.sinusoidalPE(n, d) with n = 6, d = 16 — the same peRows this level adds to the toy " +
                   "embeddings. div = 10000**(2i/d) is the per-pair wavelength Panel A's slider sweeps. Note the last " +
                   "line uses '+ pe' (not concat), which is why d_model stays 16." }
      ));
      refreshHeatA();
      refreshWaveInfo();
      root.appendChild(panelA);

      /* ============================================ PANEL B: add PE to a token */
      var panelB = TQ.block(
        TQ.h(2, "Panel B · Adding PE changes the vector"),
        TQ.p(
          "Pick a toy token and a position. We show its embedding, the position code ", TQ.math("PE(pos)"),
          ", and their elementwise sum ", TQ.math("embedding + PE"), " — three colored vectors. Several cells ",
          "visibly change color: the encoding now depends on the slot. The distance readout makes \"position ",
          "changes the vector\" a number, not a vibe."
        )
      );

      var peRows = TQ.sinusoidalPE(n, d); // 6 x 16 — one row per slot in the sentence
      var stateB = { tok: 1, posA: 1, posB: 2 };

      var tokSel = TQ.segmented({
        options: tokens.map(function (t, i) { return { label: t, value: i }; }),
        value: stateB.tok,
        onChange: function (v) { stateB.tok = v; updateB(); }
      });
      var posSliderB = TQ.slider({
        min: 0, max: n - 1, step: 1, value: stateB.posA, label: "position (slot)",
        format: function (v) { return "pos " + Math.round(v); },
        onInput: function (v) { stateB.posA = Math.round(v); updateB(); }
      });
      var posSliderB2 = TQ.slider({
        min: 0, max: n - 1, step: 1, value: stateB.posB, label: "compare-against position",
        format: function (v) { return "pos " + Math.round(v); },
        onInput: function (v) { stateB.posB = Math.round(v); updateB(); }
      });

      var outB = TQ.el("div", { class: "tq-panel" });

      function updateB() {
        var ti = stateB.tok, pa = stateB.posA, pb = stateB.posB;
        var e = emb[ti];
        var plus = TQ.addMat([e], [peRows[pa]])[0]; // embedding + PE(pa)
        // distance between the SAME token at two positions; embedding cancels:
        // ||(e+PE_a) - (e+PE_b)|| = ||PE_a - PE_b||
        var diff = [];
        for (var k = 0; k < d; k++) diff.push(peRows[pa][k] - peRows[pb][k]);
        var dist = TQ.norm(diff);

        outB.innerHTML = "";
        outB.appendChild(TQ.vectorView(e, { label: tokens[ti] + " — embedding", cellSize: 20 }));
        outB.appendChild(TQ.vectorView(peRows[pa], { label: "PE(pos " + pa + ")", cellSize: 20, max: 1 }));
        outB.appendChild(TQ.vectorView(plus, { label: tokens[ti] + " + PE(pos " + pa + ")  →  input", cellSize: 20 }));

        outB.appendChild(TQ.el("div", { class: "tq-pe-distrow" },
          TQ.el("div", { class: "tq-sim-cos" },
            TQ.el("span", { class: "tq-stat-cap", text:
              "L2 distance: \"" + tokens[ti] + "\" at pos " + pa + " vs pos " + pb }),
            TQ.el("span", { class: "tq-stat-big", text: TQ.fmt(dist, 3) })
          ),
          (pa === pb
            ? TQ.badge("same slot → distance 0", "default")
            : TQ.badge("position moved the vector", "info"))
        ));
        outB.appendChild(TQ.note(
          "The token embedding cancels in the difference, so this distance is exactly ‖PE(" + pa + ") − PE(" +
          pb + ")‖ — it depends only on the two slots, not on which word you picked. Adjacent toy slots sit ≈1.0 apart."
        ));
      }

      panelB.appendChild(TQ.el("div", { class: "tq-flexcol", style: { gap: "12px" } },
        TQ.el("div", {}, TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "token"), tokSel.el),
        TQ.el("div", { class: "tq-controls-row" }, posSliderB.el, posSliderB2.el),
        outB
      ));
      updateB();
      root.appendChild(panelB);

      /* ====================================== PANEL C: permutation demo */
      var panelC = TQ.block(
        TQ.h(2, "Panel C · Swap two words — does the output move?"),
        TQ.p(
          "Now the payoff. We derive ", TQ.math("Q, K, V"), " from the input (the documented ",
          TQ.math("TQ.toyQKV"), " convention, ", TQ.math("dk = 8"), ") and run real ", TQ.math("TQ.attention"),
          ". Input is either the raw embeddings (PE ", TQ.el("strong", { text: "off" }), ") or ",
          TQ.math("embeddings + PE"), " (PE ", TQ.el("strong", { text: "on" }),
          "). \"Swap cat⇄sat\" rebuilds the input with rows 1 and 2 traded ",
          TQ.el("strong", { text: "before" }), " PE is added, then reruns. We watch the attention-weight row ",
          "for \"The\" and its output vector — original vs swapped."
        )
      );

      var dk = 8;
      var stateC = { pe: false, swapped: false };

      var peToggle = TQ.toggle({
        label: "add positional encoding",
        value: stateC.pe,
        onChange: function (v) { stateC.pe = v; updateC(); }
      });
      var swapBtn = TQ.el("button", { class: "tq-btn tq-btn-accent", type: "button" });
      swapBtn.addEventListener("click", function () { stateC.swapped = !stateC.swapped; updateC(); });

      var outC = TQ.el("div", { class: "tq-panel" });

      function buildInput(swapped, withPE) {
        // start from embeddings; swap cat (row1) & sat (row2) if requested
        var rows = [];
        for (var i = 0; i < n; i++) rows.push(emb[i].slice());
        if (swapped) { var tmp = rows[1]; rows[1] = rows[2]; rows[2] = tmp; }
        if (withPE) rows = TQ.addMat(rows, peRows);
        return rows;
      }

      function runAttn(input) {
        // deterministic projections via the documented convention (seeds 101/202/303)
        var Wq = TQ.randMatrix(d, dk, 101);
        var Wk = TQ.randMatrix(d, dk, 202);
        var Wv = TQ.randMatrix(d, dk, 303);
        var Q = TQ.matmul(input, Wq);
        var K = TQ.matmul(input, Wk);
        var V = TQ.matmul(input, Wv);
        return TQ.attention(Q, K, V);
      }

      function updateC() {
        swapBtn.textContent = stateC.swapped ? "↺ Unswap (back to original order)" : "⇄ Swap cat ⇄ sat";

        var orig = runAttn(buildInput(false, stateC.pe));
        var swap = runAttn(buildInput(true, stateC.pe));

        // 'The' is row 0 — unmoved by the cat/sat swap
        var wOrig = orig.weights[0];
        var wSwap = swap.weights[0];
        var oOrig = orig.output[0];
        var oSwap = swap.output[0];

        // per-component output delta (orig vs swap)
        var delta = [];
        var maxAbsDelta = 0;
        for (var k = 0; k < oOrig.length; k++) {
          var dv = oSwap[k] - oOrig[k];
          delta.push(dv);
          if (Math.abs(dv) > maxAbsDelta) maxAbsDelta = Math.abs(dv);
        }
        var changed = maxAbsDelta > 1e-9;

        // labels: under swap the sentence order is The, sat, cat, on, the, mat
        var origLabels = tokens.slice();
        var swapLabels = tokens.slice();
        var t2 = swapLabels[1]; swapLabels[1] = swapLabels[2]; swapLabels[2] = t2;

        outC.innerHTML = "";
        outC.appendChild(TQ.el("div", { class: "tq-pe-statebar" },
          TQ.badge(stateC.pe ? "PE: ON" : "PE: OFF", stateC.pe ? "good" : "default"),
          TQ.badge(stateC.swapped ? "order: cat⇄sat swapped" : "order: original", stateC.swapped ? "warn" : "info"),
          TQ.el("span", { class: "tq-pe-statenote", text:
            stateC.pe
              ? "Inputs carry position → swapping changes the scores."
              : "Inputs are pure content → swapping only permutes columns." })
        ));

        outC.appendChild(TQ.el("div", { class: "tq-flexrow tq-pe-crow" },
          TQ.el("div", { class: "tq-pe-col" },
            TQ.el("div", { class: "tq-slider-label", text: "Attention weights for \"The\" — ORIGINAL" }),
            TQ.barRow(wOrig, { labels: origLabels, max: 1, format: function (v) { return TQ.fmt(v, 3); } })
          ),
          TQ.el("div", { class: "tq-pe-col" },
            TQ.el("div", { class: "tq-slider-label", text: "Attention weights for \"The\" — SWAPPED" }),
            TQ.barRow(wSwap, { labels: swapLabels, max: 1, format: function (v) { return TQ.fmt(v, 3); } })
          )
        ));

        outC.appendChild(TQ.el("div", { class: "tq-flexrow tq-pe-crow" },
          TQ.el("div", { class: "tq-pe-col" },
            TQ.vectorView(oOrig, { label: "output[\"The\"] — ORIGINAL", cellSize: 22, showValues: false })
          ),
          TQ.el("div", { class: "tq-pe-col" },
            TQ.vectorView(oSwap, { label: "output[\"The\"] — SWAPPED", cellSize: 22, showValues: false })
          )
        ));

        outC.appendChild(TQ.el("div", { class: "tq-pe-deltawrap" },
          TQ.el("div", { class: "tq-slider-label" },
            "Per-component change in output[\"The\"] (swapped − original)  ",
            changed
              ? TQ.badge("Δ nonzero — output MOVED", "warn")
              : TQ.badge("✓ all zero — output IDENTICAL", "good")
          ),
          TQ.vectorView(delta, { label: "Δ output", cellSize: 22, max: Math.max(maxAbsDelta, 1e-6), showValues: true })
        ));

        outC.appendChild(changed
          ? TQ.callout(
              "With PE ON: \"cat\" and \"sat\" now carry different position tags, so swapping them changes the " +
              "dot products. \"The\"'s weight row is genuinely different and its output vector moves (the Δ row lights " +
              "up). THIS contrast is the entire motivation for positional encoding.")
          : TQ.callout(
              "With PE OFF: the weight row for \"The\" just trades its cat/sat columns — same numbers — and the output " +
              "vector is byte-identical (Δ is all zero). This is permutation-equivariance you can stare at: an unmoved " +
              "token sees the same multiset of keys/values, so its output cannot change. Flip PE on and swap again."));
      }

      panelC.appendChild(TQ.el("div", { class: "tq-controls-row" }, peToggle.el, swapBtn));
      panelC.appendChild(outC);
      updateC();
      root.appendChild(panelC);

      /* ============ PANEL D: relative position — the dot product only sees the gap */
      var panelD = TQ.block(
        TQ.h(2, "Panel D · Relative position: the dot product only sees the gap"),
        TQ.p(
          "Panel C proved we ", TQ.el("strong", { text: "need" }), " order. This panel shows ",
          TQ.el("strong", { text: "why sinusoids in particular" }),
          ". Take two positions a fixed offset ", TQ.math("k"), " apart and dot their codes: ",
          TQ.math("sim(p, k) = PE(p) · PE(p+k)"),
          ". The astonishing part — slide the reference position ", TQ.math("p"),
          " with ", TQ.math("k"), " held fixed and the dot product barely moves, even though the two raw ",
          "vectors underneath churn wildly. The similarity depends almost entirely on the ",
          TQ.el("strong", { text: "gap" }), ", not on where you start. That is exactly what lets attention ",
          "learn \"attend ", TQ.math("k"), " tokens back\" as one reusable pattern."
        )
      );

      // A tall, real PE table so p and k slide over a genuine range. d stays 16.
      var nPosD = 40;
      var Kmax = 12;
      var peD = TQ.sinusoidalPE(nPosD, d); // 40 x 16 sinusoids — all real
      var stateD = { p: 4, k: 3, kAlt: 5, overlay: false };

      function simD(a, b) { return TQ.dot(peD[a], peD[b]); } // PE[a]·PE[b]

      // s(k) = PE[ref]·PE[ref+kk] for kk in 0..Kmax — the offset curve from one ref.
      function offsetCurve(ref) {
        var s = [];
        for (var kk = 0; kk <= Kmax; kk++) s.push(simD(ref, ref + kk));
        return s;
      }

      // Sample the pinned similarity at the CURRENT k across several reference
      // positions p' = 0,4,8,... (all valid, i.e. p'+k < nPosD). The spread of
      // these is the live "drift" — translation-invariance turned into a number.
      function driftSamples(k) {
        var vals = [];
        for (var pp = 0; pp + k < nPosD; pp += 4) vals.push(simD(pp, pp + k));
        return vals;
      }

      var ctrlP = TQ.slider({
        min: 0, max: nPosD - 1 - Kmax, step: 1, value: stateD.p, label: "reference position p",
        format: function (v) { return "p = " + Math.round(v); },
        onInput: function (v) { stateD.p = Math.round(v); updateD(); }
      });
      var ctrlK = TQ.slider({
        min: 0, max: Kmax, step: 1, value: stateD.k, label: "offset k",
        format: function (v) { return "k = " + Math.round(v); },
        onInput: function (v) { stateD.k = Math.round(v); updateD(); }
      });
      var ctrlKalt = TQ.segmented({
        options: [{ label: "k′ = 1", value: 1 }, { label: "k′ = 5", value: 5 }, { label: "k′ = 9", value: 9 }],
        value: stateD.kAlt,
        onChange: function (v) { stateD.kAlt = v; updateD(); }
      });
      var ctrlOverlay = TQ.toggle({
        label: "overlay the curve at a second reference position (p + 7)",
        value: stateD.overlay,
        onChange: function (v) { stateD.overlay = v; updateD(); }
      });

      // The similarity-vs-offset canvas. Draws s(k) for the current p (and,
      // when overlay is on, for p2 = p+7) with the chosen k marked.
      var curveCanvas = TQ.canvasPanel(380, 220, function (ctx, w, h) {
        drawCurveD(ctx, w, h);
      });
      var pinOut = TQ.el("div", { class: "tq-panel tq-pe-pin" });
      var vecOut = TQ.el("div", { class: "tq-pe-relcol" });
      var curveCap = TQ.el("div", { class: "tq-pe-relcap" });

      function curveExtent() {
        // y-range across every curve we might draw, so axes are stable while sliding.
        var all = offsetCurve(stateD.p);
        var p2 = stateD.p + 7;
        if (p2 + Kmax < nPosD) all = all.concat(offsetCurve(p2));
        return { lo: Math.min(0, TQ.minOf(all)), hi: TQ.maxOf(all) };
      }

      function drawCurveD(ctx, w, h) {
        var ext = curveExtent();
        var lo = ext.lo, hi = ext.hi, span = (hi - lo) || 1;
        var pad = 30;
        var x0 = pad, x1 = w - 12, y0 = 14, y1 = h - 26;
        function px(kk) { return x0 + (kk / Kmax) * (x1 - x0); }
        function py(v) { return y1 - ((v - lo) / span) * (y1 - y0); }

        // axes
        ctx.strokeStyle = TQ.cssVar("--ink", 0.16, "#e9edf8");
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();   // y axis
        ctx.beginPath(); ctx.moveTo(x0, py(0)); ctx.lineTo(x1, py(0)); ctx.stroke(); // y=0
        ctx.fillStyle = TQ.cssVar("--ink", 0.6, "#e8ecf6");
        ctx.font = "10px ui-monospace, monospace";
        ctx.fillText("sim", 4, y0 + 8);
        ctx.fillText("0", 12, py(0) + 3);
        ctx.fillText("k=0", x0 - 4, y1 + 14);
        ctx.fillText("k=" + Kmax, x1 - 30, y1 + 14);

        function plot(ref, t, withPoints) {
          var s = offsetCurve(ref);
          ctx.strokeStyle = TQ.colorFor(t);
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (var kk = 0; kk <= Kmax; kk++) {
            if (kk === 0) ctx.moveTo(px(kk), py(s[kk])); else ctx.lineTo(px(kk), py(s[kk]));
          }
          ctx.stroke();
          if (withPoints) {
            for (var q = 0; q <= Kmax; q++) {
              ctx.fillStyle = TQ.colorFor(t);
              ctx.globalAlpha = 0.7;
              ctx.beginPath(); ctx.arc(px(q), py(s[q]), 2.5, 0, Math.PI * 2); ctx.fill();
              ctx.globalAlpha = 1;
            }
          }
        }

        // overlay curve at p2 first (so it sits under the primary), then primary.
        var p2 = stateD.p + 7;
        if (stateD.overlay && p2 + Kmax < nPosD) plot(p2, 0.5, false);
        plot(stateD.p, 0.82, true);

        // mark the chosen k on the primary curve.
        var sk = simD(stateD.p, stateD.p + stateD.k);
        var mx = px(stateD.k), my = py(sk);
        ctx.strokeStyle = TQ.cssVar("--ink", 0.28, "#e8ecf6");
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(mx, py(0)); ctx.lineTo(mx, my); ctx.stroke();
        ctx.fillStyle = TQ.colorForSigned(sk, Math.max(Math.abs(hi), Math.abs(lo), 1));
        ctx.beginPath(); ctx.arc(mx, my, 5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = TQ.cssVar("--accent", 1, "#f2a93b");
        ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = TQ.cssVar("--ink", 0.85, "#e8ecf6");
        ctx.font = "11px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.fillText("k=" + stateD.k + " · " + TQ.fmt(sk, 3), mx, my - 9);
        ctx.textAlign = "left";
      }

      function updateD() {
        var p = stateD.p, k = stateD.k, kAlt = stateD.kAlt;
        var simK = simD(p, p + k);                 // PE(p)·PE(p+k)
        var simK2 = simD(p, p + kAlt);             // control offset PE(p)·PE(p+k′)
        var selfSim = simD(p, p);                  // the k=0 peak

        // drift across reference positions at the CURRENT k.
        var ds = driftSamples(k);
        var drift = TQ.maxOf(ds) - TQ.minOf(ds);

        curveCanvas.redraw();

        // (1) pinned readout + drift badge + control chip
        pinOut.innerHTML = "";
        pinOut.appendChild(TQ.el("div", { class: "tq-pe-relrow" },
          TQ.el("div", { class: "tq-sim-cos" },
            TQ.el("span", { class: "tq-stat-cap", text: "PE(p) · PE(p+k)   [p = " + p + ", k = " + k + "]" }),
            TQ.el("span", { class: "tq-stat-big", text: TQ.fmt(simK, 3) })
          ),
          (drift < 1e-6
            ? TQ.badge("invariant to absolute position", "good")
            : TQ.badge("drifts at this k", "info"))
        ));
        pinOut.appendChild(TQ.el("div", { class: "tq-pe-chips" },
          TQ.kv("drift across p", TQ.fmt(drift, 4)),
          TQ.kv("sampled p′", "0, 4, … (" + ds.length + " refs)"),
          TQ.kv("self-similarity (k=0)", TQ.fmt(selfSim, 3))
        ));
        pinOut.appendChild(TQ.el("div", { class: "tq-pe-relrow" },
          TQ.el("div", { class: "tq-sim-cos" },
            TQ.el("span", { class: "tq-stat-cap", text: "control: PE(p) · PE(p+k′)   [k′ = " + kAlt + "]" }),
            TQ.el("span", { class: "tq-stat-big", text: TQ.fmt(simK2, 3) })
          ),
          TQ.badge("different offset → different similarity", "info")
        ));

        // (3) the two raw vectors that churn while the dot product holds
        vecOut.innerHTML = "";
        vecOut.appendChild(TQ.vectorView(peD[p], { label: "PE(p = " + p + ")", cellSize: 18, max: 1 }));
        vecOut.appendChild(TQ.vectorView(peD[p + k], { label: "PE(p+k = " + (p + k) + ")", cellSize: 18, max: 1 }));

        // (2)/overlay caption: how close are the two curves?
        curveCap.innerHTML = "";
        var p2 = p + 7;

/* ============================================================================
 * LEVEL 06 — The Transformer Block   (order 6)
 * ----------------------------------------------------------------------------
 * Assemble a full post-LN block and animate ONE toy token's 16-dim vector
 * through every sub-layer, every number computed live by TQ math:
 *
 *   z   = LayerNorm(x + MHA(x))
 *   out = LayerNorm(z + FFN(z))      FFN(z) = max(0, zW1+b1)W2 + b2
 *
 * Pattern (copied from 01-tokens-embeddings.js):
 *   - one IIFE, ONE TQ.registerLevel call, NO other globals
 *   - short explanation blocks + a PRIMARY interactive (TQ.stepper) walkthrough
 *   - all color through TQ.colorFor / TQ.vectorView / TQ.barRow (one language)
 *   - 4 quiz questions
 *
 * All quantities are genuinely computed:
 *   qkv = TQ.toyQKV(16, 101, 202, 303); att = TQ.attention(qkv.Q,qkv.K,qkv.V)
 *   x = embeddings[p]; a = att.output[p] (blend of all 6 V rows via att.weights[p])
 *   r1 = x + a; z = LayerNorm(r1) -> mean=0, var=1 (computed, not asserted)
 *   FFN: W1=randMatrix(16,32,711), W2=randMatrix(32,16,713); h = relu(zW1+b1)
 *   r2 = z + ff; out = LayerNorm(r2) -> mean=0, var=1; out is 16-dim like x.
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "transformer-block",
    order: 6,
    title: "The Transformer Block",
    icon: "🧱",
    tagline: "Assemble it: Attention + Add&Norm + Feed-Forward + Add&Norm, stacked.",
    preread: "Illustrated Transformer (capstone)",
    objectives: [
      "Assemble a full block: Multi-Head Attention → residual+LayerNorm → FFN → residual+LayerNorm",
      "Map residual connections onto your CNN skip-connection (ResNet) intuition",
      "Understand why we LayerNorm (stable activation scale → trainable deep stacks)",
      "Tell encoder (bidirectional), decoder-only (causal), and encoder–decoder (adds cross-attention) blocks apart"
    ],

    render: function (root) {
      var toy = TQ.toy;
      var tokens = toy.tokens;
      var emb = toy.embeddings;
      var d = toy.dModel;        // 16
      var n = tokens.length;     // 6
      var dHidden = 32;          // 2x expansion here for legibility (real models use ~4x; same shape lesson)

      /* ---- fixed, deterministic block weights (seeds frozen) ------------- */
      var qkv = TQ.toyQKV(d, 101, 202, 303);
      var att = TQ.attention(qkv.Q, qkv.K, qkv.V); // scaled dot-product, /sqrt(16)=/4
      // We project the attention output (dk=16) straight back as the MHA result
      // (single conceptual head here; W_O = identity-shaped). att.output is n x 16.

      var W1 = TQ.randMatrix(d, dHidden, 711);
      var W2 = TQ.randMatrix(dHidden, d, 713);
      var b1row = TQ.randMatrix(1, dHidden, 715, 0.3)[0];
      var b2row = TQ.randMatrix(1, d, 717, 0.3)[0];

      function addVec(u, v) {
        var out = [];
        for (var i = 0; i < u.length; i++) out.push(u[i] + v[i]);
        return out;
      }
      function variance(vec) {
        var mu = TQ.mean(vec);
        var s = 0;
        for (var i = 0; i < vec.length; i++) s += (vec[i] - mu) * (vec[i] - mu);
        return s / vec.length;
      }

      // Run the WHOLE block for a single position p; return every intermediate.
      function runBlock(p) {
        var x = emb[p].slice();
        var a = att.output[p].slice();           // MHA output for this token
        var r1 = addVec(x, a);                    // residual #1 (x + MHA)
        var z = TQ.layerNorm(r1);                 // LayerNorm #1

        var hRaw = addVec(TQ.matmul([z], W1)[0], b1row); // zW1 + b1
        var h = TQ.reluVec(hRaw);                 // ReLU
        var ff = addVec(TQ.matmul([h], W2)[0], b2row);   // hW2 + b2
        var r2 = addVec(z, ff);                   // residual #2 (z + FFN)
        var out = TQ.layerNorm(r2);               // LayerNorm #2

        return {
          x: x, a: a, r1: r1, z: z,
          hRaw: hRaw, h: h, ff: ff, r2: r2, out: out
        };
      }

      /* ----------------------------------------------------- intro narrative */
      root.appendChild(TQ.block(
        TQ.h(2, "The block is a loop body — and you've already debugged its twin"),
        TQ.p(
          "A transformer is a stack of identical ", TQ.el("strong", { text: "blocks" }),
          " (GPT-2 had 12–48; modern LLMs run 30–120). One block does exactly two things, in order: ",
          "(1) ", TQ.el("strong", { text: "mix tokens together" }), " with attention, then ",
          "(2) ", TQ.el("strong", { text: "think about each token individually" }), " with a small MLP. ",
          "Wrapped around each is the move you already trust from ResNet: a ",
          TQ.el("strong", { text: "skip connection" }), "."
        ),
        TQ.p(
          "The post-LN block computes ",
          TQ.math("z = LayerNorm(x + MHA(x))"), ", then ",
          TQ.math("out = LayerNorm(z + FFN(z))"), ". Read those ",
          TQ.math("x +"), " and ", TQ.math("z +"),
          " literally — they are residual connections. The sub-layer doesn't have to reproduce its " +
          "input; it only learns a ", TQ.el("strong", { text: "delta" }), " to add. Identity is free, so " +
          "gradients have a clean highway down a 100-layer stack and the thing actually trains. Without " +
          "residuals, deep transformers degrade and die exactly like deep plain CNNs did."
        ),
        TQ.callout(
          "CNN bridge: residual = skip connection (ResNet, 2015). The block learns x + (a small correction), " +
          "not x replaced. That's why gradients reach the bottom of a very deep stack."
        ),
        // Static topology skeleton: the WIRING a beginner should see before the
        // 7-stage stepper walks values through linearly. Colors via CSS vars /
        // currentColor only (no hardcoded hex); arrowhead marker like L1's.
        TQ.figure(
          '<svg viewBox="0 0 300 320" width="300" height="320" role="img" ' +
            'aria-label="Transformer block topology: input branches into a residual skip and a sub-layer, ' +
            'merging at Add and Norm, twice" ' +
            'font-family="var(--mono)" font-size="11">' +
            '<defs><marker id="tq-l6-arrow" viewBox="0 0 10 10" refX="9" refY="5" ' +
              'markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
              '<path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>' +
            '<g stroke="currentColor" stroke-width="1.5" fill="none" color="var(--line)">' +
              // backbone bottom -> up
              '<line x1="150" y1="300" x2="150" y2="262"/>' +
              '<line x1="150" y1="214" x2="150" y2="176" marker-end="url(#tq-l6-arrow)"/>' +
              '<line x1="150" y1="152" x2="150" y2="118"/>' +
              '<line x1="150" y1="70" x2="150" y2="34" marker-end="url(#tq-l6-arrow)"/>' +
            '</g>' +
            // residual bypass arcs (skip connections) drawn in accent
            '<g stroke="var(--accent-2)" stroke-width="1.5" fill="none">' +
              '<path d="M150 262 C 250 250, 250 200, 188 188" marker-end="url(#tq-l6-arrow)" color="var(--accent-2)"/>' +
              '<path d="M150 118 C 250 106, 250 56, 188 44" marker-end="url(#tq-l6-arrow)" color="var(--accent-2)"/>' +
            '</g>' +
            // input x
            '<text x="150" y="316" text-anchor="middle" fill="var(--ink)">x</text>' +
            // MHA sub-layer box
            '<rect x="62" y="238" width="120" height="26" rx="6" fill="var(--panel-hi)" stroke="var(--line)"/>' +
            '<text x="122" y="255" text-anchor="middle" fill="var(--ink)">MHA</text>' +
            // branch line into MHA
            '<line x1="150" y1="276" x2="122" y2="264" stroke="currentColor" stroke-width="1.5" ' +
              'color="var(--line)"/>' +
            // Add & Norm #1
            '<rect x="92" y="176" width="116" height="26" rx="6" fill="var(--panel-hi)" stroke="var(--accent-2)"/>' +
            '<text x="150" y="193" text-anchor="middle" fill="var(--ink)">Add &amp; Norm</text>' +
            // z label
            '<text x="166" y="140" text-anchor="start" fill="var(--ink-mute)">z</text>' +
            // FFN sub-layer box
            '<rect x="62" y="94" width="120" height="26" rx="6" fill="var(--panel-hi)" stroke="var(--line)"/>' +
            '<text x="122" y="111" text-anchor="middle" fill="var(--ink)">FFN</text>' +
            '<line x1="150" y1="132" x2="122" y2="120" stroke="currentColor" stroke-width="1.5" ' +
              'color="var(--line)"/>' +
            // Add & Norm #2
            '<rect x="92" y="32" width="116" height="26" rx="6" fill="var(--panel-hi)" stroke="var(--accent-2)"/>' +
            '<text x="150" y="49" text-anchor="middle" fill="var(--ink)">Add &amp; Norm</text>' +
            // out label
            '<text x="150" y="20" text-anchor="middle" fill="var(--good)">out: same shape as x</text>' +
            // skip labels
            '<text x="262" y="228" text-anchor="middle" fill="var(--accent-2)" font-size="10">residual</text>' +
            '<text x="262" y="240" text-anchor="middle" fill="var(--accent-2)" font-size="10">(skip)</text>' +
            '<text x="262" y="84" text-anchor="middle" fill="var(--accent-2)" font-size="10">residual</text>' +
            '<text x="262" y="96" text-anchor="middle" fill="var(--accent-2)" font-size="10">(skip)</text>' +
          '</svg>',
          "Two sub-layers, each wrapped in a residual + LayerNorm. The skip arrows are why a 100-layer stack still trains."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "LayerNorm: the same fix as BatchNorm, but per-token so it survives inference"),
        TQ.p(
          "You normalized activations in CNNs with ", TQ.el("strong", { text: "BatchNorm" }),
          " — subtract the mean, divide by the std, restore a learnable scale/shift — to keep activation " +
          "scale stable so deep stacks stay trainable. ", TQ.el("strong", { text: "LayerNorm" }),
          " is the same idea with one critical change of axis."
        ),
        TQ.p(
          "BatchNorm normalizes each feature ", TQ.el("strong", { text: "across the batch" }),
          " (it leans on other examples). LayerNorm normalizes each token's vector ",
          TQ.el("strong", { text: "across its own features" }),
          " — no cross-token, no cross-batch dependency. That matters because an LLM generates one token " +
          "at a time with a batch of one and variable sequence length; a stat that depends on neighbors " +
          "would be poison at inference."
        ),
        TQ.p(
          "So for a single ", TQ.math("d_model = " + d), " vector, LayerNorm forces those ", String(d),
          " numbers to have ", TQ.el("strong", { text: "mean 0 and variance 1" }),
          " (then applies a learned scale (gamma, γ) and shift (bias β), here 1 and 0). The residual sum ",
          TQ.math("x + sublayer(x)"), " can blow up the scale; LayerNorm immediately tames it back. ",
          "In the walkthrough below you'll watch the mean and variance go from messy to exactly 0 and 1 — ",
          TQ.el("strong", { text: "computed, not asserted" }), "."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "The FFN is a per-token MLP — and it's where most of the parameters live"),
        TQ.p(
          "After attention lets tokens look at each other, the feed-forward network processes each token " +
          "independently: ", TQ.math("FFN(z) = max(0, zW1 + b1)W2 + b2"),
          ". It's a two-layer MLP — Linear, ReLU, Linear — and you've built a thousand of these."
        ),
        TQ.p(
          "Two things make it transformer-flavored. First, it's ", TQ.el("strong", { text: "position-wise" }),
          ": the SAME W1, W2 are applied at every position — the same little network re-run at each token, " +
          "like a 1×1 convolution sliding over the sequence (shared weights, applied independently per location). " +
          "Attention is the only place tokens talk; the FFN is purely local per-token computation. Second, it ",
          TQ.el("strong", { text: "expands then contracts" }),
          " — the hidden layer is typically ~4× d_model (GPT-2/GPT-3 are exactly 4×), " +
          "so despite being 'just an MLP' it holds roughly two-thirds of a transformer's parameters. Attention ",
          TQ.el("strong", { text: "routes" }), " information; the FFN is where the model ",
          TQ.el("strong", { text: "stores and transforms" }), " what it knows."
        ),
        TQ.note(
          "Modern models often swap ReLU for GELU/SwiGLU and put LayerNorm BEFORE each sub-layer " +
          "('pre-LN') for steadier gradients. We use the original post-LN here so the ordering is concrete."
        ),
        TQ.note(
          "Aside (expert): Llama-2-7B's FFN is 4096→11008, only ~2.7× rather than the usual 4×, because its " +
          "SwiGLU variant trims the hidden size to pay for an extra gate matrix. Same expand-then-contract idea."
        ),
        // Consolidate MHA + Add&Norm + FFN into ONE runnable forward before the
        // reader enters the 7-stage stepper. Pre-norm (ln BEFORE each sub-layer)
        // to match the pre-LN aside above; the live walkthrough animates post-LN.
        TQ.code(
          "import torch\n" +
          "import torch.nn as nn\n" +
          "\n" +
          "class TransformerBlock(nn.Module):\n" +
          "    def __init__(self, d_model, n_heads):\n" +
          "        super().__init__()\n" +
          "        self.ln1 = nn.LayerNorm(d_model)\n" +
          "        self.ln2 = nn.LayerNorm(d_model)\n" +
          "        self.attn = nn.MultiheadAttention(d_model, n_heads, batch_first=True)\n" +
          "        self.ffn = nn.Sequential(\n" +
          "            nn.Linear(d_model, 4 * d_model),  # expand\n" +
          "            nn.GELU(),\n" +
          "            nn.Linear(4 * d_model, d_model),  # contract\n" +
          "        )\n" +
          "\n" +
          "    def forward(self, x, attn_mask=None):\n" +
          "        # pre-norm: LayerNorm BEFORE each sub-layer, residual add AFTER\n" +
          "        h = self.ln1(x)\n" +
          "        a, _ = self.attn(h, h, h, attn_mask=attn_mask)  # self-attn: q=k=v=h\n" +
          "        x = x + a                                       # residual #1\n" +
          "        x = x + self.ffn(self.ln2(x))                   # residual #2\n" +
          "        return x                                        # same shape as input\n" +
          "\n" +
          "# encoder block -> no mask (every token sees every token):\n" +
          "#   out = block(x)\n" +
          "# decoder block -> causal mask (each token sees only itself + earlier):\n" +
          "#   mask = nn.Transformer.generate_square_subsequent_mask(x.size(1))\n" +
          "#   out = block(x, attn_mask=mask)\n",
          { lang: "python", label: "one transformer block (pre-norm)",
            caption: "Pre-LN: x = x + attn(ln1(x)); x = x + ffn(ln2(x)). The FFN expands 4x then contracts " +
              "(real models use ~4x; the live viz uses 2x for legible cells). The encoder/decoder contrast is " +
              "just the attn_mask. Note: this is pre-LN — the live walkthrough animates the original post-LN " +
              "(LayerNorm AFTER each sub-layer), so the two differ only in where the norm sits." }
        )
      ));

      /* ====================================================================
       *  PRIMARY INTERACTIVE: stepper walkthrough of one token's vector
       * ================================================================== */
      var primary = TQ.block(
        TQ.h(2, "Watch one token flow through the whole block"),
        TQ.p(
          "Pick a token, then step through all 7 stages. Every cell color is its value on the shared scale; " +
          "flip ", TQ.el("strong", { text: "show raw numbers" }), " to read the components. ",
          "Only ", TQ.el("strong", { text: "one" }),
          " stage uses the other tokens (attention) — everything else is per-token."
        )
      );

      // legend (matches level 01)
      primary.appendChild(TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "low" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "high" })
      ));

      // ---- shared control state -----------------------------------------
      var pos = 1;          // default 'cat' (#1)
      var showRaw = false;
      var depth = 1;        // stack-depth caption control
      var data = runBlock(pos);

      var posSel = TQ.segmented({
        options: tokens.map(function (t, i) { return { label: t, value: i }; }),
        value: pos,
        onChange: function (v) { pos = v; data = runBlock(pos); rebuildStepper(); }
      });

      var rawToggle = TQ.toggle({
        label: "show raw numbers",
        value: showRaw,
        onChange: function (v) { showRaw = v; rebuildStepper(); }
      });

      var depthSel = TQ.segmented({
        options: [{ label: "1 block", value: 1 }, { label: "6 blocks", value: 6 }, { label: "48 blocks", value: 48 }],
        value: depth,
        onChange: function (v) { depth = v; updateDepthCaption(); }
      });

      var depthCaption = TQ.note("");
      function updateDepthCaption() {
        depthCaption.innerHTML = "";
        var msg;
        if (depth === 1) {
          msg = "1 block. You're watching this single block in full. Real models stack many of these.";
        } else {
          msg = depth + " blocks stacked. The output below (16-dim, same shape as the input) becomes the " +
            "input to the next block, " + depth + " times over. Crucially the weights are NOT shared — each " +
            "block has its own attention and FFN parameters. Same shape, different transformation, repeated.";
        }
        depthCaption.appendChild(TQ.el("span", { text: msg }));
      }
      updateDepthCaption();

      var controls = TQ.el("div", { class: "tq-controls-row tq-block-controls" },
        TQ.el("div", {},
          TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Token"),
          posSel.el),
        TQ.el("div", {},
          TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Stack depth"),
          depthSel.el),
        TQ.el("div", { style: { alignSelf: "flex-end" } }, rawToggle.el)
      );
      primary.appendChild(controls);

      // ---- small rendering helpers for stages ---------------------------
      function vv(values, label) {
        return TQ.vectorView(values, { label: label, cellSize: 22, showValues: showRaw });
      }

      function statPanel(title, vec) {
        var mu = TQ.mean(vec);
        var vr = variance(vec);
        return TQ.el("div", { class: "tq-tb-stats" },
          TQ.el("span", { class: "tq-tb-stats-title", text: title }),
          TQ.kv("mean", TQ.fmt(mu, 2)),
          TQ.kv("var", TQ.fmt(vr, 2)),
          TQ.kv("min", TQ.fmt(TQ.minOf(vec), 2)),
          TQ.kv("max", TQ.fmt(TQ.maxOf(vec), 2))
        );
      }

      function residualView(label1, v1, label2, v2, sumLabel, sum) {
        return TQ.el("div", { class: "tq-tb-residual" },
          vv(v1, label1),
          TQ.el("div", { class: "tq-tb-plus", text: "+" }),
          vv(v2, label2),
          TQ.el("div", { class: "tq-tb-eq", text: "=" }),
          vv(sum, sumLabel)
        );
      }

      // ---- the 7 stages -------------------------------------------------
      function buildSteps() {
        return [
          {
            label: "1 · Input x",
            run: function (c) {
              c.appendChild(TQ.p(
                "The block's input for token ", TQ.el("strong", { text: tokens[pos] }),
                " — its ", TQ.math("d_model = " + d), " vector. (In a real stack this is the previous " +
                "block's output; here it's the embedding.)"
              ));
              c.appendChild(vv(data.x, "x  (" + tokens[pos] + ")"));
              c.appendChild(statPanel("input stats", data.x));
            }
          },
          {
            label: "2 · Multi-head attention output",
            run: function (c) {
              c.appendChild(TQ.p(
                "The ", TQ.el("strong", { text: "only" }),
                " cross-token step. Token ", TQ.el("strong", { text: tokens[pos] }),
                " blends the value vectors of all ", String(n),
                " tokens, weighted by attention. Those weights are real (scaled dot-product, ÷√" + d + "):"
              ));
              c.appendChild(TQ.barRow(att.weights[pos], {
                labels: tokens, max: 1,
                format: function (v) { return TQ.fmt(v, 3); }
              }));
              c.appendChild(vv(data.a, "MHA(x)"));
              c.appendChild(TQ.note(
                "For legibility this block runs a single full-width head (dk = d_model, Wo = identity) — " +
                "i.e. one head spanning all " + d + " dims just to keep the picture simple; real models split into " +
                "several. The Concat-then-Wo machinery from Level 4 (dk = d_model / H heads, then a learned output " +
                "projection) would slot in here unchanged and produce the same d_model-wide output."
              ));
              c.appendChild(TQ.note(
                "Every later stage is per-token: it never looks at the other five tokens again."
              ));
            }
          },
          {
            label: "3 · Residual #1  (x + MHA)",
            run: function (c) {
              c.appendChild(TQ.p(
                "The skip connection. We ", TQ.el("strong", { text: "add" }),
                " the attention output back onto the input — the sum is ", TQ.el("strong", { text: "x nudged" }),
                ", not x replaced. The sub-layer only had to learn a delta (the ResNet move)."
              ));
              c.appendChild(residualView("x", data.x, "MHA(x)", data.a, "x + MHA(x)", data.r1));
              c.appendChild(statPanel("after residual (scale can drift)", data.r1));
            }
          },
          {
            label: "4 · LayerNorm #1",
            run: function (c) {
              c.appendChild(TQ.p(
                "Normalize across the token's own ", String(d),
                " features: subtract the mean, divide by the std, apply the learned scale γ=1 and shift β=0. Watch the stats ",
                TQ.el("strong", { text: "snap" }), " to mean 0, var 1 — computed from the numbers, not asserted."
              ));
              c.appendChild(TQ.el("div", { class: "tq-tb-residual" },
                vv(data.r1, "x + MHA(x)"),
                TQ.el("div", { class: "tq-tb-eq", text: "→" }),
                vv(data.z, "z = LN(...)")
              ));
              c.appendChild(TQ.el("div", { class: "tq-tb-statrow" },
                statPanel("before LN", data.r1),
                statPanel("after LN", data.z)
              ));
            }
          },
          {
            label: "5 · FFN internals  (Linear → ReLU → Linear)",
            run: function (c) {
              c.appendChild(TQ.p(
                "Per-token MLP: expand ", TQ.math(d + " → " + dHidden),
                ", ReLU (clamps negatives to exactly 0), then contract ",
                TQ.math(dHidden + " → " + d),
                ". The SAME W1, W2 act at every position — like a 1×1 conv."
              ));
              c.appendChild(vv(data.hRaw, "zW1 + b1   (hidden, " + dHidden + "-dim, pre-ReLU)"));
              c.appendChild(vv(data.h, "max(0, ·)   (after ReLU — negatives now 0)"));
              var zeroed = 0;
              for (var i = 0; i < data.hRaw.length; i++) if (data.hRaw[i] <= 0) zeroed++;
              c.appendChild(TQ.el("div", { class: "tq-tb-stats" },
                TQ.el("span", { class: "tq-tb-stats-title", text: "ReLU" }),
                TQ.kv("hidden dim", String(dHidden)),
                TQ.kv("clamped to 0", zeroed + " / " + dHidden)
              ));
              c.appendChild(vv(data.ff, "FFN(z) = hW2 + b2   (back to " + d + "-dim)"));
            }
          },
          {
            label: "6 · Residual #2  (z + FFN)",
            run: function (c) {
              c.appendChild(TQ.p(
                "Second skip connection, same pattern. ", TQ.math("z"),
                " plus the FFN's delta — the model adds what the per-token MLP computed without throwing z away."
              ));
              c.appendChild(residualView("z", data.z, "FFN(z)", data.ff, "z + FFN(z)", data.r2));
              c.appendChild(statPanel("after residual (scale can drift again)", data.r2));
            }
          },
          {
            label: "7 · LayerNorm #2  →  block output",
            run: function (c) {
              c.appendChild(TQ.p(
                "Final normalize. The output is ", TQ.el("strong", { text: d + "-dimensional" }),
                " — the ", TQ.el("strong", { text: "same shape as the input x" }),
                ". That's exactly why blocks stack: out of one block is in to the next."
              ));
              c.appendChild(TQ.el("div", { class: "tq-tb-residual" },
                vv(data.r2, "z + FFN(z)"),
                TQ.el("div", { class: "tq-tb-eq", text: "→" }),
                vv(data.out, "out = LN(...)")
              ));
              c.appendChild(TQ.el("div", { class: "tq-tb-statrow" },
                statPanel("before LN", data.r2),
                statPanel("after LN", data.out)
              ));
              c.appendChild(TQ.el("div", { class: "tq-tb-shapecheck" },
                TQ.badge("in: " + d + "-dim", "info"),
                TQ.el("span", { class: "tq-tb-arrow", text: "→ block →" }),
                TQ.badge("out: " + data.out.length + "-dim", "good")
              ));
              c.appendChild(depthCaption);
            }
          }
        ];
      }

      var stepperHolder = TQ.el("div", { class: "tq-tb-stepper-holder" });
      function rebuildStepper() {
        stepperHolder.innerHTML = "";
        stepperHolder.appendChild(TQ.stepper(buildSteps()));
      }
      rebuildStepper();
      primary.appendChild(stepperHolder);

      primary.appendChild(TQ.callout(
        "The load-bearing split: attention is the ONLY place tokens exchange information; LayerNorm and the " +
        "FFN both operate per-token. Mix, then think locally — repeated, with fresh weights, dozens of times."
      ));
      root.appendChild(primary);

      /* --------------------------------------------------- wrap-up takeaway */
      root.appendChild(TQ.block(
        TQ.h(2, "Why this is the whole architecture"),
        TQ.p(
          "Stack this block N times, add embeddings at the bottom and an output head on top, and you have a " +
          "transformer. Residuals keep the gradient highway open; LayerNorm keeps the scale sane; attention " +
          "routes; the FFN remembers. Everything you learned earlier — embeddings, dot-product attention — " +
          "plugs in right here."
        ),
        TQ.callout(
          "Carry forward: the block preserves shape (16-dim in, 16-dim out). Shape-preservation is what makes " +
          "a deep stack possible — and the KV-cache tricks coming next live inside that attention sub-layer."
        )
      ));

      /* ----------------------------------- encoder vs decoder vs decoder-only */
      var archBlock = TQ.block(
        TQ.h(2, "Two flavors of block: encoder vs decoder (and why we go decoder-only)"),
        TQ.p(
          "The same block comes in three architectures, and they differ in exactly two ways: ",
          TQ.el("strong", { text: "which attention mask" }), " they use and ",
          TQ.el("strong", { text: "whether they add a cross-attention sub-layer" }), ". An ",
          TQ.el("strong", { text: "encoder" }), " (BERT) uses ", TQ.el("strong", { text: "bidirectional" }),
          " self-attention — no mask, every token sees every token — for understanding. A ",
          TQ.el("strong", { text: "decoder" }), " (GPT/Llama) uses ", TQ.el("strong", { text: "masked, causal" }),
          " self-attention — each token sees only itself and earlier tokens — so it generates left-to-right."
        ),
        TQ.p(
          "The original Transformer (and T5) is an ", TQ.el("strong", { text: "encoder–decoder" }),
          ": the encoder reads the source, and each decoder block adds a third sub-layer, ",
          TQ.el("strong", { text: "cross-attention" }), ", where the ",
          TQ.el("strong", { text: "query comes from the decoder" }), " but the ",
          TQ.el("strong", { text: "keys and values come from the encoder's output" }),
          " — the same scaled-dot-product attention you know, but Q from one sequence and K/V from another."
        ),
        TQ.p(
          TQ.el("em", { text: "This is the very attention from the walkthrough above (same seeds) — now with a mask you can flip." })
        )
      );

      /* ---- interactive: architecture mask grid + cross-attn + stack ------- *
       * Self-contained state (does NOT touch pos/showRaw/depth above). The
       * self-attn grid reuses the stepper's qkv (TQ.toyQKV(16,101,202,303)),
       * so the grid IS the walkthrough's attention with the mask toggled. */
      var arch = "dec";          // 'enc' | 'dec' | 'encdec'
      var maskSelRow = 0;        // selected query row in the self-attn grid
      var showMaskOnly = false;  // optional binary-vs-weights view

      // base scores (fixed) — reuse the stepper's qkv, do NOT re-seed.
      var baseScores = TQ.matmul(qkv.Q, TQ.transpose(qkv.K)); // 6×6

      // Causal mask is on whenever arch is not encoder. Apply −∞ to future keys
      // (j>i) on a COPY of the base scores (exactly the L3 mechanic), so
      // exp(−∞)=0 → those cells get genuine 0 weight and surviving cells
      // renormalize to Σ=1.0.
      function maskedScores() {
        if (arch === "enc") return baseScores;
        var M = [];
        for (var i = 0; i < baseScores.length; i++) {
          var row = [];
          for (var j = 0; j < baseScores[i].length; j++) {
            row.push(j > i ? -Infinity : baseScores[i][j]);
          }
          M.push(row);
        }
        return M;
      }
      function selfWeights() {
        return TQ.softmaxRows(TQ.scaleMat(maskedScores(), 1 / Math.sqrt(d)));
      }
      // binary allowed(1)/forbidden(0) view used by the "show mask only" toggle.
      function allowedMatrix() {
        var M = [];
        for (var i = 0; i < n; i++) {
          var row = [];
          for (var j = 0; j < n; j++) row.push((arch === "enc" || j <= i) ? 1 : 0);
          M.push(row);
        }
        return M;
      }

      // CROSS-ATTENTION (encdec only): genuinely different sequences.
      // Decoder queries come from a deterministic 3-token toy target sequence
      // projected through the SAME Wq; keys/values are the encoder's K/V over
      // the 6 source tokens. crossW is a fully-unmasked 3×6 whose rows each
      // sum to 1.0 over all 6 source keys.
      var tgtLabels = ["tgt₀", "tgt₁", "tgt₂"];
      var Qdec = TQ.matmul(TQ.randMatrix(3, d, 909), qkv.Wq);     // 3×16 queries FROM decoder
      var crossScores = TQ.matmul(Qdec, TQ.transpose(qkv.K));     // 3×6, K from encoder
      var crossW = TQ.softmaxRows(TQ.scaleMat(crossScores, 1 / Math.sqrt(d))); // 3×6 unmasked

      // ---- sub-layer stack contents per architecture ----------------------
      function stackRows() {
        if (arch === "enc") {
          return [
            { t: "self-attn (bidirectional)" }, { t: "Add & Norm" },
            { t: "FFN" }, { t: "Add & Norm" }
          ];
        }
        if (arch === "dec") {
          return [
            { t: "masked self-attn" }, { t: "Add & Norm" },
            { t: "FFN" }, { t: "Add & Norm" }
          ];
        }
        return [
          { t: "masked self-attn" }, { t: "Add & Norm" },
          { t: "CROSS-attn (Q dec, K/V enc)", cross: true }, { t: "Add & Norm" },
          { t: "FFN" }, { t: "Add & Norm" }
        ];
      }

      // ---- DOM holders ----------------------------------------------------
      var selfHeatHolder = TQ.el("div", { class: "tq-grow" });
      var selfCaption = TQ.el("div", { class: "tq-mask-caption" });
      var selfChips = TQ.el("div", { class: "tq-mask-chips" });
      var stackHolder = TQ.el("div", { class: "tq-arch-stack" });
      var crossWrap = TQ.el("div", { class: "tq-arch-cross", style: { display: "none" } });
      var mechNote = TQ.el("div", { class: "tq-mask-mech", style: { display: "none" } });

      var maskLegend = TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "0.0" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "1.0" })
      );

      // ---- self-attn heatmap build (mirrors L3 buildHeat/markMasked/rewire) -
      function buildSelfHeat(weights) {
        var matrix = showMaskOnly ? allowedMatrix() : weights;
        return TQ.heatmap(matrix, {
          rowLabels: tokens, colLabels: tokens, cellSize: 46,
          min: 0, max: 1, selectedRow: maskSelRow,
          format: function (v) {
            if (arch !== "enc" && v === 0) return "∅";
            return showMaskOnly ? (v > 0 ? "1" : "0") : TQ.fmt(v, 2);
          }
        });
      }
      function markMasked(node) {
        var cells = node.querySelectorAll(".tq-hm-cell");
        var k = 0;
        for (var r = 0; r < n; r++) {
          for (var c = 0; c < n; c++) {
            if (arch !== "enc" && c > r) cells[k].classList.add("is-masked");
            k++;
          }
        }
      }
      function rewireSelf(node) {
        var cells = node.querySelectorAll(".tq-hm-cell");
        var k = 0;
        for (var r = 0; r < n; r++) {
          for (var c = 0; c < n; c++) {
            (function (rowIdx, colIdx, cell) {
              cell.classList.add("is-clickable");
              cell.setAttribute("role", "button");
              cell.setAttribute("tabindex", "0");
              var forbidden = (arch !== "enc" && colIdx > rowIdx);
              cell.addEventListener("click", function () {
                if (forbidden) showMech(rowIdx, colIdx); else selectMaskRow(rowIdx);
              });
              cell.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  if (forbidden) showMech(rowIdx, colIdx); else selectMaskRow(rowIdx);
                }
              });
              if (forbidden) cell.addEventListener("mouseenter", function () { showMech(rowIdx, colIdx); });
            })(r, c, cells[k]);
            k++;
          }
        }
      }

      function showMech(i, j) {
        mechNote.style.display = "";
        mechNote.innerHTML = "";
        mechNote.appendChild(TQ.el("span",
          { class: "tq-mask-mech-mark", text: "∅", "aria-hidden": "true" }));
        mechNote.appendChild(TQ.el("div", { class: "tq-mask-mech-body" },
          "Forbidden: key ", TQ.el("strong", { text: "#" + j + " (" + tokens[j] + ")" }),
          " is in the future of query ", TQ.el("strong", { text: "#" + i + " (" + tokens[i] + ")" }),
          " (j>i). −∞ before softmax → exp(−∞)=0 → exactly 0 weight."
        ));
      }

      // cross-attn heatmap (encdec only)
      function buildCrossGrid() {
        crossWrap.innerHTML = "";
        crossWrap.appendChild(TQ.el("div", { class: "tq-arch-cross-title" },
          TQ.el("strong", { text: "Cross-attention" }),
          " — decoder asks, encoder answers. Q and K/V are literally different sequences (rows ≠ cols)."
        ));
        var axes = TQ.el("div", { class: "tq-arch-cross-axes" },
          TQ.el("span", { class: "tq-arch-axis tq-arch-axis-q", text: "Q ← decoder (target ↓)" }),
          TQ.el("span", { class: "tq-arch-axis tq-arch-axis-kv", text: "K,V ← encoder output (source →)" })
        );
        var grid = TQ.heatmap(crossW, {
          rowLabels: tgtLabels, colLabels: tokens, cellSize: 40,
          min: 0, max: 1,
          format: function (v) { return TQ.fmt(v, 2); },
          onCell: function (r) { selectCrossRow(r); }
        });
        crossWrap.appendChild(axes);
        crossWrap.appendChild(grid);
        crossWrap.appendChild(crossCaption);
      }
      var crossCaption = TQ.el("div", { class: "tq-mask-caption" });
      function selectCrossRow(r) {
        crossSelRow = TQ.clamp(r, 0, tgtLabels.length - 1);
        renderCrossCaption();
      }
      var crossSelRow = 0;
      function renderCrossCaption() {
        crossCaption.innerHTML = "";
        var rs = TQ.sum(crossW[crossSelRow]);
        crossCaption.appendChild(TQ.el("span", {},
          "Decoder token ", TQ.el("strong", { text: tgtLabels[crossSelRow] }),
          " attends over ", TQ.el("strong", { text: "all " + n + " source keys" }),
          " (no mask — the source is fully known). "
        ));
        crossCaption.appendChild(TQ.kv("row Σ", TQ.fmt(rs, 3)));
      }

      // ---- morphing sub-layer stack ---------------------------------------
      function buildStack() {
        stackHolder.innerHTML = "";
        stackHolder.appendChild(TQ.el("div", { class: "tq-arch-stack-cap", text: "Sub-layers" }));
        var rows = stackRows();
        for (var i = 0; i < rows.length; i++) {
          stackHolder.appendChild(TQ.el("div",
            { class: "tq-arch-chip" + (rows[i].cross ? " is-cross" : ""), text: rows[i].t }));
        }
      }

      // ---- caption + Σ chip under the self-attn grid ----------------------
      function renderSelfCaption(weights) {
        selfCaption.innerHTML = "";
        selfChips.innerHTML = "";
        var r = maskSelRow;
        if (arch === "enc") {
          selfCaption.appendChild(TQ.el("span", {},
            "Query ", TQ.el("strong", { text: "\"" + tokens[r] + "\"" }), " (#", String(r),
            ") may attend to ", TQ.el("strong", { text: "all " + n + " keys" }),
            " — bidirectional, no mask."
          ));
        } else {
          var allowedCount = r + 1;
          var maskedToks = tokens.slice(r + 1);
          var parts = [
            "Query ", TQ.el("strong", { text: "\"" + tokens[r] + "\"" }), " (#", String(r),
            ") may attend to: ",
            TQ.el("strong", { text: tokens.slice(0, allowedCount).join(", ") }),
            " — " + allowedCount + " of " + n + " keys"
          ];
          if (maskedToks.length) {
            parts.push("; the " + maskedToks.length + " future key" +
              (maskedToks.length === 1 ? "" : "s") + " (");
            parts.push(TQ.el("strong", { text: maskedToks.join(", ") }));
            parts.push(") "+ (maskedToks.length === 1 ? "is" : "are") + " masked (∅).");
          } else {
            parts.push(" (no future keys to mask).");
          }
          selfCaption.appendChild(TQ.el("span", {}, parts));
        }
        selfChips.appendChild(TQ.kv("row Σ", TQ.fmt(TQ.sum(weights[r]), 3)));
        selfChips.appendChild(arch === "enc"
          ? TQ.badge("bidirectional", "info")
          : TQ.badge("causal · lower-triangular", "info"));
      }

      // ---- master refresh -------------------------------------------------
      function refreshArch() {
        var weights = selfWeights();
        var fresh = buildSelfHeat(weights);
        rewireSelf(fresh);
        markMasked(fresh);
        if (selfHeatHolder.firstChild) selfHeatHolder.replaceChild(fresh, selfHeatHolder.firstChild);
        else selfHeatHolder.appendChild(fresh);
        renderSelfCaption(weights);
        buildStack();

/* ============================================================================
 * LEVEL 07 — Generation & the KV Cache   (order 7)
 * ----------------------------------------------------------------------------
 * Follows the gold-standard pattern of 01-tokens-embeddings.js:
 *   - one IIFE, ONE TQ.registerLevel call, NO other globals
 *   - render() = short explanation blocks + a PRIMARY interactive sandbox,
 *     every number genuinely computed via TQ math (no faked attention/memory)
 *   - all color via TQ.colorFor / TQ.heatmap / TQ.vectorView / TQ.barRow
 *   - 4 quiz questions
 *
 * The math, all real and continuous with earlier levels (same toy sentence):
 *   - dk = head_dim slider. Wq=randMatrix(16,dk,101), Wk=(...,202), Wv=(...,303)
 *     via TQ.toyQKV, exactly the documented Q/K/V convention.
 *   - K_all = emb·Wk, V_all = emb·Wv, Q_all = emb·Wq (6 x dk each).
 *   - At step t (1..6): the K/V caches are the first t rows of K_all/V_all,
 *     displayed TRANSPOSED (dk x t) so each click appends a real COLUMN.
 *   - The new query q_t = Q_all[t-1] attends over the cache:
 *       scores[j] = dot(q_t, K_cache[j]); scaled = scores/sqrt(dk);
 *       weights = softmax(scaled)  -> automatically causal (cache holds j<=t-1).
 *   - Work counters: with-cache total = n (one new k,v per step);
 *     recompute-all total = n(n+1)/2. Savings = recompute/cache, all computed.
 *   - Causal-mask grid: 6x6 lower-triangular, rendered with colorFor.
 *   - Memory panel: cache_bytes = 2·n_layers·seq_len·n_kv_heads·head_dim·bytes,
 *     computed live from sliders, formatted in GB.
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "kv-cache",
    order: 7,
    title: "Generation & the KV Cache",
    icon: "📼",
    tagline: "Decoders generate one token at a time — so cache the past instead of recomputing it.",
    preread: "Memory-Efficient Attention (setup)",
    objectives: [
      "Understand autoregressive decoding: one token per step, each attends to all prior tokens",
      "See why recomputing every past K/V each step is wasteful, and how a cache fixes it",
      "Feel the compute-with-cache vs without-cache contrast that motivates the next levels"
    ],

    render: function (root) {
      var toy = TQ.toy;
      var tokens = toy.tokens;
      var emb = toy.embeddings;
      var N = tokens.length;

      /* ----------------------------------------------------- intro narrative */
      root.appendChild(TQ.block(
        TQ.h(2, "Decoders generate left-to-right, one token at a time"),

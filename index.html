            "input to the next block, " + depth + " times over. Crucially the weights are NOT shared — each " +
            "block has its own attention and FFN parameters. Same shape, different transformation, repeated.";
        }
        depthCaption.appendChild(TQ.el("span", { text: msg }));
      }
      updateDepthCaption();

      var controls = TQ.el("div", { class: "tq-controls-row tq-block-controls" },
        TQ.el("div", {},
          TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Token"),
          posSel.el),
        TQ.el("div", {},
          TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Stack depth"),
          depthSel.el),
        TQ.el("div", { style: { alignSelf: "flex-end" } }, rawToggle.el)
      );
      primary.appendChild(controls);

      // ---- small rendering helpers for stages ---------------------------
      function vv(values, label) {
        return TQ.vectorView(values, { label: label, cellSize: 22, showValues: showRaw });
      }

      function statPanel(title, vec) {
        var mu = TQ.mean(vec);
        var vr = variance(vec);
        return TQ.el("div", { class: "tq-tb-stats" },
          TQ.el("span", { class: "tq-tb-stats-title", text: title }),
          TQ.kv("mean", TQ.fmt(mu, 2)),
          TQ.kv("var", TQ.fmt(vr, 2)),
          TQ.kv("min", TQ.fmt(TQ.minOf(vec), 2)),
          TQ.kv("max", TQ.fmt(TQ.maxOf(vec), 2))
        );
      }

      function residualView(label1, v1, label2, v2, sumLabel, sum) {
        return TQ.el("div", { class: "tq-tb-residual" },
          vv(v1, label1),
          TQ.el("div", { class: "tq-tb-plus", text: "+" }),
          vv(v2, label2),
          TQ.el("div", { class: "tq-tb-eq", text: "=" }),
          vv(sum, sumLabel)
        );
      }

      // ---- the 7 stages -------------------------------------------------
      function buildSteps() {
        return [
          {
            label: "1 · Input x",
            run: function (c) {
              c.appendChild(TQ.p(
                "The block's input for token ", TQ.el("strong", { text: tokens[pos] }),
                " — its ", TQ.math("d_model = " + d), " vector. (In a real stack this is the previous " +
                "block's output; here it's the embedding.)"
              ));
              c.appendChild(vv(data.x, "x  (" + tokens[pos] + ")"));
              c.appendChild(statPanel("input stats", data.x));
            }
          },
          {
            label: "2 · Multi-head attention output",
            run: function (c) {
              c.appendChild(TQ.p(
                "The ", TQ.el("strong", { text: "only" }),
                " cross-token step. Token ", TQ.el("strong", { text: tokens[pos] }),
                " blends the value vectors of all ", String(n),
                " tokens, weighted by attention. Those weights are real (scaled dot-product, ÷√" + d + "):"
              ));
              c.appendChild(TQ.barRow(att.weights[pos], {
                labels: tokens, max: 1,
                format: function (v) { return TQ.fmt(v, 3); }
              }));
              c.appendChild(vv(data.a, "MHA(x)"));
              c.appendChild(TQ.note(
                "For legibility this block runs a single full-width head (dk = d_model, Wo = identity); the " +
                "Concat-then-Wo machinery from Level 4 (dk = d_model / H, then a learned output projection) would " +
                "slot in here unchanged and produce the same d_model-wide output."
              ));
              c.appendChild(TQ.note(
                "Every later stage is per-token: it never looks at the other five tokens again."
              ));
            }
          },
          {
            label: "3 · Residual #1  (x + MHA)",
            run: function (c) {
              c.appendChild(TQ.p(
                "The skip connection. We ", TQ.el("strong", { text: "add" }),
                " the attention output back onto the input — the sum is ", TQ.el("strong", { text: "x nudged" }),
                ", not x replaced. The sub-layer only had to learn a delta (the ResNet move)."
              ));
              c.appendChild(residualView("x", data.x, "MHA(x)", data.a, "x + MHA(x)", data.r1));
              c.appendChild(statPanel("after residual (scale can drift)", data.r1));
            }
          },
          {
            label: "4 · LayerNorm #1",
            run: function (c) {
              c.appendChild(TQ.p(
                "Normalize across the token's own ", String(d),
                " features: subtract the mean, divide by the std, apply γ=1, β=0. Watch the stats ",
                TQ.el("strong", { text: "snap" }), " to mean 0, var 1 — computed from the numbers, not asserted."
              ));
              c.appendChild(TQ.el("div", { class: "tq-tb-residual" },
                vv(data.r1, "x + MHA(x)"),
                TQ.el("div", { class: "tq-tb-eq", text: "→" }),
                vv(data.z, "z = LN(...)")
              ));
              c.appendChild(TQ.el("div", { class: "tq-tb-statrow" },
                statPanel("before LN", data.r1),
                statPanel("after LN", data.z)
              ));
            }
          },
          {
            label: "5 · FFN internals  (Linear → ReLU → Linear)",
            run: function (c) {
              c.appendChild(TQ.p(
                "Per-token MLP: expand ", TQ.math(d + " → " + dHidden),
                ", ReLU (clamps negatives to exactly 0), then contract ",
                TQ.math(dHidden + " → " + d),
                ". The SAME W1, W2 act at every position — like a 1×1 conv."
              ));
              c.appendChild(vv(data.hRaw, "zW1 + b1   (hidden, " + dHidden + "-dim, pre-ReLU)"));
              c.appendChild(vv(data.h, "max(0, ·)   (after ReLU — negatives now 0)"));
              var zeroed = 0;
              for (var i = 0; i < data.hRaw.length; i++) if (data.hRaw[i] <= 0) zeroed++;
              c.appendChild(TQ.el("div", { class: "tq-tb-stats" },
                TQ.el("span", { class: "tq-tb-stats-title", text: "ReLU" }),
                TQ.kv("hidden dim", String(dHidden)),
                TQ.kv("clamped to 0", zeroed + " / " + dHidden)
              ));
              c.appendChild(vv(data.ff, "FFN(z) = hW2 + b2   (back to " + d + "-dim)"));
            }
          },
          {
            label: "6 · Residual #2  (z + FFN)",
            run: function (c) {
              c.appendChild(TQ.p(
                "Second skip connection, same pattern. ", TQ.math("z"),
                " plus the FFN's delta — the model adds what the per-token MLP computed without throwing z away."
              ));
              c.appendChild(residualView("z", data.z, "FFN(z)", data.ff, "z + FFN(z)", data.r2));
              c.appendChild(statPanel("after residual (scale can drift again)", data.r2));
            }
          },
          {
            label: "7 · LayerNorm #2  →  block output",
            run: function (c) {
              c.appendChild(TQ.p(
                "Final normalize. The output is ", TQ.el("strong", { text: d + "-dimensional" }),
                " — the ", TQ.el("strong", { text: "same shape as the input x" }),
                ". That's exactly why blocks stack: out of one block is in to the next."
              ));
              c.appendChild(TQ.el("div", { class: "tq-tb-residual" },
                vv(data.r2, "z + FFN(z)"),
                TQ.el("div", { class: "tq-tb-eq", text: "→" }),
                vv(data.out, "out = LN(...)")
              ));
              c.appendChild(TQ.el("div", { class: "tq-tb-statrow" },
                statPanel("before LN", data.r2),
                statPanel("after LN", data.out)
              ));
              c.appendChild(TQ.el("div", { class: "tq-tb-shapecheck" },
                TQ.badge("in: " + d + "-dim", "info"),
                TQ.el("span", { class: "tq-tb-arrow", text: "→ block →" }),
                TQ.badge("out: " + data.out.length + "-dim", "good")
              ));
              c.appendChild(depthCaption);
            }
          }
        ];
      }

      var stepperHolder = TQ.el("div", { class: "tq-tb-stepper-holder" });
      function rebuildStepper() {
        stepperHolder.innerHTML = "";
        stepperHolder.appendChild(TQ.stepper(buildSteps()));
      }
      rebuildStepper();
      primary.appendChild(stepperHolder);

      primary.appendChild(TQ.callout(
        "The load-bearing split: attention is the ONLY place tokens exchange information; LayerNorm and the " +
        "FFN both operate per-token. Mix, then think locally — repeated, with fresh weights, dozens of times."
      ));
      root.appendChild(primary);

      /* --------------------------------------------------- wrap-up takeaway */
      root.appendChild(TQ.block(
        TQ.h(2, "Why this is the whole architecture"),
        TQ.p(
          "Stack this block N times, add embeddings at the bottom and an output head on top, and you have a " +
          "transformer. Residuals keep the gradient highway open; LayerNorm keeps the scale sane; attention " +
          "routes; the FFN remembers. Everything you learned earlier — embeddings, dot-product attention — " +
          "plugs in right here."
        ),
        TQ.callout(
          "Carry forward: the block preserves shape (16-dim in, 16-dim out). Shape-preservation is what makes " +
          "a deep stack possible — and the KV-cache tricks coming next live inside that attention sub-layer."
        )
      ));

      /* ----------------------------------- encoder vs decoder vs decoder-only */
      var archBlock = TQ.block(
        TQ.h(2, "Two flavors of block: encoder vs decoder (and why we go decoder-only)"),
        TQ.p(
          "The same block comes in three architectures, and they differ in exactly two ways: ",
          TQ.el("strong", { text: "which attention mask" }), " they use and ",
          TQ.el("strong", { text: "whether they add a cross-attention sub-layer" }), ". An ",
          TQ.el("strong", { text: "encoder" }), " (BERT) uses ", TQ.el("strong", { text: "bidirectional" }),
          " self-attention — no mask, every token sees every token — for understanding. A ",
          TQ.el("strong", { text: "decoder" }), " (GPT/Llama) uses ", TQ.el("strong", { text: "masked, causal" }),
          " self-attention — each token sees only itself and earlier tokens — so it generates left-to-right."
        ),
        TQ.p(
          "The original Transformer (and T5) is an ", TQ.el("strong", { text: "encoder–decoder" }),
          ": the encoder reads the source, and each decoder block adds a third sub-layer, ",
          TQ.el("strong", { text: "cross-attention" }), ", where the ",
          TQ.el("strong", { text: "query comes from the decoder" }), " but the ",
          TQ.el("strong", { text: "keys and values come from the encoder's output" }),
          " — the same scaled-dot-product attention you know, but Q from one sequence and K/V from another."
        ),
        TQ.p(
          TQ.el("em", { text: "This is the very attention from the walkthrough above (same seeds) — now with a mask you can flip." })
        )
      );

      /* ---- interactive: architecture mask grid + cross-attn + stack ------- *
       * Self-contained state (does NOT touch pos/showRaw/depth above). The
       * self-attn grid reuses the stepper's qkv (TQ.toyQKV(16,101,202,303)),
       * so the grid IS the walkthrough's attention with the mask toggled. */
      var arch = "dec";          // 'enc' | 'dec' | 'encdec'
      var maskSelRow = 0;        // selected query row in the self-attn grid
      var showMaskOnly = false;  // optional binary-vs-weights view

      // base scores (fixed) — reuse the stepper's qkv, do NOT re-seed.
      var baseScores = TQ.matmul(qkv.Q, TQ.transpose(qkv.K)); // 6×6

      // Causal mask is on whenever arch is not encoder. Apply −∞ to future keys
      // (j>i) on a COPY of the base scores (exactly the L3 mechanic), so
      // exp(−∞)=0 → those cells get genuine 0 weight and surviving cells
      // renormalize to Σ=1.0.
      function maskedScores() {
        if (arch === "enc") return baseScores;
        var M = [];
        for (var i = 0; i < baseScores.length; i++) {
          var row = [];
          for (var j = 0; j < baseScores[i].length; j++) {
            row.push(j > i ? -Infinity : baseScores[i][j]);
          }
          M.push(row);
        }
        return M;
      }
      function selfWeights() {
        return TQ.softmaxRows(TQ.scaleMat(maskedScores(), 1 / Math.sqrt(d)));
      }
      // binary allowed(1)/forbidden(0) view used by the "show mask only" toggle.
      function allowedMatrix() {
        var M = [];
        for (var i = 0; i < n; i++) {
          var row = [];
          for (var j = 0; j < n; j++) row.push((arch === "enc" || j <= i) ? 1 : 0);
          M.push(row);
        }
        return M;
      }

      // CROSS-ATTENTION (encdec only): genuinely different sequences.
      // Decoder queries come from a deterministic 3-token toy target sequence
      // projected through the SAME Wq; keys/values are the encoder's K/V over
      // the 6 source tokens. crossW is a fully-unmasked 3×6 whose rows each
      // sum to 1.0 over all 6 source keys.
      var tgtLabels = ["tgt₀", "tgt₁", "tgt₂"];
      var Qdec = TQ.matmul(TQ.randMatrix(3, d, 909), qkv.Wq);     // 3×16 queries FROM decoder
      var crossScores = TQ.matmul(Qdec, TQ.transpose(qkv.K));     // 3×6, K from encoder
      var crossW = TQ.softmaxRows(TQ.scaleMat(crossScores, 1 / Math.sqrt(d))); // 3×6 unmasked

      // ---- sub-layer stack contents per architecture ----------------------
      function stackRows() {
        if (arch === "enc") {
          return [
            { t: "self-attn (bidirectional)" }, { t: "Add & Norm" },
            { t: "FFN" }, { t: "Add & Norm" }
          ];
        }
        if (arch === "dec") {
          return [
            { t: "masked self-attn" }, { t: "Add & Norm" },
            { t: "FFN" }, { t: "Add & Norm" }
          ];
        }
        return [
          { t: "masked self-attn" }, { t: "Add & Norm" },
          { t: "CROSS-attn (Q dec, K/V enc)", cross: true }, { t: "Add & Norm" },
          { t: "FFN" }, { t: "Add & Norm" }
        ];
      }

      // ---- DOM holders ----------------------------------------------------
      var selfHeatHolder = TQ.el("div", { class: "tq-grow" });
      var selfCaption = TQ.el("div", { class: "tq-mask-caption" });
      var selfChips = TQ.el("div", { class: "tq-mask-chips" });
      var stackHolder = TQ.el("div", { class: "tq-arch-stack" });
      var crossWrap = TQ.el("div", { class: "tq-arch-cross", style: { display: "none" } });
      var mechNote = TQ.el("div", { class: "tq-mask-mech", style: { display: "none" } });

      var maskLegend = TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "0.0" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "1.0" })
      );

      // ---- self-attn heatmap build (mirrors L3 buildHeat/markMasked/rewire) -
      function buildSelfHeat(weights) {
        var matrix = showMaskOnly ? allowedMatrix() : weights;
        return TQ.heatmap(matrix, {
          rowLabels: tokens, colLabels: tokens, cellSize: 46,
          min: 0, max: 1, selectedRow: maskSelRow,
          format: function (v) {
            if (arch !== "enc" && v === 0) return "∅";
            return showMaskOnly ? (v > 0 ? "1" : "0") : TQ.fmt(v, 2);
          }
        });
      }
      function markMasked(node) {
        var cells = node.querySelectorAll(".tq-hm-cell");
        var k = 0;
        for (var r = 0; r < n; r++) {
          for (var c = 0; c < n; c++) {
            if (arch !== "enc" && c > r) cells[k].classList.add("is-masked");
            k++;
          }
        }
      }
      function rewireSelf(node) {
        var cells = node.querySelectorAll(".tq-hm-cell");
        var k = 0;
        for (var r = 0; r < n; r++) {
          for (var c = 0; c < n; c++) {
            (function (rowIdx, colIdx, cell) {
              cell.classList.add("is-clickable");
              cell.setAttribute("role", "button");
              cell.setAttribute("tabindex", "0");
              var forbidden = (arch !== "enc" && colIdx > rowIdx);
              cell.addEventListener("click", function () {
                if (forbidden) showMech(rowIdx, colIdx); else selectMaskRow(rowIdx);
              });
              cell.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  if (forbidden) showMech(rowIdx, colIdx); else selectMaskRow(rowIdx);
                }
              });
              if (forbidden) cell.addEventListener("mouseenter", function () { showMech(rowIdx, colIdx); });
            })(r, c, cells[k]);
            k++;
          }
        }
      }

      function showMech(i, j) {
        mechNote.style.display = "";
        mechNote.innerHTML = "";
        mechNote.appendChild(TQ.el("span",
          { class: "tq-mask-mech-mark", text: "∅", "aria-hidden": "true" }));
        mechNote.appendChild(TQ.el("div", { class: "tq-mask-mech-body" },
          "Forbidden: key ", TQ.el("strong", { text: "#" + j + " (" + tokens[j] + ")" }),
          " is in the future of query ", TQ.el("strong", { text: "#" + i + " (" + tokens[i] + ")" }),
          " (j>i). −∞ before softmax → exp(−∞)=0 → exactly 0 weight."
        ));
      }

      // cross-attn heatmap (encdec only)
      function buildCrossGrid() {
        crossWrap.innerHTML = "";
        crossWrap.appendChild(TQ.el("div", { class: "tq-arch-cross-title" },
          TQ.el("strong", { text: "Cross-attention" }),
          " — decoder asks, encoder answers. Q and K/V are literally different sequences (rows ≠ cols)."
        ));
        var axes = TQ.el("div", { class: "tq-arch-cross-axes" },
          TQ.el("span", { class: "tq-arch-axis tq-arch-axis-q", text: "Q ← decoder (target ↓)" }),
          TQ.el("span", { class: "tq-arch-axis tq-arch-axis-kv", text: "K,V ← encoder output (source →)" })
        );
        var grid = TQ.heatmap(crossW, {
          rowLabels: tgtLabels, colLabels: tokens, cellSize: 40,
          min: 0, max: 1,
          format: function (v) { return TQ.fmt(v, 2); },
          onCell: function (r) { selectCrossRow(r); }
        });
        crossWrap.appendChild(axes);
        crossWrap.appendChild(grid);
        crossWrap.appendChild(crossCaption);
      }
      var crossCaption = TQ.el("div", { class: "tq-mask-caption" });
      function selectCrossRow(r) {
        crossSelRow = TQ.clamp(r, 0, tgtLabels.length - 1);
        renderCrossCaption();
      }
      var crossSelRow = 0;
      function renderCrossCaption() {
        crossCaption.innerHTML = "";
        var rs = TQ.sum(crossW[crossSelRow]);
        crossCaption.appendChild(TQ.el("span", {},
          "Decoder token ", TQ.el("strong", { text: tgtLabels[crossSelRow] }),
          " attends over ", TQ.el("strong", { text: "all " + n + " source keys" }),
          " (no mask — the source is fully known). "
        ));
        crossCaption.appendChild(TQ.kv("row Σ", TQ.fmt(rs, 3)));
      }

      // ---- morphing sub-layer stack ---------------------------------------
      function buildStack() {
        stackHolder.innerHTML = "";
        stackHolder.appendChild(TQ.el("div", { class: "tq-arch-stack-cap", text: "Sub-layers" }));
        var rows = stackRows();
        for (var i = 0; i < rows.length; i++) {
          stackHolder.appendChild(TQ.el("div",
            { class: "tq-arch-chip" + (rows[i].cross ? " is-cross" : ""), text: rows[i].t }));
        }
      }

      // ---- caption + Σ chip under the self-attn grid ----------------------
      function renderSelfCaption(weights) {
        selfCaption.innerHTML = "";
        selfChips.innerHTML = "";
        var r = maskSelRow;
        if (arch === "enc") {
          selfCaption.appendChild(TQ.el("span", {},
            "Query ", TQ.el("strong", { text: "\"" + tokens[r] + "\"" }), " (#", String(r),
            ") may attend to ", TQ.el("strong", { text: "all " + n + " keys" }),
            " — bidirectional, no mask."
          ));
        } else {
          var allowedCount = r + 1;
          var maskedToks = tokens.slice(r + 1);
          var parts = [
            "Query ", TQ.el("strong", { text: "\"" + tokens[r] + "\"" }), " (#", String(r),
            ") may attend to: ",
            TQ.el("strong", { text: tokens.slice(0, allowedCount).join(", ") }),
            " — " + allowedCount + " of " + n + " keys"
          ];
          if (maskedToks.length) {
            parts.push("; the " + maskedToks.length + " future key" +
              (maskedToks.length === 1 ? "" : "s") + " (");
            parts.push(TQ.el("strong", { text: maskedToks.join(", ") }));
            parts.push(") "+ (maskedToks.length === 1 ? "is" : "are") + " masked (∅).");
          } else {
            parts.push(" (no future keys to mask).");
          }
          selfCaption.appendChild(TQ.el("span", {}, parts));
        }
        selfChips.appendChild(TQ.kv("row Σ", TQ.fmt(TQ.sum(weights[r]), 3)));
        selfChips.appendChild(arch === "enc"
          ? TQ.badge("bidirectional", "info")
          : TQ.badge("causal · lower-triangular", "info"));
      }

      // ---- master refresh -------------------------------------------------
      function refreshArch() {
        var weights = selfWeights();
        var fresh = buildSelfHeat(weights);
        rewireSelf(fresh);
        markMasked(fresh);
        if (selfHeatHolder.firstChild) selfHeatHolder.replaceChild(fresh, selfHeatHolder.firstChild);
        else selfHeatHolder.appendChild(fresh);
        renderSelfCaption(weights);
        buildStack();
        if (arch === "encdec") {
          crossWrap.style.display = "";
          buildCrossGrid();
          renderCrossCaption();
        } else {
          crossWrap.style.display = "none";
        }
        mechNote.style.display = "none";
      }

      function setArch(v) {
        arch = v;
        maskSelRow = TQ.clamp(maskSelRow, 0, n - 1);
        refreshArch();
      }
      function selectMaskRow(r) {
        maskSelRow = TQ.clamp(r, 0, n - 1);
        refreshArch();
      }

      // ---- controls -------------------------------------------------------
      var archSeg = TQ.segmented({
        options: [
          { label: "Encoder-only (BERT)", value: "enc" },
          { label: "Decoder-only (GPT/Llama)", value: "dec" },
          { label: "Encoder–decoder (T5)", value: "encdec" }
        ],
        value: "dec",
        onChange: setArch
      });
      var maskOnlyToggle = TQ.toggle({
        label: "show allowed-mask only (1/0 instead of weights)",
        value: false,
        onChange: function (on) { showMaskOnly = on; refreshArch(); }
      });

      var archControls = TQ.el("div", { class: "tq-arch-controls" },
        TQ.el("div", { class: "tq-arch-ctrl-cell" },
          TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Architecture"),
          archSeg.el),
        TQ.el("div", { class: "tq-arch-ctrl-cell", style: { alignSelf: "flex-end" } }, maskOnlyToggle.el)
      );

      archBlock.appendChild(archControls);
      archBlock.appendChild(maskLegend);
      archBlock.appendChild(TQ.el("div", { class: "tq-arch-row" },
        TQ.el("div", { class: "tq-flexcol tq-grow", style: { gap: "10px" } },
          selfHeatHolder, selfChips, selfCaption, mechNote, crossWrap),
        stackHolder
      ));
      archBlock.appendChild(TQ.callout(
        "Flip the selector and watch only the dark triangle move on identical numbers: ",
        TQ.el("strong", { text: "encoder" }), " fills the whole square (bidirectional); ",
        TQ.el("strong", { text: "decoder" }), " masks the future (causal); ",
        TQ.el("strong", { text: "encoder–decoder" }), " keeps the masked self-attn AND grows a third sub-layer — " +
        "the cross-attention grid below it, where rows (decoder targets) and columns (encoder source) are " +
        "genuinely different sequences. Masking relocates probability, never deletes it: every row Σ stays 1.000."
      ));

      // first paint
      refreshArch();
      root.appendChild(archBlock);

      root.appendChild(TQ.block(
        TQ.callout(
          "Modern LLMs (GPT, Llama, DeepSeek) are ", TQ.el("strong", { text: "decoder-only" }),
          ": they drop the encoder and its cross-attention entirely and just stack masked-self-attention decoder " +
          "blocks. That's why the rest of this game lives in the decoder world — when Level 7 says a 'decoder generates " +
          "left-to-right,' this masked block is exactly what it means."
        )
      ));

      /* scoped styles — colors via CSS variables only, no hardcoded hex */
      injectOnce("tq-lvl06-css",
        ".tq-block-controls{align-items:flex-start;gap:22px;flex-wrap:wrap;margin:6px 0 14px}" +
        ".tq-tb-stepper-holder{margin-top:6px}" +
        ".tq-tb-residual{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0}" +
        ".tq-tb-plus,.tq-tb-eq{font-size:22px;font-weight:700;color:var(--ink-mute);padding:0 2px}" +
        ".tq-tb-statrow{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}" +
        ".tq-tb-stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;" +
          "background:var(--panel-hi);border:1px solid var(--line);border-radius:10px;" +
          "padding:8px 12px;margin-top:10px}" +
        ".tq-tb-stats-title{font-size:12px;font-weight:700;color:var(--ink-mute);" +
          "text-transform:uppercase;letter-spacing:.04em;margin-right:4px}" +
        ".tq-tb-shapecheck{display:flex;align-items:center;gap:10px;margin-top:12px}" +
        ".tq-tb-arrow{font-family:var(--mono);color:var(--ink-mute);font-size:13px}" +
        /* --- architecture mask grid interactive (tq-arch-* / tq-mask-*) --- */
        ".tq-arch-controls{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin:6px 0 12px}" +
        ".tq-arch-ctrl-cell{display:flex;flex-direction:column;justify-content:flex-end}" +
        ".tq-arch-row{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-top:6px}" +
        ".tq-arch-stack{flex:0 0 auto;min-width:220px;border:1px solid var(--line);border-radius:12px;" +
          "padding:12px;background:var(--panel-hi);display:flex;flex-direction:column;gap:6px}" +
        ".tq-arch-stack-cap{font-size:12px;font-weight:700;color:var(--ink-mute);" +
          "text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}" +
        ".tq-arch-chip{font-size:12.5px;color:var(--ink-mute);font-family:var(--mono);" +
          "border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--panel);" +
          "transition:opacity .35s ease,max-height .35s ease,border-color .35s ease}" +
        ".tq-arch-chip.is-cross{color:var(--accent-2);border-color:var(--accent-2);" +
          "box-shadow:0 0 0 1px var(--accent-2) inset}" +
        ".tq-arch-cross{margin-top:8px;border-top:1px dashed var(--line);padding-top:12px}" +
        ".tq-arch-cross-title{font-size:13px;color:var(--ink-soft);margin-bottom:8px}" +
        ".tq-arch-cross-axes{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px}" +
        ".tq-arch-axis{font-size:11.5px;font-family:var(--mono);font-weight:700;" +
          "border:1px solid var(--line);border-radius:6px;padding:3px 7px}" +
        ".tq-arch-axis-q{color:var(--accent-2);border-color:var(--accent-2)}" +
        ".tq-arch-axis-kv{color:var(--cool);border-color:var(--cool)}" +
        ".tq-mask-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}" +
        ".tq-mask-caption{font-size:13.5px;color:var(--ink-soft);line-height:1.5}" +
        ".tq-mask-mech{display:flex;gap:10px;align-items:flex-start;background:var(--panel-hi);" +
          "border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink-soft)}" +
        ".tq-mask-mech-mark{color:var(--ink-mute);font-size:16px;line-height:1.2}" +
        ".tq-mask-mech-body{flex:1}" +
        /* causal-mask treatment (own L6 copy — L3's is scoped to tq-lvl03-css) */
        ".tq-hm-cell.is-masked{opacity:.32;filter:saturate(.4)}" +
        ".tq-hm-cell.is-masked .tq-hm-val{color:var(--ink-mute)}" +
        ".tq-hm-cell.is-masked.is-rowsel{opacity:.45}");
    },

    quiz: [
      {
        q: "In the post-LN block out = LayerNorm(z + FFN(z)), what is the role of the `z +` term?",
        choices: [
          "It is a residual/skip connection — the sub-layer learns a delta added to its input, keeping gradients flowing in a deep stack (just like ResNet)",
          "It concatenates z onto the FFN output, doubling the vector's dimension",
          "It is the positional encoding being re-added at every layer",
          "It applies the softmax that turns FFN outputs into attention weights"
        ],
        answer: 0,
        explain: "`z +` is the residual/skip connection from ResNet. The FFN only learns a delta on top of the " +
                 "identity, so deep stacks stay trainable and gradients reach the bottom layers."
      },
      {
        q: "LayerNorm and BatchNorm both stabilize activation scale. What is the key difference that makes LayerNorm the right choice for an autoregressive LLM?",
        choices: [
          "LayerNorm has no learnable parameters, so it is cheaper",
          "LayerNorm normalizes across each token's own features, with no dependence on other tokens or the batch — so it behaves identically at training and single-token inference",
          "LayerNorm normalizes across the batch dimension, averaging over many sentences",
          "LayerNorm replaces the need for an activation function inside the FFN"
        ],
        answer: 1,
        explain: "BatchNorm's statistics depend on the batch/neighbors, which breaks down at one-token-at-a-time " +
                 "inference. LayerNorm normalizes within each token's feature vector, so it is independent of " +
                 "sequence length and batch size."
      },
      {
        q: "Within one transformer block, where do different token positions exchange information?",
        choices: [
          "In the feed-forward network, which mixes all positions together",
          "In LayerNorm, which averages across the sequence",
          "Only in the multi-head attention sub-layer; the FFN and LayerNorm operate per-token independently",
          "Nowhere — tokens never interact inside a block"
        ],
        answer: 2,
        explain: "Attention is the only cross-token operation. The FFN applies the same weights to each position " +
                 "independently (like a 1×1 conv), and LayerNorm normalizes each token's own vector — neither " +
                 "looks at other positions."
      },
      {
        q: "The FFN is FFN(z) = max(0, zW1 + b1)W2 + b2 with a hidden layer typically ~4× d_model. Why does this 'just an MLP' matter so much?",
        choices: [
          "It is where tokens attend to each other",
          "It performs the positional encoding",
          "Because of the 4× expansion it holds the majority of the model's parameters — it's where the model stores and transforms what it knows, per token",
          "It guarantees the output has mean 0 and variance 1"
        ],
        answer: 2,
        explain: "The 4× expand-then-contract MLP, applied at every position with shared weights, accounts for " +
                 "roughly two-thirds of a transformer's parameters. Attention routes information; the FFN is the " +
                 "per-token compute/storage."
      },
      {
        q: "What distinguishes a decoder block from an encoder block, and what extra sub-layer does an encoder–decoder's decoder add?",
        choices: [
          "The decoder uses bidirectional attention; it adds a second FFN to read the encoder output",
          "The decoder uses MASKED self-attention (each token sees only itself and earlier tokens); in an encoder–decoder it also adds a cross-attention sub-layer where Q comes from the decoder but K/V come from the encoder's output",
          "The decoder removes LayerNorm; it adds positional encoding that the encoder lacks",
          "There is no difference — encoder and decoder blocks are identical, the names are just conventions"
        ],
        answer: 1,
        explain: "An encoder block uses bidirectional (unmasked) self-attention; a decoder block masks attention so " +
                 "it can generate left-to-right. The original encoder–decoder also gives each decoder block a " +
                 "cross-attention sub-layer (Q from the decoder, K/V from the encoder). Modern LLMs are decoder-only: " +
                 "masked self-attention blocks with no encoder and no cross-attention."
      }
    ]
  });

  // tiny helper local to this module (NOT a global): inject scoped CSS once.
  function injectOnce(id, css) {
    if (document.getElementById(id)) return;
    var s = document.createElement("style");
    s.id = id;
    s.textContent = css;
    document.head.appendChild(s);
  }
})();


/* ===== 07-kv-cache.js ===== */
/* ============================================================================
 * LEVEL 07 — Generation & the KV Cache   (order 7)
 * ----------------------------------------------------------------------------
 * Follows the gold-standard pattern of 01-tokens-embeddings.js:
 *   - one IIFE, ONE TQ.registerLevel call, NO other globals
 *   - render() = short explanation blocks + a PRIMARY interactive sandbox,
 *     every number genuinely computed via TQ math (no faked attention/memory)
 *   - all color via TQ.colorFor / TQ.heatmap / TQ.vectorView / TQ.barRow
 *   - 4 quiz questions
 *
 * The math, all real and continuous with earlier levels (same toy sentence):
 *   - dk = head_dim slider. Wq=randMatrix(16,dk,101), Wk=(...,202), Wv=(...,303)
 *     via TQ.toyQKV, exactly the documented Q/K/V convention.
 *   - K_all = emb·Wk, V_all = emb·Wv, Q_all = emb·Wq (6 x dk each).
 *   - At step t (1..6): the K/V caches are the first t rows of K_all/V_all,
 *     displayed TRANSPOSED (dk x t) so each click appends a real COLUMN.
 *   - The new query q_t = Q_all[t-1] attends over the cache:
 *       scores[j] = dot(q_t, K_cache[j]); scaled = scores/sqrt(dk);
 *       weights = softmax(scaled)  -> automatically causal (cache holds j<=t-1).
 *   - Work counters: with-cache total = n (one new k,v per step);
 *     recompute-all total = n(n+1)/2. Savings = recompute/cache, all computed.
 *   - Causal-mask grid: 6x6 lower-triangular, rendered with colorFor.
 *   - Memory panel: cache_bytes = 2·n_layers·seq_len·n_kv_heads·head_dim·bytes,
 *     computed live from sliders, formatted in GB.
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "kv-cache",
    order: 7,
    title: "Generation & the KV Cache",
    icon: "📼",
    tagline: "Decoders generate one token at a time — so cache the past instead of recomputing it.",
    preread: "Memory-Efficient Attention (setup)",
    objectives: [
      "Understand autoregressive decoding: one token per step, each attends to all prior tokens",
      "See why recomputing every past K/V each step is wasteful, and how a cache fixes it",
      "Feel the compute-with-cache vs without-cache contrast that motivates the next levels"
    ],

    render: function (root) {
      var toy = TQ.toy;
      var tokens = toy.tokens;
      var emb = toy.embeddings;
      var N = tokens.length;

      /* ----------------------------------------------------- intro narrative */
      root.appendChild(TQ.block(
        TQ.h(2, "Decoders generate left-to-right, one token at a time"),
        TQ.p(
          "A CNN sees the whole image at once: one forward pass, done. An ",
          TQ.el("strong", { text: "autoregressive decoder" }),
          " is different — it produces text one token per step, and each new token is fed back in as input for the next step. ",
          "At step ", TQ.math("t"), " the model has the sequence so far (", TQ.math("t"),
          " tokens) and computes a single new token, ", TQ.math("t+1"), "."
        ),
        TQ.p(
          "Crucially, when computing the representation for position ", TQ.math("t"),
          ", attention lets that position look at every ", TQ.el("strong", { text: "earlier" }),
          " position — but never a later one (there is none yet). This \"only look left\" rule is ",
          TQ.el("strong", { text: "causal masking" }),
          ": future positions are masked out (set to −∞ before softmax, so their weight is 0). ",
          "It's the architectural reason a language model can be trained to predict the next word without cheating by peeking ahead."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "The same K and V get recomputed every step — that's the waste"),
        TQ.p(
          "Recall self-attention: each token projects its embedding into a query ", TQ.math("q"),
          ", a key ", TQ.math("k"), ", and a value ", TQ.math("v"),
          " (", TQ.math("Q=XWq, K=XWk, V=XWv"), "). To produce the next token at step ", TQ.math("t"),
          ", you only need the NEW token's query ", TQ.math("q_t"),
          ". That ", TQ.math("q_t"), " dot-products against the keys of ALL tokens, softmaxes, and reads out a weighted sum of their values."
        ),
        TQ.p(
          "Here's the catch: the keys and values of tokens ", TQ.math("0..t−1"),
          " are identical to what they were last step — the past doesn't change. The naive loop recomputes K and V for the ",
          TQ.el("strong", { text: "entire prefix every single step" }),
          ". Over a generation of ", TQ.math("T"), " tokens that's roughly ",
          TQ.math("1+2+...+T ≈ T²/2"), " key/value computations. Quadratic, for information you already had."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "Cache the past K and V; only the new token does work"),
        TQ.p(
          "The fix is embarrassingly simple: keep a ", TQ.el("strong", { text: "cache" }),
          " of all past keys and values. At step ", TQ.math("t"), " you compute only ", TQ.math("k_t"),
          " and ", TQ.math("v_t"), " (one token's worth of projection), append them as a new column to the K-cache and V-cache, then attend: ",
          TQ.math("weights = softmax(q_t · K_cacheᵀ / √dk)"), ", ", TQ.math("out = weights · V_cache"), "."
        ),
        TQ.p(
          "Per-step K/V ", TQ.el("em", { text: "projection" }), " work drops from ~", TQ.math("t"), " to ~", TQ.math("1"),
          ", so the running total of that recompute over ", TQ.math("T"), " tokens falls from ~", TQ.math("T²/2"),
          " to ~", TQ.math("T"), " — linear. (The query still dot-products against all ", TQ.math("t"),
          " cached keys, so attention ", TQ.el("em", { text: "scoring" }), " is still ", TQ.math("O(t)"),
          " per step — the cache kills redundant projection, not the intrinsic quadratic of attention itself.)"
        ),
        TQ.callout(
          "Note what is NOT cached: queries. A past token's query was only ever needed to compute that token's OWN output — " +
          "which already happened and won't change. Future tokens need past KEYS and VALUES (to attend to them), never past queries. " +
          "So you cache K and V, and throw the old q's away."
        )
      ));

      /* =====================================================================
       * PRIMARY INTERACTIVE — autoregressive-decoding sandbox
       * ===================================================================*/
      var sandbox = TQ.block(
        TQ.h(2, "Sandbox: generate the sentence, watch the cache grow"),
        TQ.p(
          "Below, the toy sentence is decoded one token at a time. Each ",
          TQ.el("strong", { text: "Generate next token" }),
          " click computes only the new token's ", TQ.math("k_t, v_t"),
          ", appends them as a new COLUMN to the growing K-cache and V-cache, and shows the new query ",
          TQ.math("q_t"), " attending across the whole cache. Two counters tally the cumulative key/value work."
        )
      );

      // --- live state -----------------------------------------------------
      var dk = 4;                 // head_dim slider value
      var t = 1;                  // tokens revealed so far (1..N)
      var mode = "cache";         // "cache" | "recompute"
      var cacheWork = 0;          // cumulative with-cache token-projections
      var recomputeWork = 0;      // cumulative recompute-all token-projections

      // projection matrices + full K/V/Q for current dk (rebuilt when dk changes)
      var qkv, K_all, V_all, Q_all;
      function rebuildProjections() {
        qkv = TQ.toyQKV(dk, 101, 202, 303);
        K_all = qkv.K; V_all = qkv.V; Q_all = qkv.Q; // each N x dk
      }
      rebuildProjections();

      // recompute the cumulative work counters from scratch for the current t,
      // so they're always consistent (no drift) and genuinely computed.
      function recountWork() {
        cacheWork = t;                  // 1 new (k,v) per step => total t
        recomputeWork = t * (t + 1) / 2; // sum_{s=1..t} s
      }
      recountWork();

      // controls + panels (filled by redraw)
      var legend = TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "low" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "high" })
      );

      var genBtn = TQ.el("button", { class: "tq-btn tq-btn-accent", type: "button" });
      var resetBtn = TQ.el("button", { class: "tq-btn tq-btn-ghost", type: "button", text: "↺ Reset" });

      var modeSeg = TQ.segmented({
        options: [{ label: "With cache", value: "cache" }, { label: "Recompute all", value: "recompute" }],
        value: "cache",
        onChange: function (v) { mode = v; redraw(); }
      });

      var dkSlider = TQ.slider({
        min: 2, max: 16, step: 1, value: dk, label: "head_dim (dk)",
        format: function (v) { return String(Math.round(v)); },
        onInput: function (v) {
          dk = Math.round(v);
          rebuildProjections();
          redraw();
        }
      });

      // token strip showing revealed vs pending tokens
      var stripWrap = TQ.el("div", { class: "tq-kv-strip" });
      // caches (transposed dk x t heatmaps)
      var cacheWrap = TQ.el("div", { class: "tq-kv-caches" });
      // attention row for newest query
      var attnWrap = TQ.el("div", { class: "tq-panel tq-grow" });
      // work counters
      var workWrap = TQ.el("div", { class: "tq-kv-work" });

      function renderStrip() {
        stripWrap.innerHTML = "";
        for (var i = 0; i < N; i++) {
          var revealed = i < t;
          var isNew = i === t - 1;
          var cls = "tq-kv-tok" + (revealed ? " is-on" : " is-off") + (isNew ? " is-new" : "");
          stripWrap.appendChild(TQ.el("div", { class: cls, title: revealed ? "position " + i : "not generated yet" },
            TQ.el("span", { class: "tq-kv-tok-idx", text: "#" + i }),
            TQ.el("span", { class: "tq-kv-tok-word", text: revealed ? tokens[i] : "·" })
          ));
        }
      }

      // Build a dk x t heatmap from the first t rows of M (each row = one token's
      // vector); transpose so a click adds a column. Fixed color scale over the
      // whole matrix so past columns NEVER change color as new ones appear.
      function cacheHeat(M, title, scaleMax) {
        var rowsT = t;
        var cache = [];
        for (var r = 0; r < rowsT; r++) cache.push(M[r]); // t x dk
        var disp = TQ.transpose(cache);                   // dk x t
        var colLabels = [];
        for (var c = 0; c < rowsT; c++) colLabels.push(tokens[c]);
        var rowLabels = [];
        for (var d = 0; d < dk; d++) rowLabels.push("d" + d);
        return TQ.heatmap(disp, {
          title: title, rowLabels: rowLabels, colLabels: colLabels,
          cellSize: 30, min: -scaleMax, max: scaleMax,
          selectedCol: rowsT - 1,
          format: function (v) { return TQ.fmt(v, 1); }
        });
      }

      function renderCaches() {
        cacheWrap.innerHTML = "";
        // fixed symmetric scale from the FULL matrices so colors are stable
        var flatK = [].concat.apply([], K_all);
        var flatV = [].concat.apply([], V_all);
        var kMax = Math.max(Math.abs(TQ.minOf(flatK)), Math.abs(TQ.maxOf(flatK))) || 1;
        var vMax = Math.max(Math.abs(TQ.minOf(flatV)), Math.abs(TQ.maxOf(flatV))) || 1;

        var kPanel = TQ.el("div", { class: "tq-panel tq-grow" },
          cacheHeat(K_all, "K-cache  (dk=" + dk + " × " + t + " tokens)", kMax),
          TQ.note("Each click appends ONE column — the newest token's key. Past columns never change color: the past is frozen.")
        );
        var vPanel = TQ.el("div", { class: "tq-panel tq-grow" },
          cacheHeat(V_all, "V-cache  (dk=" + dk + " × " + t + " tokens)", vMax),
          TQ.note(mode === "recompute"
            ? "Recompute-all mode: every step re-derives K and V for ALL " + t + " tokens (the whole cache, not just the new column)."
            : "With-cache mode: only the new column is computed; the rest is read straight from memory.")
        );
        cacheWrap.appendChild(kPanel);
        cacheWrap.appendChild(vPanel);
      }

      function renderAttention() {
        attnWrap.innerHTML = "";
        var q = Q_all[t - 1];                  // newest query
        var scores = [], j;
        for (j = 0; j < t; j++) scores.push(TQ.dot(q, K_all[j]));
        var inv = 1 / Math.sqrt(dk);
        var scaled = scores.map(function (s) { return s * inv; });
        var weights = TQ.softmax(scaled);      // length t — automatically causal
        var labels = [];
        for (j = 0; j < t; j++) labels.push(tokens[j]);

        attnWrap.appendChild(TQ.el("div", { class: "tq-heatmap-title",
          text: "Attention of the newest query  q(" + tokens[t - 1] + ")  over the cache" }));
        attnWrap.appendChild(TQ.barRow(weights, {
          labels: labels, max: 1, format: function (v) { return TQ.fmt(v, 3); },
          highlight: t - 1
        }));
        attnWrap.appendChild(TQ.note(
          "Weights are non-zero only on positions ≤ " + (t - 1) + " (causal): there is no row for future tokens, " +
          "so they can't be attended to. Earlier tokens' queries are gone — we never recompute them."
        ));
      }

      function renderWork() {
        workWrap.innerHTML = "";
        var ratio = cacheWork > 0 ? (recomputeWork / cacheWork) : 1;
        var perStepRecompute = t; // this step's recompute-all cost
        var savedThisStep = perStepRecompute - 1;

        var cacheStat = TQ.el("div", { class: "tq-kv-stat" + (mode === "cache" ? " is-active" : "") },
          TQ.el("span", { class: "tq-stat-cap", text: "with cache — K/V projections" + (mode === "cache" ? " ◀ active" : "") }),
          TQ.el("span", { class: "tq-stat-big", text: String(cacheWork) }),
          TQ.el("span", { class: "tq-kv-stat-sub", text: "+1 this step (only the new token)" })
        );
        var recomputeStat = TQ.el("div", { class: "tq-kv-stat" + (mode === "recompute" ? " is-active" : "") },
          TQ.el("span", { class: "tq-stat-cap", text: "recompute all — K/V projections" + (mode === "recompute" ? " ◀ active" : "") }),
          TQ.el("span", { class: "tq-stat-big", text: String(recomputeWork) }),
          TQ.el("span", { class: "tq-kv-stat-sub", text: "+" + perStepRecompute + " this step (re-did all " + t + ")" })
        );
        var ratioStat = TQ.el("div", { class: "tq-kv-stat is-ratio" },
          TQ.el("span", { class: "tq-stat-cap", text: "wasted work avoided" }),
          TQ.el("span", { class: "tq-stat-big", text: TQ.fmt(ratio, 2) + "×" }),
          TQ.el("span", { class: "tq-kv-stat-sub", text: "saved " + savedThisStep + " projection" + (savedThisStep === 1 ? "" : "s") + " this step" })
        );

        workWrap.appendChild(TQ.el("div", { class: "tq-kv-stat-grid" }, cacheStat, recomputeStat, ratioStat));

        // honest extrapolation to a long context
        var T = 1000;
        var bigRatio = (T + 1) / 2; // recompute T(T+1)/2 vs cache T  -> (T+1)/2
        workWrap.appendChild(TQ.note(
          "Extrapolating honestly: for T tokens recompute-all does T(T+1)/2 projections vs T with the cache → ratio (T+1)/2. " +
          "At T=" + T + " that's ~" + TQ.fmt(bigRatio, 0) + "× the K/V work avoided. The two curves are linear vs quadratic — they diverge fast."
        ));
      }

      function syncButtons() {
        genBtn.textContent = t >= N ? "Sentence complete ✓" : "Generate next token →";
        genBtn.disabled = t >= N;
        resetBtn.disabled = t <= 1;
      }

      function redraw() {
        recountWork();
        renderStrip();
        renderCaches();
        renderAttention();
        renderWork();
        syncButtons();
      }

      genBtn.addEventListener("click", function () {
        if (t >= N) return;
        t += 1;
        redraw();
      });
      resetBtn.addEventListener("click", function () {
        t = 1;
        redraw();
      });

      var controls = TQ.el("div", { class: "tq-controls-row tq-kv-controls" },
        genBtn, resetBtn,
        TQ.el("div", { class: "tq-kv-mode" },
          TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "mode"),
          modeSeg.el
        ),
        dkSlider.el
      );

      sandbox.appendChild(controls);
      sandbox.appendChild(legend);
      sandbox.appendChild(stripWrap);
      sandbox.appendChild(workWrap);
      sandbox.appendChild(cacheWrap);
      sandbox.appendChild(attnWrap);
      redraw();
      root.appendChild(sandbox);

      /* ----------------------------------------- causal mask grid (the rule) */
      var maskBlock = TQ.block(
        TQ.h(2, "Why \"only look left\" comes for free"),
        TQ.p(
          "The cache only ever holds positions ≤ ", TQ.math("t"),
          ", so softmaxing over it is automatically causal. During training (whole sequence at once) you instead apply a ",
          TQ.el("strong", { text: "causal mask" }), ": for query position ", TQ.math("i"),
          ", any future key ", TQ.math("j > i"),
          " is set to −∞ before softmax, so its weight is exactly 0. Below, warm cells are allowed (", TQ.math("j ≤ i"),
          "); dark cells are masked future positions."
        )
      );
      var mask = [];
      for (var mi = 0; mi < N; mi++) {
        var mrow = [];
        for (var mj = 0; mj < N; mj++) mrow.push(mj <= mi ? 1 : 0);
        mask.push(mrow);
      }
      maskBlock.appendChild(TQ.heatmap(mask, {
        title: "Causal mask  M[i][j] = 1 if j ≤ i else 0  (allowed vs −∞)",
        rowLabels: tokens, colLabels: tokens, cellSize: 40, min: 0, max: 1,
        format: function (v) { return v ? "✓" : "∅"; }
      }));
      maskBlock.appendChild(TQ.note(
        "Row = the querying token; column = the token it may read. Lower-triangular: each token sees itself and the past, " +
        "never the future. Dark (∅) cells become −∞ pre-softmax → weight 0."
      ));
      root.appendChild(maskBlock);

      /* -------------------------------- memory formula panel (bridge to L8/9) */
      root.appendChild(TQ.block(
        TQ.h(2, "The cache buys speed but costs memory — and that bill is the next two levels"),
        TQ.p(
          "Caching trades recompute for storage, and the storage grows with everything: ",
          TQ.math("cache_bytes = 2 · n_layers · seq_len · n_kv_heads · head_dim · bytes"),
          " (the 2 is K and V). It scales linearly with sequence length, so a 100k-token context is a genuinely large, " +
          "ever-growing tensor in GPU memory — often dwarfing the model weights for long contexts. ",
          "That's the real bottleneck of LLM serving: not FLOPs, but KV-cache memory."
        )
      ));

      var memBlock = TQ.block(
        TQ.h(3, "Feel the cache grow"),
        TQ.p("Move the sliders — the byte total is computed live from the standard formula. Watch it move linearly with every term.")
      );

      var mem = { layers: 32, seq: 8192, kvHeads: 32, headDim: 128, bytes: 2 };
      var memOut = TQ.el("div", { class: "tq-panel" });

      function fmtBytes(b) {
        var gb = b / (1024 * 1024 * 1024);
        if (gb >= 1) return TQ.fmt(gb, 2) + " GB";
        var mb = b / (1024 * 1024);
        return TQ.fmt(mb, 1) + " MB";
      }

      function updateMem() {
        memOut.innerHTML = "";
        var bytes = 2 * mem.layers * mem.seq * mem.kvHeads * mem.headDim * mem.bytes;
        memOut.appendChild(TQ.el("div", { class: "tq-kv-stat" },
          TQ.el("span", { class: "tq-stat-cap", text: "cache_bytes" }),
          TQ.el("span", { class: "tq-stat-big", text: fmtBytes(bytes) }),
          TQ.el("span", { class: "tq-kv-stat-sub",
            text: "2 × " + mem.layers + " × " + mem.seq + " × " + mem.kvHeads + " × " + mem.headDim + " × " + mem.bytes + " bytes" })
        ));
        memOut.appendChild(TQ.callout(
          "Levels 8–9 attack exactly the n_kv_heads and head_dim terms: MQA/GQA shrink n_kv_heads by sharing keys/values " +
          "across query heads, and MLA compresses K and V into a small shared latent. You can't appreciate those tricks until you've felt the cache grow."
        ));
      }

      var sLayers = TQ.slider({ min: 1, max: 96, step: 1, value: mem.layers, label: "n_layers",
        format: function (v) { return String(Math.round(v)); },
        onInput: function (v) { mem.layers = Math.round(v); updateMem(); } });
      var sSeq = TQ.slider({ min: 128, max: 131072, step: 128, value: mem.seq, label: "seq_len (tokens)",
        format: function (v) { return String(Math.round(v)); },
        onInput: function (v) { mem.seq = Math.round(v); updateMem(); } });
      var sHeads = TQ.slider({ min: 1, max: 64, step: 1, value: mem.kvHeads, label: "n_kv_heads",
        format: function (v) { return String(Math.round(v)); },
        onInput: function (v) { mem.kvHeads = Math.round(v); updateMem(); } });
      var sHeadDim = TQ.slider({ min: 16, max: 256, step: 16, value: mem.headDim, label: "head_dim",
        format: function (v) { return String(Math.round(v)); },
        onInput: function (v) { mem.headDim = Math.round(v); updateMem(); } });
      var sBytes = TQ.slider({ min: 1, max: 4, step: 1, value: mem.bytes, label: "bytes/elem",
        format: function (v) { return String(Math.round(v)) + " (" + ({1: "fp8", 2: "fp16", 4: "fp32"}[Math.round(v)] || "?") + ")"; },
        onInput: function (v) { mem.bytes = Math.round(v); updateMem(); } });

      memBlock.appendChild(TQ.el("div", { class: "tq-kv-mem-controls" },
        sLayers.el, sSeq.el, sHeads.el, sHeadDim.el, sBytes.el));
      memBlock.appendChild(memOut);
      updateMem();
      root.appendChild(memBlock);

      /* ---------------------------------------------------- wrap-up takeaway */
      root.appendChild(TQ.block(
        TQ.h(2, "Carry this forward"),
        TQ.callout(
          "The KV cache turns quadratic K/V recompute into linear K/V work (attention scoring over the cache is still " +
          "O(t) per step — the cache attacks redundant projection and memory, not attention's intrinsic quadratic) — but it " +
          "creates a memory tensor that grows with context " +
          "length, layers, kv-heads, and head_dim. Shrinking that tensor is the whole job of MQA, GQA (Level 8) and MLA (Level 9)."
        )
      ));

      /* scoped styles — colors only via CSS variables, never hardcoded hex */
      injectOnce("tq-lvl07-css",
        ".tq-kv-controls{align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}" +
        ".tq-kv-mode{display:flex;flex-direction:column}" +
        ".tq-kv-strip{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}" +
        ".tq-kv-tok{display:inline-flex;flex-direction:column;align-items:center;gap:2px;" +
          "min-width:46px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;" +
          "background:var(--panel-hi);transition:opacity .2s,border-color .2s}" +
        ".tq-kv-tok.is-off{opacity:.32}" +
        ".tq-kv-tok.is-new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}" +
        ".tq-kv-tok-idx{font-size:10px;color:var(--ink-mute);font-family:var(--mono)}" +
        ".tq-kv-tok-word{font-size:15px;font-weight:700}" +
        ".tq-kv-caches{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-top:6px}" +
        ".tq-kv-work{margin:6px 0 10px}" +
        ".tq-kv-stat-grid{display:flex;gap:14px;flex-wrap:wrap}" +
        ".tq-kv-stat{display:flex;flex-direction:column;gap:2px;background:var(--panel-hi);" +
          "border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:180px;flex:1}" +
        ".tq-kv-stat.is-ratio{border-color:var(--accent)}" +
        ".tq-kv-stat.is-active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}" +
        ".tq-kv-stat-sub{font-size:11px;color:var(--ink-mute)}" +
        ".tq-kv-mem-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));" +
          "gap:12px 18px;margin:8px 0 14px}");
    },

    quiz: [
      {
        q: "During autoregressive generation with a KV cache, what does the model actually compute from scratch at each new step?",
        choices: [
          "The keys and values for all tokens seen so far",
          "Only the new token's query, key, and value; it reuses the cached keys/values for all past tokens",
          "Nothing — the entire output is read directly from the cache",
          "The full attention matrix for every pair of tokens in the sequence"
        ],
        answer: 1,
        explain: "Past tokens' keys/values don't change, so they're cached. Each step only projects the new token's q, k, v and attends q_t against the cached K and V."
      },
      {
        q: "Why are queries NOT stored in the KV cache, while keys and values are?",
        choices: [
          "Queries are too large to store",
          "A past token's query was only needed to produce that token's own output (already done); future tokens attend to past keys/values, never past queries",
          "Queries are recomputed faster than keys, so caching them is pointless",
          "Queries are identical across all tokens, so one copy suffices"
        ],
        answer: 1,
        explain: "Attention uses the NEW query against ALL past keys/values. Old queries have no future use once their token's output is computed, so only K and V are cached."
      },
      {
        q: "Generating T tokens, how does total key/value projection work compare with vs. without the cache?",
        choices: [
          "Both are about T — the cache saves memory, not compute",
          "Without cache ~T²/2 (recompute the whole prefix each step); with cache ~T (one new token per step) — a linear vs quadratic difference",
          "With cache is slower because of the lookup overhead",
          "Without cache ~T; with cache ~T²/2"
        ],
        answer: 1,
        explain: "Recomputing K/V for the length-t prefix each step sums to 1+2+...+T ≈ T²/2. Caching computes one new token's K/V per step → ~T total. The savings grow with context."
      },
      {
        q: "The KV cache fixes wasted recompute. What new problem does it create that levels 8–9 (MQA/GQA/MLA) exist to solve?",
        choices: [
          "It makes attention less accurate",
          "It requires recomputing queries instead",
          "Its memory grows linearly with context (2·n_layers·seq_len·n_kv_heads·head_dim·bytes), becoming the dominant cost for long contexts",
          "It breaks causal masking, letting tokens see the future"
        ],
        answer: 2,
        explain: "The cache trades compute for memory. Cache size scales with sequence length × layers × kv-heads × head_dim, so long contexts make it huge — MQA/GQA shrink n_kv_heads and MLA compresses K/V into a latent."
      }
    ]
  });

  // tiny helper local to this module (NOT a global): inject scoped CSS once.
  function injectOnce(id, css) {
    if (document.getElementById(id)) return;
    var s = document.createElement("style");
    s.id = id;
    s.textContent = css;
    document.head.appendChild(s);
  }
})();


/* ===== 08-mha-mqa-gqa.js ===== */
/* ============================================================================
 * LEVEL 08 — MHA → MQA → GQA: Sharing the KV   (order 8)
 * ----------------------------------------------------------------------------
 * Pattern (copied from 01-tokens-embeddings.js):
 *   - one IIFE, ONE TQ.registerLevel call, NO other globals
 *   - render() = short explanation blocks + PRIMARY interactive visualizations,
 *     every number genuinely computed from the live controls (plain real JS)
 *   - all color via TQ.colorFor / TQ.barRow / TQ.canvasPanel (one color language)
 *   - 2-4 quiz questions
 *
 * The math here is the KV-cache memory formula (exact, no fakes):
 *   cacheBytes(n_kv) = 2 (K&V) × layers × seq_len × n_kv × head_dim × bytes_per_elem
 *   MHA  : n_kv = n_q_heads
 *   GQA  : n_kv = g   (1 < g < n_q)
 *   MQA  : n_kv = 1
 *   savings vs MHA = 1 − n_kv / n_q_heads
 *
 * TWO linked primaries on a shared mode switch (MHA | GQA | MQA):
 *   (A) a query-heads → KV-heads WIRING diagram on a TQ.canvasPanel
 *   (B) a LIVE KV-cache calculator: sliders feed the real formula, three modes
 *       rendered as a TQ.barRow in GB/MB, plus a savings-% readout + the literal
 *       substituted formula string on screen.
 *
 * Structured on the axes (layers, seq, n_kv, head_dim, bytes) so L9 can add MLA
 * as another n_kv-equivalent (latent dim) bar on the same chart.
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "mha-mqa-gqa",
    order: 8,
    title: "MHA → MQA → GQA: Sharing the KV",
    icon: "🗜",
    tagline: "At long context the KV cache dominates memory — so let query heads share K/V.",
    preread: "Memory-Efficient Attention (core)",
    objectives: [
      "See the query-heads → KV-heads mapping for MHA (1:1), GQA (groups share), MQA (all share 1)",
      "Compute KV-cache memory live and watch it shrink as KV heads are shared",
      "Name the tradeoff: MQA cheapest but can degrade; GQA the sweet spot (Llama-2/3)"
    ],

    render: function (root) {
      /* ---------------------------------------------------- intro narrative */
      root.appendChild(TQ.block(
        TQ.h(2, "The KV cache is the new memory wall"),
        TQ.p(
          "At inference a transformer generates ", TQ.el("strong", { text: "one token at a time" }),
          ". For every new token, attention needs the Keys and Values of ",
          TQ.el("em", { text: "every previous token" }),
          " — recomputing them each step would be quadratic suicide. So we cache them: the ",
          TQ.el("strong", { text: "KV cache" }),
          ". It grows linearly with context length, and is stored per layer, for both K and V."
        ),
        TQ.el("div", { class: "tq-formula-banner" }, TQ.math(
          "KV bytes = 2 (K&V) × layers × seq_len × n_kv_heads × head_dim × bytes_per_elem"
        )),
        TQ.callout(
          "The load-bearing subtlety: cache size depends on the number of KEY/VALUE heads, " +
          "NOT the number of QUERY heads. Queries are computed fresh each step and thrown away — " +
          "they're never cached. Keys and Values are what you pay rent on. That asymmetry is the whole trick."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "Three ways to wire query heads to KV heads"),
        TQ.p(
          "Think back to grouped / depthwise convolution (splitting channels into independent groups) — ",
          "same structural move, different axis. Here we're grouping the ", TQ.el("strong", { text: "attention heads" }), "."
        ),
        TQ.el("ul", { class: "tq-mode-list" },
          TQ.el("li", {},
            TQ.el("strong", { text: "MHA (Multi-Head): " }),
            "n_kv = n_q. Every query head gets its own private K and V. Max expressiveness, max cache. 1:1."),
          TQ.el("li", {},
            TQ.el("strong", { text: "MQA (Multi-Query): " }),
            "n_kv = 1. ALL query heads share one K/V. Cache shrinks by a factor of n_q (e.g. 64×). " +
            "Cheapest — but funnelling every head through one key space can measurably hurt quality " +
            "(PaLM noted small-but-real degradation and training instability)."),
          TQ.el("li", {},
            TQ.el("strong", { text: "GQA (Grouped-Query): " }),
            "n_kv = g, with 1 < g < n_q. Query heads are partitioned into g groups; each shares one K/V. " +
            "It interpolates exactly between MHA (g = n_q) and MQA (g = 1). Llama-2 70B and Llama-3 use " +
            "GQA with 8 KV heads — the sweet spot. Savings vs MHA = ", TQ.math("1 − n_kv/n_q"), ".")
        )
      ));

      /* ============================================================ *
       *  SHARED MODE STATE + the two linked primaries
       * ============================================================ */

      // Discrete context-length stops (power-of-two tokens, clean GB numbers).
      var SEQ_STOPS = [4096, 8192, 16384, 32768, 65536, 131072, 262144];
      function seqLabel(n) {
        return (n >= 1024 ? (n / 1024) + "k" : n) + " tok";
      }

      // ---- live control state (read fresh from the widgets every recompute)
      var state = {
        mode: "GQA",
        layers: 80,
        seqIdx: 5,          // -> 131072 (128k)
        nq: 64,
        headDim: 128,
        bytes: 2,           // fp16
        g: 8                // GQA groups (snapped to a divisor of nq)
      };

      // TRUE divisors of nq (g must divide n_q so heads partition evenly into g
      // groups — that is the defining constraint of GQA). Always includes 1 and nq,
      // so the groups slider interpolates exactly from MQA (g=1) to MHA (g=n_q).
      function divisorStops(nq) {
        var out = [];
        for (var v = 1; v <= nq; v++) if (nq % v === 0) out.push(v);
        return out;
      }
      function snapToStops(val, stops) {
        var best = stops[0], bd = Infinity;
        for (var i = 0; i < stops.length; i++) {
          var d = Math.abs(stops[i] - val);
          if (d < bd) { bd = d; best = stops[i]; }
        }
        return best;
      }

      // ---- the real formula (plain JS, every factor live) ----------------
      function cacheBytes(n_kv) {
        var seq = SEQ_STOPS[state.seqIdx];
        return 2 * state.layers * seq * n_kv * state.headDim * state.bytes;
      }
      var GB = 1024 * 1024 * 1024;
      var MB = 1024 * 1024;
      function fmtBytes(b) {
        if (b >= GB) return TQ.fmt(b / GB, 1) + " GB";
        if (b >= MB) return TQ.fmt(b / MB, 1) + " MB";
        return TQ.fmt(b / 1024, 1) + " KB";
      }
      // n_kv for a given mode given current state
      function nkvFor(mode) {
        if (mode === "MHA") return state.nq;
        if (mode === "MQA") return 1;
        return TQ.clamp(state.g, 1, state.nq); // GQA
      }

      /* ----------------------------- (A) WIRING DIAGRAM (canvas) ---------- */
      var DRAW_CAP = 16; // cap drawn query heads for legibility; calc uses true counts

      var wiring = TQ.canvasPanel(420, 320, function (ctx, w, h) {
        var nqDrawn = Math.min(state.nq, DRAW_CAP);
        var nkvTrue = nkvFor(state.mode);
        // how many KV heads to actually draw, scaled to the drawn query count
        var ratio = nqDrawn / state.nq;            // fraction of heads shown
        var nkvDrawn = Math.max(1, Math.round(nkvTrue * ratio));
        if (state.mode === "MHA") nkvDrawn = nqDrawn;
        if (state.mode === "MQA") nkvDrawn = 1;

        var padTop = 44, padBot = 24;
        var leftX = 92, rightX = w - 92;
        var qSpan = h - padTop - padBot;
        var kSpan = h - padTop - padBot;

        function qy(i) { return padTop + (nqDrawn === 1 ? qSpan / 2 : (i / (nqDrawn - 1)) * qSpan); }
        function ky(j) { return padTop + (nkvDrawn === 1 ? kSpan / 2 : (j / (nkvDrawn - 1)) * kSpan); }

        // group index of drawn query head i -> drawn kv head index
        function kvOf(i) {
          if (state.mode === "MHA") return i;
          if (state.mode === "MQA") return 0;
          // GQA: partition the drawn heads into nkvDrawn contiguous groups
          var per = nqDrawn / nkvDrawn;
          return Math.min(nkvDrawn - 1, Math.floor(i / per));
        }

        // column captions
        ctx.font = "600 13px " + "ui-sans-serif, system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = TQ.cssVar("--ink-soft", 1, "#aab3cd");
        ctx.fillText("Query heads (n_q = " + state.nq + ")", leftX, 22);
        ctx.fillText("KV heads (n_kv = " + nkvTrue + ")", rightX, 22);

        // wires first (under the dots)
        ctx.lineWidth = 2;
        for (var i = 0; i < nqDrawn; i++) {
          var j = kvOf(i);
          var t = nkvDrawn <= 1 ? 0.5 : j / (nkvDrawn - 1);
          var col = TQ.colorFor(0.25 + 0.6 * t); // color by which KV group it joins
          ctx.strokeStyle = col;
          ctx.globalAlpha = 0.75;
          ctx.beginPath();
          ctx.moveTo(leftX + 9, qy(i));
          ctx.bezierCurveTo((leftX + rightX) / 2, qy(i), (leftX + rightX) / 2, ky(j), rightX - 9, ky(j));
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        // query dots (left)
        for (var qi = 0; qi < nqDrawn; qi++) {
          var jq = kvOf(qi);
          var tq = nkvDrawn <= 1 ? 0.5 : jq / (nkvDrawn - 1);
          ctx.fillStyle = TQ.colorFor(0.25 + 0.6 * tq);
          ctx.beginPath();
          ctx.arc(leftX, qy(qi), 7, 0, Math.PI * 2);
          ctx.fill();
        }
        // kv dots (right)
        for (var kj = 0; kj < nkvDrawn; kj++) {
          var tk = nkvDrawn <= 1 ? 0.5 : kj / (nkvDrawn - 1);
          ctx.fillStyle = TQ.colorFor(0.25 + 0.6 * tk);
          ctx.beginPath();
          ctx.arc(rightX, ky(kj), 9, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = TQ.cssVar("--ink", 0.35, "#e9edf8");
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        // footnote when we capped the drawing
        if (state.nq > DRAW_CAP) {
          ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
          ctx.fillStyle = TQ.cssVar("--ink-mute", 1, "#6f7aa0");
          ctx.textAlign = "center";
          ctx.fillText("showing " + nqDrawn + " of " + state.nq + " heads — pattern is identical", w / 2, h - 6);
        }
      });

      /* ----------------------------- (B) CALCULATOR ---------------------- */
      var barsHolder = TQ.el("div", { class: "tq-grow" });
      var savingsOut = TQ.el("div", { class: "tq-kvcalc-savings" });
      var formulaOut = TQ.el("div", { class: "tq-kvcalc-formula" });

      function modeIndex(mode) { return mode === "MHA" ? 0 : (mode === "GQA" ? 1 : 2); }

      function recompute() {
        var nq = state.nq;
        var g = TQ.clamp(state.g, 1, nq);
        var mhaB = cacheBytes(nq);
        var gqaB = cacheBytes(g);
        var mqaB = cacheBytes(1);

        // ---- bars (real bytes -> GB, highlight selected mode) ----
        barsHolder.innerHTML = "";
        barsHolder.appendChild(TQ.barRow([mhaB, gqaB, mqaB], {
          labels: ["MHA", "GQA (g=" + g + ")", "MQA"],
          max: mhaB,
          highlight: modeIndex(state.mode),
          format: fmtBytes
        }));

        // ---- savings vs MHA for the selected mode ----
        var nkv = nkvFor(state.mode);
        var savings = (1 - nkv / nq) * 100;
        var selB = cacheBytes(nkv);
        savingsOut.innerHTML = "";
        savingsOut.appendChild(TQ.el("span", { class: "tq-stat-cap",
          text: state.mode + " cache (n_kv = " + nkv + ")" }));
        savingsOut.appendChild(TQ.el("span", { class: "tq-stat-big", text: fmtBytes(selB) }));
        savingsOut.appendChild(TQ.el("div", { class: "tq-kvcalc-savrow" },
          TQ.badge(TQ.fmt(savings, 1) + "% saved vs MHA",
            savings > 80 ? "good" : (savings > 1 ? "info" : "default")),
          TQ.el("span", { class: "tq-kvcalc-savnote",
            text: state.mode === "MHA" ? "baseline" : "= 1 − " + nkv + "/" + nq })
        ));

        // ---- literal substituted formula string ----
        var seq = SEQ_STOPS[state.seqIdx];
        formulaOut.innerHTML = "";
        formulaOut.appendChild(TQ.math(
          "2 × " + state.layers + " × " + seq + " × " + nkv + " × " +
          state.headDim + " × " + state.bytes + " = " + fmtBytes(selB)
        ));

        wiring.redraw();
      }

      // ---- mode switch (shared: redraws wiring AND highlights the bar) ----
      var modeSeg = TQ.segmented({
        options: [{ label: "MHA", value: "MHA" }, { label: "GQA", value: "GQA" }, { label: "MQA", value: "MQA" }],
        value: state.mode,
        onChange: function (v) {
          state.mode = v;
          groupsWrap.style.display = (v === "GQA") ? "" : "none";
          recompute();
        }
      });

      // ---- sliders -------------------------------------------------------
      var sLayers = TQ.slider({
        min: 4, max: 120, step: 4, value: state.layers, label: "Layers",
        format: function (v) { return String(Math.round(v)); },
        onInput: function (v) { state.layers = Math.round(v); recompute(); }
      });

      var sSeq = TQ.slider({
        min: 0, max: SEQ_STOPS.length - 1, step: 1, value: state.seqIdx, label: "Context length",
        format: function (v) { return seqLabel(SEQ_STOPS[Math.round(v)]); },
        onInput: function (v) { state.seqIdx = Math.round(v); recompute(); }
      });

      var sHeadDim = TQ.slider({
        min: 32, max: 256, step: 32, value: state.headDim, label: "head_dim",
        format: function (v) { return String(Math.round(v)); },
        onInput: function (v) { state.headDim = Math.round(v); recompute(); }
      });

      // groups slider (only meaningful in GQA) — snaps to power-of-two divisors of nq
      var sGroups = TQ.slider({
        min: 1, max: state.nq, step: 1, value: state.g, label: "KV groups (g)",
        format: function (v) { return String(snapToStops(Math.round(v), divisorStops(state.nq))); },
        onInput: function (v) {
          state.g = snapToStops(Math.round(v), divisorStops(state.nq));
          recompute();
        }
      });
      var groupsWrap = TQ.el("div", { class: "tq-grow" }, sGroups.el);
      groupsWrap.style.display = (state.mode === "GQA") ? "" : "none";

      // query-heads slider — re-clamps groups when nq changes
      var sNq = TQ.slider({
        min: 8, max: 128, step: 8, value: state.nq, label: "Query heads (n_q)",
        format: function (v) { return String(Math.round(v)); },
        onInput: function (v) {
          state.nq = Math.round(v);
          // re-snap g to a valid divisor of the new nq, keep it ≤ nq
          var stops = divisorStops(state.nq);
          state.g = snapToStops(TQ.clamp(state.g, 1, state.nq), stops);
          sGroups.set(state.g);
          // rebuild groups slider range to new nq (cheap: replace its max)
          var inp = sGroups.el.querySelector(".tq-slider-input");
          if (inp) { inp.max = String(state.nq); inp.value = String(state.g); }
          recompute();
        }
      });

      // ---- bytes/elem toggle (fp16 / fp8) --------------------------------
      var bytesSeg = TQ.segmented({
        options: [{ label: "fp16 (2 B)", value: 2 }, { label: "fp8 (1 B)", value: 1 }],
        value: state.bytes,
        onChange: function (v) { state.bytes = v; recompute(); }
      });

      /* ----------------------------- assemble the calculator block ------- */
      var legend = TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "less cache" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "more cache" })
      );

      var calcBlock = TQ.block(
        TQ.h(2, "Live KV-cache calculator"),
        TQ.p(
          "Pick a mode, then drag the knobs. Every bar is the real formula computed in plain JS. ",
          "Bars are GB of cache for ", TQ.el("strong", { text: "one sequence" }),
          ", relative to MHA (the longest bar)."
        ),
        TQ.el("div", { class: "tq-kvcalc-modebar" },
          TQ.el("span", { class: "tq-slider-label", text: "Attention variant" }),
          modeSeg.el
        ),
        TQ.el("div", { class: "tq-flexrow tq-kvcalc-main" },
          // left: wiring diagram

          TQ.el("li", {}, "Drag ", TQ.el("strong", { text: "Query heads" }),
            " up while in MQA mode: the MQA bar does NOT budge. Cache tracks KV heads, not query heads — " +
            "queries are recomputed and discarded each step, never cached. (MHA's bar, where n_kv = n_q, does grow.)"),
          TQ.el("li", {}, "In GQA, sweep ", TQ.el("strong", { text: "KV groups (g)" }),
            " from 1 to n_q: the GQA bar slides continuously from sitting on top of MQA to sitting on top of MHA. " +
            "GQA is literally a dial between the two; savings = 1 − g/n_q."),
          TQ.el("li", {}, "Flip ", TQ.el("strong", { text: "fp16 → fp8" }),

          "the KV cache, not the parameters, is what bounds context length and batch size in production."

      /* small scoped styles — colors come from CSS variables only, no hex */
      injectOnce("tq-lvl08-css",

          "border:1px solid var(--line);border-radius:10px;text-align:center}" +

        ".tq-kvcalc-bars{display:flex;flex-direction:column;gap:14px;min-width:300px;justify-content:flex-start}" +
        ".tq-kvcalc-savings{display:flex;flex-direction:column;gap:4px}" +

        ".tq-kvcalc-savnote{font-family:var(--mono);font-size:12px;color:var(--ink-mute)}" +

    },

        choices: [

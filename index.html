    });

    var main = TQ.el("main", { class: "tq-main" }, hero, grid,
      TQ.el("div", { class: "tq-map-foot" },
        HAS_STORAGE ? null : TQ.note("Storage is blocked (you're on file://) — the game runs fine, but progress won't be saved between reloads.")
      )
    );
    wrap.appendChild(main);
    mount(wrap);
  }

  // ---- QUIZ ----------------------------------------------------------------
  function renderQuiz(container, level, onPass) {
    var quiz = level.quiz || [];
    var answers = {};            // qIndex -> chosen index
    var locked = {};             // qIndex -> bool (answered/locked)

    var card = TQ.el("div", { class: "tq-quiz" });
    card.appendChild(TQ.el("h3", { class: "tq-quiz-h" },
      TQ.el("span", { text: "Check Understanding" }),
      TQ.el("span", { class: "tq-quiz-count", text: quiz.length + (quiz.length === 1 ? " question" : " questions") })
    ));

    var status = TQ.el("div", { class: "tq-quiz-status", text: "Answer all questions to pass and unlock the next level." });

    function refreshStatus() {
      var answered = 0, correct = 0;
      for (var i = 0; i < quiz.length; i++) {
        if (locked[i]) { answered++; if (answers[i] === quiz[i].answer) correct++; }
      }
      if (answered < quiz.length) {
        status.className = "tq-quiz-status";
        status.textContent = answered + " / " + quiz.length + " answered — " + correct + " correct so far.";
        passBtn.disabled = true;
      } else if (correct === quiz.length) {
        status.className = "tq-quiz-status is-pass";
        status.textContent = "Perfect — " + correct + " / " + quiz.length + ". You may advance.";
        passBtn.disabled = false;
      } else {
        status.className = "tq-quiz-status is-fail";
        status.textContent = correct + " / " + quiz.length + " correct. Review the explanations, then retry the misses.";
        passBtn.disabled = true;
      }
    }

    quiz.forEach(function (item, qi) {
      var qEl = TQ.el("div", { class: "tq-q" });
      qEl.appendChild(TQ.el("div", { class: "tq-q-text" },
        TQ.el("span", { class: "tq-q-num", text: "Q" + (qi + 1) }),
        TQ.el("span", { text: item.q })
      ));
      var choicesEl = TQ.el("div", { class: "tq-q-choices" });
      var explainEl = TQ.el("div", { class: "tq-q-explain" });

      item.choices.forEach(function (choice, ci) {
        var btn = TQ.el("button", { class: "tq-choice", type: "button" },
          TQ.el("span", { class: "tq-choice-key", text: String.fromCharCode(65 + ci) }),
          TQ.el("span", { class: "tq-choice-text", text: choice })
        );
        btn.addEventListener("click", function () {
          if (locked[qi]) return;
          locked[qi] = true;
          answers[qi] = ci;
          var isRight = ci === item.answer;
          // mark this choice + reveal the correct one; lock all
          var allBtns = choicesEl.querySelectorAll(".tq-choice");
          for (var b = 0; b < allBtns.length; b++) {
            allBtns[b].disabled = true;
            if (b === item.answer) allBtns[b].classList.add("is-correct");
          }
          if (!isRight) btn.classList.add("is-wrong");
          // icon + text — never color alone
          btn.appendChild(TQ.el("span", { class: "tq-choice-mark", text: isRight ? "✓" : "✗" }));
          explainEl.className = "tq-q-explain is-shown " + (isRight ? "is-right" : "is-wrong");
          explainEl.appendChild(TQ.el("span", { class: "tq-explain-tag", text: isRight ? "Correct" : "Not quite" }));
          explainEl.appendChild(TQ.el("span", { text: item.explain }));
          refreshStatus();
        });
        choicesEl.appendChild(btn);
      });

      qEl.appendChild(choicesEl);
      qEl.appendChild(explainEl);
      card.appendChild(qEl);
    });

    var passBtn = TQ.el("button", { class: "tq-btn tq-btn-accent tq-quiz-pass", type: "button", text: "Complete level →" });
    passBtn.disabled = true;
    passBtn.addEventListener("click", function () { onPass(); });

    card.appendChild(status);
    card.appendChild(TQ.el("div", { class: "tq-quiz-actions" }, passBtn));
    container.appendChild(card);
    refreshStatus();
  }

  // ---- LEVEL view ----------------------------------------------------------
  function renderLevel(levelId) {
    var levels = sortedLevels();
    var level = LEVELS_BY_ID[levelId];
    if (!level) { renderMap(); return; }
    var idx = -1;
    for (var i = 0; i < levels.length; i++) if (levels[i].id === levelId) { idx = i; break; }
    var progress = loadProgress();

    if (!isUnlocked(levels, idx, progress)) { renderMap(); return; }

    state.view = "level";
    state.levelId = levelId;

    var wrap = TQ.el("div", { class: "tq-app" });
    wrap.appendChild(buildTopBar(levels, progress));

    var backBtn = TQ.el("button", { class: "tq-btn tq-btn-ghost tq-back", type: "button", text: "‹ Map" });
    backBtn.addEventListener("click", function () { goMap(); });

    var head = TQ.el("div", { class: "tq-level-head" },
      TQ.el("div", { class: "tq-level-head-top" },
        backBtn,
        TQ.el("span", { class: "tq-level-icon", text: level.icon || "•" }),
        TQ.el("div", { class: "tq-level-titles" },
          TQ.el("h1", { class: "tq-level-title", text: "Lv " + level.order + " · " + level.title }),
          TQ.el("div", { class: "tq-level-tagline", text: level.tagline || "" })
        ),
        TQ.badge(level.preread || "", "info")
      )
    );

    if (level.objectives && level.objectives.length) {
      var objList = TQ.el("ul", { class: "tq-objectives" });
      level.objectives.forEach(function (o) {
        objList.appendChild(TQ.el("li", { class: "tq-objective" },
          TQ.el("span", { class: "tq-objective-mark", text: "◆", "aria-hidden": "true" }),
          TQ.el("span", { text: o })
        ));
      });
      head.appendChild(TQ.el("div", { class: "tq-objectives-wrap" },
        TQ.el("div", { class: "tq-objectives-label", text: "In this level you'll" }), objList));
    }

    var lessonEl = TQ.el("div", { class: "tq-lesson" });
    try {
      level.render(lessonEl);
    } catch (err) {
      console.error("Level render failed:", levelId, err);
      lessonEl.appendChild(TQ.callout("This level hit a snag while rendering. (" + (err && err.message) + ")"));
    }

    var quizWrap = TQ.el("div", { class: "tq-quiz-wrap" });
    renderQuiz(quizWrap, level, function () {
      var p = loadProgress();
      var firstTime = !p.completed[level.id];
      p.completed[level.id] = true;
      if (firstTime) p.xp += XP_PER_LEVEL;
      saveProgress(p);
      showCompletion(level, levels, idx);
    });

    var main = TQ.el("main", { class: "tq-main tq-level-main" }, head, lessonEl, quizWrap);
    wrap.appendChild(main);
    mount(wrap);
  }

  // Sync the persistent top bar (progress fill, % chip, XP) to current
  // progress without a full re-render — so the reward shows the moment the
  // completion modal opens, not only after returning to the map.
  function refreshTopBar() {
    if (!appRoot) return;
    var p = loadProgress();
    var pct = progressPct(sortedLevels(), p);
    var fill = appRoot.querySelector(".tq-progress-fill");
    if (fill) fill.style.width = pct + "%";
    var pctChip = appRoot.querySelector(".tq-pct");
    if (pctChip) pctChip.textContent = pct + "%";
    var xpNum = appRoot.querySelector(".tq-xp-num");
    if (xpNum) xpNum.textContent = p.xp + " XP";
  }

  // ---- Completion interstitial --------------------------------------------
  function showCompletion(level, levels, idx) {
    var progress = loadProgress();
    var isLast = idx === levels.length - 1;
    var nextLevel = isLast ? null : levels[idx + 1];

    // reflect the freshly-awarded XP / progress in the header immediately
    refreshTopBar();

    var overlay = TQ.el("div", { class: "tq-overlay" });
    var confetti = TQ.el("div", { class: "tq-confetti", "aria-hidden": "true" });
    for (var c = 0; c < 28; c++) {
      var piece = TQ.el("span", { class: "tq-confetti-bit" });
      piece.style.left = (Math.round((c / 28) * 100)) + "%";
      piece.style.animationDelay = (((c % 7) * 90)) + "ms";
      piece.style.background = TQ.colorFor((c % 7) / 6);
      confetti.appendChild(piece);
    }

    var actions = TQ.el("div", { class: "tq-complete-actions" });
    if (nextLevel) {
      var nextBtn = TQ.el("button", { class: "tq-btn tq-btn-accent", type: "button",
        text: "Next: " + nextLevel.title + " →" });
      nextBtn.addEventListener("click", function () { goLevel(nextLevel.id); });
      actions.appendChild(nextBtn);
    }
    var mapBtn = TQ.el("button", { class: "tq-btn tq-btn-ghost", type: "button", text: "Back to map" });
    mapBtn.addEventListener("click", function () { goMap(); });
    actions.appendChild(mapBtn);

    var modal = TQ.el("div", { class: "tq-complete" },
      confetti,
      TQ.el("div", { class: "tq-complete-icon", text: isLast ? "🏁" : (level.icon || "✓") }),
      TQ.el("h2", { class: "tq-complete-title", text: isLast ? "Quest complete!" : "Level complete!" }),
      TQ.el("p", { class: "tq-complete-sub", text: isLast
        ? "You've connected the whole chain — from embeddings to MLA. Go ship something memory-efficient."
        : "Nice. " + level.title + " cleared." }),
      TQ.el("div", { class: "tq-complete-xp" },
        TQ.badge("+" + XP_PER_LEVEL + " XP", "good"),
        TQ.el("span", { class: "tq-complete-total", text: "Total: " + progress.xp + " XP" })
      ),
      actions
    );
    overlay.appendChild(modal);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) goMap(); });
    appRoot.appendChild(overlay);
  }

  // ---- navigation ----------------------------------------------------------
  function goMap() { renderMap(); }
  function goLevel(id) { renderLevel(id); }

  TQ.goMap = goMap;
  TQ.goLevel = goLevel;

  // expose a tiny bit of read-only introspection for debugging
  TQ._levels = function () { return sortedLevels(); };
  TQ.hasStorage = function () { return HAS_STORAGE; };

  function boot() {
    appRoot = document.getElementById("app");
    if (!appRoot) {
      appRoot = TQ.el("div", { id: "app" });
      document.body.appendChild(appRoot);
    }
    if (!LEVELS.length) {
      appRoot.appendChild(TQ.callout("No levels registered. Add level modules that call TQ.registerLevel(...)."));
      return;
    }
    renderMap();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  window.TQ = TQ;
})();

/* ===== 01-tokens-embeddings.js ===== */
/* ============================================================================
 * LEVEL 01 — Tokens & Embeddings   (order 1)  [REFERENCE / GOLD-STANDARD]
 * ----------------------------------------------------------------------------
 * The pattern every other level copies:
 *   - one IIFE, ONE TQ.registerLevel call, NO other globals
 *   - render() = short explanation blocks + at least one PRIMARY interactive
 *     visualization, every number genuinely computed via TQ math
 *   - all color via TQ.colorFor / TQ.heatmap / TQ.vectorView (one color language)
 *   - 2-4 quiz questions
 *
 * Math shown here, all real:
 *   - the shared toy sentence -> tokens -> TQ.toy.embeddings (16-dim vectors)
 *   - each token rendered as a TQ.vectorView (colored cells = vector components)
 *   - a full cosine-similarity matrix (TQ.cosine) shown as a clickable heatmap
 *   - a "compare two tokens" panel where the user picks A & B and watches the
 *     real dot product / norms / cosine update, building the intuition that
 *     "similar words = closer vectors".
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "tokens-embeddings",
    order: 1,
    title: "Tokens & Embeddings",
    icon: "🔠",
    tagline: "Text becomes numbers a network can actually do math on.",
    preread: "Illustrated Transformer (input side)",
    objectives: [
      "See how a sentence is split into tokens and each token becomes a learned vector",
      "Read an embedding as a row of numbers (here, 16 of them) — like a CNN feature vector, but for a word",
      "Use cosine similarity to feel that related words land in nearby directions"
    ],

    render: function (root) {
      var toy = TQ.toy;
      var tokens = toy.tokens;
      var emb = toy.embeddings;
      var d = toy.dModel;
      var n = tokens.length;

      /* -------------------------------------------------- intro narrative */
      root.appendChild(TQ.block(
        TQ.h(2, "From characters to vectors"),
        TQ.p(
          "A transformer never sees letters. The first thing it does is chop text into ",
          TQ.el("strong", { text: "tokens" }),
          " (roughly: words or word-pieces) and hand each token its own vector — an ",
          TQ.el("strong", { text: "embedding" }),
          ". You already know this shape of object: it's a learned feature vector, exactly like the ",
          "512-d descriptor popping out of a CNN before the classifier. The twist is that here the vector ",
          "stands for a piece of language, and it's looked up from a big trainable table — one row per vocabulary entry."
        ),
        TQ.p(
          "Our toy sentence for the whole game is fixed so you can build intuition without moving targets:"
        ),
        TQ.el("div", { class: "tq-token-strip" },
          tokens.map(function (tk, i) {
            return TQ.el("span", { class: "tq-token-chip" },
              TQ.el("span", { class: "tq-token-idx", text: "#" + i }),
              TQ.el("span", { class: "tq-token-word", text: tk })
            );
          })
        ),
        TQ.note("Tokenization here is one-token-per-word for clarity. Real tokenizers (BPE) " +
                "would split rarer words into sub-pieces — e.g. \"tokenization\" → \"token\" + \"ization\" — " +
                "but the idea is identical: every piece gets a vector.")
      ));

      /* -------------------------------------- each token as a colored vector */
      var vectorBlock = TQ.block(
        TQ.h(2, "An embedding is just a vector of numbers"),
        TQ.p(
          "Below, each token's ", TQ.math("d_model = " + d),
          "-dimensional embedding is drawn as a row of cells. Each cell is one component; its color is the ",
          TQ.el("strong", { text: "value" }),
          " on our shared scale (cool/dark = low, bright/warm = high). Same color language is used everywhere in this game."
        )
      );
      var legend = TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "low" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "high" })
      );
      vectorBlock.appendChild(legend);

      var vecList = TQ.el("div", { class: "tq-vec-list" });
      for (var vi = 0; vi < n; vi++) {
        vecList.appendChild(TQ.vectorView(emb[vi], { label: tokens[vi], cellSize: 24 }));
      }
      vectorBlock.appendChild(vecList);

      // Orienting diagram: text -> token ids -> vectors. Static SVG, inherits
      // theme colors via currentColor / CSS vars (no hardcoded hex).
      vectorBlock.appendChild(TQ.figure(
        '<svg viewBox="0 0 560 120" width="560" height="120" role="img" ' +
          'aria-label="Flow from text to token ids to embedding vectors" ' +
          'font-family="var(--mono)" font-size="13">' +
          '<defs><marker id="tq-l1-arrow" viewBox="0 0 10 10" refX="9" refY="5" ' +
            'markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
            '<path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>' +
          // stage 1: text
          '<text x="70" y="22" text-anchor="middle" fill="var(--ink-mute)" font-size="11">text</text>' +
          '<rect x="14" y="34" width="112" height="34" rx="7" fill="var(--panel-hi)" ' +
            'stroke="var(--line)"/>' +
          '<text x="70" y="56" text-anchor="middle" fill="var(--ink)">"The cat"</text>' +
          // stage 2: token ids
          '<text x="280" y="22" text-anchor="middle" fill="var(--ink-mute)" font-size="11">token ids</text>' +
          '<rect x="224" y="34" width="112" height="34" rx="7" fill="var(--panel-hi)" ' +
            'stroke="var(--line)"/>' +
          '<text x="280" y="56" text-anchor="middle" fill="var(--accent-2)">[464, 3797]</text>' +
          // stage 3: vectors
          '<text x="490" y="22" text-anchor="middle" fill="var(--ink-mute)" font-size="11">embeddings</text>' +
          '<g>' +
            '<rect x="434" y="34" width="14" height="14" rx="2" fill="var(--cool)"/>' +
            '<rect x="450" y="34" width="14" height="14" rx="2" fill="var(--info)"/>' +
            '<rect x="466" y="34" width="14" height="14" rx="2" fill="var(--accent)"/>' +
            '<rect x="482" y="34" width="14" height="14" rx="2" fill="var(--good)"/>' +
            '<rect x="498" y="34" width="14" height="14" rx="2" fill="var(--cool-deep)"/>' +
            '<rect x="514" y="34" width="14" height="14" rx="2" fill="var(--accent-2)"/>' +
            '<rect x="434" y="52" width="14" height="14" rx="2" fill="var(--accent)"/>' +
            '<rect x="450" y="52" width="14" height="14" rx="2" fill="var(--good)"/>' +
            '<rect x="466" y="52" width="14" height="14" rx="2" fill="var(--cool)"/>' +
            '<rect x="482" y="52" width="14" height="14" rx="2" fill="var(--accent-2)"/>' +
            '<rect x="498" y="52" width="14" height="14" rx="2" fill="var(--info)"/>' +
            '<rect x="514" y="52" width="14" height="14" rx="2" fill="var(--cool-deep)"/>' +
          '</g>' +
          // arrows + labels
          '<g stroke="currentColor" stroke-width="1.5" fill="none" color="var(--ink-faint)">' +
            '<line x1="130" y1="51" x2="218" y2="51" marker-end="url(#tq-l1-arrow)"/>' +
            '<line x1="340" y1="51" x2="428" y2="51" marker-end="url(#tq-l1-arrow)"/>' +
          '</g>' +
          '<text x="174" y="44" text-anchor="middle" fill="var(--ink-faint)" font-size="10">tokenize</text>' +
          '<text x="384" y="44" text-anchor="middle" fill="var(--ink-faint)" font-size="10">lookup</text>' +
        '</svg>',
        "The input pipeline: text is split into tokens, each token maps to an integer id, " +
        "and each id indexes one row of the embedding table to produce its vector."
      ));

      // Minimal, correct PyTorch: tokenize -> nn.Embedding lookup -> the token
      // vectors this level visualizes. Mirrors the toy (vocab→ids→rows of a table).
      vectorBlock.appendChild(TQ.code(
        "import torch\n" +
        "import torch.nn as nn\n" +
        "\n" +
        "# 1. tokenize: text -> integer ids (one row per vocabulary entry)\n" +
        "token_ids = torch.tensor([464, 3797, 3332, 319, 262, 2603])  # The cat sat on the mat\n" +
        "\n" +
        "# 2. the embedding table: a trainable (vocab_size x d_model) matrix\n" +
        "vocab_size, d_model = 50257, 16\n" +
        "embedding = nn.Embedding(vocab_size, d_model)\n" +
        "\n" +
        "# 3. lookup: each id selects its row -> (seq_len x d_model) vectors\n" +
        "vectors = embedding(token_ids)   # shape: (6, 16) — exactly what's drawn above\n" +
        "print(vectors.shape)             # torch.Size([6, 16])\n",
        { lang: "python", label: "embedding lookup",
          caption: "nn.Embedding is just a lookup table: id i returns row i. Those rows are the colored vectors above." }
      ));

      vectorBlock.appendChild(TQ.callout(
        "Notice \"The\" (#0) and \"the\" (#4) look almost identical — same word, near-identical vectors. " +
        "\"cat\" and \"mat\" share a family resemblance too. That visual similarity is the whole point: " +
        "meaning lives in the geometry."
      ));
      root.appendChild(vectorBlock);

      /* ------------------------------------- PRIMARY interactive: similarity */
      // Precompute the full cosine-similarity matrix (real TQ.cosine).
      var simMatrix = [];
      for (var r = 0; r < n; r++) {
        var rowSim = [];
        for (var c = 0; c < n; c++) rowSim.push(TQ.cosine(emb[r], emb[c]));
        simMatrix.push(rowSim);
      }

      var simBlock = TQ.block(
        TQ.h(2, "Do these vectors actually mean anything?"),
        TQ.p(
          "If embeddings are meaningful, related tokens should point in similar directions. We measure ",
          "direction-agreement with ", TQ.el("strong", { text: "cosine similarity" }), ": ",
          TQ.math("cos(a,b) = (a·b) / (‖a‖ ‖b‖)"),
          ". It ignores length and asks only \"how aligned?\" — ", TQ.el("strong", { text: "+1" }),
          " = same direction, ", TQ.el("strong", { text: "0" }), " = unrelated/orthogonal, ",
          TQ.el("strong", { text: "−1" }), " = opposite."
        ),
        TQ.p(
          TQ.el("strong", { text: "Click any cell" }),
          " in the matrix to break that pair down on the right. The diagonal is each token with itself, so it's always 1.00."
        )
      );

      // layout: heatmap (left) + breakdown panel (right)
      var detail = TQ.el("div", { class: "tq-panel tq-grow tq-sim-detail" });

      function renderDetail(i, j) {
        detail.innerHTML = "";
        var a = emb[i], b = emb[j];
        var dotv = TQ.dot(a, b);
        var na = TQ.norm(a), nb = TQ.norm(b);
        var cos = TQ.cosine(a, b);
        var verdict = cos > 0.85 ? ["Twins", "good"]
                    : cos > 0.5 ? ["Related", "info"]
                    : cos > 0.15 ? ["Loosely related", "default"]
                    : cos > -0.15 ? ["Basically unrelated", "default"]
                    : ["Opposed", "warn"];

        detail.appendChild(TQ.el("div", { class: "tq-sim-head" },
          TQ.el("span", { class: "tq-sim-pair" },
            TQ.el("strong", { text: tokens[i] }),
            TQ.el("span", { class: "tq-sim-vs", text: "·" }),
            TQ.el("strong", { text: tokens[j] })
          ),
          TQ.badge(verdict[0], verdict[1])
        ));

        detail.appendChild(TQ.vectorView(a, { label: tokens[i], cellSize: 18 }));
        detail.appendChild(TQ.vectorView(b, { label: tokens[j], cellSize: 18 }));

        detail.appendChild(TQ.el("div", { class: "tq-sim-stats" },
          TQ.kv("a · b", TQ.fmt(dotv, 2)),
          TQ.kv("‖a‖", TQ.fmt(na, 2)),
          TQ.kv("‖b‖", TQ.fmt(nb, 2))
        ));

        detail.appendChild(TQ.el("div", { class: "tq-sim-cos" },
          TQ.el("span", { class: "tq-stat-cap", text: "cosine similarity" }),
          TQ.el("span", { class: "tq-stat-big", text: TQ.fmt(cos, 3) })
        ));
        // a tiny bar so the magnitude is felt, mapped -1..1 -> 0..1
        detail.appendChild(TQ.barRow([cos], {
          labels: ["cos"], max: 1,
          format: function (v) { return TQ.fmt(v, 3); }
        }));

        if (i === j) {
          detail.appendChild(TQ.note("A vector compared with itself is perfectly aligned → cosine = 1.00. " +
            "That's why the diagonal glows brightest."));
        }
      }

      // We rebuild the (cheap 6x6) heatmap on each click so the selection
      // outline moves. The kernel's own onCell would survive a rebuild, but we
      // want full control of the selected-row/col props, so we wire clicks
      // ourselves via rewire() and leave onCell off the def.
      function buildHeat(selI, selJ) {
        return TQ.heatmap(simMatrix, {
          rowLabels: tokens, colLabels: tokens, cellSize: 46,
          min: -1, max: 1, // fix scale so colors mean the same thing as the formula range
          selectedRow: selI, selectedCol: selJ,
          format: function (v) { return TQ.fmt(v, 2); }
        });
      }
      var heat = buildHeat(1, 5);

      function rewire(node) {
        var cells = node.querySelectorAll(".tq-hm-cell");
        var k = 0;
        for (var rr = 0; rr < n; rr++) {
          for (var cc = 0; cc < n; cc++) {
            (function (i2, j2, cell) {
              cell.classList.add("is-clickable");
              cell.setAttribute("role", "button");
              cell.setAttribute("tabindex", "0");
              cell.addEventListener("click", function () { select(i2, j2); });
              cell.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i2, j2); }
              });
            })(rr, cc, cells[k]);
            k++;
          }
        }
      }

      var heatHolder = TQ.el("div", { class: "tq-grow" }, heat);

      function select(i, j) {
        var fresh = buildHeat(i, j);
        rewire(fresh);
        heatHolder.replaceChild(fresh, heatHolder.firstChild);
        renderDetail(i, j);
      }

      // initial wiring + first detail
      rewire(heat);
      renderDetail(1, 5);

      simBlock.appendChild(TQ.el("div", { class: "tq-flexrow tq-sim-row" }, heatHolder, detail));
      simBlock.appendChild(TQ.note(
        "These embeddings are deterministically generated for the lesson (seeded, with a little hand-built " +
        "semantic structure) so the geometry is legible. In a real model these numbers are learned by " +
        "gradient descent over billions of tokens — but they're read and used exactly like this."
      ));
      root.appendChild(simBlock);

      /* ----------------------------- secondary interactive: pick & compare */
      var pickBlock = TQ.block(
        TQ.h(2, "Play: pick two tokens"),
        TQ.p("Same machinery, driven by you. Choose token A and token B; the dot product, norms, and " +
             "cosine recompute live from the real vectors.")
      );

      var aSel = TQ.segmented({
        options: tokens.map(function (t, i) { return { label: t, value: i }; }),
        value: 1,
        onChange: function () { updatePick(); }
      });
      var bSel = TQ.segmented({
        options: tokens.map(function (t, i) { return { label: t, value: i }; }),
        value: 4,
        onChange: function () { updatePick(); }
      });
      var pickOut = TQ.el("div", { class: "tq-panel" });

      function updatePick() {
        var i = aSel.get(), j = bSel.get();
        pickOut.innerHTML = "";
        var cos = TQ.cosine(emb[i], emb[j]);
        pickOut.appendChild(TQ.el("div", { class: "tq-sim-cos" },
          TQ.el("span", { class: "tq-stat-cap", text: "cos( " + tokens[i] + " , " + tokens[j] + " )" }),
          TQ.el("span", { class: "tq-stat-big", text: TQ.fmt(cos, 3) })
        ));
        pickOut.appendChild(TQ.barRow([cos], { labels: ["cos"], max: 1, format: function (v) { return TQ.fmt(v, 3); } }));
        pickOut.appendChild(TQ.vectorView(emb[i], { label: tokens[i], cellSize: 18 }));
        pickOut.appendChild(TQ.vectorView(emb[j], { label: tokens[j], cellSize: 18 }));
      }

      pickBlock.appendChild(TQ.el("div", { class: "tq-flexcol", style: { gap: "12px" } },
        TQ.el("div", { class: "tq-controls-row" },

          TQ.el("div", {}, TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Token B"), bSel.el)
        ),

      /* ----------------------------------------------- go deeper (resources) */
      root.appendChild(TQ.resources("Go deeper — tokens & embeddings", [
        {
          label: "The Illustrated Word2Vec",
          url: "https://jalammar.github.io/illustrated-word2vec/",
          kind: "blog",
          note: "Jay Alammar's visual tour of how word vectors capture meaning — the geometry you just clicked through."
        },
        {
          label: "Tiktokenizer — see tokenization live",
          url: "https://tiktokenizer.vercel.app/",
          kind: "interactive",
          note: "Type any text and watch a real BPE tokenizer split it into token ids in your browser."

        {

        {

          url: "https://www.youtube.com/watch?v=zduSFxRajkE",
          kind: "video",
          note: "Builds a tokenizer from scratch, end to end — the step that produces the ids feeding nn.Embedding."
        }
      ]));

      /* --------------------------------------------------- wrap-up takeaway */
      root.appendChild(TQ.block(
        TQ.h(2, "Why this matters for what's coming"),
        TQ.p(
          "Everything downstream — attention, multi-head, the KV cache, MLA — operates on vectors like these. ",
          "Attention's core move is comparing vectors with dot products (you just did that by hand). ",
          "If two tokens are aligned, their dot product is large, and one will ", TQ.el("strong", { text: "attend" }),
          " to the other. That's the next level."
        ),
        TQ.callout("Mental model to carry forward: a token = a point/direction in a high-dimensional space, " +
                   "and \"meaning\" = where it sits relative to everything else.")
      ));

      /* small scoped styles this level needs (kept minimal; colors come from
         CSS variables only — no hardcoded hex here) */
      injectOnce("tq-lvl01-css",
        ".tq-token-strip{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}" +
        ".tq-token-chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;" +
          "background:var(--panel-hi);border:1px solid var(--line);border-radius:10px;padding:8px 14px}" +
        ".tq-token-idx{font-size:10px;color:var(--ink-mute);font-family:var(--mono)}" +
        ".tq-token-word{font-size:16px;font-weight:700}" +
        ".tq-vec-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}" +

    },

    quiz: [

  // tiny helper local to this module (NOT a global): inject scoped CSS once.
  function injectOnce(id, css) {

/* ============================================================================
 * LEVEL 02 — Why Attention? (Q/K/V)   (order 2)
 * ----------------------------------------------------------------------------
 * Same pattern as level 01:
 *   - one IIFE, ONE TQ.registerLevel call, NO other globals
 *   - render() = explanation blocks + a PRIMARY interactive "soft database
 *     lookup" bench, every number genuinely computed via TQ math
 *   - all color via TQ.colorFor / TQ.barRow / TQ.vectorView (one color language)
 *   - 4 quiz questions
 *
 * Math shown here, all real (from the shared toy sentence):
 *   - Q/K/V via TQ.toyQKV(8, 101, 202, 303)  (dk = 8)
 *   - for a chosen query i: scores_i[j] = TQ.dot(Q[i], K[j])
 *   - weights_i = TQ.softmax(scores_i)   <-- UNSCALED on purpose; the /sqrt(dk)
 *     scaling is deferred to level 3 (we mention it but do NOT apply it here, so
 *     the displayed weights match the "raw -> softmax" story). NOTE: we do NOT
 *     use TQ.attention().weights because that one divides by sqrt(dk).
 *   - output_i = sum_j weights_i[j] * V[j]
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "why-attention",
    order: 2,
    title: "Why Attention? (Q/K/V)",
    icon: "🔍",
    tagline: "A soft, differentiable database lookup: queries ask, keys advertise, values deliver.",
    preread: "Illustrated Transformer",
    objectives: [
      "Grasp attention as a soft key-value lookup BEFORE seeing the formula",
      "See that a Query·Key dot product is a 'how relevant?' score, and softmax turns scores into a blend",
      "Understand that the output is a weighted average of Values, not a hard pick"
    ],

    render: function (root) {
      var toy = TQ.toy;
      var tokens = toy.tokens;
      var n = tokens.length;
      var dk = 8;

      /* ----- derive Q/K/V deterministically (the documented convention) ----- */
      var qkv = TQ.toyQKV(dk, 101, 202, 303);
      var Q = qkv.Q, K = qkv.K, V = qkv.V; // each n x dk

      // Interactive state for the "See it" lookup (does NOT touch bench/stepper):
      //   curT    = softmax temperature for the CANVAS only (1.0 = canonical)
      //   pinnedKey = which Key/Value row is dissected (-1 = none)
      //   hoverKey  = transient hover row (-1 = none)
      var curT = 1.0;
      var pinnedKey = -1;
      var hoverKey = -1;

      // For a query index i: raw scores against every key, then UNSCALED softmax.
      function scoresFor(i) {
        var s = [];
        for (var j = 0; j < n; j++) s.push(TQ.dot(Q[i], K[j]));
        return s;
      }
      function weightsFor(i) {
        return TQ.softmax(scoresFor(i)); // softmax on RAW scores (no /sqrt(dk))
      }
      // Tempered weights for the canvas: divide raw scores by T, THEN softmax.
      // T = 1 reproduces weightsFor(i) exactly, so the bench/stepper stay canonical.
      function tempWeightsFor(i, T) {
        var s = scoresFor(i);
        var ts = [];
        for (var j = 0; j < n; j++) ts.push(s[j] / T);
        return TQ.softmax(ts);
      }
      // output_i = sum_j w[j] * V[j]   (length dk)
      function outputFor(i) {
        var w = weightsFor(i);
        var out = TQ.zeros(dk);
        for (var j = 0; j < n; j++) {
          for (var c = 0; c < dk; c++) out[c] += w[j] * V[j][c];
        }
        return out;
      }
      function argmaxIdx(arr) {
        var bi = 0;
        for (var i = 1; i < arr.length; i++) if (arr[i] > arr[bi]) bi = i;
        return bi;
      }
      // Signed color scale for RAW scores so negatives read as cool/dark and
      // positives as warm/bright (TQ.barRow's bar LENGTH is |value|, so without
      // this a large negative score would look identical to a large positive one).
      function signedColorFn(scores) {
        var m = 0;
        for (var k = 0; k < scores.length; k++) m = Math.max(m, Math.abs(scores[k]));
        if (!m) m = 1;
        return function (v) { return TQ.colorForSigned(v, m); };
      }

      /* ----------------------------------------------- intro: the problem */
      root.appendChild(TQ.block(
        TQ.h(2, "The problem attention solves"),
        TQ.p(
          "A CNN mixes information ", TQ.el("strong", { text: "locally" }),
          " — a 3×3 kernel only sees its immediate neighbors, and you stack layers to slowly grow the ",
          TQ.el("em", { text: "receptive field" }), " (how far a layer can \"see\"). ",
          "Language doesn't respect locality: in ",
          TQ.el("em", { text: "\"the cat that the dog chased sat on the mat,\"" }),
          " the word that binds ", TQ.el("strong", { text: "sat" }), " to its subject is ",
          TQ.el("strong", { text: "cat" }), " — seven tokens back."
        ),
        TQ.p(
          TQ.el("strong", { text: "Attention" }),
          " is the transformer's answer: a layer where every token can pull information directly from every ",
          "other token in ", TQ.el("strong", { text: "one hop" }),
          " — and, crucially, it ", TQ.el("em", { text: "learns which ones matter" }),
          " instead of using a fixed stencil. No fixed receptive field, no recurrence ",
          "(processing tokens one-after-another like an RNN): just learned, ",
          "content-dependent routing of information."
        )
      ));

      /* ------------------------------------- mental model: database lookup */
      root.appendChild(TQ.block(
        TQ.h(2, "The mental model: a soft, differentiable database lookup"),
        TQ.p(
          "Think of a key-value store (a Python dict / hash map). You issue a ",
          TQ.el("strong", { text: "Query" }), "; you compare it against every ",
          TQ.el("strong", { text: "Key" }), "; the Key that matches hands back its ",
          TQ.el("strong", { text: "Value" }), ". Attention is the ",
          TQ.el("em", { text: "soft" }), " version of exactly this."
        ),
        TQ.p(
          "Each token emits three vectors, all linear projections of its embedding: a ",
          TQ.el("strong", { text: "Query" }), " (\"what am I looking for?\"), a ",
          TQ.el("strong", { text: "Key" }), " (\"what do I advertise / what am I about?\"), and a ",
          TQ.el("strong", { text: "Value" }), " (\"what I'll actually contribute if you pick me\"). ",
          "The lookup is fuzzy: instead of one Key winning, ", TQ.el("em", { text: "every" }),
          " Key gets a relevance score and the answer is a blend of all the Values weighted by those scores."
        ),
        TQ.callout(
          "Why \"differentiable\"? (Optional aside, if you've met training before.) A gradient is the slope the " +
          "network follows to improve a little at a time. A hard hash-map lookup (argmax = just pick the single " +
          "highest, a flat all-or-nothing choice) has no slope to follow, so it can't be trained by gradient " +
          "descent. A softmax blend changes smoothly as the weights shift — there's always a slope — which is " +
          "the whole reason attention is learnable end-to-end."
        ),
        TQ.note(
          "Q/K/V here are real: each is the toy embedding matrix times a distinct projection " +
          "(Wq, Wk, Wv = TQ.randMatrix with seeds 101 / 202 / 303), giving dk = " + dk + "-dim vectors."
        )
      ));

      /* ============================================================= *
       *  PRIMARY VISUAL — see Q/K/V: three role-vectors + the lookup
       *  they drive. This query selector also drives the bench + stepper.
       * ============================================================= */
      var querySel = TQ.segmented({
        options: tokens.map(function (t, i) { return { label: t, value: i }; }),
        value: 1, // default 'cat'
        onChange: function () { updateConcept(); updateBench(); }
      });

      var conceptBlock = TQ.block(
        TQ.h(2, "See it: three vectors, one lookup"),
        TQ.p(
          "Before any formula, here is the whole idea as a picture. Pick a ",
          TQ.el("strong", { text: "query token" }),
          " and watch two things: the three role-vectors it projects from its embedding, and the soft ",
          "lookup those vectors drive."
        )
      );
      conceptBlock.appendChild(TQ.el("div", { class: "tq-controls-row" },
        TQ.el("div", {},
          TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Query token  i"),
          querySel.el
        )
      ));

      // legend: what each of the three vectors MEANS
      conceptBlock.appendChild(TQ.el("div", { class: "tq-qkv-legend" },
        TQ.el("span", { class: "tq-qkv-chip is-q" }, TQ.el("b", { text: "🔍 Query" }), " — what am I looking for?"),
        TQ.el("span", { class: "tq-qkv-chip is-k" }, TQ.el("b", { text: "🏷️ Key" }), " — what do I advertise?"),
        TQ.el("span", { class: "tq-qkv-chip is-v" }, TQ.el("b", { text: "📦 Value" }), " — what do I deliver if picked?")
      ));

      // Part A — one embedding projected into Q, K, V (all real vectors)
      conceptBlock.appendChild(TQ.el("div", { class: "tq-wa-rowhead",
        text: "1 · one token → three role-vectors   (Q, K, V = embedding × Wq, Wk, Wv)" }));
      var projRegion = TQ.el("div", { class: "tq-panel tq-wa-region tq-qkv-proj" });
      conceptBlock.appendChild(projRegion);

      // Part B — the soft lookup, drawn (Query scores Keys -> softmax weights pull Values -> output)
      conceptBlock.appendChild(TQ.el("div", { class: "tq-wa-rowhead",
        text: "2 · the soft lookup: the Query scores every Key, softmax weights pull the Values into one blended output" }));
      var lookup = TQ.canvasPanel(680, 320, drawLookup);
      conceptBlock.appendChild(TQ.el("div", { class: "tq-panel tq-wa-region tq-qkv-canvaswrap" }, lookup.el));
      conceptBlock.appendChild(TQ.note(
        "Edge thickness = magnitude. Left edges are raw Q·K scores (cool = negative, warm = positive); right " +
        "edges are softmax weights (brighter = more of that Value flows into the output). The strongest match is " +
        "outlined in amber. Change the query and the whole picture re-routes — that is content-dependent attention. " +
        "Click any Key/Value row to dissect WHY it got its score."
      ));

      /* --- (B) softmax TEMPERATURE knob — canvas-only; bench stays canonical --- */
      var tempSlider = TQ.slider({
        min: 0.25, max: 4, step: 0.05, value: 1,
        label: "softmax temperature  T  (rescales scores before softmax)",
        format: function (v) { return "T = " + TQ.fmt(v, 2); },
        onInput: function (v) {
          curT = v;
          lookup.redraw();
          updateDissect();    // keep the panel's "vs softmax weight" readout live
          updateTempStatus(); // keep the near-hard / soft / flattening pill in sync with T
        }
      });
      var tempStatus = TQ.el("span", { class: "tq-qkv-tempstatus" });
      var tempRow = TQ.el("div", { class: "tq-controls-row tq-qkv-temprow" },
        TQ.el("div", { style: { flex: "1 1 320px" } }, tempSlider.el),
        tempStatus
      );
      conceptBlock.appendChild(tempRow);
      conceptBlock.appendChild(TQ.note(
        "Low T sharpens the blend toward a near-hard argmax; high T flattens it toward uniform 1/n = " +
        TQ.fmt(1 / n, 3) + ". Temperature touches only the RIGHT-side (weight) edges — the left Q·K scores " +
        "and the dissection below are unchanged, because T rescales relevance into a blend, it doesn't change " +
        "the relevance. This is exactly the knob Level 3 turns with /√dk."
      ));

      /* --- (A) the dissection panel: score = Q_i · K_j, proven on screen --- */
      var dissectPanel = TQ.el("div", { class: "tq-panel tq-wa-region tq-qkv-dissect" });
      conceptBlock.appendChild(dissectPanel);

      root.appendChild(conceptBlock);

      // Elementwise-product strip + summed dot product for query i vs key j.
      // Renders nothing-but-a-placeholder until the learner pins a key.
      function updateDissect() {
        var i = querySel.get();
        var j = pinnedKey;
        dissectPanel.innerHTML = "";
        if (j < 0) {
          dissectPanel.classList.add("is-empty");
          dissectPanel.appendChild(TQ.el("div", { class: "tq-qkv-dissect-empty" },
            TQ.el("span", { class: "tq-qkv-dissect-empty-mark", text: "↑", "aria-hidden": "true" }),
            TQ.el("span", { text: "Click a Key / Value row in the diagram to see WHY it got that score — " +
              "its Q·K dot product, assembled term by term." })
          ));
          return;
        }
        dissectPanel.classList.remove("is-empty");

        var qi = Q[i], kj = K[j];
        // elementwise products q_d · k_d — the score is literally their sum.
        var prod = [];
        for (var d = 0; d < dk; d++) prod.push(qi[d] * kj[d]);
        var score = TQ.dot(qi, kj);          // = TQ.sum(prod), by definition
        var sumProd = TQ.sum(prod);
        // shared signed magnitude so positive cells read warm, negative cool.
        var pm = TQ.maxOf(prod.map(function (x) { return Math.abs(x); })) || 1;

        // tempered weight for THIS key, at the canvas's current temperature.
        var tw = tempWeightsFor(i, curT);
        var topIdx = argmaxIdx(tw);

        dissectPanel.appendChild(TQ.el("div", { class: "tq-qkv-dissect-head" },
          TQ.el("span", { class: "tq-qkv-dissect-title" },
            "Why this score?  ",
            TQ.el("b", { class: "tq-qkv-dissect-q", text: "Q · " + tokens[i] }),
            "  •  ",
            TQ.el("b", { class: "tq-qkv-dissect-k", text: "K · " + tokens[j] })
          ),
          TQ.badge(j === topIdx ? "top key at T = " + TQ.fmt(curT, 2) : "key #" + j,
                   j === topIdx ? "good" : "default")
        ));

        // row 1 / row 2: the two role-vectors, side by side conceptually (stacked).
        dissectPanel.appendChild(TQ.vectorView(qi, {
          label: "Q · " + tokens[i] + "   (what \"" + tokens[i] + "\" looks for)", cellSize: 18
        }));
        dissectPanel.appendChild(TQ.vectorView(kj, {
          label: "K · " + tokens[j] + "   (what \"" + tokens[j] + "\" advertises)", cellSize: 18
        }));
        // row 3: the signed elementwise product strip — warm cells add, cool cells subtract.
        dissectPanel.appendChild(TQ.el("div", { class: "tq-qkv-prodwrap" },
          TQ.vectorView(prod, {
            label: "q_d × k_d  (per dim — these are summed)",
            cellSize: 18, showValues: true, max: pm
          })
        ));

        // the equation line: Σ of the strip IS the score the canvas edge encodes.
        dissectPanel.appendChild(TQ.el("div", { class: "tq-qkv-eqline" },
          TQ.math("Σ q_d·k_d  =  Q·K  =  " + TQ.fmt(score, 3)),
          TQ.el("span", { class: "tq-qkv-eqcheck",
            text: "(sum of the strip = " + TQ.fmt(sumProd, 3) + " ✓)" })
        ));
        dissectPanel.appendChild(TQ.el("div", { class: "tq-qkv-eqkvs" },
          TQ.kv("dot product Q·K", TQ.fmt(score, 3)),
          TQ.kv("vs softmax weight", TQ.fmt(tw[j], 3)),
          TQ.kv("at temperature", "T = " + TQ.fmt(curT, 2))
        ));
        dissectPanel.appendChild(TQ.note(
          "The warm cells (positive q_d·k_d) push the score up; the cool cells (negative) pull it down. " +
          "Their sum is the single number on the canvas edge — that is all a \"relevance score\" ever is."
        ));
      }

      // keep the temperature status pill (near-hard vs flattening) in sync.
      function updateTempStatus() {
        var i = querySel.get();
        var tw = tempWeightsFor(i, curT);
        var peak = TQ.maxOf(tw);
        var uniform = 1 / n;
        tempStatus.innerHTML = "";
        if (peak >= 0.6) {
          tempStatus.appendChild(TQ.badge("near-hard pick · peak " + TQ.fmt(peak, 2), "warn"));
        } else if (peak <= uniform * 1.6) {
          tempStatus.appendChild(TQ.badge("flattening → uniform " + TQ.fmt(uniform, 3), "info"));
        } else {
          tempStatus.appendChild(TQ.badge("soft blend · peak " + TQ.fmt(peak, 2), "default"));
        }
      }

      // builder for a single role card in Part A
      function roleCard(tag, name, ask, vec, cls) {
        return TQ.el("div", { class: "tq-qkv-card " + cls },
          TQ.el("div", { class: "tq-qkv-cardhead" },
            TQ.el("span", { class: "tq-qkv-tag", text: tag }),
            TQ.el("span", { class: "tq-qkv-name", text: name })
          ),
          TQ.el("div", { class: "tq-qkv-ask", text: ask }),
          TQ.vectorView(vec, { cellSize: 16 })
        );
      }

      function updateConcept() {
        var i = querySel.get();
        // Part A: embedding -> Q, K, V
        projRegion.innerHTML = "";
        projRegion.appendChild(TQ.el("div", { class: "tq-qkv-card is-emb" },
          TQ.el("div", { class: "tq-qkv-cardhead" },
            TQ.el("span", { class: "tq-qkv-tag", text: "emb" }),
            TQ.el("span", { class: "tq-qkv-name", text: "“" + tokens[i] + "”" })
          ),
          TQ.el("div", { class: "tq-qkv-ask", text: "the token's " + TQ.toy.dModel + "-dim embedding (Level 1)" }),
          TQ.vectorView(TQ.toy.embeddings[i], { cellSize: 13 })
        ));
        projRegion.appendChild(TQ.el("div", { class: "tq-qkv-arrow",
          html: "× W<sub>q</sub><br>× W<sub>k</sub><br>× W<sub>v</sub><br>➜" }));
        projRegion.appendChild(TQ.el("div", { class: "tq-qkv-roles" },
          roleCard("Q", "🔍 Query", "what “" + tokens[i] + "” is looking for", Q[i], "is-q"),
          roleCard("K", "🏷️ Key", "what “" + tokens[i] + "” advertises", K[i], "is-k"),
          roleCard("V", "📦 Value", "what “" + tokens[i] + "” delivers if picked", V[i], "is-v")
        ));
        // Part B: redraw the lookup diagram + refresh the dissection / temp status
        // for the (possibly newly-selected) query, re-dissecting any pinned key.
        lookup.redraw();
        updateDissect();
        updateTempStatus();
      }

      // Geometry shared by drawLookup AND the canvas hit-test, so a click maps to
      // the same row rectangle the canvas drew. Returns {rowY,tnx,tW,rowH,top0,bot}.
      function lookupGeom(w, h) {
        var top0 = 56, bot = h - 16;
        var rowH = (bot - top0) / n;
        var tnx = Math.round(w * 0.47);
        var tW = 122;
        return { top0: top0, bot: bot, rowH: rowH, tnx: tnx, tW: tW };
      }
      // Which Key/Value row (if any) does a canvas-local (x,y) fall on? -1 = none.
      // We give the clickable band a generous height (full rowH) so the whole
      // lane — node + its score/weight numbers — is a target.
      function hitTestRow(x, y, w, h) {
        var g = lookupGeom(w, h);
        if (x < g.tnx - g.tW / 2 - 56 || x > g.tnx + g.tW / 2 + 64) return -1;
        for (var j = 0; j < n; j++) {
          var cy = g.top0 + g.rowH * j + g.rowH / 2;
          if (y >= cy - g.rowH / 2 && y <= cy + g.rowH / 2) return j;
        }
        return -1;
      }

      // canvas: the soft lookup for the currently selected query
      function drawLookup(ctx, w, h) {
        var i = querySel.get();
        var scores = scoresFor(i);
        // RIGHT-side edges use the TEMPERED weights (canvas-only). curT = 1 gives
        // the canonical weightsFor(i) exactly, so the default picture is unchanged.
        var weights = tempWeightsFor(i, curT);
        var maxAbs = 1, maxW = 1e-6, j;
        for (j = 0; j < n; j++) { maxAbs = Math.max(maxAbs, Math.abs(scores[j])); maxW = Math.max(maxW, weights[j]); }
        var top = argmaxIdx(weights);

        var ink     = TQ.cssVar("--ink", 1, "#e9edf8");
        var mute    = TQ.cssVar("--ink-mute", 1, "#6f7aa0");
        var soft    = TQ.cssVar("--ink-soft", 1, "#aab3cd");
        var line    = TQ.cssVar("--line", 1, "#25304f");
        var panel   = TQ.cssVar("--panel", 1, "#131a2c");
        var panelHi = TQ.cssVar("--panel-hi", 1, "#1d2747");
        var accent  = TQ.cssVar("--accent", 1, "#f2a93b");
        var good    = TQ.cssVar("--good", 1, "#46d39a");
        var mono    = TQ.cssVar("--mono", 1, "ui-monospace, monospace");
        var font    = TQ.cssVar("--font", 1, "system-ui, sans-serif");

        var top0 = 56, bot = h - 16;
        var rowH = (bot - top0) / n;
        function rowY(k) { return top0 + rowH * k + rowH / 2; }
        var qx = 86, tnx = Math.round(w * 0.47), ox = w - 92;
        var qW = 108, qH = 46, tW = 122, tH = Math.min(30, rowH - 10), oW = 104, oH = 48;
        var cy = (rowY(0) + rowY(n - 1)) / 2;

        function rr(x, y, ww, hh, r) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + ww, y, x + ww, y + hh, r);
          ctx.arcTo(x + ww, y + hh, x, y + hh, r);
          ctx.arcTo(x, y + hh, x, y, r);
          ctx.arcTo(x, y, x + ww, y, r);
          ctx.closePath();
        }

        // column mini-headers
        ctx.textBaseline = "middle";
        ctx.textAlign = "center";
        ctx.font = "10px " + mono;
        ctx.fillStyle = mute;
        ctx.fillText("Q·K  score", (qx + tnx) / 2, 20);
        ctx.fillText("KEYS · VALUES", tnx, 20);
        ctx.fillText("softmax weight", (tnx + ox) / 2, 20);

        // edges (drawn under the nodes)
        for (j = 0; j < n; j++) {
          var y = rowY(j);
          var sNorm = Math.abs(scores[j]) / maxAbs;
          var wNorm = weights[j] / maxW;
          // left: query -> key, width by |score|, signed color
          ctx.strokeStyle = TQ.colorForSigned(scores[j], maxAbs);
          ctx.globalAlpha = 0.28 + 0.55 * sNorm;
          ctx.lineWidth = 1 + 8 * sNorm;
          var x0 = qx + qW / 2, x1 = tnx - tW / 2, mx = (x0 + x1) / 2;
          ctx.beginPath();
          ctx.moveTo(x0, cy);
          ctx.bezierCurveTo(mx, cy, mx, y, x1, y);
          ctx.stroke();
          // right: key -> output, width by weight, brightness by weight
          ctx.strokeStyle = TQ.colorFor(0.18 + 0.82 * wNorm);
          ctx.globalAlpha = 0.30 + 0.6 * wNorm;
          ctx.lineWidth = 1 + 11 * wNorm;
          var x2 = tnx + tW / 2, x3 = ox - oW / 2, mx2 = (x2 + x3) / 2;
          ctx.beginPath();
          ctx.moveTo(x2, y);
          ctx.bezierCurveTo(mx2, y, mx2, cy, x3, cy);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        // token (Key/Value) nodes + per-row score & weight numbers
        for (j = 0; j < n; j++) {
          var yy = rowY(j);
          var isTop = j === top;
          var isPinned = j === pinnedKey;
          var isHover = j === hoverKey;
          // subtle full-lane highlight for the pinned/hovered row (drawn first).
          if (isPinned || isHover) {
            rr(tnx - tW / 2 - 52, yy - rowH / 2 + 2, tW + 116, rowH - 4, 8);
            ctx.fillStyle = TQ.cssVar("--accent", isPinned ? 0.1 : 0.05, "#f2a93b");
            ctx.fill();
          }
          rr(tnx - tW / 2, yy - tH / 2, tW, tH, 8);
          ctx.fillStyle = panel; ctx.fill();
          ctx.lineWidth = (isTop || isPinned) ? 2 : 1;
          ctx.strokeStyle = (isTop || isPinned) ? accent : line; ctx.stroke();
          // amber selection ring so canvas + dissection panel stay visually linked.
          if (isPinned) {
            rr(tnx - tW / 2 - 4, yy - tH / 2 - 4, tW + 8, tH + 8, 10);
            ctx.lineWidth = 2;
            ctx.strokeStyle = TQ.cssVar("--accent", 0.9, "#f2a93b");
            ctx.setLineDash([4, 3]);
            ctx.stroke();
            ctx.setLineDash([]);
          }
          ctx.fillStyle = ink;
          ctx.font = (isTop ? "bold " : "") + "13px " + font;
          ctx.textAlign = "center";
          ctx.fillText(tokens[j], tnx, yy);
          ctx.font = "11px " + mono;
          ctx.textAlign = "right"; ctx.fillStyle = soft;
          ctx.fillText(scores[j].toFixed(2), tnx - tW / 2 - 8, yy);
          ctx.textAlign = "left"; ctx.fillStyle = isTop ? accent : soft;
          ctx.fillText(weights[j].toFixed(3), tnx + tW / 2 + 8, yy);
        }

        // query node (left)
        rr(qx - qW / 2, cy - qH / 2, qW, qH, 10);
        ctx.fillStyle = panelHi; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = accent; ctx.stroke();
        ctx.textAlign = "center";
        ctx.fillStyle = mute; ctx.font = "9px " + mono;
        ctx.fillText("QUERY", qx, cy - 10);
        ctx.fillStyle = ink; ctx.font = "bold 14px " + font;
        ctx.fillText(tokens[i], qx, cy + 9);

        // output node (right)
        rr(ox - oW / 2, cy - oH / 2, oW, oH, 10);
        ctx.fillStyle = panelHi; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = good; ctx.stroke();
        ctx.fillStyle = mute; ctx.font = "9px " + mono;
        ctx.fillText("OUTPUT", ox, cy - 10);
        ctx.fillStyle = ink; ctx.font = "12px " + mono;
        ctx.fillText("Σ w·V", ox, cy + 9);
      }

      // --- canvas interactivity: click pins a Key/Value row, hover previews it ---
      // Map a pointer event to canvas-local logical (x,y) (the drawFn coord space).
      function canvasXY(ev) {
        var rect = lookup.canvas.getBoundingClientRect();
        // logical drawing width/height are 680 x 320 (see canvasPanel call).
        var sx = 680 / (rect.width || 680);
        var sy = 320 / (rect.height || 320);
        return { x: (ev.clientX - rect.left) * sx, y: (ev.clientY - rect.top) * sy };
      }
      lookup.canvas.style.cursor = "pointer";
      lookup.canvas.addEventListener("click", function (ev) {
        var p = canvasXY(ev);
        var j = hitTestRow(p.x, p.y, 680, 320);
        if (j < 0) return;
        pinnedKey = (pinnedKey === j) ? -1 : j; // click the pinned row again to clear
        lookup.redraw();
        updateDissect();
      });
      lookup.canvas.addEventListener("mousemove", function (ev) {
        var p = canvasXY(ev);
        var j = hitTestRow(p.x, p.y, 680, 320);
        if (j !== hoverKey) { hoverKey = j; lookup.redraw(); }
      });
      lookup.canvas.addEventListener("mouseleave", function () {
        if (hoverKey !== -1) { hoverKey = -1; lookup.redraw(); }
      });

      updateConcept();
      updateDissect();
      updateTempStatus();

      /* ----------------------- scoring + softmax narrative ----------------------- */
      root.appendChild(TQ.block(
        TQ.h(2, "Scoring with a dot product, blending with a softmax"),
        TQ.p(
          "How relevant is Key ", TQ.math("j"), " to Query ", TQ.math("i"), "? Take their dot product: ",
          TQ.math("score_ij = Q_i · K_j"), ". From Level 1 you know a dot product is large when two vectors ",
          "are aligned — so this is just \"how much does what ", TQ.math("i"),
          " wants match what ", TQ.math("j"), " advertises?\""
        ),
        TQ.p(
          "That gives a row of raw scores (any real numbers, positive or negative). To turn them into a usable ",
          "blend, run softmax: ", TQ.math("weights_i = softmax(score_i)"),
          ". Softmax exponentiates and normalizes, so the weights are all positive and sum to exactly ",
          TQ.el("strong", { text: "1" }), " — a probability distribution over where token ", TQ.math("i"),
          " pays attention. The output is then ", TQ.math("output_i = Σ_j weights_ij · V_j"), "."
        ),
        TQ.p(
          "Note what this is ", TQ.el("strong", { text: "NOT" }), ": it's not argmax, not a hard pick of the ",
          "single best key. A token can put 50% of its attention on one neighbor and spread the rest."
        ),
        TQ.note(
          "One detail deferred to Level 3: real attention divides the scores by √dk before softmax, to keep " +
          "numbers from blowing up as vectors get longer. The story is identical — only the scale changes — so " +
          "here we keep the math UNSCALED and the displayed weights match the raw → softmax narrative exactly."
        )
      ));

      /* ----------------------- shape pipeline figure + PyTorch ----------------------- */
      // The interactive canvas/bench teach the CONCEPT; neither shows the
      // dimension bookkeeping (d_model=16 -> d_k=8) nor the (n x n) attention
      // matrix. This static figure + code make those shapes explicit, right
      // where the four formulas above are defined. Static SVG, theme via CSS vars.
      var codeBlock = TQ.block(
        TQ.h(2, "The same four steps as PyTorch — and their shapes"),
        TQ.p(
          "Project → Score → Normalize → Blend is just four lines of tensor code. The diagram tracks the ",
          "shapes as they flow: the embeddings (", TQ.math("n × d_model"), ") become ",
          TQ.math("Q, K, V"), " (", TQ.math("n × d_k"), "), the queries-dotted-with-keys make an ",
          TQ.math("n × n"), " grid of scores, softmax keeps that shape, and the final blend lands back at ",
          TQ.math("n × d_k"), "."
        )
      );

      codeBlock.appendChild(TQ.figure(
        '<svg viewBox="0 0 720 132" width="720" height="132" role="img" ' +
          'aria-label="Shape pipeline: x is n by d_model, projected to Q K V at n by d_k, ' +
          'scored to an n by n grid, softmaxed, then blended back to n by d_k" ' +
          'font-family="var(--mono)" font-size="13">' +
          '<defs><marker id="tq-l2-arrow" viewBox="0 0 10 10" refX="9" refY="5" ' +
            'markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
            '<path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>' +
          // box 1: x
          '<rect x="8" y="46" width="96" height="40" rx="7" fill="var(--panel-hi)" stroke="var(--line)"/>' +
          '<text x="56" y="64" text-anchor="middle" fill="var(--ink)">x</text>' +
          '<text x="56" y="79" text-anchor="middle" fill="var(--ink-mute)" font-size="11">n × d_model</text>' +
          // box 2: Q,K,V
          '<rect x="176" y="46" width="104" height="40" rx="7" fill="var(--panel-hi)" stroke="var(--accent)"/>' +
          '<text x="228" y="64" text-anchor="middle" fill="var(--accent)">Q, K, V</text>' +
          '<text x="228" y="79" text-anchor="middle" fill="var(--ink-mute)" font-size="11">n × d_k</text>' +
          // box 3: scores
          '<rect x="352" y="46" width="104" height="40" rx="7" fill="var(--panel-hi)" stroke="var(--line)"/>' +
          '<text x="404" y="64" text-anchor="middle" fill="var(--ink)">scores</text>' +
          '<text x="404" y="79" text-anchor="middle" fill="var(--ink-mute)" font-size="11">n × n</text>' +
          // box 4: weights
          '<rect x="528" y="46" width="104" height="40" rx="7" fill="var(--panel-hi)" stroke="var(--cool)"/>' +
          '<text x="580" y="64" text-anchor="middle" fill="var(--cool)">weights</text>' +
          '<text x="580" y="79" text-anchor="middle" fill="var(--ink-mute)" font-size="11">n × n</text>' +
          // arrows along the top row
          '<g stroke="currentColor" stroke-width="1.5" fill="none" color="var(--ink-faint)">' +
            '<line x1="106" y1="66" x2="174" y2="66" marker-end="url(#tq-l2-arrow)"/>' +
            '<line x1="282" y1="66" x2="350" y2="66" marker-end="url(#tq-l2-arrow)"/>' +
            '<line x1="458" y1="66" x2="526" y2="66" marker-end="url(#tq-l2-arrow)"/>' +
          '</g>' +
          // arrow labels
          '<text x="140" y="40" text-anchor="middle" fill="var(--ink-faint)" font-size="10">project</text>' +
          '<text x="140" y="56" text-anchor="middle" fill="var(--ink-faint)" font-size="10">Wq/Wk/Wv</text>' +
          '<text x="316" y="40" text-anchor="middle" fill="var(--ink-faint)" font-size="10">score</text>' +
          '<text x="316" y="56" text-anchor="middle" fill="var(--ink-faint)" font-size="10">Q @ K.T</text>' +
          '<text x="492" y="40" text-anchor="middle" fill="var(--ink-faint)" font-size="10">softmax</text>' +
          '<text x="492" y="56" text-anchor="middle" fill="var(--ink-faint)" font-size="10">each row</text>' +
          // blend arrow down-right to out box
          '<g stroke="currentColor" stroke-width="1.5" fill="none" color="var(--ink-faint)">' +
            '<path d="M580 88 L580 110 L636 110" marker-end="url(#tq-l2-arrow)"/>' +
          '</g>' +
          '<text x="600" y="106" text-anchor="middle" fill="var(--ink-faint)" font-size="10">blend (@V)</text>' +
          // out box
          '<rect x="640" y="94" width="76" height="34" rx="7" fill="var(--panel-hi)" stroke="var(--good)"/>' +
          '<text x="678" y="110" text-anchor="middle" fill="var(--good)" font-size="12">out</text>' +
          '<text x="678" y="123" text-anchor="middle" fill="var(--ink-mute)" font-size="10">n × d_k</text>' +
        '</svg>',
        "Shapes flowing through one attention lookup: project the embeddings to Q/K/V, " +
        "dot every query with every key to fill an n × n score grid, softmax each row, " +
        "then blend the Values back to n × d_k."
      ));

      // Minimal, correct PyTorch for ONE attention lookup. Mirrors the four
      // formulas above (project / score / softmax / blend). No /sqrt(dk) here —
      // that arrives in Level 3 (noted inline).
      codeBlock.appendChild(TQ.code(
        "import torch\n" +
        "import torch.nn as nn\n" +
        "\n" +
        "# x: the token embeddings from Level 1 -> shape (seq_len, d_model)\n" +
        "x = torch.randn(6, 16)            # 6 tokens, 16-dim embeddings\n" +
        "\n" +
        "# 1. PROJECT: one linear map each turns every embedding into Q, K, V\n" +
        "d_k = 8\n" +
        "W_q, W_k, W_v = (nn.Linear(16, d_k, bias=False) for _ in range(3))\n" +
        "Q, K, V = W_q(x), W_k(x), W_v(x)  # each (6, 8): one role-vector per token\n" +
        "\n" +
        "# 2. SCORE: every Query dotted with every Key -> a (6, 6) grid of relevances\n" +
        "scores = Q @ K.T                  # scores[i, j] = Q[i] . K[j]\n" +
        "# (Level 3 will divide these by sqrt(d_k) for stability; we skip it here.)\n" +
        "\n" +
        "# 3. NORMALIZE: softmax each row -> positive weights that sum to 1\n" +
        "weights = scores.softmax(dim=-1)  # (6, 6), each row sums to 1.0\n" +
        "\n" +
        "# 4. BLEND: weighted average of the Value vectors\n" +
        "out = weights @ V                 # (6, 8): each row is a soft mix of all V's\n" +
        "print(out.shape)                  # torch.Size([6, 8])\n",
        { lang: "python", label: "one attention lookup",
          caption: "out is a soft weighted average of V — never a hard pick of one row. " +
            "Those four lines are exactly the Project → Score → Normalize → Blend story above." }
      ));

      root.appendChild(codeBlock);

      /* ============================================================= *
       *  PRIMARY INTERACTIVE — the soft database lookup bench
       * ============================================================= */
      var benchBlock = TQ.block(
        TQ.h(2, "Bench: pick a query token and watch the lookup"),
        TQ.p(
          "The same lookup as the diagram above, now as exact bars. Using the ",
          TQ.el("strong", { text: "query token you picked above" }),
          ", row 1 is its raw ", TQ.math("Q·K"),
          " score against every key token; row 2 is the softmax weights derived from those scores; row 3 ",
          "assembles the ", TQ.el("strong", { text: "output" }),
          " as a weighted blend of the six Value vectors. Every number is computed live from the real toy embeddings."
        )
      );

      var legend = TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "low" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "high" })
      );
      benchBlock.appendChild(legend);

      // --- control: raw/softmax toggle (the QUERY is chosen in the visual above) ---
      var showWeights = TQ.toggle({
        label: "softmax weights (off = compare raw scores)",
        value: true,
        onChange: function () { updateBench(); }
      });

      var controls = TQ.el("div", { class: "tq-controls-row tq-wa-controls" },
        TQ.el("div", {},
          TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Middle row"),
          showWeights.el
        )
      );
      benchBlock.appendChild(controls);

      // readout strip + the three output regions
      var readout = TQ.el("div", { class: "tq-wa-readout" });
      var midCaption = TQ.el("div", { class: "tq-wa-caption" });
      var scoreRegion = TQ.el("div", { class: "tq-panel tq-wa-region" });
      var midRegion = TQ.el("div", { class: "tq-panel tq-wa-region" });
      var blendRegion = TQ.el("div", { class: "tq-panel tq-wa-region" });

      benchBlock.appendChild(readout);
      benchBlock.appendChild(TQ.el("div", { class: "tq-wa-grid" },
        TQ.el("div", {},
          TQ.el("div", { class: "tq-wa-rowhead", text: "1 · raw Q·K scores" }),
          scoreRegion
        ),
        TQ.el("div", {},
          TQ.el("div", { class: "tq-wa-rowhead tq-wa-midhead" }),
          midCaption,
          midRegion
        ),
        TQ.el("div", {},
          TQ.el("div", { class: "tq-wa-rowhead", text: "3 · blend of Values → output" }),
          blendRegion
        )
      ));

      function updateBench() {
        var i = querySel.get();
        var scores = scoresFor(i);
        var weights = weightsFor(i);
        var output = outputFor(i);
        var topKey = argmaxIdx(weights);
        var sumW = TQ.sum(weights);
        var weightsOn = showWeights.get();

        // --- readout strip: top key, its weight, running sum ---
        readout.innerHTML = "";
        readout.appendChild(TQ.kv("query", tokens[i]));
        readout.appendChild(TQ.kv("top key", tokens[topKey]));
        readout.appendChild(TQ.kv("its weight", TQ.fmt(weights[topKey], 3)));
        readout.appendChild(TQ.kv("Σ weights", TQ.fmt(sumW, 3)));
        readout.appendChild(weights[topKey] < 0.99
          ? TQ.badge("soft blend (no weight = 1.0)", "info")
          : TQ.badge("near-hard pick", "warn"));

        // --- row 1: raw scores (signed bars; negatives read correctly) ---
        scoreRegion.innerHTML = "";
        scoreRegion.appendChild(TQ.barRow(scores, {
          labels: tokens,
          highlight: argmaxIdx(scores),
          colorFn: signedColorFn(scores),
          format: function (v) { return TQ.fmt(v, 2); }
        }));

        // --- middle head + caption depends on toggle ---
        var midHead = midRegion.parentNode.querySelector(".tq-wa-midhead");
        midRegion.innerHTML = "";
        if (weightsOn) {
          midHead.textContent = "2 · softmax weights";
          midCaption.innerHTML = "";
          midCaption.appendChild(TQ.el("span", { text: "weights: positive, sum = " }));
          midCaption.appendChild(TQ.el("strong", { text: TQ.fmt(sumW, 2) }));
          midRegion.appendChild(TQ.barRow(weights, {
            labels: tokens, max: 1, highlight: topKey,
            format: function (v) { return TQ.fmt(v, 3); }
          }));
        } else {
          midHead.textContent = "2 · raw scores again (compare lens — toggle on to normalize)";
          var hasNeg = TQ.minOf(scores) < 0;
          midCaption.innerHTML = "";
          midCaption.appendChild(TQ.el("span", { text: "same as row 1 on purpose: raw scores are any real number" +
            (hasNeg ? " (includes negatives)" : "") + " — they don't sum to anything tidy; toggle on to see softmax normalize them" }));
          midRegion.appendChild(TQ.barRow(scores, {
            labels: tokens, highlight: argmaxIdx(scores),
            colorFn: signedColorFn(scores),
            format: function (v) { return TQ.fmt(v, 2); }
          }));
        }

        // --- row 3: each Value dimmed to its weight, then the assembled output ---
        blendRegion.innerHTML = "";
        var stack = TQ.el("div", { class: "tq-wa-vstack" });
        for (var j = 0; j < n; j++) {
          var w = weights[j];
          // opacity tracks weight so high-weight Values "fade in"
          var op = TQ.clamp(0.18 + 0.82 * w, 0.18, 1);
          var vrow = TQ.el("div", {
            class: "tq-wa-vrow" + (j === topKey ? " is-top" : ""),
            style: { opacity: String(op) }
          },
            TQ.vectorView(V[j], { label: tokens[j], cellSize: 18 }),
            TQ.el("span", { class: "tq-wa-vweight", text: "× " + TQ.fmt(w, 3) })
          );
          stack.appendChild(vrow);
        }
        blendRegion.appendChild(stack);
        blendRegion.appendChild(TQ.el("div", { class: "tq-wa-outsep", text: "Σ  weighted average  =" }));
        blendRegion.appendChild(TQ.el("div", { class: "tq-wa-output" },
          TQ.vectorView(output, { label: "output for " + tokens[i], cellSize: 22, showValues: false })
        ));
      }

      benchBlock.appendChild(TQ.callout(
        "Try query \"The\" (or \"the\"): it attends hardest to \"cat\" (~0.50) — the article reaching for its " +
        "noun — and \"the\" (#4) gives nearly the same pattern, echoing Level 1's twin geometry. Query \"sat\" " +
        "leans on \"on\" (~0.49); \"on\" attends back to \"sat\" — but the two weights differ, because Q and K " +
        "are different projections. Attention is content-dependent AND asymmetric."
      ));
      root.appendChild(benchBlock);
      updateBench();

      /* ============================================================= *
       *  STEPPER — the full pipeline, one step at a time
       * ============================================================= */
      var stepBlock = TQ.block(
        TQ.h(2, "Walkthrough: Project → Score → Normalize → Blend"),
        TQ.p(
          "Step through the pipeline for the currently selected query (",

/* ============================================================================
 * LEVEL 03 — Scaled Dot-Product Self-Attention   (order 3)
 * ----------------------------------------------------------------------------
 * Follows the gold-standard pattern from 01-tokens-embeddings.js:
 *   - one IIFE, ONE TQ.registerLevel call, NO other globals
 *   - render() = short explanation blocks + a PRIMARY interactive lab, every
 *     number genuinely computed via TQ math (no hardcoded weights/curves)
 *   - all color via TQ.colorFor / TQ.heatmap / TQ.barRow (one color language)
 *   - 2-4 quiz questions
 *
 * Math shown here, all real:
 *   - {Q,K,V} = TQ.toyQKV(dk, 101,202,303) on the shared 6-token sentence
 *   - base scores S = Q·Kᵀ are FIXED (independent of the slider)
 *   - on every slider input: scaled = S/s, weights = TQ.softmaxRows(scaled),
 *     redrawing the 6×6 heatmap + a 3-stage breakdown + a live peak-weight stat
 *   - a dk segmented control rebuilds Q,K,V so raw-score spread grows with dk
 *   - "snap to √dk" returns the divisor to the healthy regime
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "self-attention",
    order: 3,
    title: "Scaled Dot-Product Self-Attention",
    icon: "🧮",
    tagline: "The real mechanism: softmax(QKᵀ / √dk) V, every number live.",
    preread: "Illustrated Transformer / Basics",
    objectives: [
      "Compute self-attention end-to-end on the shared sentence with real numbers",
      "Trace one query row: raw dot product → ÷√dk → softmax weight",
      "Explain WHY we divide by √dk (large dot products saturate softmax → vanishing gradients)"
    ],

    render: function (root) {
      var tokens = TQ.toy.tokens;
      var n = tokens.length;

      /* -------------------------------------------------- intro narrative */
      root.appendChild(TQ.block(
        TQ.h(2, "Self-attention: every token re-asks the room about itself"),
        TQ.p(
          "In your CNN days a pixel's new value came from a fixed convolution kernel — the same learned ",
          "weights slid over every location. Attention rips that fixedness out. Each token emits three ",
          "projections of its own embedding: a ", TQ.el("strong", { text: "Query" }), " (\"what am I looking for?\"), ",
          "a ", TQ.el("strong", { text: "Key" }), " (\"what do I offer?\"), and a ",
          TQ.el("strong", { text: "Value" }), " (\"what I'll actually hand over\"). We build them with three ",
          "learned matrices: ", TQ.math("Q = E·Wq"), ", ", TQ.math("K = E·Wk"), ", ", TQ.math("V = E·Wv"),
          ", where ", TQ.math("E"), " is the 6×16 toy embedding matrix and each ", TQ.math("W"), " is 16×dk."
        ),
        TQ.p(
          TQ.el("strong", { text: "\"Self\"" }), "-attention just means Q, K and V all come from the ",
          TQ.el("strong", { text: "same sequence" }), " (these same six tokens) — a token compares itself ",
          "against its own neighbors, not some other input. The output for each token is a content-weighted ",
          "blend of every token's Value, where the weights are recomputed on the fly from how well that token's ",
          "Query aligns with every Key. No fixed kernel; the mixing weights come from the data every forward pass. ",
          "That data-dependent routing is why transformers eat long-range dependencies for breakfast (a ",
          "long-range dependency = a token needing information from a far-away token) where a CNN ",
          "needed many stacked layers to see across an image."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "The formula is one line — and every piece is a dot product you already trust"),
        TQ.p(
          TQ.math("Attention(Q,K,V) = softmax(QKᵀ / √dk) · V"),
          ". Read it right-to-left. ", TQ.math("QKᵀ"), " is the score matrix: entry ", TQ.math("[i,j]"),
          " is the raw dot product of token i's Query with token j's Key — the same un-normalized alignment ",
          "you computed by hand in Level 1, but now between learned projections. Big dot product = strong match ",
          "= token i wants j's Value. Then divide every score by ", TQ.math("√dk"),
          " (the temperature fix — temperature = how peaked vs flat the softmax comes out — next block). Then ", TQ.el("strong", { text: "softmax" }),
          " runs across each ROW, turning scores into a probability distribution that sums to 1.0 — the ",
          "attention weights. Finally multiply that weight matrix by ", TQ.math("V"),
          ", so each token's output is a convex combination (a weighted average whose weights sum to 1) of all Values, ",
          "dominated by the tokens it scored highest against."
        ),
        TQ.callout(
          "Nothing magic — three matmuls, one scale, one softmax. The lab below runs exactly this pipeline on the " +
          "shared sentence, with the numbers recomputed live as you turn the knobs."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "Why ÷√dk: the dot product's variance grows with dk, and softmax has no chill"),
        TQ.p(
          "A score is a dot product of two ", TQ.math("dk"), "-dimensional vectors: ",
          TQ.math("q·k = Σ qᵢkᵢ"), " over dk terms. If the components are roughly independent with unit variance, ",
          "that sum has variance ~dk, so its standard deviation grows like ", TQ.math("√dk"),
          ". Crank dk from 8 to 64 and the typical magnitude of your raw scores roughly triples ",
          "(√64/√8 ≈ 2.8×) — for free, just from adding dimensions, with no change in actual semantic alignment."
        ),
        TQ.p(
          "Now feed those into softmax. Softmax is exponential, so it's brutally sensitive to the ",
          TQ.el("strong", { text: "spread" }), " of its inputs: when scores are large and spread out, ",
          TQ.math("exp()"), " makes the biggest one swamp the rest and the distribution collapses toward one-hot. ",
          "You know exactly why that's poison — softmax in its saturated regime (output so close to one-hot that its ",
          "slope, i.e. gradient, is ~0) has gradients near zero (the same ",
          "vanishing-gradient flatness you fought with saturated sigmoids), so the model can barely learn which ",
          "token to attend to. Dividing by ", TQ.math("√dk"), " cancels the dimension-induced inflation, holding ",
          "the score variance ~constant regardless of head size, keeping softmax in its smooth, high-gradient regime. ",
          "It's a temperature knob set to exactly the value that neutralizes dk."
        ),
        TQ.note(
          "The interactive below lets you yank that knob and watch the peak weight climb toward 1.0 as you shrink " +
          "the divisor — saturation, live, on real recomputed numbers."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "Causal masking: how a decoder forbids peeking at the future"),
        TQ.p(
          "Everything so far let every token attend to every other token — including ones to its RIGHT. That's fine ",
          "for an encoder, but a ", TQ.el("strong", { text: "decoder" }), " generates left-to-right: when it predicts ",
          "token i it cannot be allowed to look at tokens it hasn't produced yet. The fix is a ",
          TQ.el("strong", { text: "causal mask" }), " — before softmax, set every \"future\" score ",
          TQ.math("S[i,j] with j>i"), " to ", TQ.math("−∞"), ". Since ", TQ.math("exp(−∞)=0"),
          ", those cells get exactly zero weight, and — this is the load-bearing part — softmax ",
          TQ.el("strong", { text: "renormalizes the surviving cells in that same row so they still sum to 1.0" }),
          ". The masked mass doesn't vanish; it gets redistributed to the past."
        ),
        TQ.note(
          "Flip the new \"causal mask (decoder)\" toggle in the lab below and watch the upper triangle of the heatmap " +
          "go dark while the surviving cells in each row brighten to absorb the freed weight — the row-Σ chip stays " +
          "pinned at 1.000 the whole time. That redistribution is the entire idea, and it's invisible in a static grid."
        )
      ));

      /* ================================================================== *
       *  PRIMARY INTERACTIVE — the scaled-dot-product attention lab
       * ================================================================== */

      var lab = TQ.block(
        TQ.h(2, "The lab: softmax(QKᵀ / scale) · V, recomputed live"),
        TQ.p(
          "The heatmap is the full 6×6 attention-weight matrix on the shared sentence. ",
          TQ.el("strong", { text: "Click any query ROW" }), " to expand a three-stage breakdown for that ",
          "token — raw ", TQ.math("Q·K"), ", scaled (÷scale), and the softmax weight. Drag the ",
          TQ.el("strong", { text: "scaling-factor slider" }), ": as the divisor shrinks toward 0 you'll watch the ",
          "row sharpen and the ", TQ.el("strong", { text: "peak weight" }), " climb toward 1.0 (softmax saturating ",
          "into a near-one-hot spike). At the proper ", TQ.math("√dk"), " it sits in a smooth, healthy regime. ",
          "Flip the ", TQ.el("strong", { text: "causal mask (decoder)" }), " toggle to block future keys ",
          "(", TQ.math("j>i"), "): the upper triangle drops to 0.000 and each row renormalizes over the past — ",
          "the row-Σ chip stays at 1.000 throughout."
        )
      );

      // ---- live state -------------------------------------------------------
      // dk, base scores S (fixed per dk), the current divisor, and selected row.
      var SEED_Q = 101, SEED_K = 202, SEED_V = 303;
      var dk = 8;
      var qkv, baseScores, V, sqrtDk;
      var divisor = Math.sqrt(dk);
      var selectedRow = 0;
      var causal = false; // decoder causal mask: block future keys (j > i)

      function rebuildForDk(newDk) {
        dk = newDk;
        qkv = TQ.toyQKV(dk, SEED_Q, SEED_K, SEED_V);
        // base scores are FIXED, independent of the slider
        baseScores = TQ.matmul(qkv.Q, TQ.transpose(qkv.K)); // 6×6, == TQ.attention(...).scores
        V = qkv.V;
        sqrtDk = Math.sqrt(dk);
      }
      rebuildForDk(dk);

      // Apply the causal mask to a copy of the base scores: future keys (j > i)
      // get −∞ so exp() drives them to exactly 0. When causal is off, returns
      // baseScores untouched. (Math.exp(-Infinity) === 0, so masked cells get
      // EXACTLY zero weight and the surviving cells renormalize to sum to 1.0.)
      function maskedScores() {
        if (!causal) return baseScores;
        var M = [];
        for (var i = 0; i < baseScores.length; i++) {
          var row = [];
          for (var j = 0; j < baseScores[i].length; j++) {
            row.push(j > i ? -Infinity : baseScores[i][j]);
          }
          M.push(row);
        }
        return M;
      }

      // weights from the CURRENT divisor (and mask) — genuine recompute through
      // softmax. The mask is applied to the UNscaled scores, then the existing
      // /scale + softmax pipeline runs unchanged.
      function computeWeights() {
        var scaled = TQ.scaleMat(maskedScores(), 1 / divisor); // Sᵢⱼ / s  (−∞ stays −∞)
        return TQ.softmaxRows(scaled);                         // per-row softmax
      }

      // peak weight of the selected row + mean of every row's max (saturation metric)
      function meanPeak(weights) {
        var s = 0;
        for (var i = 0; i < weights.length; i++) s += TQ.maxOf(weights[i]);
        return s / weights.length;
      }

      // ---- DOM holders ------------------------------------------------------
      var heatHolder = TQ.el("div", { class: "tq-grow" });
      var statRow = TQ.el("div", { class: "tq-sa-stats" });
      var breakdown = TQ.el("div", { class: "tq-panel tq-sa-breakdown" });
      // renormalization-proof callout under the heatmap, shown only when masked
      var maskCallout = TQ.el("div", { class: "tq-callout tq-sa-maskcallout", style: { display: "none" } });

      // legend (shared color language)
      var legend = TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "0.0" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "1.0" })
      );

      function buildHeat(weights) {
        return TQ.heatmap(weights, {
          rowLabels: tokens, colLabels: tokens, cellSize: 46,
          min: 0, max: 1, // fixed scale so colors mean the same probability everywhere
          selectedRow: selectedRow,
          // masked (future) cells are genuine 0 under the mask — render '∅' so
          // they read as "forbidden", not merely "tiny".
          format: function (v) { return (causal && v === 0) ? "∅" : TQ.fmt(v, 2); }
        });
      }

      // After a heatmap is built, tag the strict-upper-triangle cells as masked
      // (only when causal is on) so scoped CSS can dim them. Purely cosmetic —
      // the numbers themselves are already 0 from the −∞ softmax.
      function markMasked(node) {
        var cells = node.querySelectorAll(".tq-hm-cell");
        var k = 0;
        for (var r = 0; r < n; r++) {
          for (var c = 0; c < n; c++) {
            if (causal && c > r) cells[k].classList.add("is-masked");
            k++;
          }
        }
      }

      // rewire heatmap cells: clicking ANY cell selects that token's query row.
      function rewire(node) {
        var cells = node.querySelectorAll(".tq-hm-cell");
        var k = 0;
        for (var r = 0; r < n; r++) {
          for (var c = 0; c < n; c++) {
            (function (rowIdx, cell) {
              cell.classList.add("is-clickable");
              cell.setAttribute("role", "button");
              cell.setAttribute("tabindex", "0");
              cell.addEventListener("click", function () { selectRow(rowIdx); });
              cell.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectRow(rowIdx); }
              });
            })(r, cells[k]);
            k++;
          }
        }
      }

      function renderStats(weights) {
        statRow.innerHTML = "";
        var peak = TQ.maxOf(weights[selectedRow]);
        var mp = meanPeak(weights);
        var rowSum = TQ.sum(weights[selectedRow]);

        var regime = peak > 0.85 ? ["near one-hot — saturated", "warn"]
                   : peak > 0.45 ? ["sharpening", "info"]
                   : ["smooth blend — healthy", "good"];

        var peakStat = TQ.el("div", { class: "tq-sa-peak" },
          TQ.el("span", { class: "tq-stat-cap", text: "peak weight (row " + tokens[selectedRow] + ")" }),
          TQ.el("span", { class: "tq-stat-big", text: TQ.fmt(peak, 3) }),
          TQ.badge(regime[0], regime[1]),
          causal ? TQ.badge("causal · lower-triangular", "info") : null
        );
        statRow.appendChild(peakStat);
        statRow.appendChild(TQ.el("div", { class: "tq-sa-chips" },
          TQ.kv("divisor", TQ.fmt(divisor, 2)),
          TQ.kv("√dk", TQ.fmt(sqrtDk, 2)),
          TQ.kv("mean peak (all rows)", TQ.fmt(mp, 3)),
          TQ.kv("row Σ", TQ.fmt(rowSum, 3))
        ));
      }

      function renderBreakdown(weights) {
        breakdown.innerHTML = "";
        var r = selectedRow;
        // For the bar DISPLAY of stages 1 & 2, show masked future entries as 0 so
        // TQ.barRow never tries to draw −∞. The actual softmax (stage 3 / weights)
        // still used −∞ internally, so its zeros are genuinely computed.
        var raw = baseScores[r].map(function (x, j) { return (causal && j > r) ? 0 : x; });
        var scaled = raw.map(function (x, j) { return (causal && j > r) ? 0 : x / divisor; });
        var w = weights[r];
        var rawMax = TQ.maxOf([].concat.apply([], baseScores).map(function (x) { return Math.abs(x); }));

        breakdown.appendChild(TQ.el("div", { class: "tq-sa-bd-head" },
          TQ.el("span", { class: "tq-sa-bd-title" },
            "Query row ",
            TQ.el("strong", { text: "\"" + tokens[r] + "\"" }),
            " (#", String(r), ") vs every Key"
          )
        ));

        breakdown.appendChild(TQ.el("div", { class: "tq-sa-stage" },
          TQ.el("div", { class: "tq-sa-stage-label" },
            TQ.el("span", { class: "tq-sa-stage-n", text: "1" }),
            TQ.el("span", { text: "raw  " }), TQ.math("Q·Kᵀ")
          ),
          TQ.barRow(raw, {
            labels: tokens, max: rawMax || 1,
            format: function (v) { return TQ.fmt(v, 2); }
          })
        ));

        breakdown.appendChild(TQ.el("div", { class: "tq-sa-stage" },
          TQ.el("div", { class: "tq-sa-stage-label" },
            TQ.el("span", { class: "tq-sa-stage-n", text: "2" }),
            TQ.el("span", { text: "scaled  ÷ " + TQ.fmt(divisor, 2) })
          ),
          // Stage 2 gets its OWN bar scale (rawMax/divisor) so the bars never
          // clamp when the divisor < 1 (scaled magnitudes exceed the raw range).
          // Keeping each stage on its own scale is what makes the "uniform
          // shrink/grow" read correctly across the whole divisor range.
          TQ.barRow(scaled, {
            labels: tokens, max: (rawMax / divisor) || 1,
            format: function (v) { return TQ.fmt(v, 2); }
          })
        ));

        breakdown.appendChild(TQ.el("div", { class: "tq-sa-stage" },
          TQ.el("div", { class: "tq-sa-stage-label" },
            TQ.el("span", { class: "tq-sa-stage-n", text: "3" }),
            TQ.el("span", { text: "softmax weight  " }),
            TQ.badge("Σ = " + TQ.fmt(TQ.sum(w), 3), "info")
          ),
          TQ.barRow(w, {
            labels: tokens, max: 1,
            format: function (v) { return TQ.fmt(v, 3); }
          })
        ));

        breakdown.appendChild(TQ.note(
          "Stage 2 is just stage 1 uniformly shrunk by the same factor everywhere — yet softmax turns that " +
          "uniform shrink into a dramatically flatter distribution. Softmax cares about the SPREAD of its inputs, " +
          "and the divisor controls that spread."
        ));
      }

      // master refresh: recompute weights, redraw heatmap + stats + breakdown.
      function refresh() {
        var weights = computeWeights();
        var fresh = buildHeat(weights);
        rewire(fresh);
        markMasked(fresh);
        if (heatHolder.firstChild) heatHolder.replaceChild(fresh, heatHolder.firstChild);
        else heatHolder.appendChild(fresh);
        renderStats(weights);
        renderBreakdown(weights);
        // the renormalization-proof callout under the heatmap appears only when masked
        maskCallout.style.display = causal ? "" : "none";

          var rs = TQ.sum(weights[selectedRow]);
          maskCallout.innerHTML = "";
          maskCallout.appendChild(TQ.el("span", { class: "tq-callout-mark", text: "✦", "aria-hidden": "true" }));
          maskCallout.appendChild(TQ.el("div", { class: "tq-callout-body" },
            "Row ", TQ.el("strong", { text: "\"" + tokens[selectedRow] + "\"" }),
            " now blocks the " + (n - 1 - selectedRow) + " future key" + ((n - 1 - selectedRow) === 1 ? "" : "s") +
            " to its right (shown ∅). Softmax redistributed that mass across the " + (selectedRow + 1) +
            " allowed cell" + (selectedRow === 0 ? "" : "s") + " — and the row still sums to ",
            TQ.el("strong", { text: TQ.fmt(rs, 3) }),
            ". Masking didn't delete probability; it relocated it to the past."
          ));
        }
      }

      function selectRow(r) {
        selectedRow = TQ.clamp(r, 0, n - 1);
        refresh();
      }

      // ---- controls ---------------------------------------------------------
      var slider = TQ.slider({
        min: 0.1, max: 12, step: 0.05, value: divisor,
        label: "scaling divisor",
        format: function (v) { return TQ.fmt(v, 2); },
        onInput: function (v) { divisor = v; refresh(); }
      });

      var snapBtn = TQ.el("button", { class: "tq-btn tq-btn-accent", type: "button" },
        "snap to √dk (" + TQ.fmt(sqrtDk, 2) + ")"
      );
      snapBtn.addEventListener("click", function () {
        divisor = sqrtDk;
        slider.set(divisor);
        refresh();
      });

      var causalToggle = TQ.toggle({
        label: "causal mask (decoder) — block future keys (j>i)",
        value: false,
        onChange: function (on) { causal = on; refresh(); }
      });

      var dkSeg = TQ.segmented({
        options: [
          { label: "dk 4", value: 4 },
          { label: "dk 8", value: 8 },
          { label: "dk 16", value: 16 },
          { label: "dk 32", value: 32 }
        ],
        value: 8,
        onChange: function (newDk) {
          rebuildForDk(newDk);
          divisor = sqrtDk;            // snap divisor to the new √dk
          slider.set(divisor);
          snapBtn.textContent = "snap to √dk (" + TQ.fmt(sqrtDk, 2) + ")";
          refresh();
        }
      });

      var controls = TQ.el("div", { class: "tq-sa-controls" },
        TQ.el("div", { class: "tq-sa-ctrl-cell tq-grow" }, slider.el),
        TQ.el("div", { class: "tq-sa-ctrl-cell" },
          TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "head size dk"),
          dkSeg.el
        ),
        TQ.el("div", { class: "tq-sa-ctrl-cell" }, snapBtn),
        TQ.el("div", { class: "tq-sa-ctrl-cell tq-sa-maskcell" },
          TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "masking"),
          causalToggle.el
        )
      );

      lab.appendChild(controls);
      lab.appendChild(legend);
      lab.appendChild(TQ.el("div", { class: "tq-flexrow tq-sa-row" },
        TQ.el("div", { class: "tq-flexcol tq-grow", style: { gap: "10px" } }, heatHolder, statRow, maskCallout),
        breakdown
      ));
      lab.appendChild(TQ.callout(
        "Drag the divisor DOWN toward 0.1 and watch the selected row collapse toward one-hot — the peak weight " +
        "climbs from ≈0.29 (at √dk) up past 0.55, 0.74, toward 1.00. The heatmap row goes from a soft gradient " +
        "to a single blazing cell. THAT is softmax saturation, on real numbers."
      ));
      lab.appendChild(TQ.note(
        "Try this too: set dk to 32 and the slider to 1.0 (no scaling). The raw scores spread wider — std climbs " +
        "roughly as √dk — and the unscaled distribution sharpens for free. That inflation is the entire motivation " +
        "for the √dk denominator. Because softmax weights always sum to exactly 1.000, the output is always a " +
        "convex combination of Values: a token can amplify or ignore neighbors, but never invents signal outside the Value set."
      ));

      // Minimal, runnable-style PyTorch mirroring the lab pipeline exactly:
      // QKᵀ -> /√dk -> optional causal mask (−∞ before softmax) -> softmax row -> @V.
      // One head, no nn.Module / batching boilerplate — exactly the 6×6 single-head visual.
      lab.appendChild(TQ.code(
        "import torch\n" +
        "import torch.nn.functional as F\n" +
        "import math\n" +
        "\n" +
        "def self_attention(Q, K, V, causal=False):\n" +
        "    # Q, K, V: (seq_len, d_k) — one head, like the 6x6 lab above\n" +
        "    d_k = Q.size(-1)\n" +
        "    # stage 1: raw scores S[i,j] = q_i . k_j   (the QK^T heatmap)\n" +
        "    scores = (Q @ K.transpose(-2, -1)) / math.sqrt(d_k)  # stage 2: the /sqrt(d_k) scaling\n" +
        "    if causal:\n" +
        "        # block future keys j > i: set them to -inf BEFORE softmax\n" +
        "        mask = torch.triu(torch.ones_like(scores), diagonal=1).bool()\n" +
        "        scores = scores.masked_fill(mask, float('-inf'))    # exp(-inf) = 0\n" +
        "    # stage 3: softmax across each ROW -> attention weights (each row sums to 1.0)\n" +
        "    weights = F.softmax(scores, dim=-1)\n" +
        "    # blend Values: a convex combination of every token's V\n" +
        "    return weights @ V, weights\n",
        { lang: "python",
          label: "scaled dot-product self-attention (1 head)",
          caption: "Mirrors the lab: QK^T, /sqrt(d_k), optional causal mask -inf before softmax, then @V." }
      ));

      // first paint
      refresh();
      root.appendChild(lab);

      /* --------------------------------------------------- wrap-up takeaway */
      root.appendChild(TQ.block(
        TQ.h(2, "What you just built"),
        TQ.p(
          "One head of self-attention, end to end, on the shared sentence: project to Q/K/V, score with ",
          TQ.math("QKᵀ"), ", scale by ", TQ.math("1/√dk"), ", softmax each row into attention weights, blend the ",
          "Values. The next level stacks several of these heads side by side — each with its own Wq/Wk/Wv — so the ",
          "model can attend along multiple relationships at once."
        ),
        TQ.callout("Mental model to carry forward: attention = data-dependent routing. The weights are a fresh " +
                   "softmax over learned dot products every forward pass — there is no fixed kernel."),
        TQ.p(
          "You also saw the ", TQ.el("strong", { text: "causal mask" }), " mechanic up close: −∞ on the future, then ",
          "softmax renormalizes so every row still sums to 1.0. Hold onto that. In Levels 6 and 7 you'll meet it again ",
          "from the other side — there the decoder's KV-cache makes masking essentially ", TQ.el("em", { text: "free" }),
          ", because future positions simply don't exist in the cache yet. Same rule (\"only look left\"), seen here as ",
          "the mechanism and there as why it costs nothing to enforce."
        )
      ));

      /* ----------------------------------------------- go deeper (resources) */
      root.appendChild(TQ.resources("Go deeper — self-attention & scaling", [
        {
          label: "The Annotated Transformer",
          url: "https://nlp.seas.harvard.edu/annotated-transformer/",
          kind: "code",
          note: "Harvard's line-by-line PyTorch walkthrough — the same scaled dot-product attention you just coded, in context."
        },
        {
          label: "The Illustrated Transformer",
          url: "https://jalammar.github.io/illustrated-transformer/",
          kind: "blog",
          note: "Jay Alammar's visual tour of Q/K/V, scoring, and softmax — the pictures behind this lab."
        },
        {
          label: "Attention Is All You Need",
          url: "https://arxiv.org/abs/1706.03762",
          kind: "paper",
          note: "The original paper that introduced softmax(QKᵀ/√dk)·V and the √dk scaling motivation."
        },
        {
          label: "3Blue1Brown — Attention, visually explained",
          url: "https://www.youtube.com/watch?v=eMlx5fFNoYc",
          kind: "video",
          note: "A geometric, animated build of exactly the attention mechanism you turned the knobs on here."
        }
      ]));

      /* small scoped styles (colors via CSS variables only — no hardcoded hex) */
      injectOnce("tq-lvl03-css",
        ".tq-sa-controls{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin:6px 0 14px}" +
        ".tq-sa-ctrl-cell{display:flex;flex-direction:column;justify-content:flex-end}" +
        ".tq-sa-row{align-items:flex-start;gap:20px;margin-top:6px}" +
        ".tq-sa-breakdown{min-width:300px;display:flex;flex-direction:column;gap:12px}" +
        ".tq-sa-stats{display:flex;flex-direction:column;gap:8px}" +
        ".tq-sa-peak{display:flex;align-items:center;gap:12px;flex-wrap:wrap}" +
        ".tq-sa-chips{display:flex;gap:8px;flex-wrap:wrap}" +
        ".tq-sa-bd-head{font-size:15px;border-bottom:1px solid var(--line);padding-bottom:8px}" +
        ".tq-sa-stage{display:flex;flex-direction:column;gap:6px}" +
        ".tq-sa-stage-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}" +
        ".tq-sa-stage-n{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;" +
          "border-radius:50%;background:var(--panel-hi);border:1px solid var(--line);font-size:11px;font-weight:700}" +
        ".tq-sa-bd-title{font-size:15px}" +
        // causal-mask treatment: dim the strict-upper-triangle cells, mute their
        // '∅' glyph, and drop a subtle diagonal hatch so "forbidden" reads at a glance.
        ".tq-hm-cell.is-masked{opacity:.32;filter:saturate(.4)}" +
        ".tq-hm-cell.is-masked .tq-hm-val{color:var(--ink-mute)}" +
        ".tq-hm-cell.is-masked.is-rowsel{opacity:.45}" +
        ".tq-sa-maskcell{min-width:200px}" +
        ".tq-sa-maskcallout{margin-top:2px}");
    },

    quiz: [
      {
        q: "In self-attention, where do Q, K, and V come from?",
        choices: [
          "Q from the current sequence, but K and V are loaded from a separate external memory bank",
          "All three are three different learned linear projections (E·Wq, E·Wk, E·Wv) of the SAME input sequence's embeddings",
          "Q and K are projections of the input; V is the raw embedding passed through unchanged",
          "They are three independent learned tables looked up by token id, like the embedding table"
        ],
        answer: 1,
        explain: "'Self' means Q, K, V are all linear projections of the same tokens' embeddings via distinct " +
                 "learned matrices Wq/Wk/Wv. (When Q comes from a different sequence than K/V, it's cross-attention.)"
      },
      {
        q: "Why divide the QKᵀ scores by √dk before the softmax?",
        choices: [
          "To make the scores sum to 1 so they form a probability distribution",
          "Because the dot product of two dk-dim vectors has variance ~dk (std ~√dk); without the fix, larger heads inflate scores, pushing softmax into a saturated near-one-hot regime with vanishing gradients",
          "√dk is the number of attention heads, so it averages their contributions",
          "To convert the dot product into a cosine similarity by normalizing the vector lengths"
        ],
        answer: 1,
        explain: "A dot product over dk terms has variance ~dk, so magnitudes grow like √dk purely from " +

      },
      {
        q: "As you shrink the scaling divisor toward 0 in the lab, the selected row's peak attention weight climbs toward 1.0. What is happening?",
        choices: [

          "Dividing by a smaller number multiplies the score spread up; softmax's exponential then makes the top score dominate, collapsing the distribution toward one-hot (saturation)",

        answer: 1,

      {
        q: "A single output vector of self-attention is best described as:",

          "The element-wise product of the Query and Key vectors",
          "The raw QKᵀ score row, before any normalization"
        ],
        answer: 1,
        explain: "weights·V is a weighted average of every token's Value, with non-negative weights that sum to " +
                 "exactly 1.0 (a convex combination). It can emphasize or ignore tokens but never produces signal " +
                 "outside the span of the Values."

  });

  // tiny helper local to this module (NOT a global): inject scoped CSS once.
  function injectOnce(id, css) {

/* ============================================================================
 * LEVEL 04 — Multi-Head Attention   (order 4)
 * ----------------------------------------------------------------------------
 * Follows the gold-standard pattern (see 01-tokens-embeddings.js):
 *   - one IIFE, ONE TQ.registerLevel call, NO other globals
 *   - render() = short explanation blocks + PRIMARY interactive visualization
 *   - every number genuinely computed via TQ math (no hardcoded attention)
 *   - all color via TQ.colorFor / TQ.heatmap / TQ.vectorView (one color language)
 *
 * Math shown, all real & deterministic:
 *   - the shared toy sentence -> TQ.toy.embeddings (6 x 16)
 *   - H = 4 heads, each with its OWN seeded Wq/Wk/Wv (base + head*10 + {1,2,3})
 *     via TQ.toyQKV(dk, ...). dk = dModel / H = 16 / 4 = 4.
 *   - per-head attention via TQ.attention -> .weights is the 6x6 heatmap shown
 *     in each tab; genuinely differs across heads because seeds differ.
 *   - Concat + Wo: per token concat the H length-4 outputs -> length 16, then
 *     ConcatAll (6 x 16) · Wo (16 x 16) -> Final (6 x 16). All via TQ.matmul.
 *   - "sharpest head" = argmin over heads of row entropy of att.weights[query].
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "multi-head",
    order: 4,
    title: "Multi-Head Attention",
    icon: "🧠",
    tagline: "Run attention several times in parallel subspaces, then concatenate.",
    preread: "Illustrated Transformer",
    objectives: [
      "See that each head has its own learned Q/K/V projections (its own subspace)",
      "Observe different heads attend to different relations (different patterns on the same sentence)",
      "Follow concat-of-heads → output projection back to d_model"
    ],

    render: function (root) {
      var toy = TQ.toy;
      var tokens = toy.tokens;
      var X = toy.embeddings;       // 6 x 16
      var dModel = toy.dModel;      // 16
      var H = 4;                    // heads
      var dk = dModel / H;          // 4
      var n = tokens.length;        // 6
      var BASE = 400;               // seed base; per-head = BASE + h*10 + {1,2,3}

      /* ---------------------------------------------- build every head (real) */
      // heads[h] = { qkv, att } where att = {scores, scaled, weights, output, dk}
      var heads = [];
      for (var h = 0; h < H; h++) {
        var qkv = TQ.toyQKV(dk, BASE + h * 10 + 1, BASE + h * 10 + 2, BASE + h * 10 + 3);
        var att = TQ.attention(qkv.Q, qkv.K, qkv.V); // weights: 6x6, output: 6x4
        heads.push({ qkv: qkv, att: att });
      }

      // ConcatAll (6 x 16): horizontally stack the four 6x4 head outputs.
      var concatAll = [];
      for (var t = 0; t < n; t++) {
        var rowC = [];
        for (var hh = 0; hh < H; hh++) {
          var ov = heads[hh].att.output[t];
          for (var k = 0; k < ov.length; k++) rowC.push(ov[k]);
        }
        concatAll.push(rowC); // length H*dk = 16
      }
      // Wo: (H*dk) x dModel = 16 x 16, learned output projection (deterministic).
      var Wo = TQ.randMatrix(H * dk, dModel, 999);
      var Final = TQ.matmul(concatAll, Wo); // 6 x 16

      // Shannon entropy of a probability row (lower = more peaked / confident).
      function entropy(p) {
        var e = 0;
        for (var i = 0; i < p.length; i++) {
          var w = p[i];
          if (w > 1e-12) e += -w * Math.log(w);
        }
        return e;
      }
      // Sharpest head for a given query token index = argmin head-row entropy.
      function sharpestHead(q) {
        var best = 0, bestE = Infinity;
        for (var hi = 0; hi < H; hi++) {
          var e = entropy(heads[hi].att.weights[q]);
          if (e < bestE) { bestE = e; best = hi; }
        }
        return best;
      }
      // argmax index of an array (first max wins) — used for each head's peak key.
      function argmaxIdx(arr) {
        var bi = 0;
        for (var ai = 1; ai < arr.length; ai++) if (arr[ai] > arr[bi]) bi = ai;
        return bi;
      }

      /* ----------------------------------------------------- intro narrative */
      root.appendChild(TQ.block(
        TQ.h(2, "One attention head is a single point of view"),
        TQ.p(
          "You just built scaled dot-product attention: project tokens into ",
          TQ.math("Q, K, V"), ", score every query against every key, softmax, blend the values. ",
          "But one set of projection matrices (", TQ.math("Wq, Wk, Wv"),
          ") forces every relationship through ", TQ.el("strong", { text: "one" }),
          " learned lens. If that lens is tuned to track \"which noun does this verb act on,\" it has no ",
          "spare capacity to also track \"which article binds this noun\" or \"what's three tokens back.\" ",
          "A single head must compromise across all the relations in a sentence at once."
        )
      ));

      root.appendChild(TQ.block(
        TQ.h(2, "Run attention H times in parallel subspaces"),
        TQ.p(
          "Multi-head attention is the obvious fix: instead of one big ", TQ.math("d_model"),
          "-wide attention, run ", TQ.el("strong", { text: "H" }), " smaller ones in parallel, each with its ",
          TQ.el("strong", { text: "own" }), " ", TQ.math("Wq/Wk/Wv"), ". Each head projects the SAME input ",
          "embeddings into its own ", TQ.math("dk"), "-dimensional subspace (", TQ.math("dk = d_model / H"),
          ") and does the full scores → scale by ", TQ.math("1/√dk"),
          " → softmax → weighted-V pipeline independently."
        ),
        // on-screen arithmetic strip — make the shape bookkeeping explicit
        TQ.el("div", { class: "tq-mh-arith" },
          TQ.el("span", { class: "tq-mh-arith-item" }, TQ.math("dk = d_model / H = " + dModel + " / " + H + " = " + dk)),
          TQ.el("span", { class: "tq-mh-arith-item" }, TQ.math("concat width = H × dk = " + H + " × " + dk + " = " + (H * dk) + " = d_model"))
        ),
        TQ.p(
          "(\"Subspace\" just means a smaller slice of the representation space — each head looks at only ",
          TQ.math("dk"), " of the ", TQ.math("d_model"), " coordinates, reached through its own learned projection, ",
          "rather than the full width.) ",
          "Here ", TQ.math("d_model = " + dModel), ", ", TQ.math("H = " + H), ", so ", TQ.math("dk = " + dk),
          " — four ", dk + "-dimensional attentions running side by side. ",
          TQ.el("strong", { text: "If you've seen CNNs" }), " (optional analogy — skip if not): ",
          "this is almost exactly that intuition — a conv layer doesn't apply one filter, it applies a ",
          TQ.el("strong", { text: "bank" }),
          " of filters, each tuned to a different pattern (edges, texture, color blobs). A head is an attention ",
          "\"filter\"; the bank gives the layer multiple simultaneous ways to relate tokens."
        ),
        // Orienting diagram: the whole split → parallel heads → concat → Wo
        // pipeline at a glance, BEFORE the interactive parts dissect each stage.
        // Static SVG, theme colors via CSS vars / currentColor (no hardcoded hex).
        TQ.figure(
          '<svg viewBox="0 0 720 230" width="720" height="230" role="img" ' +
            'aria-label="Multi-head attention pipeline: split into heads, attend in parallel, concatenate, project with Wo" ' +
            'font-family="var(--mono)" font-size="12">' +
            '<defs><marker id="tq-l4-arrow" viewBox="0 0 10 10" refX="9" refY="5" ' +
              'markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
              '<path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>' +
            '<g stroke="currentColor" stroke-width="1.4" fill="none" color="var(--ink-faint)">' +
              // X -> split fan-out
              '<line x1="92" y1="115" x2="150" y2="115" marker-end="url(#tq-l4-arrow)"/>' +
              '<line x1="156" y1="115" x2="300" y2="35"  marker-end="url(#tq-l4-arrow)"/>' +
              '<line x1="156" y1="115" x2="300" y2="88"  marker-end="url(#tq-l4-arrow)"/>' +
              '<line x1="156" y1="115" x2="300" y2="141" marker-end="url(#tq-l4-arrow)"/>' +
              '<line x1="156" y1="115" x2="300" y2="194" marker-end="url(#tq-l4-arrow)"/>' +
              // heads -> concat converge
              '<line x1="430" y1="35"  x2="540" y2="108" marker-end="url(#tq-l4-arrow)"/>' +
              '<line x1="430" y1="88"  x2="540" y2="112" marker-end="url(#tq-l4-arrow)"/>' +
              '<line x1="430" y1="141" x2="540" y2="118" marker-end="url(#tq-l4-arrow)"/>' +
              '<line x1="430" y1="194" x2="540" y2="122" marker-end="url(#tq-l4-arrow)"/>' +
              // concat -> Wo -> out
              '<line x1="600" y1="115" x2="630" y2="115" marker-end="url(#tq-l4-arrow)"/>' +
            '</g>' +
            // X input
            '<text x="48" y="92" text-anchor="middle" fill="var(--ink-mute)" font-size="11">input</text>' +
            '<rect x="14" y="100" width="76" height="32" rx="7" fill="var(--panel-hi)" stroke="var(--line)"/>' +
            '<text x="52" y="120" text-anchor="middle" fill="var(--ink)">X (6×16)</text>' +
            // split node label
            '<text x="150" y="150" text-anchor="middle" fill="var(--ink-faint)" font-size="10">split H=4</text>' +
            // four head boxes
            '<g>' +
              '<rect x="300" y="20"  width="130" height="30" rx="6" fill="var(--panel-hi)" stroke="var(--accent)"/>' +
              '<text x="365" y="39"  text-anchor="middle" fill="var(--ink)">head 1 · dk=4</text>' +
              '<rect x="300" y="73"  width="130" height="30" rx="6" fill="var(--panel-hi)" stroke="var(--accent)"/>' +
              '<text x="365" y="92"  text-anchor="middle" fill="var(--ink)">head 2 · dk=4</text>' +
              '<rect x="300" y="126" width="130" height="30" rx="6" fill="var(--panel-hi)" stroke="var(--accent)"/>' +
              '<text x="365" y="145" text-anchor="middle" fill="var(--ink)">head 3 · dk=4</text>' +
              '<rect x="300" y="179" width="130" height="30" rx="6" fill="var(--panel-hi)" stroke="var(--accent)"/>' +
              '<text x="365" y="198" text-anchor="middle" fill="var(--ink)">head 4 · dk=4</text>' +
            '</g>' +
            '<text x="365" y="13" text-anchor="middle" fill="var(--ink-mute)" font-size="10">attend in parallel → each 6×4</text>' +
            // concat node
            '<rect x="540" y="98" width="60" height="34" rx="7" fill="var(--panel-hi)" stroke="var(--accent-2)"/>' +
            '<text x="570" y="119" text-anchor="middle" fill="var(--ink)">concat</text>' +
            '<text x="570" y="150" text-anchor="middle" fill="var(--ink-faint)" font-size="10">6×16</text>' +
            // Wo box
            '<rect x="630" y="99" width="74" height="32" rx="7" fill="var(--panel-hi)" stroke="var(--line)"/>' +
            '<text x="667" y="119" text-anchor="middle" fill="var(--ink)">Wo (16×16)</text>' +
            '<text x="667" y="150" text-anchor="middle" fill="var(--ink-faint)" font-size="10">out 6×16</text>' +
            // arrow shape labels
            '<text x="120" y="108" text-anchor="middle" fill="var(--ink-faint)" font-size="10">6×16</text>' +
            '<text x="250" y="78"  text-anchor="middle" fill="var(--ink-faint)" font-size="10">6×4 ×4</text>' +
          '</svg>',
          "The whole pipeline at a glance: split d_model into H heads, attend in parallel subspaces, " +
          "concatenate back to d_model, then mix with Wo. The tabs and tracer below let you play with each stage."
        )
      ));

      /* ---------------------------------- PRIMARY interactive: heads as tabs */
      // Shared query selector drives BOTH the row highlight inside each head's
      // heatmap AND the Concat+Wo panel below. Clicking a heatmap row syncs it.
      var selQuery = 1; // default 'cat'
      var highlightSharp = false;

      // Per-head enable flags for the side-by-side comparison block (all ON).
      var enabledHeads = [];
      for (var eh = 0; eh < H; eh++) enabledHeads.push(true);

      // Forward decls so cross-updates work.
      var concatPanel = TQ.el("div", { class: "tq-panel tq-grow tq-mh-concat" });
      var querySel = TQ.segmented({
        options: tokens.map(function (tk, i) { return { label: tk, value: i }; }),
        value: selQuery,
        onChange: function (v) { selQuery = v; renderConcat(); refreshActiveHeatmap(); renderCompare(); }
      });
      var sharpToggle = TQ.toggle({
        label: "Highlight sharpest head",
        value: false,
        onChange: function (v) { highlightSharp = v; renderConcat(); }
      });

      // Track the currently-mounted heatmap so a query change can re-highlight
      // its selected row without flipping tabs.
      var activeHeadIdx = 0;
      var activeHeatHolder = null;

      function buildHeadHeatmap(headIdx) {
        return TQ.heatmap(heads[headIdx].att.weights, {
          rowLabels: tokens, colLabels: tokens, cellSize: 44,
          min: 0, max: 1, // attention weights are probabilities in [0,1]
          selectedRow: selQuery,
          format: function (v) { return TQ.fmt(v, 2); }
        });
      }

      function wireHeatRows(node) {
        // Make whole rows clickable to set the query (clicking any cell in a
        // row selects that query). Kernel already makes cells keyboard-able.
        var cells = node.querySelectorAll(".tq-hm-cell");
        var idx = 0;
        for (var r = 0; r < n; r++) {
          for (var c = 0; c < n; c++) {
            (function (rr, cell) {
              cell.classList.add("is-clickable");
              cell.setAttribute("role", "button");
              cell.setAttribute("tabindex", "0");
              cell.addEventListener("click", function () { setQuery(rr); });
              cell.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setQuery(rr); }
              });
            })(r, cells[idx]);
            idx++;
          }
        }
      }

      function setQuery(q) {
        selQuery = q;
        querySel.set(q);
        refreshActiveHeatmap();
        renderConcat();
        renderCompare();
      }

      function refreshActiveHeatmap() {
        if (!activeHeatHolder) return;
        var fresh = buildHeadHeatmap(activeHeadIdx);
        wireHeatRows(fresh);
        activeHeatHolder.replaceChild(fresh, activeHeatHolder.firstChild);
      }

      var tabItems = [];
      for (var ht = 0; ht < H; ht++) {
        (function (headIdx) {
          tabItems.push({
            label: "Head " + (headIdx + 1),
            render: function (container) {
              activeHeadIdx = headIdx;
              var heat = buildHeadHeatmap(headIdx);
              wireHeatRows(heat);
              activeHeatHolder = TQ.el("div", { class: "tq-grow" }, heat);

              // Per-head quick stats so the "different lens" point is concrete.
              var rowEntropies = [];
              for (var q = 0; q < n; q++) rowEntropies.push(entropy(heads[headIdx].att.weights[q]));
              var meanE = TQ.mean(rowEntropies);
              var maxPossible = Math.log(n); // uniform-row entropy ceiling

              var info = TQ.el("div", { class: "tq-panel tq-mh-headinfo" },
                TQ.el("div", { class: "tq-mh-headinfo-h" },
                  TQ.el("strong", { text: "Head " + (headIdx + 1) }),
                  TQ.badge("own seeds " + (BASE + headIdx * 10 + 1) + "/" +
                    (BASE + headIdx * 10 + 2) + "/" + (BASE + headIdx * 10 + 3), "info")
                ),
                TQ.el("div", { class: "tq-mh-stats" },
                  TQ.kv("dk", String(dk)),
                  TQ.kv("avg row entropy", TQ.fmt(meanE, 2)),
                  TQ.kv("uniform max", TQ.fmt(maxPossible, 2))
                ),
                TQ.note("Each cell = how much the query (row) reads from the key (col). " +
                  "Every row is a softmax, so it sums to ≈1.00 and lives in [0,1]. " +
                  "(\"Row entropy\" above = how spread-out vs. peaked a row is: low = the head " +
                  "focuses hard on one key, high = it spreads attention evenly across keys.) " +
                  "Click any row to trace that query through Concat + Wo below.")
              );

              container.appendChild(TQ.el("div", { class: "tq-flexrow tq-mh-tabrow" },
                activeHeatHolder, info));
            }
          });
        })(ht);
      }

      var headsBlock = TQ.block(
        TQ.h(2, "Four heads, same sentence — genuinely different patterns"),
        TQ.p(
          "Each tab below is a real attention-weights heatmap (rows = query token, cols = key token) ",
          "for one head, computed from that head's ", TQ.el("strong", { text: "own seeded" }), " ",
          TQ.math("Wq/Wk/Wv"), ". The heads differ because each gets a different random seed for its ",
          "projections (", TQ.math("base + head·10"), "), so each carves out a genuinely different subspace ",
          "— same input, four different lenses. Nothing is faked; flip between tabs and watch the pattern change."
        )
      );
      var legend = TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "0 (ignore)" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "1 (focus)" })
      );
      headsBlock.appendChild(legend);
      headsBlock.appendChild(TQ.tabs(tabItems));
      headsBlock.appendChild(TQ.callout(
        "Don't over-romanticize it: in a trained model heads CAN specialize (one ends up syntax-ish, " +
        "another positional, etc.), but they're not cleanly labeled modules, and pruning studies show many " +
        "heads are redundant. Say \"they can specialize,\" not \"head 7 IS the syntax head.\""
      ));
      root.appendChild(headsBlock);

      /* ============================================================= *
       *  PRIMARY interactive — SAME query, four lenses, + union coverage.
       *  The comparison the tabs make impossible: all four heads' attention
       *  ROWS for ONE query, stacked on the same six key columns, plus a
       *  computed UNION row (elementwise max across the ENABLED heads).
       *  Drives off the existing module-scope selQuery (no second selector).
       * ============================================================= */
      var comparePanel = TQ.el("div", { class: "tq-panel tq-grow tq-mh-cmp" });

      // one head-row strip: heads[h].att.weights[q] as a 1×6 heatmap, [0,1] scale
      function headRowStrip(h, q, dim) {
        var strip = TQ.heatmap([heads[h].att.weights[q]], {
          colLabels: tokens,
          rowLabels: ["head " + (h + 1)],
          cellSize: 44, min: 0, max: 1,
          selectedCol: argmaxIdx(heads[h].att.weights[q]),
          format: function (v) { return TQ.fmt(v, 2); }
        });
        return TQ.el("div", { class: "tq-mh-cmp-row" + (dim ? " is-off" : "") }, strip);
      }

      function renderCompare() {
        comparePanel.innerHTML = "";
        var q = selQuery;

        // header — which query we're comparing across heads
        comparePanel.appendChild(TQ.el("div", { class: "tq-mh-concat-head" },
          TQ.el("span", { class: "tq-stat-cap", text: "same query, four lenses" }),
          TQ.el("span", { class: "tq-mh-qtoken", text: "\"" + tokens[q] + "\" (#" + q + ")" })
        ));

        // shared column-header alignment is handled by each heatmap's colLabels.
        var grid = TQ.el("div", { class: "tq-mh-cmp-grid" });

        // four head rows (dim + excluded from union when toggled off)
        for (var hi = 0; hi < H; hi++) {
          grid.appendChild(headRowStrip(hi, q, !enabledHeads[hi]));
        }

        // UNION row = elementwise max across the ENABLED heads (genuinely live).
        var enabledIdx = [];
        for (var ei = 0; ei < H; ei++) if (enabledHeads[ei]) enabledIdx.push(ei);
        var union = [];
        for (var k = 0; k < n; k++) {
          if (enabledIdx.length === 0) { union.push(0); continue; }
          union.push(TQ.maxOf(enabledIdx.map(function (h) { return heads[h].att.weights[q][k]; })));
        }
        var unionStrip = TQ.heatmap([union], {
          colLabels: tokens,
          rowLabels: ["union (max)"],
          cellSize: 44, min: 0, max: 1,
          format: function (v) { return TQ.fmt(v, 2); }
        });
        grid.appendChild(TQ.el("div", { class: "tq-mh-cmp-row tq-mh-cmp-union" }, unionStrip));
        comparePanel.appendChild(grid);

        // readout: per-head argmax chips (enabled only) + distinct-keys-covered badge
        var distinct = {};
        var readout = TQ.el("div", { class: "tq-mh-cmp-readout" });
        readout.appendChild(TQ.el("span", { class: "tq-stat-cap", text: "peaks" }));
        for (var ci = 0; ci < H; ci++) {
          var am = argmaxIdx(heads[ci].att.weights[q]);
          var on = enabledHeads[ci];
          if (on) distinct[am] = true;
          readout.appendChild(TQ.badge(
            "head" + (ci + 1) + "→" + tokens[am] + (on ? "" : " (off)"),
            on ? "info" : "default"
          ));
        }
        var nDistinct = Object.keys(distinct).length;
        readout.appendChild(TQ.badge(
          nDistinct + " distinct key" + (nDistinct === 1 ? "" : "s") + " covered",
          nDistinct >= 3 ? "good" : "warn"
        ));
        comparePanel.appendChild(readout);

        // honest "they differ in WHERE, not in sharpness" annotation via entropy
        var ents = [];
        for (var pe = 0; pe < H; pe++) ents.push(entropy(heads[pe].att.weights[q]));
        comparePanel.appendChild(TQ.note(
          "Each strip is one head's softmax row for \"" + tokens[q] + "\" over the six keys (same [0,1] color " +
          "scale as the tabs). Each head's argmax key (its column label) is highlighted. The heads differ mostly " +
          "in WHERE they peak, not how " +
          "sharp they are — row entropies here are " +
          ents.map(function (e) { return TQ.fmt(e, 2); }).join(" / ") +
          " (uniform ceiling ln 6 = " + TQ.fmt(Math.log(n), 2) + " — the entropy a row would have if attention " +
          "were spread perfectly evenly across all six keys). The bottom UNION row is the elementwise " +
          "max across the ENABLED heads: drop to one head and it collapses to that head's narrow row; enable all " +
          "four and it lights up across keys no single head reached."
        ));
      }

      // four head on/off toggles (all default ON) — recompute union live.
      var cmpToggles = TQ.el("div", { class: "tq-mh-cmp-toggles" });
      for (var tg = 0; tg < H; tg++) {
        (function (hIdx) {
          var tgl = TQ.toggle({
            label: "Head " + (hIdx + 1),
            value: true,
            onChange: function (on) { enabledHeads[hIdx] = on; renderCompare(); }
          });
          cmpToggles.appendChild(tgl.el);
        })(tg);
      }

      var compareBlock = TQ.block(
        TQ.h(2, "Same query, four lenses — and what they cover together"),
        TQ.p(
          "The tabs above show one head at a time, so you have to hold one 6×6 grid in your head while you flip ",
          "to the next. Here is the comparison the tabs can't make: pick a query (the ",
          TQ.el("strong", { text: "same selector that drives Concat below" }),
          ") and see all four heads' attention ", TQ.el("strong", { text: "rows" }),
          " for it, stacked on the same six key columns."
        ),
        TQ.p(
          "The bottom ", TQ.el("strong", { text: "union" }), " row is computed live as the elementwise ",
          TQ.math("max"), " across the enabled heads. Toggle heads off and watch coverage shrink to a single ",
          "narrow row; turn them back on and the union blooms across keys no single head reaches alone — the ",
          "concrete meaning of \"multiple simultaneous ways to relate tokens.\""
        ),
        TQ.el("div", { class: "tq-controls-row" },
          TQ.el("div", {},
            TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Heads in the union"),
            cmpToggles)
        ),
        comparePanel,
        TQ.callout(
          "No single head covers cat→{The, mat, on} at once — the bank does. That breadth is exactly what " +
          "Concat + Wo merges into one vector next."
        )
      );
      renderCompare();
      root.appendChild(compareBlock);

      /* --------------------------- Concat + Wo panel (depends on selQuery) */
      function renderConcat() {
        concatPanel.innerHTML = "";
        var q = selQuery;
        var sharp = sharpestHead(q);

        concatPanel.appendChild(TQ.el("div", { class: "tq-mh-concat-head" },
          TQ.el("span", { class: "tq-stat-cap", text: "tracing query token" }),
          TQ.el("span", { class: "tq-mh-qtoken", text: "\"" + tokens[q] + "\" (#" + q + ")" })
        ));

        // 1) each head's dk-vector output for this token
        var headRows = TQ.el("div", { class: "tq-mh-headvecs" });
        for (var hi = 0; hi < H; hi++) {
          var isSharp = (hi === sharp);
          var dim = highlightSharp && !isSharp;
          var wrap = TQ.el("div", { class: "tq-mh-headvec" + (dim ? " is-dim" : "") },
            TQ.el("div", { class: "tq-mh-headvec-label" },
              TQ.el("span", { text: "head " + (hi + 1) + " · " + dk + "d" }),
              (highlightSharp && isSharp)
                ? TQ.badge("sharpest ✦", "good")
                : null
            ),
            TQ.vectorView(heads[hi].att.output[q], { cellSize: 26, showValues: true })
          );
          headRows.appendChild(wrap);
        }
        concatPanel.appendChild(TQ.el("div", { class: "tq-mh-step" },
          TQ.el("div", { class: "tq-mh-step-label", text: "1 · each head outputs a " + dk + "-dim vector" }),
          headRows
        ));

        // 2) concatenate -> length 16 = d_model
        concatPanel.appendChild(TQ.el("div", { class: "tq-mh-step" },
          TQ.el("div", { class: "tq-mh-step-label", text: "2 · concatenate → " + (H * dk) + "-dim (" + H + " × " + dk + " = " + (H * dk) + ")" }),
          TQ.vectorView(concatAll[q], { cellSize: 22, showValues: true })
        ));

        // 3) project by Wo -> final d_model vector
        concatPanel.appendChild(TQ.el("div", { class: "tq-mh-step" },
          TQ.el("div", { class: "tq-mh-step-label", text: "3 · × Wo (" + (H * dk) + "×" + dModel + ") → final " + dModel + "-dim vector" }),
          TQ.vectorView(Final[q], { cellSize: 22, showValues: true })
        ));

        concatPanel.appendChild(TQ.note(
          "Concat returns you to model width; " +
          "Wo is the learned mixer that lets the heads talk — without it you'd just have four " +
          "disconnected subspace results. " + (highlightSharp
            ? ("Sharpest head for \"" + tokens[q] + "\" is head " + (sharp + 1) +
               " (lowest row entropy = most confident).")
            : "Toggle \"sharpest head\" to spotlight the most confident head for this query.")
        ));
      }

      var concatBlock = TQ.block(
        TQ.h(2, "Concat, then project back: the part everyone skips"),
        TQ.p(
          "Each head outputs an ", TQ.math("n × dk"), " matrix (one ", TQ.math("dk"),
          "-vector per token). You can't just hand four separate ", TQ.math("dk"),
          "-vectors to the next layer — it expects width ", TQ.math("d_model"),
          ". So per token you ", TQ.el("strong", { text: "concatenate" }), " the H head-outputs back to length ",
          TQ.math("H·dk = " + (H * dk)), ", then multiply by ONE more learned matrix ",
          TQ.math("Wo"), " of shape ", TQ.math((H * dk) + "×" + dModel), ". ",
          TQ.math("MultiHead(X) = Concat(head_1..head_H)·Wo"), "."
        ),
        TQ.p(
          "Pick which token to trace; watch its four short ", TQ.math("dk=" + dk),
          " vectors snap together into one ", TQ.math((H * dk) + "-cell"),
          " vector, which then becomes a DIFFERENT ", TQ.math(dModel + "-cell"),
          " vector after ", TQ.math("Wo"), "."
        ),
        TQ.el("div", { class: "tq-controls-row" },
          TQ.el("div", {},
            TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Query token"),
            querySel.el),
          TQ.el("div", {},
            TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" } }, "Options"),
            sharpToggle.el)
        ),
        concatPanel
      );
      renderConcat();
      // Minimal, correct PyTorch forward pass that maps 1:1 onto this toy:
      // d_model=16, H=4, dk=4. The (B, n, H, dk) reshape is the batched view
      // that runs all heads in parallel — exactly what the tracer above showed.
      concatBlock.appendChild(TQ.code(
        "import torch\n" +
        "import torch.nn as nn\n" +
        "import torch.nn.functional as F\n" +
        "\n" +
        "class MultiHeadAttention(nn.Module):\n" +
        "    def __init__(self, d_model=16, n_heads=4):\n" +
        "        super().__init__()\n" +
        "        self.n_heads = n_heads\n" +
        "        self.d_k = d_model // n_heads        # 16 // 4 = 4 (this level's dk)\n" +
        "        self.w_q = nn.Linear(d_model, d_model)   # one (16->16) projection each\n" +
        "        self.w_k = nn.Linear(d_model, d_model)\n" +
        "        self.w_v = nn.Linear(d_model, d_model)\n" +
        "        self.w_o = nn.Linear(d_model, d_model)   # the learned output mixer\n" +
        "\n" +
        "    def forward(self, x):                    # x: (B, n, d_model)\n" +
        "        B, n, _ = x.shape\n" +
        "        # project, then split d_model into (n_heads, d_k) and move heads up front\n" +
        "        # (B, n, d_model) -> (B, n, H, d_k) -> (B, H, n, d_k): the batched view\n" +
        "        q = self.w_q(x).view(B, n, self.n_heads, self.d_k).transpose(1, 2)\n" +
        "        k = self.w_k(x).view(B, n, self.n_heads, self.d_k).transpose(1, 2)\n" +
        "        v = self.w_v(x).view(B, n, self.n_heads, self.d_k).transpose(1, 2)\n" +
        "        # scaled dot-product attention, applied across ALL heads at once\n" +
        "        scores = q @ k.transpose(-2, -1) / (self.d_k ** 0.5)   # (B, H, n, n)\n" +
        "        attn = F.softmax(scores, dim=-1)     # one softmax runs all H heads\n" +
        "        out = attn @ v                       # (B, H, n, d_k)\n" +
        "        # transpose + reshape back: this IS the concat, width H*d_k = 16 = d_model\n" +
        "        out = out.transpose(1, 2).reshape(B, n, self.n_heads * self.d_k)\n" +
        "        return self.w_o(out)                 # (B, n, d_model)\n",
        { lang: "python", label: "multi-head attention",
          caption: "The (B, n, H, dk) reshape is the whole trick: one batched softmax runs all H heads in " +
                   "parallel; transpose+reshape is the concat; w_o is the mixer." }
      ));
      root.appendChild(concatBlock);

      /* --------------------------------------------------- wrap-up takeaway */
      root.appendChild(TQ.block(
        TQ.h(2, "Why subspaces — and where this goes next"),
        TQ.p(
          "Splitting ", TQ.math("d_model"), " into H slices of size ", TQ.math("dk"),
          " isn't free capacity — total parameters are roughly the same as one full-width head. The win is ",
          TQ.el("strong", { text: "structural" }), ": H independent softmaxes can each commit fully to one ",
          "relation instead of one softmax averaging them all."
        ),
        TQ.callout(
          "Carry forward: MultiHead(X) = Concat(head_1..head_H)·Wo. The final " + dModel +
          "-dim vector you just built is exactly what flows into the residual + LayerNorm + FFN of a " +
          "transformer block — the next level."
        )
      ));

      /* ----------------------------------------------------- go deeper links */
      root.appendChild(TQ.resources("Go deeper", [
        { label: "The Illustrated Transformer", kind: "blog",

          note: "the visual walkthrough this level's preread points at — multi-head section" },
        { label: "3Blue1Brown — Attention, visually explained", kind: "video",

          url: "https://www.youtube.com/watch?v=kCc8FmEb1nY",
          note: "codes the exact (B, n, H, dk) reshape above, from scratch" },
        { label: "The Annotated Transformer", kind: "code",
          url: "https://nlp.seas.harvard.edu/annotated-transformer/",
          note: "line-by-line PyTorch alongside the original paper" },
        { label: "Attention Is All You Need (§3.2.2, Multi-Head Attention)", kind: "paper",
          url: "https://arxiv.org/abs/1706.03762",
          note: "the source — the Concat·Wo formula in its original form" }
      ]));

      /* small scoped styles (colors via CSS vars only — no hardcoded hex) */
      injectOnce("tq-lvl04-css",
        ".tq-mh-arith{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}" +
        ".tq-mh-arith-item{display:inline-flex}" +

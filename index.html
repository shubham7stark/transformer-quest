/* ===== 09-mla.js ===== */
/* ============================================================================
 * LEVEL 09 — Multi-Head Latent Attention (DeepSeek)   (order 9)
 * ----------------------------------------------------------------------------
 * The payoff of the KV-cache arc. MHA/GQA/MQA shrink the cache by sharing K/V
 * across heads. MLA asks a sharper question: why cache per-head K/V at all?
 * Down-project every token to ONE small latent vector c (that's all you cache,
 * plus a tiny decoupled RoPE key), and UP-project back to rich per-head K/V at
 * use time. It's a low-rank factorization of the KV projection.
 *
 * Everything shown is genuinely computed via TQ math (no faked numbers):
 *   - per-head K/V from TQ.toyQKV(head_dim, seedQ+i, seedK+i, seedV+i)
 *   - latent c = embeddings · W_DKV (W_DKV = TQ.randMatrix(dModel, d_c, seed))
 *   - rope key  r = embeddings · W_rope
 *   - reconstructed K_i = c · W_UK_i, V_i = c · W_UV_i  (low-rank up-projection)
 *   - the four cache formulas (MHA/GQA/MQA/MLA) on ONE shared TQ.barRow axis
 *
 * Pattern copied from level 01: one IIFE, ONE TQ.registerLevel, no other
 * globals, all color via TQ.colorFor / vectorView / barRow.
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "mla",
    order: 9,
    title: "Multi-Head Latent Attention (DeepSeek)",
    icon: "💎",
    tagline: "Don't just share KV heads — compress them into a tiny shared latent you cache.",
    preread: "DeepSeek MLA",
    objectives: [
      "Understand MLA: down-project K/V into one small latent vector c (cached), up-project to per-head K/V at use time",
      "See the decoupled RoPE key carried separately alongside the latent",
      "Compare MLA cache vs MHA/GQA/MQA on the same axes — MLA can match MHA quality while caching far less than even GQA"
    ],

    render: function (root) {
      var toy = TQ.toy;
      var tokens = toy.tokens;
      var emb = toy.embeddings;
      var dModel = toy.dModel;
      var n = tokens.length;

      /* ============================================================== *
       *  NARRATIVE BLOCK 1 — the cache is the bottleneck
       * ============================================================== */
      root.appendChild(TQ.block(
        TQ.h(2, "The cache is the bottleneck — so stop caching K and V"),
        TQ.p(
          "You've met the KV cache: per token, per layer, you stash every head's ",
          TQ.el("strong", { text: "K" }), " and ", TQ.el("strong", { text: "V" }),
          " so attention over history isn't recomputed each step. Plain ",
          TQ.el("strong", { text: "MHA" }), " caches ", TQ.math("2 · n_heads · head_dim"),
          " numbers per token per layer. ", TQ.el("strong", { text: "GQA/MQA" }),
          " shrank that by letting heads ", TQ.el("em", { text: "share" }),
          " K/V (fewer kv-heads)."
        ),
        TQ.p(
          TQ.el("strong", { text: "MLA asks a sharper question:" }),
          " why cache per-head K/V at all? Cache one small shared latent vector ",
          TQ.math("c"), " and reconstruct every head's K and V from it on the fly. ",
          "You already know this move from your CV days — it's a ",
          TQ.el("strong", { text: "low-rank factorization" }),
          ". The full per-head K/V projection is a fat matrix; MLA factors it as ",
          "“squeeze down to ", TQ.math("d_c"), ", then expand back up.” ",
          "You store only the squeezed thing."
        ),
        TQ.callout([
          "Bridge from SVD: replacing a fat projection with down-then-up (rank ",
          TQ.math("d_c"), ") is exactly rank-k truncation. The latent ", TQ.math("c"),
          " is the compressed code; the up-projections are the basis that re-expands it."
        ])
      ));

      /* ============================================================== *
       *  NARRATIVE BLOCK 2 — down/up projection
       * ============================================================== */
      root.appendChild(TQ.block(
        TQ.h(2, "Down-project to cache, up-project to use"),
        TQ.p(
          "Each token's embedding ", TQ.math("h"), " is multiplied by a down-projection ",
          TQ.math("W_DKV"), " to produce a latent ", TQ.math("c"), " of dimension ",
          TQ.math("d_c"), " — small (think 512 when the full K/V across all heads would be ~16k). ",
          TQ.math("c"), " is the ", TQ.el("strong", { text: "only" }),
          " thing written to the cache (plus the rope key below)."
        ),
        TQ.p(
          "At attention time you up-project: ", TQ.math("K_i = c · W_UK_i"),
          " and ", TQ.math("V_i = c · W_UV_i"), " give head ", TQ.math("i"),
          "'s keys and values. Because ", TQ.math("W_UK"), " and ", TQ.math("W_UV"),
          " are fixed model weights, they don't live in the cache — they're paid once. ",
          "So a cache that scaled with ", TQ.math("n_heads · head_dim"),
          " now scales with just ", TQ.math("d_c"), ". That's the whole trick, and it's ",
          "why MLA can match MHA quality (the up-projection lets each head recover a rich, ",
          "distinct K/V) while caching less than even GQA."
        )
      ));

      /* ============================================================== *
       *  NARRATIVE BLOCK 3 — decoupled RoPE
       * ============================================================== */
      root.appendChild(TQ.block(
        TQ.h(2, "Why RoPE has to ride alongside (the decoupled key)"),
        TQ.p(
          "Here's the subtle bug MLA designs around. ", TQ.el("strong", { text: "RoPE" }),
          " (the rotary position trick from L5) rotates each key by an angle that depends on ",
          "the token's absolute position ", TQ.el("em", { text: "before" }),
          " the dot product — so ", TQ.math("q·k"), " ends up depending only on relative distance. ",
          "If you bake RoPE into the cached latent, the rotation is frozen at cache-time and you can ",
          "no longer absorb the up-projection ", TQ.math("W_UK"),
          " into the query side; the position math and the low-rank math fight."
        ),
        TQ.p(
          "Make that 'absorb' concrete. The content score is ", TQ.math("q · K_iᵀ = (x·W_Q) · (c·W_UK)ᵀ"),
          ". Matrix multiply is associative, so you can pre-fold ", TQ.math("W_UK"),
          " into the query projection once: ", TQ.math("W_Q' = W_Q · W_UKᵀ"),
          ", and then the score is just ", TQ.math("(x·W_Q') · cᵀ"),
          " — the per-head key ", TQ.math("K_i"),
          " is never actually materialized from the latent at decode time; you dot the query straight against the tiny cached ",
          TQ.math("c"), ". That folding is exactly what makes MLA cheap. But RoPE inserts a ",
          TQ.el("em", { text: "position-dependent rotation" }), " R(pos) between ", TQ.math("c"),
          " and the query (", TQ.math("q·R(pos)·(c·W_UK)ᵀ"),
          "), and R(pos) changes every token — so it can't be pre-folded into a single fixed ",
          TQ.math("W_Q'"), ". That's the collision, and why the rope key is split out."
        ),
        TQ.p(
          "DeepSeek's fix: split the key in two. A ", TQ.el("strong", { text: "content" }),
          " part comes from the latent ", TQ.math("c"),
          " (no position, fully compressible). A small ", TQ.el("strong", { text: "separate" }),
          " rope key ", TQ.math("k_rope"), " of dimension ", TQ.math("d_rope"),
          " carries the rotary position info and is cached as-is beside ", TQ.math("c"),
          ". The query gets a matching rope part. Final score = (content from latent) + (rope part). ",
          "You cache ", TQ.math("d_c + d_rope"),
          " per token per layer — still tiny — and position survives compression."
        )
      ));

      /* ============================================================== *
       *  PRIMARY VISUAL 1 — collapse / cache / expand stepper
       * ============================================================== */
      var animBlock = TQ.block(
        TQ.h(2, "Watch the collapse → cache → expand"),
        TQ.p(
          "Real numbers from our toy sentence. We follow token ",
          TQ.el("strong", { text: "“cat”" }),
          " (#1). Step through: many tall per-head K/V columns ", TQ.el("strong", { text: "collapse" }),
          " into ONE short latent ", TQ.math("c"), " (+ a small rope key ", TQ.math("r"),
          "); that latent is all that's cached; then it ", TQ.el("strong", { text: "expands" }),
          " back out to full per-head K/V at use time — no head merged away."
        )
      );
      var legend = TQ.el("div", { class: "tq-legend" },
        TQ.el("span", { text: "low" }),
        TQ.el("div", { class: "tq-legend-scale" }),
        TQ.el("span", { text: "high" })
      );
      animBlock.appendChild(legend);

      // ---- fixed dims for the animation (kept legible / small) ----
      var ANIM_HEADS = 4;     // show 4 heads so the collapse is dramatic but readable
      var ANIM_HEAD_DIM = 8;  // per-head K/V dim for the toy
      var ANIM_DC = 6;        // toy latent dim (short column)
      var ANIM_DROPE = 3;     // toy rope key dim (tiny)
      var TOK = 1;            // "cat"

      // seeds (distinct so heads/projections differ deterministically)
      var SEED_BASE_Q = 1100, SEED_BASE_K = 2200, SEED_BASE_V = 3300;
      var SEED_DKV = 9001, SEED_ROPE = 9101, SEED_BASE_UK = 9200, SEED_BASE_UV = 9400;

      // per-head K and V (real), for the followed token
      var headK = [], headV = [];
      for (var hh = 0; hh < ANIM_HEADS; hh++) {
        var qkv = TQ.toyQKV(ANIM_HEAD_DIM, SEED_BASE_Q + hh, SEED_BASE_K + hh, SEED_BASE_V + hh);
        headK.push(qkv.K[TOK]);
        headV.push(qkv.V[TOK]);
      }

      // latent c = emb · W_DKV  (real); take the followed token's row
      var W_DKV = TQ.randMatrix(dModel, ANIM_DC, SEED_DKV);
      var Cmat = TQ.matmul(emb, W_DKV);
      var cVec = Cmat[TOK];

      // rope key r = emb · W_rope (real)
      var W_ROPE = TQ.randMatrix(dModel, ANIM_DROPE, SEED_ROPE);
      var Rmat = TQ.matmul(emb, W_ROPE);
      var rVec = Rmat[TOK];

      // reconstructed per-head K/V from the latent: K_i = c · W_UK_i (real)
      // (c is 1xd_c here; wrap as a 1-row matrix to matmul with d_c x head_dim)
      var cRow = [cVec];
      var reK = [], reV = [];
      for (var uh = 0; uh < ANIM_HEADS; uh++) {
        var W_UK = TQ.randMatrix(ANIM_DC, ANIM_HEAD_DIM, SEED_BASE_UK + uh);
        var W_UV = TQ.randMatrix(ANIM_DC, ANIM_HEAD_DIM, SEED_BASE_UV + uh);
        reK.push(TQ.matmul(cRow, W_UK)[0]);
        reV.push(TQ.matmul(cRow, W_UV)[0]);
      }

      // helper: a labelled column of K and V vectorViews for one head
      function headColumn(label, kvec, vvec, dim) {
        return TQ.el("div", { class: "tq-mla-headcol" },
          TQ.el("div", { class: "tq-mla-headcap", text: label }),
          TQ.vectorView(kvec, { label: "K", cellSize: 16 }),
          TQ.vectorView(vvec, { label: "V", cellSize: 16 }),
          TQ.el("div", { class: "tq-mla-dim", text: dim + "-d" })
        );
      }

      function stepPerHead(container, dim, ks, vs, capPrefix) {
        var cols = TQ.el("div", { class: "tq-mla-cols" });
        for (var i = 0; i < ANIM_HEADS; i++) {
          cols.appendChild(headColumn((capPrefix || "head ") + i, ks[i], vs[i], dim));
        }
        container.appendChild(cols);
      }

      function latentColumn() {
        return TQ.el("div", { class: "tq-mla-latentcol" },
          TQ.el("div", { class: "tq-mla-headcap", text: "latent c" }),
          TQ.vectorView(cVec, { label: "c", cellSize: 18 }),
          TQ.el("div", { class: "tq-mla-dim", text: "d_c = " + ANIM_DC })
        );
      }
      function ropeColumn(greyed) {
        return TQ.el("div", { class: "tq-mla-ropecol" + (greyed ? "" : " is-live") },
          TQ.el("div", { class: "tq-mla-headcap", text: "rope key r" }),
          TQ.vectorView(rVec, { label: "r", cellSize: 18 }),
          TQ.el("div", { class: "tq-mla-dim", text: "d_rope = " + ANIM_DROPE })
        );
      }

      var stepper = TQ.stepper([
        {
          label: "1 · Per-head K/V (what MHA caches)",
          run: function (c) {
            c.appendChild(TQ.p(
              ANIM_HEADS + " heads, each with its own ", TQ.math(ANIM_HEAD_DIM + "-d"),
              " K and V for token “cat”. MHA stores ", TQ.el("strong", { text: "all of these" }),
              " — that's ", TQ.math("2 · n_heads · head_dim"), " numbers per token per layer."
            ));
            stepPerHead(c, ANIM_HEAD_DIM, headK, headV);
          }
        },
        {
          label: "2 · Down-project → latent c (+ rope key r)",
          run: function (c) {
            c.appendChild(TQ.p(
              "All those columns collapse into ONE short latent ", TQ.math("c = h · W_DKV"),
              " of dim ", TQ.math("d_c = " + ANIM_DC),
              ", with a tiny decoupled rope key ", TQ.math("r"), " beside it."
            ));
            c.appendChild(TQ.el("div", { class: "tq-mla-merge" },
              latentColumn(), ropeColumn(false)
            ));
            c.appendChild(TQ.note(
              "The fat per-head K/V is gone — squeezed to a single low-rank code plus a position tag."
            ));
          }
        },
        {
          label: "3 · Cache only c (+ r) — this is ALL that's stored",
          run: function (c) {
            c.appendChild(TQ.p(
              "Everything except ", TQ.math("c"), " and ", TQ.math("r"),
              " is greyed out: the per-head K/V is NOT in the cache. ",
              "Only ", TQ.math("d_c + d_rope = " + (ANIM_DC + ANIM_DROPE)),
              " numbers per token per layer are written."
            ));
            var ghost = TQ.el("div", { class: "tq-mla-cols is-ghost" });
            for (var i = 0; i < ANIM_HEADS; i++) {
              ghost.appendChild(headColumn("head " + i, headK[i], headV[i], ANIM_HEAD_DIM));
            }
            c.appendChild(TQ.el("div", { class: "tq-mla-merge" },
              latentColumn(), ropeColumn(false),
              TQ.el("span", { class: "tq-mla-arrow", text: "✗ not cached →" }),
              ghost
            ));
            c.appendChild(TQ.callout(
              "The rope key never disappears — position info is cached separately and survives " +
              "compression (this is the L5 RoPE thread)."
            ));
          }
        },
        {
          label: "4 · Up-project at use time → rich per-head K/V again",
          run: function (c) {
            c.appendChild(TQ.p(
              "At attention time the tiny ", TQ.math("c"), " fans back OUT: ",
              TQ.math("K_i = c · W_UK_i"), ", ", TQ.math("V_i = c · W_UV_i"),
              ". Each head gets its own full ", TQ.math(ANIM_HEAD_DIM + "-d"),
              " K/V again — distinct per head, reconstructed not stored."
            ));
            c.appendChild(TQ.el("div", { class: "tq-mla-merge" },
              latentColumn(),
              TQ.el("span", { class: "tq-mla-arrow", text: "→ expand →" })
            ));
            stepPerHead(c, ANIM_HEAD_DIM, reK, reV, "K_/V_ head ");
            c.appendChild(TQ.note(
              "These are reconstructed via real " + TQ.fmt(ANIM_DC, 0) + "→" + ANIM_HEAD_DIM +
              " up-projections — no head was merged away, unlike GQA/MQA."
            ));
          }
        }
      ]);
      animBlock.appendChild(stepper);
      root.appendChild(animBlock);

      /* ============================================================== *
       *  PRIMARY VISUAL 2 — cache calculator (MHA/GQA/MQA/MLA)
       * ============================================================== */
      var calcBlock = TQ.block(
        TQ.h(2, "The cache calculator — four modes, one axis"),
        TQ.p(
          "Now the punchline on bytes. Same model config across all four modes so the bars are ",
          "directly comparable. Cache per token per layer:"
        ),
        TQ.el("div", { class: "tq-mla-formulas" },
          TQ.kv("MHA", "2 · n_heads · head_dim · bytes"),
          TQ.kv("GQA", "2 · n_kv_heads · head_dim · bytes"),
          TQ.kv("MQA", "2 · 1 · head_dim · bytes"),
          TQ.kv("MLA", "(d_c + d_rope) · bytes")
        ),
        TQ.note(
          "Note the MLA formula has NO factor of 2 and NO n_heads: the single latent c reconstructs " +
          "BOTH K and V for ALL heads, and the rope key is added once."
        )
      );

      // ---- fixed model config (matches L8 realistic defaults) ----
      var CFG = { nHeads: 32, headDim: 128, bytes: 2, nLayers: 60, seqLen: 8192 };

      // ---- live MLA + GQA knobs ----
      var dcVal = 512;
      var dropeVal = 64;
      var groupsVal = 4; // GQA groups -> n_kv_heads = nHeads / groups
      var axisMode = "perTok"; // or "total"

      function nKvHeads() {
        var k = Math.round(CFG.nHeads / groupsVal);
        return TQ.clamp(k, 1, CFG.nHeads);
      }

      // cache bytes per token per layer for each mode (REAL arithmetic)
      function bytesPerTok() {
        var mha = 2 * CFG.nHeads * CFG.headDim * CFG.bytes;
        var gqa = 2 * nKvHeads() * CFG.headDim * CFG.bytes;
        var mqa = 2 * 1 * CFG.headDim * CFG.bytes;
        var mla = (dcVal + dropeVal) * CFG.bytes;
        return { mha: mha, gqa: gqa, mqa: mqa, mla: mla };
      }

      function scaleFactor() {
        return axisMode === "total" ? (CFG.nLayers * CFG.seqLen) : 1;
      }

      // human-readable byte formatter
      function fmtBytes(v) {
        if (!isFinite(v)) return "—";
        if (v >= 1e9) return TQ.fmt(v / 1e9, 2) + " GB";
        if (v >= 1e6) return TQ.fmt(v / 1e6, 2) + " MB";
        if (v >= 1e3) return TQ.fmt(v / 1e3, 2) + " KB";
        return TQ.fmt(v, 0) + " B";
      }

      var barHolder = TQ.el("div", { class: "tq-grow" });
      var savingsHolder = TQ.el("div", {});

      function rebuild() {
        var per = bytesPerTok();
        var sf = scaleFactor();
        var vals = [per.mha * sf, per.gqa * sf, per.mqa * sf, per.mla * sf];

        barHolder.innerHTML = "";
        barHolder.appendChild(TQ.barRow(vals, {
          labels: ["MHA", "GQA-" + nKvHeads() + "kv", "MQA", "MLA"],
          max: vals[0], // MHA is the reference top of the axis
          format: fmtBytes,
          highlight: 3
        }));

        // savings callout (real ratios)
        var savVsMha = (1 - per.mla / per.mha) * 100;
        var savVsGqa = (1 - per.mla / per.gqa) * 100;
        var ratioMha = per.mha / per.mla;
        savingsHolder.innerHTML = "";
        savingsHolder.appendChild(TQ.callout(
          TQ.el("div", { class: "tq-flexcol", style: { gap: "4px" } },
            TQ.el("div", {},
              TQ.el("strong", { text: TQ.fmt(savVsMha, 1) + "% less than MHA" }),
              TQ.el("span", { class: "tq-mla-mute", text:
                "  (" + fmtBytes(per.mla * sf) + " vs " + fmtBytes(per.mha * sf) +
                " · " + TQ.fmt(ratioMha, 1) + "× smaller)" })
            ),
            TQ.el("div", {},
              (savVsGqa >= 0
                ? TQ.el("span", { text: TQ.fmt(savVsGqa, 1) + "% less than GQA-" + nKvHeads() + "kv too" })
                : TQ.el("span", { text: TQ.fmt(-savVsGqa, 1) + "% MORE than GQA-" + nKvHeads() + "kv (raise groups or lower d_c)" }))
            )
          )
        ));
      }

      // ---- controls ----
      var dcSlider = TQ.slider({
        min: 32, max: 1024, step: 32, value: dcVal, label: "d_c (latent dim)",
        format: function (v) { return TQ.fmt(v, 0); },
        onInput: function (v) { dcVal = v; rebuild(); }
      });
      var dropeSlider = TQ.slider({
        min: 0, max: 128, step: 8, value: dropeVal, label: "d_rope (decoupled rope key)",
        format: function (v) { return TQ.fmt(v, 0); },
        onInput: function (v) { dropeVal = v; rebuild(); }
      });
      var groupsSlider = TQ.slider({
        min: 1, max: 32, step: 1, value: groupsVal, label: "GQA groups (→ n_kv_heads = n_heads / groups)",
        format: function (v) { return TQ.fmt(v, 0) + " (" + Math.max(1, Math.round(CFG.nHeads / v)) + " kv)"; },
        onInput: function (v) { groupsVal = v; rebuild(); }
      });
      var axisSeg = TQ.segmented({
        options: [
          { label: "per token / layer", value: "perTok" },
          { label: "total cache (× layers × seq)", value: "total" }
        ],
        value: axisMode,
        onChange: function (v) { axisMode = v; rebuild(); }
      });

      var cfgChips = TQ.el("div", { class: "tq-mla-cfg" },
        TQ.kv("n_heads", String(CFG.nHeads)),
        TQ.kv("head_dim", String(CFG.headDim)),
        TQ.kv("bytes/elem", CFG.bytes + " (fp16)"),
        TQ.kv("n_layers", String(CFG.nLayers)),
        TQ.kv("seq_len", String(CFG.seqLen))
      );

      calcBlock.appendChild(cfgChips);
      calcBlock.appendChild(TQ.el("div", { class: "tq-controls-row tq-mla-controls" },
        dcSlider.el, dropeSlider.el, groupsSlider.el
      ));
      calcBlock.appendChild(TQ.el("div", { class: "tq-flexrow", style: { margin: "10px 0", alignItems: "center", gap: "10px" } },
        TQ.el("span", { class: "tq-slider-label", text: "axis" }), axisSeg.el
      ));
      calcBlock.appendChild(TQ.el("div", { class: "tq-panel" }, barHolder));
      calcBlock.appendChild(savingsHolder);
      calcBlock.appendChild(TQ.note(
        "Slide d_c down and MLA shrinks below MQA; slide it up and MLA rises toward GQA — that's the " +
        "rank-k fidelity knob you know from SVD. d_rope adds a small fixed floor that doesn't depend on n_heads."
      ));
      rebuild();
      root.appendChild(calcBlock);

      /* ============================================================== *
       *  WRAP-UP
       * ============================================================== */
      root.appendChild(TQ.block(
        TQ.h(2, "The emotional payoff"),
        TQ.p(
          "MQA < GQA < MHA was the L8 story. MLA drops ", TQ.el("strong", { text: "below GQA" }),
          " (and below MQA at small ", TQ.math("d_c"), ") while — per the design intent — keeping ",
          TQ.el("strong", { text: "MHA-level expressivity" }),
          ". GQA/MQA force heads to literally share K/V (a real quality hit); MLA reconstructs each head's ",
          "K/V from a shared latent through ", TQ.el("em", { text: "distinct" }),
          " up-projections, so heads stay individualized while only the small latent is cached."
        ),
        TQ.callout(
          "Near-lowest cache (far below MHA and GQA; comparable to MQA) AND full quality at once — that " +
          "juxtaposition is why DeepSeek-V2/V3 ship MLA. MQA gets slightly lower cache but sacrifices quality; " +
          "MLA keeps every head. It's not magic: it's a low-rank factorization of the KV projection with " +
          "position carried separately."
        )
      ));

      /* scoped styles — colors come only from CSS variables (no hardcoded hex) */
      injectOnce("tq-lvl09-css",
        ".tq-mla-cols{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin:6px 0}" +
        ".tq-mla-cols.is-ghost{opacity:.28;filter:grayscale(1)}" +
        ".tq-mla-headcol,.tq-mla-latentcol,.tq-mla-ropecol{display:flex;flex-direction:column;gap:6px;" +
          "align-items:flex-start;background:var(--panel-hi);border:1px solid var(--line);" +
          "border-radius:10px;padding:10px 12px}" +
        ".tq-mla-latentcol{border-color:var(--accent);box-shadow:var(--glow)}" +
        ".tq-mla-ropecol{border-style:dashed}" +
        ".tq-mla-ropecol.is-live{border-color:var(--info)}" +
        ".tq-mla-headcap{font-size:12px;font-weight:700;color:var(--ink-soft);font-family:var(--mono)}" +
        ".tq-mla-dim{font-size:10px;color:var(--ink-mute);font-family:var(--mono)}" +
        ".tq-mla-merge{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:6px 0}" +
        ".tq-mla-arrow{font-family:var(--mono);font-size:12px;color:var(--ink-mute);white-space:nowrap}" +
        ".tq-mla-formulas{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}" +
        ".tq-mla-cfg{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}" +
        ".tq-mla-controls{align-items:flex-start;gap:18px;flex-wrap:wrap}" +
        ".tq-mla-mute{color:var(--ink-mute);font-size:12px}");
    },

    quiz: [
      {
        q: "In MLA, what is actually written to the KV cache for each token (per layer)?",
        choices: [
          "The full per-head K and V for every head, like MHA",
          "One shared latent vector c (plus a small decoupled rope key) — per-head K/V are reconstructed from it at use time",
          "Only the query vectors Q for every head",
          "The averaged K/V across all heads, like MQA"
        ],
        answer: 1,
        explain: "MLA caches the small latent c and a small rope key. Each head's K and V are up-projected " +
                 "from c (K_i = c·W_UK_i, V_i = c·W_UV_i) at attention time — they are never stored."
      },
      {
        q: "Why does MLA keep a separate 'decoupled' RoPE key instead of compressing position into the latent c?",
        choices: [
          "RoPE keys are cheaper to compute than content keys",
          "Rotary position is applied before the dot product and depends on absolute position; baking it into the cached latent would break the low-rank factorization, so a small position-carrying key rides alongside c",
          "DeepSeek wanted a larger cache for accuracy",
          "Because RoPE only works on the value vectors, not the keys"
        ],
        answer: 1,
        explain: "RoPE's position-dependent rotation can't be absorbed into the up-projection if it's frozen " +
                 "inside the cached latent. Splitting off a small rope key keeps c position-free (fully " +
                 "compressible) while preserving relative-position info."
      },
      {
        q: "Using fp16 (2 bytes), n_heads=32, head_dim=128, MHA caches 2×32×128×2 = 16384 B per token per layer. With d_c=512 and d_rope=64, what does MLA cache, and roughly what saving?",
        choices: [
          "2×512×2 = 2048 B, ~88% saving",
          "(512+64)×2 = 1152 B, ~93% saving",
          "(512+64)×2×32 = 36864 B, it's actually larger",
          "512×64×2 = 65536 B, ~no saving"
        ],
        answer: 1,
        explain: "MLA caches (d_c + d_rope) × bytes = (512+64)×2 = 1152 B — no factor of 2 and no n_heads " +
                 "factor, since the single latent reconstructs both K and V for all heads. That's ~93% less " +
                 "than MHA's 16384 B."
      },
      {
        q: "The big claim is 'MLA matches MHA quality while caching less than GQA.' Which mechanism makes the quality part plausible?",
        choices: [
          "It uses more attention heads than MHA",
          "Each head's K/V is reconstructed from c via its own learned up-projection, so heads stay distinct and expressive — unlike GQA/MQA which force heads to literally share the same K/V",
          "It skips the softmax to save compute",
          "It caches Q as well as the latent"
        ],
        answer: 1,
        explain: "GQA/MQA reduce cache by making heads share identical K/V (a real expressivity hit). MLA " +
                 "instead reconstructs per-head K/V from a shared latent through distinct up-projections, so " +
                 "heads remain individualized while only the small latent is cached."
      }
    ]
  });

  // tiny helper local to this module (NOT a global): inject scoped CSS once.
  function injectOnce(id, css) {
    if (document.getElementById(id)) return;
    var s = document.createElement("style");
    s.id = id;
    s.textContent = css;
    document.head.appendChild(s);
  }
})();


/* ===== 10-boss-synthesis.js ===== */
/* ============================================================================
 * LEVEL 10 — Boss Level: The Whole Picture   (order 10)
 * ----------------------------------------------------------------------------
 * Synthesis level. No new math — it threads the SAME toy sentence
 * (TQ.toy) through every stage you've already built, then makes the
 * memory/quality trade-off numeric.
 *
 * Two PRIMARY interactions, all numbers genuinely computed via TQ math:
 *   1) A clickable 7-stage pipeline strip (Embed → Position → Q/K/V →
 *      Scaled Attention → Multi-Head → Block → KV Cache). Clicking a stage
 *      reveals a "what & why" card with a live number pulled from the toy:
 *        - Embed:    emb[1] ('cat') as a vectorView, d_model=16
 *        - Position: sinusoidalPE(6,16) row pos=1 as a vectorView
 *        - Q/K/V:    toyQKV(4,...) -> Q row for 'cat'
 *        - Scaled:   attention(Q,K,V) -> weights[1] as a barRow (sums to 1),
 *                    dk=4, 1/sqrt(4)=0.50, plus unscaled-vs-scaled peakiness
 *        - Multi:    2 heads, concat (6x8), ·Wo back to 16; concat[1]
 *        - Block:    project head output to 16, residual + LayerNorm
 *        - KV Cache: per-token-per-layer element formula
 *   2) A "spot the bottleneck" calculator: pick scheme (MHA/MQA/GQA/MLA),
 *      seq_len (log-ish steps), fp16/fp8 -> real KV-cache GB + savings.
 *
 * All color via TQ.colorFor / heatmap / vectorView / barRow (one language).
 * ========================================================================== */

(function () {
  "use strict";

  TQ.registerLevel({
    id: "boss-synthesis",
    order: 10,
    title: "Boss Level: The Whole Picture",
    icon: "🏁",
    tagline: "Connect the whole chain — and prove you can reason across it.",
    preread: "All four",
    objectives: [
      "Recap the full journey: tokens → attention → heads → position → block → KV cache → MHA/MQA/GQA/MLA",
      "Connect ideas across levels (why scaling, why the cache grows, why MLA wins)",
      "Pass a tougher mixed quiz and hit a celebratory completion state"
    ],

    render: function (root) {
      var toy = TQ.toy;
      var tokens = toy.tokens;
      var emb = toy.embeddings;
      var d = toy.dModel;          // 16
      var n = tokens.length;       // 6
      var CAT = 1;                 // index of "cat" — the token we trace

      /* ---------------------------------------------------- intro narrative */
      root.appendChild(TQ.block(
        TQ.h(2, "One sentence forward through the whole stack"),
        TQ.p(
          "You've built every piece; here's the chain in one breath. A token becomes a ",
          TQ.el("strong", { text: "vector" }), " (embedding). ",
          "Position gets stamped in (sinusoidal / RoPE) so order isn't lost. Each token projects to a ",
          TQ.el("strong", { text: "query, key, value" }), ". Attention scores every query against every key with a ",
          "dot product, divides by ", TQ.math("√dk"), " so the softmax doesn't saturate, normalizes to weights, ",
          "and mixes the values — that's one head. Many heads run in parallel, each reading a different ",
          "relationship; their outputs concat and pass through ", TQ.math("Wo"), ". Wrap that in ",
          TQ.el("strong", { text: "residual + LayerNorm" }), ", add an FFN, stack the block N times, and predict ",
          "the next token."
        ),
        TQ.p(
          "The ", TQ.el("strong", { text: "KV cache" }), " is the one thing that survives between tokens at ",
          "inference — and it's the thing that bankrupts you at long context. ",
          TQ.el("strong", { text: "MHA / MQA / GQA / MLA" }), " are all answers to one question: ",
          TQ.el("em", { text: "how do we shrink that cache without lobotomizing the model?" }),
          " Click through the pipeline below — the same six-word toy sentence you've followed since Level 1 ",
          "runs through every stage, so the recap is concrete, not abstract."
        ),
        TQ.el("div", { class: "tq-token-strip" },
          tokens.map(function (tk, i) {
            return TQ.el("span", { class: "tq-token-chip" + (i === CAT ? " is-trace" : "") },
              TQ.el("span", { class: "tq-token-idx", text: "#" + i }),
              TQ.el("span", { class: "tq-token-word", text: tk })
            );
          })
        ),
        TQ.note("We trace token #1, \"cat\", through every stage so you watch one concrete vector move.")
      ));

      /* ============================================================ *
       *  PRIMARY 1 — the clickable pipeline strip
       * ============================================================ */

      // --- precompute everything once (all real TQ math) -----------------
      var dk = 4;

      // Stage 2: positional encoding
      var PE = TQ.sinusoidalPE(n, d);

      // Stage 3: Q/K/V (single head, documented seeds)
      var qkv = TQ.toyQKV(dk, 101, 202, 303);

      // Stage 4: scaled attention
      var att = TQ.attention(qkv.Q, qkv.K, qkv.V);
      var scaleFactor = 1 / Math.sqrt(att.dk);          // 0.50 for dk=4
      var weightsCat = att.weights[CAT];                 // valid prob dist (sums to 1)
      var unscaledWeightsCat = TQ.softmax(att.scores[CAT]); // softmax of UNscaled scores

      // Stage 5: multi-head — two heads, concat (6x8), ·Wo -> 6x16
      var head0 = TQ.toyQKV(dk, 101, 202, 303);
      var head1 = TQ.toyQKV(dk, 111, 212, 313);
      var o0 = TQ.attention(head0.Q, head0.K, head0.V).output; // 6x4
      var o1 = TQ.attention(head1.Q, head1.K, head1.V).output; // 6x4
      var concat = [];
      for (var rc = 0; rc < n; rc++) concat.push(o0[rc].concat(o1[rc])); // 6x8
      var Wo = TQ.randMatrix(2 * dk, d, 404);            // 8x16
      var multiOut = TQ.matmul(concat, Wo);              // 6x16

      // Stage 6: block — residual + post-LayerNorm on the trace token.
      // The head output dim (8 after concat·Wo it's 16) — use multiOut[1] which
      // is already d_model=16, so the residual add is dimension-clean.
      var blockX = emb[CAT];                             // 16-d embedding
      var blockSub = multiOut[CAT];                      // 16-d attention sublayer output
      var blockRes = [];
      for (var bi = 0; bi < d; bi++) blockRes.push(blockX[bi] + blockSub[bi]); // x + sublayer
      var blockNorm = TQ.layerNorm(blockRes);            // post-LN

      // helper for inline labelled stat chips
      function statChip(label, value) {
        return TQ.kv(label, value);
      }

      // each stage: {key, icon, title, oneLine, render(container)}
      var stages = [
        {
          key: "embed", icon: "🔠", title: "Embed",
          why: "Token → a learned d_model-vector. Meaning lives in this geometry.",
          run: function (c) {
            c.appendChild(TQ.p(
              TQ.el("strong", { text: "What & why: " }),
              "the token \"cat\" is looked up as a ", TQ.math("d_model = " + d),
              "-dimensional vector. Everything downstream operates on rows like this one."
            ));
            c.appendChild(TQ.vectorView(emb[CAT], { label: "emb[\"cat\"]", cellSize: 22 }));
            c.appendChild(TQ.el("div", { class: "tq-boss-stats" },
              statChip("d_model", String(d)),
              statChip("‖emb‖", TQ.fmt(TQ.norm(emb[CAT]), 2))
            ));
          }
        },
        {
          key: "pos", icon: "📍", title: "Position",
          why: "Order is stamped in so the model knows token 1 from token 5.",
          run: function (c) {
            c.appendChild(TQ.p(
              TQ.el("strong", { text: "What & why: " }),
              "attention itself is order-blind, so we add a positional signal. Sinusoidal PE for ",
              TQ.math("pos = " + CAT), " uses ", TQ.math("PE(pos,2i)=sin(pos/10000^(2i/d))"),
              " on even dims, ", TQ.math("cos(…)"), " on odd."
            ));
            c.appendChild(TQ.vectorView(PE[CAT], { label: "PE[pos=1]", cellSize: 22, max: 1 }));
            c.appendChild(TQ.note("The real input to the next stage is emb + PE; here we show the PE row " +
              "alone so the positional fingerprint is visible."));
          }
        },
        {
          key: "qkv", icon: "🎯", title: "Q / K / V",
          why: "Each token projects to a query, key, and value via Wq, Wk, Wv.",
          run: function (c) {
            c.appendChild(TQ.p(
              TQ.el("strong", { text: "What & why: " }),
              "three learned projections turn each embedding into a ", TQ.el("strong", { text: "query" }),
              " (what am I looking for?), a ", TQ.el("strong", { text: "key" }),
              " (what do I offer?), and a ", TQ.el("strong", { text: "value" }),
              " (what I'll pass on). Here ", TQ.math("dk = " + dk), "."
            ));
            c.appendChild(TQ.vectorView(qkv.Q[CAT], { label: "Q[\"cat\"]", cellSize: 26 }));
            c.appendChild(TQ.vectorView(qkv.K[CAT], { label: "K[\"cat\"]", cellSize: 26 }));
            c.appendChild(TQ.vectorView(qkv.V[CAT], { label: "V[\"cat\"]", cellSize: 26 }));
            c.appendChild(TQ.el("div", { class: "tq-boss-stats" },
              statChip("Q = emb·Wq", "16→" + dk),
              statChip("seeds", "101 / 202 / 303")
            ));
          }
        },
        {
          key: "scaled", icon: "⚖️", title: "Scaled Attention",
          why: "softmax(QKᵀ/√dk)·V — the 1/√dk keeps the softmax from saturating.",
          run: function (c) {
            c.appendChild(TQ.p(
              TQ.el("strong", { text: "What & why: " }),
              "score \"cat\"'s query against every key, divide by ", TQ.math("√dk"),
              ", softmax to weights, mix the values. The weights below are a valid probability ",
              "distribution — they sum to ", TQ.el("strong", { text: TQ.fmt(TQ.sum(weightsCat), 2) }), "."
            ));
            c.appendChild(TQ.barRow(weightsCat, {
              labels: tokens, max: 1,
              format: function (v) { return TQ.fmt(v, 3); }
            }));
            c.appendChild(TQ.el("div", { class: "tq-boss-stats" },
              statChip("dk", String(att.dk)),
              statChip("1/√dk", TQ.fmt(scaleFactor, 2)),
              statChip("Σ weights", TQ.fmt(TQ.sum(weightsCat), 2))
            ));
            c.appendChild(TQ.callout(
              "Why √dk exists: dot products of dk components have std ∝ √dk. Without the divide, big dk " +
              "makes logits huge and softmax spikes to near one-hot — gradients vanish. Compare the two " +
              "distributions below: UNscaled (left) is peakier than scaled (right)."
            ));
            var cmp = TQ.el("div", { class: "tq-boss-cmp" },
              TQ.el("div", {},
                TQ.el("div", { class: "tq-slider-label", text: "UNscaled  softmax(QKᵀ)" }),
                TQ.barRow(unscaledWeightsCat, { labels: tokens, max: 1, format: function (v) { return TQ.fmt(v, 3); } })
              ),
              TQ.el("div", {},
                TQ.el("div", { class: "tq-slider-label", text: "Scaled  softmax(QKᵀ/√dk)" }),
                TQ.barRow(weightsCat, { labels: tokens, max: 1, format: function (v) { return TQ.fmt(v, 3); } })
              )
            );
            c.appendChild(cmp);
          }
        },
        {
          key: "multi", icon: "🧠", title: "Multi-Head",
          why: "Several heads read different relationships in parallel, then concat·Wo.",
          run: function (c) {
            c.appendChild(TQ.p(
              TQ.el("strong", { text: "What & why: " }),
              "run two independent heads (distinct seeds), giving each token a ", TQ.math("2·dk = " + (2 * dk)),
              "-dim concatenated output, then project back to ", TQ.math("d_model = " + d),
              " with ", TQ.math("Wo"), ". More query heads = more relationships modeled."
            ));
            c.appendChild(TQ.vectorView(concat[CAT], { label: "concat[\"cat\"] (6×8 row)", cellSize: 24 }));
            c.appendChild(TQ.vectorView(multiOut[CAT], { label: "·Wo → d_model=16", cellSize: 22 }));
            c.appendChild(TQ.el("div", { class: "tq-boss-stats" },
              statChip("heads", "2"),
              statChip("concat", n + "×" + (2 * dk)),
              statChip("after Wo", n + "×" + d)
            ));
          }
        },
        {
          key: "block", icon: "🧱", title: "Block",
          why: "residual (x + sublayer) then LayerNorm — repeated N times.",
          run: function (c) {
            c.appendChild(TQ.p(
              TQ.el("strong", { text: "What & why: " }),
              "the sublayer output is added back to the input (residual), then normalized. Order is ",
              TQ.el("strong", { text: "residual-THEN-LayerNorm" }), " (post-LN, as in the Illustrated Transformer). ",
              "We use the multi-head output for \"cat\" (already ", TQ.math("d_model=16"),
              ") so the residual add is dimension-clean."
            ));
            c.appendChild(TQ.vectorView(blockX, { label: "x (embedding)", cellSize: 20 }));
            c.appendChild(TQ.vectorView(blockSub, { label: "sublayer out", cellSize: 20 }));
            c.appendChild(TQ.vectorView(blockRes, { label: "x + sublayer (residual)", cellSize: 20 }));
            c.appendChild(TQ.vectorView(blockNorm, { label: "LayerNorm(residual)", cellSize: 20 }));
            c.appendChild(TQ.el("div", { class: "tq-boss-stats" },
              statChip("mean(LN)", TQ.fmt(TQ.mean(blockNorm), 2)),
              statChip("‖LN‖", TQ.fmt(TQ.norm(blockNorm), 2))
            ));
            c.appendChild(TQ.note("LayerNorm pulls the vector to zero mean / unit variance — note mean(LN) ≈ 0.00. " +
              "An FFN follows (the per-token compute), then the whole block stacks N times."));
          }
        },
        {
          key: "cache", icon: "💾", title: "KV Cache",
          why: "Keys & values for every past token are stored — this is what grows.",
          run: function (c) {
            var perTok = 2 * 1 * dk; // for ONE head in the toy: 2·n_kv·head_dim
            c.appendChild(TQ.p(
              TQ.el("strong", { text: "What & why: " }),
              "at inference each new token reuses the K and V of every prior token, so we cache them. ",
              "Per token per layer the cache holds ", TQ.math("2 · n_kv_heads · head_dim"),
              " numbers. For our single toy head (", TQ.math("head_dim = " + dk),
              "): ", TQ.el("strong", { text: "2 · 1 · " + dk + " = " + perTok }), " elements per token."
            ));
            c.appendChild(TQ.vectorView(qkv.K[CAT], { label: "cached K[\"cat\"]", cellSize: 24 }));
            c.appendChild(TQ.vectorView(qkv.V[CAT], { label: "cached V[\"cat\"]", cellSize: 24 }));
            c.appendChild(TQ.callout(
              "This cache grows linearly with sequence length — every past token must be kept. That linear " +
              "wall is exactly why long context is a memory problem. Scroll down to size it for a real model."
            ));
          }
        }
      ];

      // build the strip + the detail panel
      var pipeBlock = TQ.block(
        TQ.h(2, "The pipeline, click-by-click"),
        TQ.p("Each stage below is a button. Click one to see its ", TQ.el("strong", { text: "what & why" }),
          " plus a live number computed from the toy sentence. The arrows show the flow of \"cat\" forward.")
      );

      var detail = TQ.el("div", { class: "tq-panel tq-grow tq-boss-detail" });
      var stripBtns = [];

      function selectStage(idx) {
        for (var i = 0; i < stripBtns.length; i++) {
          stripBtns[i].classList.toggle("is-active", i === idx);
          stripBtns[i].setAttribute("aria-selected", i === idx ? "true" : "false");
        }
        detail.innerHTML = "";
        detail.appendChild(TQ.el("div", { class: "tq-boss-detail-head" },
          TQ.el("span", { class: "tq-boss-detail-icon", text: stages[idx].icon }),
          TQ.el("span", { class: "tq-boss-detail-title", text: (idx + 1) + ". " + stages[idx].title }),
          TQ.badge("stage " + (idx + 1) + " / " + stages.length, "info")
        ));
        stages[idx].run(detail);
      }

      var strip = TQ.el("div", { class: "tq-boss-strip", role: "tablist" });
      stages.forEach(function (st, idx) {
        var btn = TQ.el("button", {
          class: "tq-boss-stage", type: "button", role: "tab",
          "aria-selected": "false", title: st.why
        },
          TQ.el("span", { class: "tq-boss-stage-icon", text: st.icon }),
          TQ.el("span", { class: "tq-boss-stage-label", text: st.title })
        );
        btn.addEventListener("click", function () { selectStage(idx); });
        btn.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight") { e.preventDefault(); var nx = (idx + 1) % stages.length; selectStage(nx); stripBtns[nx].focus(); }
          if (e.key === "ArrowLeft") { e.preventDefault(); var pv = (idx - 1 + stages.length) % stages.length; selectStage(pv); stripBtns[pv].focus(); }
        });
        stripBtns.push(btn);
        strip.appendChild(btn);
        if (idx < stages.length - 1) {
          strip.appendChild(TQ.el("span", { class: "tq-boss-arrow", text: "→", "aria-hidden": "true" }));
        }
      });

      pipeBlock.appendChild(strip);
      pipeBlock.appendChild(detail);
      selectStage(0);
      root.appendChild(pipeBlock);

      /* ========================================================== *
       *  Forces framing
       * ========================================================== */
      root.appendChild(TQ.block(
        TQ.h(2, "The three forces that decide everything downstream"),
        TQ.p(
          "Almost every design choice is a fight between three quantities. ",
          TQ.el("strong", { text: "(1) Quality" }), " — how many independent relationships attention can model, ",
          "which scales with the number of query heads. ",
          TQ.el("strong", { text: "(2) Memory at inference" }), " — dominated by the KV cache, which grows as ",
          TQ.math("2 · n_layers · seq_len · n_kv_heads · head_dim · bytes"), ". ",
          TQ.el("strong", { text: "(3) The √dk + RoPE guardrails" }), " — which keep the math numerically and ",
          "positionally sane regardless of size."
        ),
        TQ.p(
          TQ.el("strong", { text: "MQA / GQA" }), " attack memory by cutting ", TQ.math("n_kv_heads"),
          " (saving ", TQ.math("1 − n_kv/n_q"), ") while keeping all query heads for quality. ",
          TQ.el("strong", { text: "MLA" }), " goes further: it stops caching K and V directly and instead caches a ",
          "small latent ", TQ.math("c"), " that both are reconstructed from — paying for it with a separate, ",
          "decoupled RoPE key, because you can't bake rotary position into a compressed latent and still ",
          "rebuild clean per-head keys."
        )
      ));

      /* ========================================================== *
       *  PRIMARY 2 — "spot the bottleneck" calculator
       * ========================================================== */

      var calcBlock = TQ.block(
        TQ.h(2, "Spot the bottleneck: size the KV cache"),
        TQ.p("Pick an attention scheme, a context length, and a precision. The real KV-cache size and the ",
          "savings-vs-MHA recompute live. Config below: a 32-layer, 32-query-head model (head_dim 128), with ",
          "MLA's latent sizes (d_c 512, d_rope 64) from the DeepSeek-V2 ballpark used in the pre-reads.")
      );

      // fixed model config
      var N_LAYERS = 32, HEAD_DIM = 128, N_Q = 32;
      var D_C = 512, D_ROPE = 64;          // MLA latent + decoupled RoPE key (DeepSeek-V2)
      var N_KV = { MHA: 32, GQA: 8, MQA: 1 };

      var scheme = "MHA";
      var seqLen = 8192;
      var bytes = 2; // fp16

      function cacheBytes(sch, seq, by) {
        if (sch === "MLA") {
          // ONE latent replaces BOTH K and V -> no factor of 2
          return N_LAYERS * seq * (D_C + D_ROPE) * by;
        }
        return 2 * N_LAYERS * seq * N_KV[sch] * HEAD_DIM * by;
      }
      function fmtGB(b) { return TQ.fmt(b / 1e9, 2) + " GB"; }

      var schemeSeg = TQ.segmented({
        options: [
          { label: "MHA", value: "MHA" },
          { label: "GQA (8)", value: "GQA" },
          { label: "MQA", value: "MQA" },
          { label: "MLA", value: "MLA" }
        ],
        value: "MHA",
        onChange: function (v) { scheme = v; updateCalc(); }
      });

      // log-ish discrete seq lengths via a slider over indices
      var SEQS = [512, 2048, 8192, 32768, 131072];
      var seqSlider = TQ.slider({
        min: 0, max: SEQS.length - 1, step: 1, value: 2,
        label: "Context length (seq_len)",
        format: function (i) { return SEQS[i].toLocaleString() + " tok"; },
        onInput: function (i) { seqLen = SEQS[Math.round(i)]; updateCalc(); }
      });

      var precToggle = TQ.toggle({
        label: "fp8 (bytes = 1) instead of fp16 (bytes = 2)",
        value: false,
        onChange: function (on) { bytes = on ? 1 : 2; updateCalc(); }
      });

      var calcOut = TQ.el("div", { class: "tq-panel" });

      function updateCalc() {
        calcOut.innerHTML = "";

        var mha = cacheBytes("MHA", seqLen, bytes);
        var cur = cacheBytes(scheme, seqLen, bytes);
        var savings = mha > 0 ? (1 - cur / mha) : 0;

        // headline stats
        var stats = TQ.el("div", { class: "tq-boss-calc-stats" },
          TQ.el("div", { class: "tq-boss-calc-stat is-primary" },
            TQ.el("span", { class: "tq-stat-cap", text: scheme + " KV cache" }),
            TQ.el("span", { class: "tq-stat-big", text: fmtGB(cur) }),
            TQ.el("span", { class: "tq-boss-calc-sub", text: "at " + seqLen.toLocaleString() + " tok, fp" + (bytes === 2 ? "16" : "8") })
          ),
          TQ.el("div", { class: "tq-boss-calc-stat" },
            TQ.el("span", { class: "tq-stat-cap", text: "vs MHA baseline" }),
            TQ.el("span", { class: "tq-stat-big", text: fmtGB(mha) })
          ),
          TQ.el("div", { class: "tq-boss-calc-stat is-good" },
            TQ.el("span", { class: "tq-stat-cap", text: "memory saved" }),
            TQ.el("span", { class: "tq-stat-big", text: (savings > 0 ? TQ.fmt(savings * 100, 1) + "%" : "0%") })
          )
        );
        calcOut.appendChild(stats);

        // comparison bars across all schemes at the current seq/bytes
        var order = ["MHA", "GQA", "MQA", "MLA"];
        var vals = order.map(function (s) { return cacheBytes(s, seqLen, bytes) / 1e9; });
        var maxV = TQ.maxOf(vals);
        calcOut.appendChild(TQ.el("div", { class: "tq-slider-label", style: { margin: "10px 0 4px" }, text: "KV cache by scheme (GB)" }));
        calcOut.appendChild(TQ.barRow(vals, {
          labels: order, max: maxV,
          format: function (v) { return TQ.fmt(v, 2) + " GB"; },
          colorFn: function (v, i) { return order[i] === scheme ? TQ.colorFor(0.85) : TQ.colorFor(0.45); },
          highlight: order.indexOf(scheme)
        }));

        // per-token-per-layer element accounting + scheme-specific note
        var perTok, formula;
        if (scheme === "MLA") {
          perTok = D_C + D_ROPE;
          var mhaPerTok = 2 * N_Q * HEAD_DIM; // 2·32·128 = 8192 in this config
          formula = TQ.callout(
            "MLA caches a single latent: " + TQ.fmt(D_C, 0) + " + " + TQ.fmt(D_ROPE, 0) +
            " = " + perTok + " numbers/token/layer (the +" + D_ROPE + " is the decoupled RoPE key that carries " +
            "position), replacing MHA's 2·" + N_Q + "·" + HEAD_DIM + " = " + mhaPerTok.toLocaleString() +
            " — a ~" + TQ.fmt(mhaPerTok / perTok, 0) + "× shrink, while KEEPING all " + N_Q + " query heads."
          );
        } else {
          perTok = 2 * N_KV[scheme] * HEAD_DIM;
          var save = 1 - N_KV[scheme] / N_Q;
          formula = TQ.note(
            scheme + ": n_kv_heads = " + N_KV[scheme] + " of " + N_Q + " query heads → " +
            "2·" + N_KV[scheme] + "·" + HEAD_DIM + " = " + perTok.toLocaleString() +
            " elements/token/layer. Head-sharing saving vs MHA = 1 − " + N_KV[scheme] + "/" + N_Q +
            " = " + TQ.fmt(save * 100, 1) + "%."
          );
        }
        calcOut.appendChild(TQ.el("div", { class: "tq-boss-stats", style: { marginTop: "10px" } },
          TQ.kv("n_layers", String(N_LAYERS)),
          TQ.kv("head_dim", String(HEAD_DIM)),
          TQ.kv("n_q_heads", String(N_Q)),
          TQ.kv("bytes", String(bytes)),
          TQ.kv("per tok/layer", perTok.toLocaleString())
        ));
        calcOut.appendChild(formula);
      }

      calcBlock.appendChild(TQ.el("div", { class: "tq-boss-calc-controls" },
        TQ.el("div", { class: "tq-boss-calc-ctl" },
          TQ.el("div", { class: "tq-slider-label", style: { marginBottom: "6px" }, text: "Attention scheme" }),
          schemeSeg.el
        ),
        TQ.el("div", { class: "tq-boss-calc-ctl tq-grow" }, seqSlider.el),
        TQ.el("div", { class: "tq-boss-calc-ctl" }, precToggle.el)
      ));
      calcBlock.appendChild(calcOut);
      calcBlock.appendChild(TQ.callout(
        "Three things to feel here: (1) the cache grows STRICTLY linearly with seq_len — doubling context " +
        "doubles memory for every scheme, no exceptions; that linear wall is unavoidable. (2) GQA(8) is " +
        "exactly 75% smaller than MHA; MQA ~97%. (3) MLA sits far below MHA and below GQA(8), and — unlike " +
        "MQA — it KEEPS all query heads. At this config MLA (0.30 GB) is a bit larger than MQA (0.13 GB), " +
        "but MQA pays for that with a real quality hit; MLA's win is matching MHA-level quality at a " +
        "fraction of MHA's cache — that's the 'why MLA wins' moment, made numeric."
      ));
      updateCalc();
      root.appendChild(calcBlock);

      /* ----------------------------------------------------- final takeaway */
      root.appendChild(TQ.block(
        TQ.h(2, "You've connected the whole chain"),
        TQ.p(
          "Tokens became vectors. Position got stamped in. Q/K/V let tokens query each other; ", TQ.math("√dk"),
          " kept the softmax sane; many heads read many relationships; residual + LayerNorm + FFN made a block; ",
          "stacking blocks made a model. And the KV cache — the one thing that survives between tokens — is the ",
          "wall that MHA, MQA, GQA, and MLA all fight in different ways."
        ),
        TQ.callout("The boss takeaway: seq_len is the linear term nobody can delete. Every clever scheme only " +
          "shrinks the PER-TOKEN constant. MLA shrinks it the most while paying the least quality — that's why " +
          "it's the clever one. Now go ship something memory-efficient.")
      ));

      /* scoped styles — colors only via CSS variables / colorFor, no hardcoded hex */
      injectOnce("tq-lvl10-css",
        ".tq-token-strip{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}" +
        ".tq-token-chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;" +
          "background:var(--panel-hi);border:1px solid var(--line);border-radius:10px;padding:8px 14px}" +
        ".tq-token-chip.is-trace{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}" +
        ".tq-token-idx{font-size:10px;color:var(--ink-mute);font-family:var(--mono)}" +
        ".tq-token-word{font-size:16px;font-weight:700}" +
        ".tq-boss-strip{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:6px 0 16px}" +
        ".tq-boss-stage{display:inline-flex;flex-direction:column;align-items:center;gap:4px;" +
          "background:var(--panel-hi);border:1px solid var(--line);border-radius:12px;padding:10px 12px;" +
          "cursor:pointer;color:var(--ink);min-width:84px;transition:transform .12s,border-color .12s}" +
        ".tq-boss-stage:hover{transform:translateY(-2px);border-color:var(--accent)}" +
        ".tq-boss-stage.is-active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--panel)}" +
        ".tq-boss-stage-icon{font-size:20px;line-height:1}" +
        ".tq-boss-stage-label{font-size:11px;font-weight:600;text-align:center}" +
        ".tq-boss-arrow{color:var(--ink-mute);font-size:16px;flex:0 0 auto}" +
        ".tq-boss-detail{display:flex;flex-direction:column;gap:12px;min-height:120px}" +
        ".tq-boss-detail-head{display:flex;align-items:center;gap:10px}" +
        ".tq-boss-detail-icon{font-size:22px}" +
        ".tq-boss-detail-title{font-size:17px;font-weight:700}" +
        ".tq-boss-stats{display:flex;gap:8px;flex-wrap:wrap}" +
        ".tq-boss-cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:6px}" +
        ".tq-boss-calc-controls{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}" +
        ".tq-boss-calc-ctl{display:flex;flex-direction:column}" +
        ".tq-boss-calc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}" +
        ".tq-boss-calc-stat{display:flex;flex-direction:column;gap:2px;background:var(--panel-hi);" +
          "border:1px solid var(--line);border-radius:10px;padding:10px 14px}" +
        ".tq-boss-calc-stat.is-primary{border-color:var(--accent)}" +
        ".tq-boss-calc-stat.is-good{border-color:var(--good,var(--accent))}" +
        ".tq-boss-calc-sub{font-size:11px;color:var(--ink-mute)}");
    },

    quiz: [
      {
        q: "You're serving a model at 128k context and KV-cache memory is the wall. Your eng wants to switch MHA→MQA; your researcher warns about quality loss. Which statement is the most accurate trade-off?",
        choices: [
          "MQA and MHA use identical memory; the only difference is speed",
          "MQA collapses all key/value heads to one (≈97% cache cut with n_q=32) but every query head now reads the same K/V, reducing attention's representational resolution — GQA or MLA are the middle/better grounds",
          "MQA increases the KV cache because it adds a latent vector",
          "Switching to MQA changes the FFN, not the attention cache"
        ],
        answer: 1,
        explain: "KV cache = 2·n_layers·seq·n_kv_heads·head_dim·bytes, so n_kv_heads=1 saves 1−1/32≈97%. But all " +
                 "query heads share one K/V, so you lose head diversity — GQA keeps a few KV groups, MLA keeps " +
                 "full query heads via a cached latent."
      },
      {
        q: "What specifically breaks if you drop the 1/√dk scaling in softmax(QKᵀ/√dk)V as dk grows?",
        choices: [
          "Nothing — it's a cosmetic constant",
          "The dot-product scores' magnitude grows with dk, pushing softmax toward a near one-hot distribution, so gradients through it vanish and training/attention destabilizes",
          "The output dimension changes, breaking the residual add",
          "Position information is lost"
        ],
        answer: 1,
        explain: "Scores are sums of ~dk products; their std scales like √dk. Without dividing by √dk, large dk " +
                 "makes logits huge, softmax saturates to nearly one-hot, gradients flatten, and learning stalls. " +
                 "The √dk keeps logit variance ~constant."
      },
      {
        q: "MLA caches a small latent c per token and reconstructs K and V from it. Why does it ALSO need a separate decoupled RoPE key?",
        choices: [
          "To store the value vector, which the latent can't represent",
          "Because RoPE applies a position-dependent rotation to keys that can't be folded cleanly into the low-rank up-projection, so position is carried by a small dedicated key alongside the compressed content key",
          "To double the cache size for redundancy",
          "Because softmax requires two key vectors per token"
        ],
        answer: 1,
        explain: "RoPE rotates keys by absolute position; that rotation can't be absorbed into the static low-rank " +
                 "reconstruction of K without entangling the up-projection. DeepSeek decouples it: the content key " +
                 "comes from the latent, a small extra RoPE key carries position."
      },
      {
        q: "Across the stack, which quantity in the KV-cache formula is the one you CANNOT reduce by architectural tricks — the reason long context is fundamentally a memory problem?",
        choices: [
          "n_kv_heads — fixed by the vocab",
          "head_dim — fixed by the tokenizer",
          "seq_len — it scales linearly with context length and the cache must hold every past token's K/V; MHA/MQA/GQA/MLA only shrink the per-token cost, not the linear growth",
          "bytes — quantization can't change it"
        ],
        answer: 2,
        explain: "Cache grows linearly in seq_len because every prior token's K/V must be retained for " +
                 "autoregressive decoding. Head-sharing (MQA/GQA) and latent compression (MLA) shrink the " +
                 "per-token constant; none remove the linear-in-context growth."
      }
    ]
  });

  // tiny helper local to this module (NOT a global): inject scoped CSS once.
  function injectOnce(id, css) {
    if (document.getElementById(id)) return;
    var s = document.createElement("style");
    s.id = id;
    s.textContent = css;
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>

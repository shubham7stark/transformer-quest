<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Transformer Quest — an interactive, visual game that teaches transformer architectures and memory-efficient attention (MHA, MQA, GQA, MLA) from first principles." />
  <title>Transformer Quest — Learn Attention &amp; Memory-Efficient Transformers</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230b0f1a'/%3E%3Ctext%20x='16'%20y='22'%20font-size='18'%20text-anchor='middle'%20fill='%237aa2ff'%3E%E2%AC%A1%3C/text%3E%3C/svg%3E" />
  <style>/* ============================================================================
 * TRANSFORMER QUEST — STYLES
 * Polished dark theme. System font stack only (no CDNs / web fonts).
 * The shared color scale lives in JS (TQ.colorFor); this file owns surfaces,
 * type, spacing, and component chrome. Level files must NOT hardcode hex
 * except through TQ.colorFor / canvas drawing.
 * ========================================================================== */

:root {
  /* --- surfaces (deep space, slightly blue) --- */
  --bg:        #0a0d16;
  --bg-2:      #0e1322;
  --panel:     #131a2c;
  --panel-2:   #18203a;
  --panel-hi:  #1d2747;
  --line:      #25304f;
  --line-soft: #1b2236;

  /* --- ink --- */
  --ink:       #e9edf8;
  --ink-soft:  #aab3cd;
  --ink-mute:  #6f7aa0;
  --ink-faint: #4a5478;

  /* --- accents (match the warm end of the perceptual scale) --- */
  --accent:      #f2a93b;  /* amber */
  --accent-2:    #ffce6b;
  --accent-deep: #c77d1b;
  --cool:        #2fb8c6;  /* teal — the cool/mid anchor of the scale */
  --cool-deep:   #1f7e8a;
  --good:        #46d39a;
  --good-deep:   #1f8f63;
  --warn:        #ff7a6b;
  --warn-deep:   #c4453a;
  --info:        #5aa6ff;

  /* --- glow / shadow --- */
  --shadow:    0 12px 40px -12px rgba(0,0,0,.7);
  --shadow-sm: 0 4px 14px -6px rgba(0,0,0,.6);
  --glow:      0 0 0 1px rgba(242,169,59,.35), 0 6px 20px -6px rgba(242,169,59,.25);

  /* --- geometry --- */
  --r-sm: 8px;
  --r:    12px;
  --r-lg: 18px;
  --gap:  16px;
  --maxw: 1080px;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
          "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(47,184,198,.10), transparent 60%),
    radial-gradient(1000px 500px at 0% 0%, rgba(242,169,59,.08), transparent 55%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: rgba(242,169,59,.30); }

button { font-family: inherit; }

/* scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
*::-webkit-scrollbar { height: 10px; width: 10px; }
*::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
*::-webkit-scrollbar-thumb:hover { background: var(--panel-hi); }

/* ----------------------------------------------------------------- layout */
.tq-app { min-height: 100vh; padding-bottom: 64px; }
.tq-main {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 28px 22px 0;
}
.tq-flexrow { display: flex; gap: var(--gap); flex-wrap: wrap; align-items: flex-start; }
.tq-flexcol { display: flex; flex-direction: column; gap: 10px; }

/* ----------------------------------------------------------------- topbar */
.tq-topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(10,13,22,.82);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-soft);
}
.tq-top-inner {
  max-width: var(--maxw); margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 22px;
}
.tq-brand {
  display: inline-flex; align-items: center; gap: 9px;
  background: none; border: 0; cursor: pointer; padding: 4px 6px;
  color: var(--ink); border-radius: var(--r-sm);
}
.tq-brand:hover { background: var(--panel); }
.tq-brand-mark { color: var(--accent); font-size: 18px; }
.tq-brand-name { font-weight: 700; letter-spacing: .2px; }
.tq-top-right { display: flex; align-items: center; gap: 12px; }
.tq-pct { color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: 13px; }
.tq-xp {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 99px; padding: 5px 11px; font-size: 13px; font-weight: 600;
}
.tq-xp-star { color: var(--accent); }
.tq-xp-num { font-variant-numeric: tabular-nums; }
.tq-reset {
  background: none; border: 1px solid transparent; color: var(--ink-faint);
  cursor: pointer; font-size: 11px; letter-spacing: .4px; text-transform: uppercase;
  padding: 4px 8px; border-radius: var(--r-sm);
}
.tq-reset:hover { color: var(--warn); border-color: var(--warn-deep); }

.tq-progress-track {
  height: 3px; width: 100%; background: var(--line-soft);
}
.tq-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cool), var(--accent));
  transition: width .5s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 12px rgba(242,169,59,.5);
}

/* ------------------------------------------------------------------- hero */
.tq-hero { padding: 18px 0 8px; }
.tq-hero-title {
  font-size: clamp(28px, 4vw, 42px); margin: 0 0 8px; letter-spacing: -.5px;
  background: linear-gradient(100deg, var(--ink), var(--accent-2));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.tq-hero-sub { color: var(--ink-soft); max-width: 720px; margin: 0; font-size: 16px; }
.tq-hero-sub strong { color: var(--ink); }
.tq-hero-done { margin-top: 14px; }

/* --------------------------------------------------------------- map grid */
.tq-map-grid {
  margin-top: 22px;
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
}
.tq-card {
  position: relative; text-align: left; cursor: pointer;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 16px 16px 14px; color: var(--ink);
  display: flex; flex-direction: column; gap: 8px; min-height: 158px;
  transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.tq-card:hover:not(:disabled) {
  transform: translateY(-3px);
  border-color: var(--accent-deep);
  box-shadow: var(--shadow);
}
.tq-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tq-card.is-locked { cursor: not-allowed; opacity: .55; filter: saturate(.6); }
.tq-card.is-done { border-color: var(--good-deep); }
.tq-card-top { display: flex; align-items: center; gap: 8px; }
.tq-card-icon { font-size: 26px; line-height: 1; }
.tq-card-order {
  font-size: 11px; color: var(--ink-mute); letter-spacing: .5px;
  text-transform: uppercase; font-weight: 700;
}
.tq-card-status { margin-left: auto; font-size: 15px; color: var(--ink-soft); }
.tq-card.is-done .tq-card-status { color: var(--good); }
.tq-card-title { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
.tq-card-tagline { font-size: 13px; color: var(--ink-soft); flex: 1; line-height: 1.4; }
.tq-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.tq-card-preread { font-size: 11px; color: var(--ink-faint); }
.tq-map-foot { margin: 26px 0; }

/* ----------------------------------------------------------------- badges */
.tq-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700; letter-spacing: .3px;
  padding: 3px 9px; border-radius: 99px; text-transform: uppercase;
  border: 1px solid var(--line);
  background: var(--panel); color: var(--ink-soft);
}
.tq-badge-good { color: var(--good); border-color: var(--good-deep); background: rgba(70,211,154,.08); }
.tq-badge-warn { color: var(--warn); border-color: var(--warn-deep); background: rgba(255,122,107,.08); }
.tq-badge-info { color: var(--info); border-color: #2a4d80; background: rgba(90,166,255,.08); }

.tq-kv {
  display: inline-flex; align-items: baseline; gap: 6px;
  background: var(--panel); border: 1px solid var(--line);
  padding: 5px 10px; border-radius: var(--r-sm); font-size: 13px;
}
.tq-kv-label { color: var(--ink-mute); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
.tq-kv-val { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }

/* ------------------------------------------------------------- level view */
.tq-level-main { max-width: var(--maxw); }
.tq-level-head { margin-bottom: 18px; }
.tq-level-head-top { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; }
.tq-level-icon { font-size: 32px; line-height: 1; }
.tq-level-titles { flex: 1; min-width: 200px; }
.tq-level-title { font-size: clamp(22px, 3vw, 30px); margin: 0; letter-spacing: -.4px; }
.tq-level-tagline { color: var(--ink-soft); font-size: 15px; margin-top: 2px; }
.tq-back { flex: 0 0 auto; }

.tq-objectives-wrap {
  margin-top: 16px; background: var(--panel); border: 1px solid var(--line);
  border-left: 3px solid var(--accent); border-radius: var(--r);
  padding: 13px 16px;
}
.tq-objectives-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
  color: var(--ink-mute); font-weight: 700; margin-bottom: 7px;
}
.tq-objectives { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tq-objective { display: flex; gap: 9px; align-items: baseline; font-size: 14.5px; color: var(--ink-soft); }
.tq-objective-mark { color: var(--accent); font-size: 10px; }

/* -------------------------------------------------------------- lesson UI */
.tq-lesson { display: flex; flex-direction: column; gap: 20px; margin-top: 8px; }
.tq-block {
  background: linear-gradient(180deg, var(--panel), var(--bg-2));
  border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 20px 22px;
}
.tq-h { margin: 0 0 12px; font-size: 19px; letter-spacing: -.2px; }
.tq-block .tq-h:not(:first-child) { margin-top: 22px; }
.tq-p { margin: 0 0 12px; color: var(--ink-soft); }
.tq-p:last-child { margin-bottom: 0; }
.tq-p strong { color: var(--ink); }

.tq-note {
  background: var(--bg-2); border: 1px dashed var(--line);
  border-radius: var(--r); padding: 11px 14px; color: var(--ink-mute);
  font-size: 13.5px;
}
.tq-callout {
  display: flex; gap: 11px; align-items: flex-start;
  background: linear-gradient(180deg, rgba(242,169,59,.10), rgba(242,169,59,.03));
  border: 1px solid var(--accent-deep); border-radius: var(--r);
  padding: 13px 15px; color: var(--ink);
}
.tq-callout-mark { color: var(--accent); font-size: 16px; line-height: 1.4; flex: 0 0 auto; }
.tq-callout-body { font-size: 14.5px; }
.tq-math {
  font-family: var(--mono); font-size: .92em;
  background: var(--panel-hi); border: 1px solid var(--line);
  padding: 1px 7px; border-radius: 6px; color: var(--accent-2);
  white-space: nowrap;
}

/* ------------------------------------------------------------------- code */
.tq-code {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r); overflow: hidden; margin: 4px 0;
}
.tq-code-head {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px; background: var(--bg-2);
  border-bottom: 1px solid var(--line-soft);
}
.tq-code-chip {
  font-family: var(--mono); font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px;
  color: var(--cool); background: rgba(47,184,198,.10);
  border: 1px solid var(--cool-deep); border-radius: 6px; padding: 1px 8px;
}
.tq-code-label { font-size: 12px; color: var(--ink-mute); }
.tq-code-copy {
  margin-left: auto; background: none; border: 1px solid transparent;
  color: var(--ink-faint); cursor: pointer; font-size: 10.5px;
  text-transform: uppercase; letter-spacing: .4px; font-weight: 700;
  padding: 3px 8px; border-radius: var(--r-sm); transition: color .14s, border-color .14s, background .14s;
}
.tq-code-copy:hover { color: var(--accent-2); border-color: var(--line); background: var(--panel-hi); }
.tq-code-copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tq-code-pre {
  margin: 0; padding: 14px 16px; overflow-x: auto;
  background: transparent; line-height: 1.6;
}
.tq-code-code {
  font-family: var(--mono); font-size: 13px; color: var(--ink);
  white-space: pre; display: block; tab-size: 4;
}
.tq-code-caption {
  padding: 8px 16px 11px; font-size: 12.5px; color: var(--ink-mute);
  border-top: 1px solid var(--line-soft); background: var(--bg-2);
}

/* syntax tokens — flow through the shared color language */
.tq-tok-com { color: var(--ink-mute); font-style: italic; }
.tq-tok-str { color: var(--good); }
.tq-tok-kw  { color: var(--accent); font-weight: 600; }
.tq-tok-bln { color: var(--cool); }
.tq-tok-num { color: var(--info); }

/* -------------------------------------------------------------- resources */
.tq-resources {
  background: linear-gradient(180deg, var(--panel), var(--bg-2));
  border: 1px solid var(--line); border-left: 3px solid var(--cool);
  border-radius: var(--r-lg); padding: 16px 18px;
}
.tq-resources-head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
.tq-resources-mark { color: var(--cool); font-size: 16px; font-weight: 800; }
.tq-resources-title { margin: 0; font-size: 16px; letter-spacing: -.2px; }
.tq-resources-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.tq-resource {
  display: flex; align-items: flex-start; gap: 11px; text-decoration: none;
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r);
  padding: 10px 13px; color: var(--ink);
  transition: border-color .14s, background .14s, transform .1s;
}
.tq-resource:hover { border-color: var(--cool-deep); background: var(--panel); transform: translateX(2px); }
.tq-resource:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tq-resource-kind {
  flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; background: var(--panel-hi); border: 1px solid var(--line);
  font-family: var(--mono); line-height: 1;
}
.tq-resource-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tq-resource-toprow { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.tq-resource-label { font-size: 14px; font-weight: 600; color: var(--ink); }
.tq-resource:hover .tq-resource-label { color: var(--accent-2); }
.tq-resource-domain {
  font-size: 11.5px; color: var(--ink-faint); font-family: var(--mono);
  white-space: nowrap;
}
.tq-resource-note { font-size: 12.5px; color: var(--ink-mute); line-height: 1.45; }
.tq-resource-arrow {
  flex: 0 0 auto; align-self: center; color: var(--ink-faint); font-size: 15px;
  transition: transform .14s, color .14s;
}
.tq-resource:hover .tq-resource-arrow { color: var(--cool); transform: translateX(3px); }

/* ----------------------------------------------------------------- figure */
.tq-figure {
  margin: 4px 0; padding: 16px; display: flex; flex-direction: column;
  align-items: center; gap: 11px;
  background: var(--bg-2); border: 1px solid var(--line-soft);
  border-radius: var(--r);
}
.tq-figure-svg {
  width: 100%; display: flex; justify-content: center;
  color: var(--ink-soft); /* currentColor for inline SVG strokes/fills */
}
.tq-figure-svg svg { max-width: 100%; height: auto; display: block; }
.tq-figure-cap {
  font-size: 12.5px; color: var(--ink-mute); text-align: center;
  max-width: 56ch; line-height: 1.45;
}

/* ----------------------------------------------------------------- heatmap */
.tq-heatmap-wrap { display: inline-block; }
.tq-heatmap-title {
  font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--ink-mute); margin-bottom: 8px; font-weight: 700;
}
.tq-heatmap { display: grid; gap: 3px; align-items: center; }
.tq-hm-corner { }
.tq-hm-collabel, .tq-hm-rowlabel {
  font-size: 12px; color: var(--ink-soft); font-weight: 600;
  display: flex; align-items: center; justify-content: center; padding: 2px 6px;
  white-space: nowrap;
}
.tq-hm-rowlabel { justify-content: flex-end; padding-right: 9px; }
.tq-hm-collabel.is-sel, .tq-hm-rowlabel.is-sel { color: var(--accent-2); }
.tq-hm-cell {
  display: flex; align-items: center; justify-content: center;
  border-radius: 5px; font-size: 11px; font-variant-numeric: tabular-nums;
  font-weight: 600; transition: transform .1s ease, box-shadow .1s ease, outline-color .1s ease;
  outline: 2px solid transparent; outline-offset: -2px;
}
.tq-hm-cell.is-clickable { cursor: pointer; }
.tq-hm-cell.is-clickable:hover { transform: scale(1.08); box-shadow: var(--shadow-sm); z-index: 2; }
.tq-hm-cell.is-clickable:focus-visible { outline-color: var(--ink); }
.tq-hm-cell.is-rowsel { outline-color: rgba(255,255,255,.55); }
.tq-hm-cell.is-cellsel { outline-color: #fff; box-shadow: var(--glow); }
.tq-hm-val { pointer-events: none; }

/* --------------------------------------------------------------- mgrid */
.tq-mgrid-wrap { display: inline-block; overflow-x: auto; }
.tq-mgrid { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.tq-mgrid th, .tq-mgrid td {
  padding: 5px 9px; text-align: right; font-variant-numeric: tabular-nums;
  border-bottom: 1px solid var(--line-soft);
}
.tq-mgrid th { color: var(--ink-mute); font-weight: 700; }
.tq-mgrid-rowlabel { text-align: left !important; color: var(--ink-soft) !important; }
.tq-mgrid td { color: var(--ink-soft); }

/* ------------------------------------------------------------------- bars */
.tq-bars { display: flex; flex-direction: column; gap: 6px; min-width: 260px; }
.tq-bar-row {
  display: grid; grid-template-columns: 64px 1fr 60px; align-items: center; gap: 10px;
  padding: 2px 4px; border-radius: var(--r-sm);
}
.tq-bar-row.is-hl { background: var(--panel-hi); outline: 1px solid var(--accent-deep); }
.tq-bar-label { font-size: 13px; color: var(--ink-soft); text-align: right; white-space: nowrap; }
.tq-bar-track {
  height: 16px; background: var(--bg-2); border: 1px solid var(--line-soft);
  border-radius: 99px; overflow: hidden;
}
.tq-bar-fill { height: 100%; border-radius: 99px; transition: width .35s cubic-bezier(.4,0,.2,1); }
.tq-bar-num { font-size: 12.5px; color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }

/* --------------------------------------------------------------- vectors */
.tq-vector { display: flex; align-items: center; gap: 11px; }
.tq-vector-label {
  font-size: 13px; color: var(--ink-soft); font-weight: 600;
  min-width: 42px; text-align: right; font-family: var(--mono);
}
.tq-vector-cells { display: flex; gap: 2px; }
.tq-vector-cell {
  border-radius: 3px; display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-variant-numeric: tabular-nums; overflow: hidden;
}
.tq-vector-cellval { transform: scale(.85); opacity: .9; }

/* --------------------------------------------------------------- sliders */
.tq-slider { display: flex; flex-direction: column; gap: 6px; min-width: 220px; }
.tq-slider-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.tq-slider-label { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.tq-slider-val {
  font-size: 13px; font-weight: 700; color: var(--accent-2);
  font-variant-numeric: tabular-nums; font-family: var(--mono);
}
.tq-slider-input {
  -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
  background: linear-gradient(90deg, var(--cool-deep), var(--accent-deep));
  border-radius: 99px; outline: none; cursor: pointer;
}
.tq-slider-input::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
  border-radius: 50%; background: var(--ink); border: 2px solid var(--accent);
  box-shadow: 0 2px 8px rgba(0,0,0,.5); cursor: pointer; transition: transform .1s;
}
.tq-slider-input::-webkit-slider-thumb:hover { transform: scale(1.15); }
.tq-slider-input::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%; background: var(--ink);
  border: 2px solid var(--accent); cursor: pointer;
}

/* --------------------------------------------------------------- toggle */
.tq-toggle { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
.tq-toggle-input { position: absolute; opacity: 0; width: 0; height: 0; }
.tq-toggle-track {
  width: 40px; height: 22px; background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 99px; position: relative; transition: background .15s, border-color .15s;
}
.tq-toggle-knob {
  position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
  border-radius: 50%; background: var(--ink-soft); transition: transform .16s, background .16s;
}
.tq-toggle-input:checked + .tq-toggle-track { background: rgba(242,169,59,.25); border-color: var(--accent-deep); }
.tq-toggle-input:checked + .tq-toggle-track .tq-toggle-knob { transform: translateX(18px); background: var(--accent); }
.tq-toggle-input:focus-visible + .tq-toggle-track { box-shadow: var(--glow); }
.tq-toggle-label { font-size: 13.5px; color: var(--ink-soft); }

/* ------------------------------------------------------------- segmented */
.tq-segmented {
  display: inline-flex; background: var(--bg-2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 3px; gap: 3px;
}
.tq-seg-btn {
  background: none; border: 0; color: var(--ink-soft); cursor: pointer;
  padding: 6px 13px; border-radius: 6px; font-size: 13px; font-weight: 600;
  transition: background .14s, color .14s;
}
.tq-seg-btn:hover { color: var(--ink); }
.tq-seg-btn.is-active { background: var(--panel-hi); color: var(--accent-2); box-shadow: var(--shadow-sm); }

/* ------------------------------------------------------------------ tabs */
.tq-tabs { display: flex; flex-direction: column; gap: 14px; }
.tq-tabbar {
  display: flex; gap: 4px; border-bottom: 1px solid var(--line);
  flex-wrap: wrap; padding-bottom: 0;
}
.tq-tab {
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--ink-mute); cursor: pointer; padding: 9px 15px;
  font-size: 14px; font-weight: 600; margin-bottom: -1px;
  transition: color .14s, border-color .14s;
}
.tq-tab:hover { color: var(--ink-soft); }
.tq-tab.is-active { color: var(--accent-2); border-bottom-color: var(--accent); }
.tq-tabbody { animation: tq-fade .25s ease; }

/* --------------------------------------------------------------- stepper */
.tq-stepper {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 16px 18px;
}
.tq-step-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
.tq-step-label { font-size: 16px; font-weight: 700; color: var(--ink); }
.tq-step-dots { display: flex; gap: 6px; flex-wrap: wrap; }
.tq-step-dot {
  width: 10px; height: 10px; border-radius: 50%; padding: 0;
  background: var(--line); border: 0; cursor: pointer; transition: background .15s, transform .15s;
}
.tq-step-dot:hover { transform: scale(1.25); }
.tq-step-dot.is-active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.tq-step-body { min-height: 120px; animation: tq-fade .25s ease; }
.tq-step-controls { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.tq-step-counter { margin-left: auto; color: var(--ink-mute); font-size: 13px; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- canvas */
.tq-canvas-wrap {
  display: inline-block; border-radius: var(--r); overflow: hidden;
  border: 1px solid var(--line); background: var(--bg-2); line-height: 0;
}
.tq-canvas { display: block; }

/* --------------------------------------------------------------- buttons */
.tq-btn {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  border-radius: var(--r-sm); padding: 9px 16px; font-size: 14px; font-weight: 600;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  transition: background .14s, border-color .14s, transform .1s, box-shadow .14s;
}
.tq-btn:hover:not(:disabled) { background: var(--panel-hi); border-color: var(--ink-faint); }
.tq-btn:active:not(:disabled) { transform: translateY(1px); }
.tq-btn:disabled { opacity: .4; cursor: not-allowed; }
.tq-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tq-btn-accent {
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  color: #1a1205; border-color: var(--accent-deep); font-weight: 700;
}
.tq-btn-accent:hover:not(:disabled) {
  box-shadow: var(--glow); background: linear-gradient(180deg, var(--accent-2), var(--accent-2));
}
.tq-btn-ghost { background: transparent; }
.tq-btn-ghost:hover:not(:disabled) { background: var(--panel); }

/* ------------------------------------------------------------------ quiz */
.tq-quiz-wrap { margin-top: 26px; }
.tq-quiz {
  background: linear-gradient(180deg, var(--panel), var(--bg-2));
  border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px;
}
.tq-quiz-h {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  margin: 0 0 18px; font-size: 20px;
}
.tq-quiz-count { font-size: 12px; color: var(--ink-mute); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.tq-q { padding: 16px 0; border-top: 1px solid var(--line-soft); }
.tq-q:first-of-type { border-top: 0; padding-top: 0; }
.tq-q-text { font-size: 15.5px; font-weight: 600; margin-bottom: 12px; display: flex; gap: 9px; align-items: baseline; }
.tq-q-num {
  flex: 0 0 auto; font-size: 11px; font-weight: 800; color: var(--accent);
  background: rgba(242,169,59,.12); border: 1px solid var(--accent-deep);
  padding: 1px 7px; border-radius: 6px; letter-spacing: .3px;
}
.tq-q-choices { display: grid; gap: 8px; }
.tq-choice {
  display: flex; align-items: center; gap: 11px; text-align: left;
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r);
  padding: 11px 13px; cursor: pointer; color: var(--ink); font-size: 14.5px;
  transition: border-color .14s, background .14s, transform .1s;
}
.tq-choice:hover:not(:disabled) { border-color: var(--ink-faint); background: var(--panel); transform: translateX(2px); }
.tq-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tq-choice:disabled { cursor: default; }
.tq-choice-key {
  flex: 0 0 auto; width: 24px; height: 24px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; font-weight: 800;
  font-size: 12px; background: var(--panel-hi); border: 1px solid var(--line); color: var(--ink-soft);
}
.tq-choice-text { flex: 1; }
.tq-choice-mark { flex: 0 0 auto; font-weight: 800; font-size: 15px; }
.tq-choice.is-correct {
  border-color: var(--good-deep); background: rgba(70,211,154,.12);
}
.tq-choice.is-correct .tq-choice-key { background: var(--good-deep); color: #052; border-color: var(--good); }
.tq-choice.is-correct .tq-choice-mark { color: var(--good); }
.tq-choice.is-wrong { border-color: var(--warn-deep); background: rgba(255,122,107,.10); }
.tq-choice.is-wrong .tq-choice-mark { color: var(--warn); }

.tq-q-explain {
  display: none; margin-top: 10px; font-size: 13.5px; line-height: 1.55;
  border-radius: var(--r-sm); padding: 0;
}
.tq-q-explain.is-shown { display: block; padding: 11px 13px; }
.tq-q-explain.is-right { background: rgba(70,211,154,.08); border: 1px solid var(--good-deep); color: var(--ink-soft); }
.tq-q-explain.is-wrong { background: rgba(90,166,255,.06); border: 1px solid #2a4d80; color: var(--ink-soft); }
.tq-explain-tag {
  display: inline-block; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
  font-size: 11px; margin-right: 8px;
}
.tq-q-explain.is-right .tq-explain-tag { color: var(--good); }
.tq-q-explain.is-wrong .tq-explain-tag { color: var(--info); }

.tq-quiz-status {
  margin-top: 18px; padding: 11px 14px; border-radius: var(--r);
  background: var(--bg-2); border: 1px solid var(--line);
  font-size: 13.5px; color: var(--ink-soft); font-weight: 600;
}
.tq-quiz-status.is-pass { border-color: var(--good-deep); color: var(--good); background: rgba(70,211,154,.08); }
.tq-quiz-status.is-fail { border-color: var(--warn-deep); color: var(--warn); background: rgba(255,122,107,.07); }
.tq-quiz-actions { margin-top: 16px; display: flex; justify-content: flex-end; }

/* -------------------------------------------------------- completion modal */
.tq-overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(5,7,13,.74); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; padding: 22px;
  animation: tq-fade .2s ease;
}
.tq-complete {
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--accent-deep); border-radius: var(--r-lg);
  padding: 30px 32px; max-width: 460px; width: 100%; text-align: center;
  box-shadow: var(--shadow);
  animation: tq-pop .3s cubic-bezier(.2,1.1,.4,1);
}
.tq-complete-icon { font-size: 52px; line-height: 1; margin-bottom: 8px; }
.tq-complete-title { margin: 0 0 6px; font-size: 26px; }
.tq-complete-sub { color: var(--ink-soft); margin: 0 0 18px; font-size: 14.5px; }
.tq-complete-xp { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 22px; }
.tq-complete-total { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; }
.tq-complete-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.tq-confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tq-confetti-bit {
  position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px;
  opacity: 0; animation: tq-fall 1.5s ease-in forwards;
}

/* ---------------------------------------------------------------- motion */
@keyframes tq-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes tq-pop { from { opacity: 0; transform: scale(.92) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes tq-fall {
  0% { opacity: 0; transform: translateY(0) rotate(0); }
  10% { opacity: 1; }
  100% { opacity: 0; transform: translateY(420px) rotate(540deg); }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ------------------------------------------------------------- responsive */
@media (max-width: 640px) {
  .tq-main { padding: 18px 14px 0; }
  .tq-top-inner { padding: 10px 14px; }
  .tq-reset { display: none; }
  .tq-block { padding: 16px; }
  .tq-bar-row { grid-template-columns: 52px 1fr 50px; }
  /* On narrow screens, give the back button its own row above the
     icon+title so a 3-line wrapped title can't leave an awkward gap
     beside the button/icon. */
  .tq-level-head-top { align-items: center; }
  .tq-level-head-top .tq-back { flex: 1 0 100%; order: -1; align-self: flex-start; margin-bottom: 4px; }
}

/* utility: let levels lay out two panels side-by-side that wrap nicely */
.tq-panel {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: var(--r); padding: 14px 16px;
}
.tq-grow { flex: 1 1 280px; min-width: 0; }
.tq-controls-row {
  display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end;
  padding: 14px 16px; background: var(--bg-2); border: 1px solid var(--line);
  border-radius: var(--r); margin-bottom: 4px;
}
.tq-legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-mute); }
.tq-legend-scale {
  height: 12px; width: 120px; border-radius: 99px;
  background: linear-gradient(90deg,
    hsl(232,45%,16%), hsl(200,65%,34%), hsl(178,70%,46%), hsl(44,92%,56%), hsl(33,100%,64%));
  border: 1px solid var(--line);
}
.tq-stat-big {
  font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums;
  letter-spacing: -.5px; color: var(--accent-2);
}
.tq-stat-cap { font-size: 12px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .4px; }
</style>

<body>
  <div id="app"></div>
  <script>/* ============================================================================
 * TRANSFORMER QUEST — KERNEL
 * ----------------------------------------------------------------------------
 * window.TQ : math/visual utilities + the game engine.
 * Single file, plain vanilla JS (ES5/ES6). No frameworks, no build, no network.
 * Runs by double-clicking index.html from file://.
 *
 * Builders: every level is a separate IIFE that calls TQ.registerLevel(def)
 * EXACTLY ONCE and leaks NO other globals. Rely ONLY on the helpers documented
 * below — they are the stable contract.
 *
 * ============================================================================
 * MATH API  (deterministic — no Math.random anywhere; everything seed-based)
 * ----------------------------------------------------------------------------
 *  TQ.rng(seed)                      -> function()->float in [0,1)  (mulberry32)
 *  TQ.randMatrix(rows,cols,seed,scale=1) -> rows x cols 2D array in [-scale,scale]
 *  TQ.matmul(A,B)                    -> A·B   (A: m x n, B: n x p -> m x p)
 *  TQ.transpose(M)                   -> Mᵀ
 *  TQ.addMat(A,B)                    -> elementwise A+B (same shape)
 *  TQ.scaleMat(M,s)                  -> elementwise M*s
 *  TQ.dot(a,b)                       -> scalar dot product of two vectors
 *  TQ.softmax(arr)                   -> numerically-stable probability vector
 *  TQ.softmaxRows(M)                 -> softmax applied to each row of M
 *  TQ.attention(Q,K,V)               -> { scores, scaled, weights, output }
 *                                       scores  = Q·Kᵀ
 *                                       scaled  = scores / sqrt(dk)
 *                                       weights = softmaxRows(scaled)
 *                                       output  = weights·V
 *  TQ.cosine(a,b)                    -> cosine similarity in [-1,1]
 *  TQ.clamp(x,lo,hi)                 -> x clamped to [lo,hi]
 *  TQ.lerp(a,b,t)                    -> linear interpolation
 *  TQ.fmt(x,dp=2)                    -> number formatted to dp decimals (string)
 *  --- extras (documented, builders may use) ---
 *  TQ.norm(a)                        -> L2 norm (length) of a vector
 *  TQ.zeros(rows,cols)               -> rows x cols matrix of 0  (cols omitted -> vector)
 *  TQ.layerNorm(vec, gain=1, bias=0) -> mean/var normalized vector
 *  TQ.relu(x) / TQ.reluVec(v)        -> ReLU on scalar / vector
 *  TQ.sum(arr) / TQ.mean(arr) / TQ.maxOf(arr) / TQ.minOf(arr)
 *  TQ.range(n)                       -> [0,1,...,n-1]
 *  TQ.sinusoidalPE(nPos, dModel)     -> nPos x dModel sinusoidal positional matrix
 *
 * ============================================================================
 * SHARED TOY EXAMPLE  (continuity — the SAME sentence everywhere)
 * ----------------------------------------------------------------------------
 *  TQ.toy = {
 *    tokens:     ["The","cat","sat","on","the","mat"],
 *    dModel:     16,
 *    embeddings: tokens.length x dModel deterministic matrix (in ~[-1,1])
 *  }
 *  CONVENTION for deriving Q/K/V deterministically inside a level:
 *    var Wq = TQ.randMatrix(TQ.toy.dModel, dk, 101);   // query projection
 *    var Wk = TQ.randMatrix(TQ.toy.dModel, dk, 202);   // key   projection
 *    var Wv = TQ.randMatrix(TQ.toy.dModel, dk, 303);   // value projection
 *    var Q  = TQ.matmul(TQ.toy.embeddings, Wq); // etc.
 *  Pick distinct seeds per head (e.g. base + headIndex) for multi-head.
 *  Helper that bakes this convention: TQ.toyQKV(dk, seedQ, seedK, seedV).
 *  The exact seeds don't matter pedagogically; the SENTENCE staying constant does.
 *
 * ============================================================================
 * VISUAL HELPERS  (return real DOM nodes; styled by styles.css; dark theme)
 * ----------------------------------------------------------------------------
 *  TQ.el(tag, attrs, ...children)
 *      hyperscript. attrs may include {class,text,html,onclick,style,title,...}.
 *      style may be a string or an object. children may be nodes, strings,
 *      arrays, or null/false (ignored). Returns the element.
 *  TQ.colorFor(t)            t in [0,1] -> CSS color on the ONE shared scale
 *                            (low = cool/dark, high = bright/warm). Used by
 *                            heatmaps AND vectors so all visuals share a language.
 *  TQ.colorForSigned(x,max)  convenience: map x in [-max,max] -> colorFor via
 *                            normalization to [0,1].
 *  TQ.heatmap(matrix, opts)  opts: {rowLabels,colLabels,onCell,selectedRow,
 *                            selectedCol,cellSize,min,max,format,title}.
 *                            Cells colored via colorFor (auto-normalized to the
 *                            data range unless min/max given). onCell(r,c,value).
 *  TQ.barRow(values, opts)   opts:{labels,max,format,colorFn,highlight}.
 *                            Horizontal bars (one shared scale color by value).
 *  TQ.vectorView(values,opts) opts:{label,max,format,cellSize,showValues}.
 *                            A row of colored cells for ONE vector.
 *  TQ.matrixGrid(matrix,opts) opts:{rowLabels,colLabels,format,title}. A plain
 *                            numeric table (not heat-colored) for showing raw values.
 *  TQ.slider(opts)           opts:{min,max,step,value,label,format,onInput}.
 *                            -> {el, get(), set(v)}
 *  TQ.toggle(opts)           opts:{label,value,onChange} -> {el,get,set} (checkbox)
 *  TQ.segmented(opts)        opts:{options:[{label,value}],value,onChange}
 *                            -> {el,get,set}  (segmented button group)
 *  TQ.tabs(items)            items=[{label,render(container)}] -> element
 *  TQ.stepper(steps)         steps=[{label,run(container)}] -> element with
 *                            Prev/Next/Play controls (animated walkthroughs).
 *  TQ.canvasPanel(w,h,drawFn) -> {el, ctx, redraw()}  (drawFn(ctx,w,h))
 *  TQ.note(text|node)        styled aside (muted)
 *  TQ.callout(text|node)     styled aside (accented / "aha" box)
 *  TQ.math(text)             inline formula styling (monospace pill)
 *  TQ.block(...children)     a lesson section wrapper (.tq-block)
 *  TQ.h(level,text)          a heading node (level 2..4)
 *  TQ.p(...children)         a paragraph node (supports inline nodes)
 *  TQ.row(...children)/TQ.col(...children) fl: layout helpers
 *  TQ.badge(text,kind)       small pill label; kind in {default,good,warn,info}
 *  TQ.kv(label,value)        a small label:value stat chip
 *
 * ---- content helpers: CODE / LINKS / DIAGRAMS (use in every level) --------
 *  TQ.code(src, opts)        -> node. A styled <pre><code> block with a small
 *                            language chip. opts = {lang:"python"(default)|"text",
 *                            caption, label}. Minimal, robust python syntax
 *                            highlighting (HTML-escaped first; never corrupts
 *                            code). Indentation/newlines preserved exactly.
 *                            e.g. TQ.code("x = nn.Embedding(50257, 16)\n", {lang:"python", caption:"lookup"})
 *  TQ.resources(title,items) -> node. A "Go deeper" card: heading + list of
 *                            external links. items = [{label,url,
 *                            kind:"paper"|"blog"|"video"|"doc"|"code"|"interactive",
 *                            note?}]. Each link opens in a NEW TAB (target=_blank
 *                            rel=noopener), tagged with a kind emoji + bare domain.
 *                            e.g. TQ.resources("Go deeper", [{label:"Illustrated Word2Vec", url:"https://jalammar.github.io/illustrated-word2vec/", kind:"blog"}])
 *  TQ.figure(svgMarkup, caption) -> node. Centers a static inline SVG string
 *                            (set via innerHTML) in a bordered figure with a
 *                            caption. SVG should use currentColor / CSS vars so
 *                            it inherits the theme.
 *                            e.g. TQ.figure('<svg viewBox="0 0 100 20">…</svg>', "text → ids → vectors")
 *
 * ============================================================================
 * GAME ENGINE
 * ----------------------------------------------------------------------------
 *  TQ.registerLevel(def)     def: {id,order,title,icon,tagline,preread,
 *                                  objectives:[...], render(root), quiz:[...]}
 *                            quiz item: {q,choices:[...],answer:<idx>,explain}
 *  Engine boots on DOMContentLoaded: MAP screen (locked cards) -> LEVEL view
 *  (objectives -> render -> Check Understanding quiz) -> quiz gating awards XP,
 *  marks complete, unlocks next. Progress persists in localStorage(tq_progress)
 *  with graceful fallback when storage is blocked (file://). Reset control in UI.
 * ========================================================================== */

(function () {
  "use strict";

  var TQ = {};

  /* ------------------------------------------------------------------ *
   *  MATH
   * ------------------------------------------------------------------ */

  // mulberry32 PRNG — deterministic, seedable, good enough for toy data.
  TQ.rng = function (seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  TQ.randMatrix = function (rows, cols, seed, scale) {
    scale = (scale === undefined) ? 1 : scale;
    var r = TQ.rng(seed);
    var M = [];
    for (var i = 0; i < rows; i++) {
      var row = [];
      for (var j = 0; j < cols; j++) {
        row.push((r() * 2 - 1) * scale); // [-scale, scale)
      }
      M.push(row);
    }
    return M;
  };

  TQ.zeros = function (rows, cols) {
    if (cols === undefined) {
      var v = [];
      for (var i = 0; i < rows; i++) v.push(0);
      return v;
    }
    var M = [];
    for (var r = 0; r < rows; r++) {
      var row = [];
      for (var c = 0; c < cols; c++) row.push(0);
      M.push(row);
    }
    return M;
  };

  TQ.matmul = function (A, B) {
    var m = A.length, n = A[0].length, p = B[0].length;
    var out = [];
    for (var i = 0; i < m; i++) {
      var row = [];
      for (var j = 0; j < p; j++) {
        var s = 0;
        for (var k = 0; k < n; k++) s += A[i][k] * B[k][j];
        row.push(s);
      }
      out.push(row);
    }
    return out;
  };

  TQ.transpose = function (M) {
    var rows = M.length, cols = M[0].length;
    var out = [];
    for (var j = 0; j < cols; j++) {
      var row = [];
      for (var i = 0; i < rows; i++) row.push(M[i][j]);
      out.push(row);
    }
    return out;
  };

  TQ.addMat = function (A, B) {
    var out = [];
    for (var i = 0; i < A.length; i++) {
      var row = [];
      for (var j = 0; j < A[i].length; j++) row.push(A[i][j] + B[i][j]);
      out.push(row);
    }
    return out;
  };

  TQ.scaleMat = function (M, s) {
    var out = [];
    for (var i = 0; i < M.length; i++) {
      var row = [];
      for (var j = 0; j < M[i].length; j++) row.push(M[i][j] * s);
      out.push(row);
    }
    return out;
  };

  TQ.dot = function (a, b) {
    var s = 0;

  function orthonormal(rows) {

    // "cat"/"mat" share a noun-ish "thing in the scene" direction, and action
    // words sit elsewhere. Each token = a small base random vector (idiosyncratic

    // Low base scale keeps the concept geometry legible; the claims in the
    // level prose ("The"/"the" ≈ twins; cat/mat related; sat/the unrelated) hold.
    var base = TQ.randMatrix(tokens.length, dModel, 1337, 0.22);

      [0.00, 0.00, 1.00, 0.00], // sat   -> pure action (sits far from the nouns)
      [0.05, 0.00, 0.10, 0.85], // on    -> place/scene (preposition anchors location)
      [1.00, 0.00, 0.00, 0.00], // the   -> pure article (≈ "The")
      [0.05, 0.65, 0.00, 0.60]  // mat   -> thing/noun + place (a cat-adjacent object)

    wrap.appendChild(grid);

  // Plain numeric table (NOT heat colored) — for raw matrices like Wq, etc.

  // One vector as a row of colored cells. Normalizes by max(|v|) unless given.
  TQ.vectorView = function (values, opts) {

    if (!max) max = 1;
    var cs = opts.cellSize || 22;
    var fmt = opts.format || function (v) { return TQ.fmt(v, 2); };
    var showValues = !!opts.showValues;

    if (opts.label !== undefined) wrap.appendChild(TQ.el("div", { class: "tq-vector-label", text: opts.label }));

        class: "tq-vector-cell",
        style: { width: cs + "px", height: cs + "px", background: TQ.colorFor(t), color: inkFor(t) },

  TQ.slider = function (opts) {
    opts = opts || {};
    var min = (opts.min !== undefined) ? opts.min : 0;
    var max = (opts.max !== undefined) ? opts.max : 1;
    var step = (opts.step !== undefined) ? opts.step : 0.01;
    var value = (opts.value !== undefined) ? opts.value : min;
    var fmt = opts.format || function (v) { return TQ.fmt(v, 2); };

    var valOut = TQ.el("span", { class: "tq-slider-val", text: fmt(value) });
    var input = TQ.el("input", {
      type: "range", class: "tq-slider-input",
      min: String(min), max: String(max), step: String(step), value: String(value)
    });
    var labelRow = TQ.el("div", { class: "tq-slider-head" },
      opts.label ? TQ.el("span", { class: "tq-slider-label", text: opts.label }) : null,
      valOut
    );
    var wrap = TQ.el("div", { class: "tq-slider" }, labelRow, input);

    function emit() {
      var v = parseFloat(input.value);
      valOut.textContent = fmt(v);
      if (opts.onInput) opts.onInput(v);
    }
    input.addEventListener("input", emit);

    return {
      el: wrap,
      get: function () { return parseFloat(input.value); },

  TQ.toggle = function (opts) {
    opts = opts || {};
    var checked = !!opts.value;
    var input = TQ.el("input", { type: "checkbox", class: "tq-toggle-input" });
    input.checked = checked;
    var knob = TQ.el("span", { class: "tq-toggle-track" }, TQ.el("span", { class: "tq-toggle-knob" }));
    var wrap = TQ.el("label", { class: "tq-toggle" }, input, knob,
      opts.label ? TQ.el("span", { class: "tq-toggle-label", text: opts.label }) : null);
    input.addEventListener("change", function () {
      if (opts.onChange) opts.onChange(input.checked);

      el: wrap,
      get: function () { return input.checked; },

  TQ.segmented = function (opts) {
    opts = opts || {};
    var options = opts.options || [];
    var value = opts.value !== undefined ? opts.value : (options[0] && options[0].value);
    var wrap = TQ.el("div", { class: "tq-segmented", role: "tablist" });
    var btns = [];
    function sync() {
      for (var i = 0; i < btns.length; i++) {
        var on = options[i].value === value;
        btns[i].classList.toggle("is-active", on);
        btns[i].setAttribute("aria-selected", on ? "true" : "false");
      }
    }
    options.forEach(function (o, idx) {
      var b = TQ.el("button", { class: "tq-seg-btn", type: "button", role: "tab", text: o.label });
      b.addEventListener("click", function () {
        value = o.value; sync();
        if (opts.onChange) opts.onChange(value);
      });
      btns.push(b); wrap.appendChild(b);
    });
    sync();
    return {
      el: wrap,
      get: function () { return value; },
      set: function (v) { value = v; sync(); }
    };
  };

  TQ.tabs = function (items) {
    var wrap = TQ.el("div", { class: "tq-tabs" });
    var bar = TQ.el("div", { class: "tq-tabbar", role: "tablist" });
    var body = TQ.el("div", { class: "tq-tabbody" });
    var tabButtons = [];

    function select(idx) {
      for (var i = 0; i < tabButtons.length; i++) {
        var on = i === idx;
        tabButtons[i].classList.toggle("is-active", on);
        tabButtons[i].setAttribute("aria-selected", on ? "true" : "false");
        tabButtons[i].setAttribute("tabindex", on ? "0" : "-1");
      }
      body.innerHTML = "";
      items[idx].render(body);
    }

    items.forEach(function (item, idx) {
      var b = TQ.el("button", { class: "tq-tab", type: "button", role: "tab", text: item.label });
      b.addEventListener("click", function () { select(idx); });
      b.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { e.preventDefault(); select((idx + 1) % items.length); tabButtons[(idx + 1) % items.length].focus(); }
        if (e.key === "ArrowLeft") { e.preventDefault(); var p = (idx - 1 + items.length) % items.length; select(p); tabButtons[p].focus(); }
      });
      tabButtons.push(b);
      bar.appendChild(b);
    });

    wrap.appendChild(bar);
    wrap.appendChild(body);
    if (items.length) select(0);
    return wrap;
  };

  // Stepper: Prev / Next / Play through a sequence of steps. Each step.run gets
  // a fresh container. Play auto-advances; stops at the end.
  TQ.stepper = function (steps) {
    var wrap = TQ.el("div", { class: "tq-stepper" });
    var stageBody = TQ.el("div", { class: "tq-step-body" });
    var idx = 0;
    var playing = false;
    var timer = null;

    var dots = TQ.el("div", { class: "tq-step-dots" });
    var dotEls = steps.map(function (_, i) {
      var d = TQ.el("button", { class: "tq-step-dot", type: "button", "aria-label": "Step " + (i + 1) });
      d.addEventListener("click", function () { stop(); go(i); });
      dots.appendChild(d);
      return d;
    });

    var label = TQ.el("div", { class: "tq-step-label" });
    var counter = TQ.el("span", { class: "tq-step-counter" });
    var prevBtn = TQ.el("button", { class: "tq-btn tq-btn-ghost", type: "button", text: "‹ Prev" });
    var nextBtn = TQ.el("button", { class: "tq-btn tq-btn-ghost", type: "button", text: "Next ›" });
    var playBtn = TQ.el("button", { class: "tq-btn tq-btn-accent", type: "button", text: "▶ Play" });

    function render() {
      stageBody.innerHTML = "";
      label.textContent = steps[idx].label || ("Step " + (idx + 1));
      counter.textContent = (idx + 1) + " / " + steps.length;
      steps[idx].run(stageBody);
      for (var i = 0; i < dotEls.length; i++) dotEls[i].classList.toggle("is-active", i === idx);
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === steps.length - 1;
    }
    function go(i) { idx = TQ.clamp(i, 0, steps.length - 1); render(); }
    function next() { if (idx < steps.length - 1) { go(idx + 1); } else { stop(); } }
    function prev() { go(idx - 1); }
    function stop() { playing = false; playBtn.textContent = "▶ Play"; if (timer) { clearInterval(timer); timer = null; } }
    function play() {
      if (playing) { stop(); return; }
      if (idx === steps.length - 1) go(0);
      playing = true; playBtn.textContent = "⏸ Pause";
      timer = setInterval(function () {
        if (idx >= steps.length - 1) { stop(); return; }
        next();
      }, 1600);
    }

    prevBtn.addEventListener("click", function () { stop(); prev(); });
    nextBtn.addEventListener("click", function () { stop(); next(); });
    playBtn.addEventListener("click", play);

    var controls = TQ.el("div", { class: "tq-step-controls" },
      prevBtn, playBtn, nextBtn, counter
    );
    wrap.appendChild(TQ.el("div", { class: "tq-step-head" }, label, dots));
    wrap.appendChild(stageBody);
    wrap.appendChild(controls);
    render();
    return wrap;
  };

  TQ.canvasPanel = function (width, height, drawFn) {
    var ratio = window.devicePixelRatio || 1;
    var canvas = TQ.el("canvas", { class: "tq-canvas" });
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    var ctx = canvas.getContext("2d");
    ctx.scale(ratio, ratio);
    var wrap = TQ.el("div", { class: "tq-canvas-wrap" }, canvas);
    function redraw() {
      ctx.clearRect(0, 0, width, height);
      if (drawFn) drawFn(ctx, width, height);
    }
    redraw();
    return { el: wrap, ctx: ctx, canvas: canvas, redraw: redraw };
  };

  /* ------------------------------------------------------------------ *
   *  GAME ENGINE
   * ------------------------------------------------------------------ */

  var LEVELS = [];
  var LEVELS_BY_ID = {};

  TQ.registerLevel = function (def) {
    if (!def || !def.id) { console.error("registerLevel: missing def/id", def); return; }
    if (LEVELS_BY_ID[def.id]) { console.warn("registerLevel: duplicate id", def.id); return; }
    LEVELS_BY_ID[def.id] = def;
    LEVELS.push(def);
  };

  // -- persistence (graceful fallback when localStorage blocked under file://)
  var STORAGE_KEY = "tq_progress";
  var memStore = null; // fallback in-memory progress
  function storageAvailable() {
    try {
      var k = "__tq_test__";
      window.localStorage.setItem(k, "1");
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }
  var HAS_STORAGE = storageAvailable();

  function defaultProgress() { return { completed: {}, xp: 0 }; }

  function loadProgress() {
    if (!HAS_STORAGE) return memStore || (memStore = defaultProgress());
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultProgress();
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object") return defaultProgress();
      if (!parsed.completed) parsed.completed = {};
      if (typeof parsed.xp !== "number") parsed.xp = 0;
      return parsed;
    } catch (e) { return defaultProgress(); }
  }

  function saveProgress(p) {
    if (!HAS_STORAGE) { memStore = p; return; }
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
    catch (e) { memStore = p; }
  }

  var XP_PER_LEVEL = 100;

  function sortedLevels() {
    return LEVELS.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  }

  function isUnlocked(levels, idx, progress) {
    if (idx === 0) return true;
    var prev = levels[idx - 1];
    return !!progress.completed[prev.id];
  }

  // ---- App state / routing -------------------------------------------------
  var appRoot = null;
  var state = { view: "map", levelId: null };

  function mount(node) {
    appRoot.innerHTML = "";
    appRoot.appendChild(node);
    window.scrollTo(0, 0);
  }

  function progressPct(levels, progress) {
    if (!levels.length) return 0;
    var done = 0;
    for (var i = 0; i < levels.length; i++) if (progress.completed[levels[i].id]) done++;
    return Math.round((done / levels.length) * 100);
  }

  // ---- Top bar (persistent header) ----------------------------------------
  function buildTopBar(levels, progress, opts) {
    opts = opts || {};
    var pct = progressPct(levels, progress);

    var bar = TQ.el("div", { class: "tq-progress-track" },
      TQ.el("div", { class: "tq-progress-fill", style: { width: pct + "%" } })
    );

    var brand = TQ.el("button", { class: "tq-brand", type: "button", title: "Back to map" },
      TQ.el("span", { class: "tq-brand-mark", text: "⬡", "aria-hidden": "true" }),
      TQ.el("span", { class: "tq-brand-name", text: "Transformer Quest" })
    );
    brand.addEventListener("click", function () { goMap(); });

    var xpChip = TQ.el("div", { class: "tq-xp", title: "Experience" },
      TQ.el("span", { class: "tq-xp-star", text: "✦", "aria-hidden": "true" }),
      TQ.el("span", { class: "tq-xp-num", text: progress.xp + " XP" })
    );
    var pctChip = TQ.el("div", { class: "tq-pct", text: pct + "%" });

    var resetBtn = TQ.el("button", { class: "tq-reset", type: "button", title: "Reset all progress", text: "reset" });
    resetBtn.addEventListener("click", function () {
      if (window.confirm("Reset all progress and XP? This cannot be undone.")) {
        var fresh = defaultProgress();
        saveProgress(fresh);
        goMap();
      }
    });

    var right = TQ.el("div", { class: "tq-top-right" }, pctChip, xpChip, resetBtn);
    var top = TQ.el("header", { class: "tq-topbar" },
      TQ.el("div", { class: "tq-top-inner" }, brand, right),
      bar
    );
    return top;
  }

  // ---- MAP screen ----------------------------------------------------------
  function renderMap() {
    state.view = "map";
    var levels = sortedLevels();
    var progress = loadProgress();

    var wrap = TQ.el("div", { class: "tq-app" });
    wrap.appendChild(buildTopBar(levels, progress));

    var allDone = levels.length && progressPct(levels, progress) === 100;

    var hero = TQ.el("div", { class: "tq-hero" },
      TQ.el("h1", { class: "tq-hero-title", text: "Transformer Quest" }),
      TQ.el("p", { class: "tq-hero-sub", html:
        "From <strong>tokens</strong> to <strong>attention</strong> to the <strong>KV-cache</strong> tricks " +
        "(MHA · MQA · GQA · MLA) that make long-context LLMs affordable. " +
        "Manipulate the knobs, watch the real numbers move." }),
      allDone ? TQ.el("div", { class: "tq-hero-done" }, TQ.badge("All levels complete — boss slain 🏁", "good")) : null
    );

    var grid = TQ.el("div", { class: "tq-map-grid" });
    levels.forEach(function (lvl, idx) {
      var unlocked = isUnlocked(levels, idx, progress);
      var done = !!progress.completed[lvl.id];

      var statusIcon = done ? "✓" : (unlocked ? "▶" : "🔒");
      var card = TQ.el("button", {
        class: "tq-card" + (done ? " is-done" : "") + (unlocked ? "" : " is-locked"),
        type: "button",
        "aria-label": lvl.title + (unlocked ? "" : " (locked)")
      },
        TQ.el("div", { class: "tq-card-top" },
          TQ.el("span", { class: "tq-card-icon", text: lvl.icon || "•" }),
          TQ.el("span", { class: "tq-card-order", text: "Lv " + lvl.order }),
          TQ.el("span", { class: "tq-card-status", text: statusIcon })
        ),
        TQ.el("div", { class: "tq-card-title", text: lvl.title }),
        TQ.el("div", { class: "tq-card-tagline", text: lvl.tagline || "" }),
        TQ.el("div", { class: "tq-card-foot" },
          TQ.el("span", { class: "tq-card-preread", text: lvl.preread || "" }),
          done ? TQ.badge("done", "good") : (unlocked ? TQ.badge("open", "info") : TQ.badge("locked", "default"))
        )
      );
      if (unlocked) {

      } else {

      }
